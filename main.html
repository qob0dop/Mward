/* 搜索结果高亮样式 */

{
    animation: search-blink 2s ease-in-out;  border-left: 4px solid #ffc107 !important;  background-color: #fff3cd !important;
}

{
    font-weight: bold !important;  color: #856404 !important;  background-color: #fff3cd !important;
}

tr.search-highlight
{
    border-left: 4px solid #ffc107 !important;  background-color: #fff3cd !important;
}

tr.search-highlight:hover
{
    background-color: #ffeaa7 !important;
}

/* 闪烁动画 - 2秒内闪烁4次 */
@keyframes search-blink
{
    0%,
    100%
    {
        opacity: 1;  background-color: #fff3cd !important;  box-shadow: 0 0 0 rgba(255, 193, 7, .3);
    }
    12.5%
    {
        transform: scale(1.02);  opacity: .9;  background-color: #ff6b6b !important;  box-shadow: 0 0 10px rgba(255, 107, 107, .6);
    }
    25%
    {
        transform: scale(1);  opacity: 1;  background-color: #fff3cd !important;  box-shadow: 0 0 5px rgba(255, 193, 7, .3);
    }
    37.5%
    {
        transform: scale(1.02);  opacity: .9;  background-color: #ff6b6b !important;  box-shadow: 0 0 10px rgba(255, 107, 107, .6);
    }
    50%
    {
        transform: scale(1);  opacity: 1;  background-color: #fff3cd !important;  box-shadow: 0 0 5px rgba(255, 193, 7, .3);
    }
    62.5%
    {
        transform: scale(1.02);  opacity: .9;  background-color: #ff6b6b !important;  box-shadow: 0 0 10px rgba(255, 107, 107, .6);
    }
    75%
    {
        transform: scale(1);  opacity: 1;  background-color: #fff3cd !important;  box-shadow: 0 0 5px rgba(255, 193, 7, .3);
    }
    87.5%
    {
        transform: scale(1.02);  opacity: .9;  background-color: #ff6b6b !important;  box-shadow: 0 0 10px rgba(255, 107, 107, .6);
    }
}

        // Unregister all existing service workers
        navigator.serviceWorker
          .getRegistrations()
          .then(function (regs) {
            regs.forEach(function (reg) {
              reg.unregister();
            });
          })
          .catch(function () {});

        // Best-effort: clear caches created by previous SW versions
        if (window.caches) {
          caches
            .keys()
            .then(function (keys) {
              keys.forEach(function (k) {
                caches.delete(k);
              });
            })
            .catch(function () {});
        }
      });
    }

    <script>
      var userData;
      //alert("height:"+ screen.height + "width:"+screen.width  )
      layui.use(["table", "treetable", "dropdown", "appconfig"], function () {
        var $ = layui.jquery;
        var table = layui.table;
        var treetable = layui.treetable;
        var appconfig = layui.appconfig;
        var dropdown = layui.dropdown;

        var loginUser = localStorage.getItem("loginUser");

        if (loginUser === null) {
          location.href = "index.html";
          return;
        }
        var loginUserData = JSON.parse(loginUser);

        var wardData = localStorage.getItem("wardData");

        if (wardData === null) {
          layer.msg("请先选择病区！");
          location.href = "view/wardlist.html";
          return;
        }
        var jsonData = JSON.parse(wardData);
        localStorage.ward_sn = jsonData.ward_sn;
        localStorage.ward_name = jsonData.ward_name;

        // 设置病区名称显示
        $("#btn_ward_name").text(jsonData.ward_name);
        console.log(jsonData.ward_name);

        // 设置管理员名称显示
        $("#btn_user_name").text(loginUserData.user_name);
        console.log(loginUserData.user_name);
        // 渲染
        table.render({
          elem: "#munu-table",
          url:
            appconfig.api +
            "/api/MobileWard/GetActPatientLists?ward=" +
            localStorage.ward_sn +
            "&inout=I",
          //page: true,
          toolbar: "#toolbarDemo",
          //defaultToolbar: ['filter', 'exports', 'print', {
          //  title: '帮助'
          //  ,layEvent: 'LAYTABLE_TIPS'
          //  ,icon: 'layui-icon-tips'
          //}],
          defaultToolbar: [],
          response: {
            statusCode: 1, // 重新规定成功的状态码为 1，table 组件默认为 0
          },
          // 将原始数据解析成 table 组件所规定的数据格式
          parseData: function (res) {
            return {
              code: res.Status, //解析接口状态
              msg: res.message, //解析提示文本
              count: res.total, //解析数据长度
              data: res.Data, //解析数据列表
            };
          },
          cellMinWidth: 60,
          cols: [
            [
              { field: "inpatient_no", title: "住院号", width: 90, sort: true }, // unresize: true,
              { field: "bed_no", title: "床号", width: 70, sort: true },
              { field: "name", title: "姓名" ,width:100},
              {
                field: "sex_name",
                title: "性别",
                width: 50,
                templet: "#sexTpl",
              },
              { field: "ages", title: "年龄" },
              { field: "admiss_days", title: "入院天数", width: 80 },
              //{ field: 'responce_type_name', title: '身份' },
              { field: "refer_physician_name", title: "管床医生" },
              { field: "refer_nurse_name", title: "管床护士" },
              {
                field: "admiss_status_name",
                title: "状态",
                width: 50,
                templet: "#statusTpl",
              },
              { field: "nursing", title: "护理级别" },
              // { fixed: "right", title: "操作", toolbar: "#auth-state" },
            ],
          ],
          //height: 315
          done: function (res, curr, count) {
            // 行状态着色
            var trs = document.querySelectorAll(
              "#munu-table+div .layui-table-body table tbody tr"
            );
            res.data.forEach(function (row, i) {
              var tr = trs[i];
              if (!tr) return;
              switch (row.admiss_status_name) {
                case "常规":
                  tr.classList.add("status-normal");
                  break;
                case "危":
                  tr.classList.add("status-danger");
                  break;
                case "急":
                  tr.classList.add("status-urgent");
                  break;
                case "重":
                  tr.classList.add("status-heavy");
                  break;
                default:
                  tr.classList.add("status-other");
              }
            });
          },
        });

        $("#btn_ward_name").html(localStorage.ward_name);
        $("#btn_user_name").html(loginUserData.name);
        var ddl_data = [];

        $.ajax({
          //绑定病区列表
          url:
            appconfig.api +
            "/api/MobileWard/GetYzUnitList?usermi=" +
            loginUserData.user_mi +
            "&subsys_id=yz", //   获取控制器URL地址
          type: "get",
          dataType: "json",
          success: function (data) {
            //方法一
            //ddl_data =[];
            for (var i = 0; i < data.Data.length; i++) {
              //sel_pward.options.add(new Option(data.data[i].ward_name, data.data[i].ward_sn));
              ddl_data.push({

                title: data.Data[i].ward_name,

              elem: "#reloadTest", //可绑定在任意元素中，此处以上述按钮为例
              data: ddl_data,
              // 菜单被点击的事件

                localStorage.ward_sn = obj.id;
                localStorage.ward_name = obj.title;

                $("#reloadTest").data("wardsn", obj.id);
                $("#reloadTest").html(
                  obj.title +
                    "<i class='layui-icon layui-icon-down layui-font-12'></i>"
                );
                //layer.msg('可观察 Network 请求参数的变化');

                //重新加载表格数据
                layui.table.reloadData("munu-table", {
                  url:
                    appconfig.api +
                    "/api/MobileWard/GetActPatientLists?ward=" +
                    localStorage.ward_sn +
                    "&inout=I",
                });
              },
            });
            // if (localStorage.ward_sn === undefined) {
            //   $("#reloadTest").click();
            // } else if ($("#reloadTest").html().indexOf("选择科室") > -1) {
            //   $("#reloadTest").data("wardsn", localStorage.ward_sn);
            //   $("#reloadTest").html(
            //     localStorage.ward_name +
            //       "<i class='layui-icon layui-icon-down layui-font-12'></i>"
            //   );
            // }
          },
          error: function (data) {
            layer.msg("访问数据失败！请检查网络链接是否畅通。");
          },
        });
        //行单击事件（双击事件为：rowDouble）

          localStorage.setItem("userData", JSON.stringify(data));
          const now = new Date();
          const ticks = now.getTime();
          console.log(ticks);
          location.href = "view/patient.html" + "?ticks=" + ticks;
        });
        //工具栏事件
        table.on("toolbar(munu-table)", function (obj) {
          var id = obj.config.id;
          var checkStatus = table.checkStatus(id);
          var othis = lay(this);
          switch (obj.event) {
            case "allPatient":
              $("button[lay-event='allPatient']")
                .removeClass("layui-btn-primary")
                .removeClass("layui-btn-normal")
                .addClass("layui-btn-normal");
              $("button[lay-event='myPatient']")
                .removeClass("layui-btn-primary")
                .removeClass("layui-btn-normal")
                .addClass("layui-btn-primary");

              table.reloadData(
                "munu-table",
                {
                  where: {
                    doctor_sn: "",
                  },
                  //,defaultToolbar: ['print'] // 重载头部工具栏右侧图标
                  //,cols: ins1.config.cols
                },
                true
              );
              break;
            case "myPatient":
              $("button[lay-event='myPatient']")
                .removeClass("layui-btn-primary")
                .removeClass("layui-btn-normal")
                .addClass("layui-btn-normal");
              $("button[lay-event='allPatient']")
                .removeClass("layui-btn-primary")
                .removeClass("layui-btn-normal")
                .addClass("layui-btn-primary");
              table.reloadData(
                "munu-table",
                {
                  where: {
                    doctor_sn: loginUserData.user_mi,
                  },
                },
                true
              );
              break;
          }
        });

        //监听工具条
        table.on("tool(munu-table)", function (obj) {
          var data = obj.data;
          var layEvent = obj.event;

          if (layEvent === "del") {
            layer.msg("删除" + data.id);
          } else if (layEvent === "edit") {
            layer.msg("修改" + data.id);
          } else if (layEvent === "detail") {
            localStorage.setItem("userData", JSON.stringify(data));
            const now = new Date();
            const ticks = now.getTime();
            console.log(ticks);
            location.href = "view/patient.html" + "?ticks=" + ticks;
          }
        });
      });
      
      // 患者搜索功能
      function searchPatient(searchValue) {
        searchValue = searchValue.trim();
        var clearBtn = document.getElementById('clear-search');
        
        console.log('搜索关键词:', searchValue);
        
        // 显示/隐藏清空按钮
        if (searchValue) {
          clearBtn.style.display = 'block';
        } else {
          clearBtn.style.display = 'none';
        }
        
        // 如果搜索值为空，显示所有数据
        if (!searchValue) {
          // 移除所有高亮
          removeAllHighlight();
          return;
        }
        
        // 获取表格数据进行搜索
        var tableData = layui.table.cache['munu-table'] || [];
        console.log('表格数据:', tableData);
        
        var matchedRows = [];
        
        // 搜索匹配的行（支持姓名、床号、住院号搜索）
        tableData.forEach(function(row, index) {
          var isMatch = false;
          var searchFields = ['name', 'bed_no', 'inpatient_no'];
          
          for (var i = 0; i < searchFields.length; i++) {
            var fieldValue = row[searchFields[i]] || '';
            if (fieldValue.toString().toLowerCase().indexOf(searchValue.toLowerCase()) !== -1) {
              isMatch = true;
              console.log('匹配行:', index, '字段:', searchFields[i], '值:', fieldValue);
              break;
            }
          }
          
          if (isMatch) {
            matchedRows.push(index);
          }
        });
        
        console.log('匹配的行索引:', matchedRows);
        
        // 高亮匹配的行
        highlightSearchResults(matchedRows);
        
        // 如果有匹配结果，滚动到第一个匹配项
        if (matchedRows.length > 0) {
          scrollToRow(matchedRows[0]);
        } else if (searchValue) {
          // console.log('没有找到匹配结果');
          // // 可选：显示没有找到结果的提示
          // layui.layer && layui.layer.msg('没有找到匹配的患者', {icon: 0, time: 1500});
        }
      }
      
      // 清空搜索
      function clearSearch() {
        document.getElementById('patient-search').value = '';
        document.getElementById('clear-search').style.display = 'none';
        removeAllHighlight();
      }
      
      // 高亮搜索结果
      function highlightSearchResults(matchedRows) {
        // 先移除所有高亮
        removeAllHighlight();
        
        // 尝试多种可能的表格行选择器
        var possibleSelectors = [
          '#munu-table + .layui-table-view .layui-table-body tbody tr',
          '.layui-table-view .layui-table-body tbody tr',
          '#munu-table ~ .layui-table-view .layui-table-body tbody tr',
          '.layui-table tbody tr'
        ];
        
        var tableRows = null;
        for (var i = 0; i < possibleSelectors.length; i++) {
          tableRows = document.querySelectorAll(possibleSelectors[i]);
          if (tableRows && tableRows.length > 0) {
            console.log('找到表格行，使用选择器:', possibleSelectors[i]);
            break;
          }
        }
        
        if (!tableRows || tableRows.length === 0) {
          console.log('未找到表格行，尝试延迟执行');
          setTimeout(function() {
            highlightSearchResults(matchedRows);
          }, 500);
          return;
        }
        
        // 高亮匹配的行
        matchedRows.forEach(function(rowIndex) {
          if (tableRows[rowIndex]) {
            var row = tableRows[rowIndex];
            row.classList.add('search-highlight');
            console.log('高亮行:', rowIndex);
            
            // 2秒后移除闪烁动画，但保持高亮
            setTimeout(function() {
              row.style.animation = 'none';
              row.style.backgroundColor = '#fff3cd';
            }, 2000);
          }
        });
        
        console.log('匹配行数:', matchedRows.length);
      }
      
      // 移除所有高亮
      function removeAllHighlight() {
        // 尝试多种可能的高亮元素选择器
        var possibleSelectors = [
          '.search-highlight',
          'tr.search-highlight',
          '.layui-table tbody tr.search-highlight'
        ];
        
        possibleSelectors.forEach(function(selector) {
          var highlightedRows = document.querySelectorAll(selector);
          highlightedRows.forEach(function(row) {
            row.classList.remove('search-highlight');
          });
        });
      }
      
      // 滚动到指定行
      function scrollToRow(rowIndex) {
        console.log('开始滚动到行:', rowIndex);
        
        // 等待一下确保DOM已更新
        setTimeout(function() {
          // 找到正确的滚动容器 - layui-table-body 和 layui-table-main
          var tableBody = document.querySelector('.layui-table-body');
          var tableMain = document.querySelector('.layui-table-main');
          var scrollContainer = tableMain || tableBody; // 优先使用 table-main
          
          console.log('容器元素:', {
            tableBody: !!tableBody,
            tableMain: !!tableMain,
            scrollContainer: !!scrollContainer
          });
          
          var possibleSelectors = [
            '.layui-table-main tbody tr',
            '.layui-table-body tbody tr',
            '#munu-table + .layui-table-view .layui-table-body tbody tr',
            '.layui-table-view .layui-table-body tbody tr',
            '.layui-table tbody tr'
          ];
          
          var tableRows = null;
          var usedSelector = '';
          for (var i = 0; i < possibleSelectors.length; i++) {
            tableRows = document.querySelectorAll(possibleSelectors[i]);
            if (tableRows && tableRows.length > 0) {
              usedSelector = possibleSelectors[i];
              console.log('滚动使用选择器:', usedSelector, '找到行数:', tableRows.length);
              break;
            }
          }
          
          if (tableRows && tableRows[rowIndex]) {
            var targetRow = tableRows[rowIndex];
            console.log('找到目标行，开始滚动');
            
            // 使用 layui-table-main 或 layui-table-body 容器
            if (scrollContainer) {
              console.log('在', scrollContainer.className, '容器内滚动');
              // 计算目标行相对于容器顶部的位置
              var rowRect = targetRow.getBoundingClientRect();
              var containerRect = scrollContainer.getBoundingClientRect();
              var scrollTop = scrollContainer.scrollTop;
              var targetScrollTop = scrollTop + rowRect.top - containerRect.top - (scrollContainer.clientHeight / 2) + (targetRow.offsetHeight / 2);
              
              console.log('滚动计算:', {
                rowRect: rowRect,
                containerRect: containerRect,
                scrollTop: scrollTop,
                targetScrollTop: targetScrollTop
              });
              
              // 平滑滚动到目标位置
              scrollContainer.scrollTo({
                top: Math.max(0, targetScrollTop),
                behavior: 'smooth'
              });
            } 
            // 否则使用默认的页面滚动
            else {
              console.log('使用默认页面滚动');
              targetRow.scrollIntoView({ 
                behavior: 'smooth', 
                block: 'center' 
              });
            }
            
            console.log('滚动完成');
          } else {
            console.log('未找到目标行:', rowIndex, '总行数:', tableRows ? tableRows.length : 0);
          }
        }, 100);
      }
    </script>
  </body>
</html>
