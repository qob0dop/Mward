<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/lib/layui-v2.6.3/css/layui.css" media="all" />
  <link rel="stylesheet" href="/css/navpage/patients.css" />
  <title>病人列表</title>
  <style>
@keyframes spin
{
    from
    {
        transform: rotate(0deg);
    }

    to
    {
        transform: rotate(360deg);
    }
}

/* 扫码界面样式 */
#qr-scanner-container
{
    position: fixed;  z-index: 10000;  top: 0;  right: 0;  bottom: 0;  left: 0;  display: none;  background: #000;
}

#qr-scanner-container.active
{
    display: block;
}

#qr-video
{
    width: 100%;  height: 100%;  object-fit: cover;
}

#qr-canvas
{
    display: none;
}

.qr-scanner-overlay
{
    position: absolute;  top: 0;  right: 0;  bottom: 0;  left: 0;  pointer-events: none;
}

.qr-scanner-header
{
    position: absolute;  z-index: 1;  top: 0;  right: 0;  left: 0;  padding: 20px;  pointer-events: auto;  background: linear-gradient(to bottom, rgba(0, 0, 0, .7), transparent);
}

.qr-scanner-header-content
{
    display: flex;  align-items: center;  justify-content: space-between;  color: white;
}

.qr-scanner-title
{
    font-size: 16px;
}

.qr-scanner-close
{
    font-size: 28px;  padding: 5px;  cursor: pointer;
}

.qr-scan-region
{
    position: absolute;  top: 50%;  left: 50%;  width: 250px;  height: 250px;  transform: translate(-50%, -50%);  border: 2px solid #1e9fff;  border-radius: 8px;  box-shadow: 0 0 0 9999px rgba(0, 0, 0, .5);
}

.qr-scan-corner
{
    position: absolute;  width: 20px;  height: 20px;
}

.qr-scan-corner.top-left
{
    top: -2px;  left: -2px;  border-top: 3px solid #1e9fff;  border-left: 3px solid #1e9fff;
}

.qr-scan-corner.top-right
{
    top: -2px;  right: -2px;  border-top: 3px solid #1e9fff;  border-right: 3px solid #1e9fff;
}

.qr-scan-corner.bottom-left
{
    bottom: -2px;  left: -2px;  border-bottom: 3px solid #1e9fff;  border-left: 3px solid #1e9fff;
}

.qr-scan-corner.bottom-right
{
    right: -2px;  bottom: -2px;  border-right: 3px solid #1e9fff;  border-bottom: 3px solid #1e9fff;
}

.qr-scanner-footer
{
    position: absolute;  right: 0;  bottom: 50px;  left: 0;  text-align: center;  pointer-events: auto;  color: white;
}

.qr-scanner-tip
{
    font-size: 14px;  margin-bottom: 20px;
}

.qr-scanner-flash-btn
{
    font-size: 14px;  padding: 10px 20px;  cursor: pointer;  color: white;  border: none;  border-radius: 20px;  background: rgba(255, 255, 255, .3);
}

/* 加载遮罩层（overlay）和居中 spinner */
.loading-overlay
{
    position: fixed;  z-index: 9998;  top: 0;  left: 0;  display: none;

/* hidden by default */
    /* flex 居中内部内容 */
    align-items: center;  justify-content: center;  width: 100%;  height: 100%;  background-color: rgba(0, 0, 0, .3);
}

.loading-overlay.show
{
    display: flex;
}

.loading-overlay .layui-icon-loading
{
    font-size: 40px !important;  z-index: 9999;  display: none;  padding: 20px;  animation: spin 1s linear infinite !important;  color: #1e9fff;  border-radius: 50%;  background-color: rgba(255, 255, 255, .95);  box-shadow: 0 2px 10px rgba(0, 0, 0, .1);
}

.loading-overlay .layui-icon-loading.show
{
    display: block !important;
}

.patient-card-body .layui-icon
{
    font-size: 18px;  margin-right: 4px;
}

#admiss-status-label
{
    position: absolute;  top: 0;  right: 10px;  padding: 5px;  color: #fff;
}

#scan-icon
{
    width: 30px;  margin-left: 10px;
}

/* 病区搜索框样式 */
.ward-search-container
{
    position: relative;  padding: 10px 15px;  border-bottom: 1px solid #e6e6e6;  background: #f8f9fa;
}

.ward-search-container .layui-icon-search
{
    font-size: 16px;  position: absolute;  top: 50%;  left: 25px;  transform: translateY(-50%);  pointer-events: none;  color: #999;
}

#ward-search
{
    font-size: 14px;  box-sizing: border-box;  width: 100%;  height: 36px;  padding: 8px 12px 8px 35px;  transition: all .3s ease;  border: 1px solid #e6e6e6;  border-radius: 18px;  outline: none;  background: #fff;
}

#ward-search:focus
{
    border-color: #1e9fff;  box-shadow: 0 0 0 2px rgba(30, 159, 255, .1);
}

#ward-search::placeholder
{
    color: #ccc;
}

  </style>
</head>

<body>
  <!-- 扫码界面 -->
  <div id="qr-scanner-container">
    <video id="qr-video" playsinline></video>
    <canvas id="qr-canvas"></canvas>
    <div class="qr-scanner-overlay">
      <div class="qr-scanner-header">
        <div class="qr-scanner-header-content">
          <div class="qr-scanner-title">将二维码放入框内扫描</div>
          <i class="layui-icon layui-icon-close qr-scanner-close" onclick="stopQRScanner()"></i>
        </div>
      </div>
      <div class="qr-scan-region">
        <div class="qr-scan-corner top-left"></div>
        <div class="qr-scan-corner top-right"></div>
        <div class="qr-scan-corner bottom-left"></div>
        <div class="qr-scan-corner bottom-right"></div>
      </div>
      <div class="qr-scanner-footer">
        <div class="qr-scanner-tip">请对准二维码</div>
        <button class="qr-scanner-flash-btn" onclick="toggleFlashlight()" id="flashBtn" style="display:none;">
          <i class="layui-icon layui-icon-light"></i> 手电筒
        </button>
      </div>
    </div>
  </div>
  <header>
    <div class="wardlist-switch" id="wardlist-switch">
      用户病区<i class="layui-icon layui-icon-down"></i>
    </div>
    <div id="search-container">
      <i class="layui-icon layui-icon-search"></i>
      <input type="text" id="patient-search" placeholder="搜索患者"
        onfocus="this.style.borderColor='#1e9fff'; this.style.boxShadow='0 0 0 2px rgba(30,136,229,0.1)'"
        onblur="this.style.borderColor='#e6e6e6'; this.style.boxShadow='none'" />
      <img id="scan-icon" src="../images/scan.svg" alt="">
    </div>
  </header>
  <div class="tool">
    <label id="all-patients-label">全部患者</label>
    <label id="my-patients-label">我的患者</label>
    <p id="filter-label">
      筛选 | <i class="layui-icon layui-icon-shrink-right"></i>
    </p>
  </div>
  <main>

    <div class="filter-panel">
      <div class="filter-overlay"></div>
      <div class="filter-body">
        <h5>排序</h5>
        <div class="order-filter">
          <label class="sort-option active" data-sort="default">默认排序</label>
          <label class="sort-option" data-sort="admit_desc">入院时间（由近到远）</label>
          <label class="sort-option" data-sort="admit_asc">入院时间（由远到近）</label>
        </div>
        <h5>范围</h5>
        <div class="area-filter">
          <label>在院</label>
          <label>待入科</label>
          <label>出院</label>
        </div>
        <h5>状态</h5>
        <div class="status-filter">
          <label class="status-option active" data-sort="全部">全部</label>
          <label class="status-option" data-sort="常规">常规</label>
          <label class="status-option" data-sort="重">重</label>
          <label class="status-option" data-sort="危">危</label>
        </div>
        <h5>性别</h5>
        <div class="gender-filter">
          <label class="gender-option active" data-sort="全部">全部</label>
          <label class="gender-option" data-sort="男">男</label>
          <label class="gender-option" data-sort="女">女</label>
        </div>
        <div class="act-area">
          <button class="layui-btn layui-btn-primary" id="filter-reset-btn">
            重置
          </button>
          <button class="layui-btn" id="filter-confirm-btn">确认</button>
        </div>
      </div>
    </div>
    <div class="patients-cardlist">
      <!-- <div class="patient-card">
          <div class="patient-card-header">
            <label>床号</label>
            <label>姓名</label>
          </div>
          <div class="patient-card-body">
            <label>住院号</label>
            <label>状态</label>
            <label>年龄</label>
            <label>性别</label>
            <label>管床医生</label>
            <label>管床护士</label>
          </div>
        </div> -->
    </div>
    <div class="overlay"></div>
    <!-- 新增遮罩层 -->
  </main>
  <!-- 病区列表面板 -->
  <div class="ward-list">
    <div class="ward-list-header">
      共xx个病区
      <span class="close-btn" id="wardlist-close">×</span>
    </div>
    <div class="ward-search-container">
      <i class="layui-icon layui-icon-search"></i>
      <input type="text" id="ward-search" placeholder="搜索病区" />
    </div>
    <div class="ward-list-body"></div>
  </div>
  <script src="/lib/layui-v2.6.3/layui.js" charset="utf-8"></script>
  <script src="/lib/lay-config.js?v=1.0.4" charset="utf-8"></script>
  <script src="/lib/jsQR.js"></script>
  <script src="../js/navpage/patients.js"></script>
  <script>


  </script>
  <!-- 加载遮罩层 -->
  <div class="loading-overlay">
    <i class="layui-icon layui-icon-loading layui-icon-spin"></i>
  </div>
</body>

</html>
