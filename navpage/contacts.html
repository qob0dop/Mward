<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通讯录</title>
    <link rel="stylesheet" href="/lib/layui-v2.6.3/css/layui.css" media="all" />
    <link rel="stylesheet" href="/css/navpage/contacts.css" />
    <style>




    </style>
</head>

<body>
    <header>
        <div class="header-left">
            <div style="font-size: 18px;">通讯录</div>
            <div class="scope-selector">
                <select id="scope-select">
                    <option value="dept">同科室</option>
                    <option value="all">全部</option>
                </select>
            </div>
        </div>
        <div id="search-container">
            <i class="layui-icon layui-icon-search"></i>
            <input type="text" id="contact-search" placeholder="搜索联系人" />
        </div>
    </header>

    <div class="tool">
        <label class="contact-filter active" data-filter="all">全部</label>
        <label class="contact-filter" data-filter="doctor">医生</label>
        <label class="contact-filter" data-filter="nurse">护士</label>
        <label class="contact-filter" data-filter="admin">员工</label>
    </div>

    <main>
        <div class="contacts-container" id="contactsContainer">
            <!-- 联系人列表将通过 JavaScript 动态生成 -->
        </div>
    </main>

    <!-- 快速拨号 -->
    <div class="quick-dial">
        <button class="dial-btn" onclick="showEmergencyContacts()" title="紧急联系人">
            <i class="layui-icon layui-icon-cellphone"></i>
        </button>
    </div>

    <script src="/lib/layui-v2.6.3/layui.js" charset="utf-8"></script>
    <script src="/lib/lay-config.js?v=1.0.4" charset="utf-8"></script>

    <script src="../js/navpage/contacts.js" charset="utf-8"></script>
</body>

</html>
