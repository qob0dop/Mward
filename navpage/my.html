<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的</title>
    <link rel="stylesheet" href="/lib/layui-v2.6.3/css/layui.css" media="all" />
    <link rel="stylesheet" href="/css/navpage/my.css" />
    <style>





    </style>
</head>

<body>
    <header>
        <div>我的</div>
        <div class="header-actions">
            <i class="layui-icon layui-icon-set header-icon" onclick="showSettings()" title="设置"></i>
            <i class="layui-icon layui-icon-notice header-icon" onclick="goToMessage()" title="通知"></i>
        </div>
    </header>

    <main>
        <!-- 个人资料区域 -->
        <div class="profile-section">
            <div class="profile-card">
                <div class="profile-header">
                    <div class="profile-avatar" onclick="changeAvatar()">
                        <span id="userAvatar">李</span>
                        <div class="avatar-badge">
                            <i class="layui-icon layui-icon-ok" style="font-size: 12px;"></i>
                        </div>
                    </div>
                    <div class="profile-info">
                        <h2 id="loginUserName">李医生</h2>
                        <p id="loginDept">内科</p>
                        <p>工号：<span id="userMi">202401001</span></p>
                    </div>
                </div>

                <div class="profile-stats">
                    <div class="stat-item">
                        <span class="stat-number">156</span>
                        <div class="stat-label">本月患者</div>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number">28</span>
                        <div class="stat-label">待处理</div>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number">98%</span>
                        <div class="stat-label">好评率</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 快捷功能 -->
        <div class="section">
            <div class="section-title">快捷功能</div>
            <div class="menu-list">
                <div class="menu-item" onclick="showMySchedule()">
                    <div class="menu-icon blue">
                        <i class="layui-icon layui-icon-date"></i>
                    </div>
                    <div class="menu-content">
                        <div class="menu-title">我的排班</div>
                        <div class="menu-subtitle">查看本周排班安排</div>
                    </div>
                    <i class="layui-icon layui-icon-right menu-arrow"></i>
                </div>

                <div class="menu-item" onclick="showWorkStats()">
                    <div class="menu-icon green">
                        <i class="layui-icon layui-icon-chart"></i>
                    </div>
                    <div class="menu-content">
                        <div class="menu-title">工作统计</div>
                        <div class="menu-subtitle">本月工作数据统计</div>
                    </div>
                    <i class="layui-icon layui-icon-right menu-arrow"></i>
                </div>

                <div class="menu-item" onclick="showMyPatients()">
                    <div class="menu-icon orange">
                        <i class="layui-icon layui-icon-username"></i>
                    </div>
                    <div class="menu-content">
                        <div class="menu-title">我的患者</div>
                        <div class="menu-subtitle">管理我负责的患者</div>
                    </div>
                    <span class="menu-badge">12</span>
                    <i class="layui-icon layui-icon-right menu-arrow"></i>
                </div>

                <div class="menu-item" onclick="showReport()">
                    <div class="menu-icon red">
                        <i class="layui-icon layui-icon-flag"></i>
                    </div>
                    <div class="menu-content">
                        <div class="menu-title">查看报表</div>
                        <div class="menu-subtitle">访问报表系统</div>
                    </div>
                    <i class="layui-icon layui-icon-right menu-arrow"></i>
                </div>
            </div>
        </div>

        <!-- 个人设置 -->
        <div class="section">
            <div class="section-title">个人设置</div>
            <div class="menu-list">
                <div class="menu-item" onclick="editProfile()">
                    <div class="menu-icon blue">
                        <i class="layui-icon layui-icon-edit"></i>
                    </div>
                    <div class="menu-content">
                        <div class="menu-title">编辑资料</div>
                        <div class="menu-subtitle">修改个人信息</div>
                    </div>
                    <i class="layui-icon layui-icon-right menu-arrow"></i>
                </div>

                <div class="menu-item" onclick="changePassword()">
                    <div class="menu-icon purple">
                        <i class="layui-icon layui-icon-password"></i>
                    </div>
                    <div class="menu-content">
                        <div class="menu-title">修改密码</div>
                        <div class="menu-subtitle">更新登录密码</div>
                    </div>
                    <i class="layui-icon layui-icon-right menu-arrow"></i>
                </div>

                <div class="menu-item">
                    <div class="menu-icon green">
                        <i class="layui-icon layui-icon-notice"></i>
                    </div>
                    <div class="menu-content">
                        <div class="menu-title">消息推送</div>
                        <div class="menu-subtitle">接收系统通知</div>
                    </div>
                    <div class="toggle-switch active" onclick="toggleNotification(this)"></div>
                </div>

                <div class="menu-item">
                    <div class="menu-icon orange">
                        <i class="layui-icon layui-icon-voice"></i>
                    </div>
                    <div class="menu-content">
                        <div class="menu-title">声音提醒</div>
                        <div class="menu-subtitle">开启声音通知</div>
                    </div>
                    <div class="toggle-switch" onclick="toggleSound(this)"></div>
                </div>
            </div>
        </div>

        <!-- 系统功能 -->
        <div class="section">
            <div class="section-title">系统功能</div>
            <div class="menu-list">
                <div class="menu-item" onclick="showHelp()">
                    <div class="menu-icon blue">
                        <i class="layui-icon layui-icon-help"></i>
                    </div>
                    <div class="menu-content">
                        <div class="menu-title">帮助中心</div>
                        <div class="menu-subtitle">使用指南和常见问题</div>
                    </div>
                    <i class="layui-icon layui-icon-right menu-arrow"></i>
                </div>

                <div class="menu-item" onclick="showAbout()">
                    <div class="menu-icon purple">
                        <i class="layui-icon layui-icon-app"></i>
                    </div>
                    <div class="menu-content">
                        <div class="menu-title">关于系统</div>
                        <div class="menu-subtitle">版本信息和更新日志</div>
                    </div>
                    <i class="layui-icon layui-icon-right menu-arrow"></i>
                </div>

                <div class="menu-item" onclick="logout()">
                    <div class="menu-icon red">
                        <i class="layui-icon layui-icon-logout"></i>
                    </div>
                    <div class="menu-content">
                        <div class="menu-title">退出登录</div>
                        <div class="menu-subtitle">安全退出系统</div>
                    </div>
                    <i class="layui-icon layui-icon-right menu-arrow"></i>
                </div>
            </div>
        </div>

        <div class="version-info">
            移动查房系统<br>
            © 2026 Hospital Management System
        </div>
    </main>

    <!-- 模态框 -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">标题</div>
            </div>
            <div class="modal-body" id="modalBody">
                内容
            </div>
        </div>
    </div>


    <script src="/lib/layui-v2.6.3/layui.js" charset="utf-8"></script>
    <script src="/lib/lay-config.js?v=1.0.4" charset="utf-8"></script>

    <script src="../js/navpage/my.js">

    </script>
</body>

</html>
