<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消息中心</title>
    <link rel="stylesheet" href="/lib/layui-v2.6.3/css/layui.css" media="all" />
    <style>
        body,
        html {
            height: 100%;
            margin: 0;
            background-color: rgb(242, 243, 245);
        }

        header {
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-sizing: border-box;
            height: 10%;
            padding: 0 10px;
            text-align: center;
            color: #fff;
            background-color: rgb(4, 46, 167);
        }

        .message-title {
            flex: 1;
            text-align: center;
        }

        .message-count {
            font-size: 12px;
            margin-left: 5px;
            padding: 2px 8px;
            border-radius: 12px;
            background-color: #ff5722;
        }

        .tool {
            display: flex;
            align-items: center;
            height: 5%;
            padding: 0 10px;
            background-color: rgb(242, 243, 245);
        }

        .tool label {
            font-size: 12px;
            line-height: 12px;
            margin: 5px;
            padding: 5px 10px;
            cursor: pointer;
            transition: all .3s ease;
            color: gray;
            border-radius: 15px;
            background-color: #fff;
        }

        .tool label.active {
            color: rgb(67, 92, 171);
            background-color: rgb(210, 216, 231);
        }

        main {
            overflow: hidden;

            height: 85%;
        }

        .message-container {
            overflow: auto;
            box-sizing: border-box;
            height: 100%;
            padding: 10px;
            background-color: rgb(242, 243, 245);
        }

        .message-card {
            position: relative;
            margin-bottom: 10px;
            padding: 15px;
            cursor: pointer;
            transition: all .3s ease;
            border-radius: 10px;
            background-color: #fff;
            box-shadow: 0 2px 4px rgba(0, 0, 0, .1);
        }

        .message-card:hover {
            transform: translateY(-2px);

            box-shadow: 0 4px 8px rgba(0, 0, 0, .15);
        }

        .message-card.unread {
            border-left: 4px solid #1e9fff;
        }

        .message-card.unread::after {
            position: absolute;
            top: 8px;
            right: 15px;
            width: 8px;
            height: 8px;

            content: '';
            border-radius: 50%;
            background-color: #ff5722;
        }

        .message-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .message-type {
            font-size: 12px;
            padding: 3px 8px;
            color: #fff;
            border-radius: 12px;
        }

        .message-type.system {
            background-color: #1e9fff;
        }

        .message-type.notice {
            background-color: #ff5722;
        }

        .message-type.work {
            background-color: #28a745;
        }

        .message-type.urgent {
            animation: blink 1s infinite;

            background-color: #dc3545;
        }

        @keyframes blink {

            0%,
            50% {
                opacity: 1;
            }

            51%,
            100% {
                opacity: .5;
            }
        }

        .message-time {
            font-size: 12px;
            color: #999;
        }

        .message-title-text {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        .message-content {
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 8px;
            color: #666;
        }

        .message-sender {
            font-size: 12px;
            display: flex;
            align-items: center;
            color: #999;
        }

        .message-sender .layui-icon {
            margin-right: 4px;
        }

        .no-messages {
            padding: 50px 20px;

            text-align: center;
            color: #999;
        }

        .no-messages .layui-icon {
            font-size: 64px;
            margin-bottom: 20px;
            color: #ddd;
        }

        .message-actions {
            position: fixed;
            z-index: 1000;
            right: 20px;
            bottom: 20px;
        }

        .action-btn {
            font-size: 24px;
            display: block;

            width: 50px;
            height: 50px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all .3s ease;
            color: white;
            border: none;
            border-radius: 50%;
            background-color: rgb(4, 46, 167);
            box-shadow: 0 4px 8px rgba(0, 0, 0, .2);
        }

        .action-btn:hover {
            transform: scale(1.1);

            background-color: rgb(67, 92, 171);
        }

        /* 消息详情弹窗样式 */
        .message-detail-overlay {
            position: fixed;
            z-index: 1001;
            top: 0;
            left: 0;
            display: none;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, .5);
        }

        .message-detail-modal {
            position: fixed;
            z-index: 1002;
            top: 50%;
            left: 50%;
            overflow: hidden;
            width: 90%;
            max-width: 500px;
            max-height: 80%;
            transform: translate(-50%, -50%);
            border-radius: 10px;
            background: white;
        }

        .message-detail-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 20px;
            color: white;
            background-color: rgb(4, 46, 167);
        }

        .message-detail-body {
            overflow-y: auto;
            max-height: 400px;
            padding: 15px;
        }

        .close-btn {
            font-size: 24px;
            cursor: pointer;
            color: white;
            border: none;
            background: none;
        }

        /* WebSocket 状态指示器 */
        .ws-status {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
            transition: all 0.3s ease;
        }

        .ws-online {
            background-color: #52c41a;
            box-shadow: 0 0 8px rgba(82, 196, 26, 0.6);
        }

        .ws-offline {
            background-color: #f5222d;
            box-shadow: 0 0 8px rgba(245, 34, 45, 0.6);
        }

        .ws-connecting {
            background-color: #faad14;
            box-shadow: 0 0 8px rgba(250, 173, 20, 0.6);
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }
    </style>
</head>

<body>
    <header>
        <div style="display: flex; align-items: center;">
            <span id="wsStatus" class="ws-status ws-offline" title="WebSocket连接状态">●</span>
        </div>
        <div class="message-title">
            消息中心
            <span class="message-count" id="unreadCount">0</span>
        </div>
        <i class="layui-icon layui-icon-more-vertical" style="cursor: pointer;"></i>
    </header>

    <div class="tool">
        <label class="message-filter active" data-filter="all">全部</label>
        <label class="message-filter" data-filter="unread">未读</label>
        <label class="message-filter" data-filter="pending">待处置</label>
        <label class="message-filter" data-filter="processed">已处置</label>
    </div>

    <main>
        <div class="message-container" id="messageContainer">
            <!-- 消息列表将通过 JavaScript 动态生成 -->
        </div>
    </main>

    <!-- 操作按钮 -->
    <div class="message-actions">
        <button class="action-btn" onclick="markAllAsRead()" title="全部标记为已读">
            <i class="layui-icon layui-icon-ok"></i>
        </button>
    </div>

    <!-- 消息详情弹窗 -->
    <div class="message-detail-overlay" id="messageDetailOverlay" onclick="closeMessageDetail()">
        <div class="message-detail-modal" onclick="event.stopPropagation()">
            <div class="message-detail-header">
                <h3 id="detailTitle">消息详情</h3>
                <button class="close-btn" onclick="closeMessageDetail()">×</button>
            </div>
            <div class="message-detail-body" id="detailContent">
                <!-- 详情内容 -->
            </div>
        </div>
    </div>

    <script src="/lib/layui-v2.6.3/layui.js" charset="utf-8"></script>
    <script src="/js/lay-config.js" charset="utf-8"></script>
    <script>
        layui.use(['appconfig', 'layer', 'form', 'jquery'], function () {
            const $ = layui.jquery;
            const appconfig = layui.appconfig;
            const layer = layui.layer;
            const form = layui.form;

            // WebSocket 配置（从 appconfig 获取）
            const WS_CONFIG = {
                WS_BASE: appconfig.ws + '/ws',  // 使用 appconfig 的 ws 地址
                API_BASE: appconfig.api + '/api',  // 使用 appconfig 的 api 地址
                HEARTBEAT_INTERVAL: 30000,
                RECONNECT_INTERVAL: 5000,
                ENABLE_DESKTOP_NOTIFICATION: true,
                ENABLE_SOUND_NOTIFICATION: true,
                ENABLE_AUTO_RECONNECT: true
            };

            // WebSocket 变量
            let ws = null;
            let reconnectTimer = null;
            let heartbeatTimer = null;

            // 消息数据存储
            const messageData = [];
            let messageIdCounter = 1;
            let currentFilter = 'all';
            const loginUser = JSON.parse(localStorage.getItem('loginUser'));

            // 获取用户信息（从 localStorage 或其他地方获取）
            function getUserInfo() {
                // 这里需要根据实际情况获取用户信息
                // 示例：从 localStorage 获取
                return {
                    userId: loginUser ? loginUser.user_mi : (localStorage.getItem('userId') || 'DOC001'),
                    userRole: 'doctor',
                    wardCode: loginUser ? loginUser.dept_sn : (localStorage.getItem('wardCode') || 'NK001')
                };
            }

            // 更新 WebSocket 状态指示器（使用 jQuery）
            function updateWSStatus(status) {
                const $statusElement = $('#wsStatus');
                if ($statusElement.length === 0) return;

                $statusElement.removeClass('ws-online ws-offline ws-connecting').addClass('ws-status');

                switch (status) {
                    case 'online':
                        $statusElement.addClass('ws-online').attr('title', 'WebSocket已连接');
                        break;
                    case 'offline':
                        $statusElement.addClass('ws-offline').attr('title', 'WebSocket未连接');
                        break;
                    case 'connecting':
                        $statusElement.addClass('ws-connecting').attr('title', 'WebSocket连接中...');
                        break;
                }
            }

            // WebSocket 连接
            function connectWebSocket() {
                const userInfo = getUserInfo();
                const wsUrl = `${WS_CONFIG.WS_BASE}?userId=${userInfo.userId}&userRole=${userInfo.userRole}&wardCode=${userInfo.wardCode}`;

                console.log('正在连接 WebSocket:', wsUrl);
                updateWSStatus('connecting');

                try {
                    ws = new WebSocket(wsUrl);

                    ws.onopen = function () {
                        console.log('✅ WebSocket 连接成功');
                        updateWSStatus('online');

                        // 显示连接成功提示（直接使用 layer，无需再次 use）
                        layer.msg('消息推送已连接', { icon: 1, time: 1000 });

                        // 开始心跳
                        startHeartbeat();
                    };

                    ws.onmessage = function (event) {
                        console.log('📨 收到消息:', event.data);

                        try {
                            const msg = JSON.parse(event.data);
                            handleWebSocketMessage(msg);
                        } catch (e) {
                            console.error('解析消息失败:', e);
                        }
                    };

                    ws.onerror = function (error) {
                        console.error('❌ WebSocket 错误:', error);
                        updateWSStatus('offline');
                    };

                    ws.onclose = function () {
                        console.log('🔌 WebSocket 连接已关闭');
                        updateWSStatus('offline');
                        stopHeartbeat();

                        // 自动重连
                        if (WS_CONFIG.ENABLE_AUTO_RECONNECT) {
                            reconnectTimer = setTimeout(() => {
                                console.log('尝试重新连接...');
                                connectWebSocket();
                            }, WS_CONFIG.RECONNECT_INTERVAL);
                        }
                    };
                } catch (error) {
                    console.error('WebSocket 连接失败:', error);
                    updateWSStatus('offline');
                }
            }

            // 心跳机制
            function startHeartbeat() {
                heartbeatTimer = setInterval(() => {
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ Type: 'ping' }));
                    }
                }, WS_CONFIG.HEARTBEAT_INTERVAL);
            }

            function stopHeartbeat() {
                if (heartbeatTimer) {
                    clearInterval(heartbeatTimer);
                    heartbeatTimer = null;
                }
            }

            // 处理接收到的 WebSocket 消息
            function handleWebSocketMessage(msg) {
                // 忽略连接和心跳消息
                if (msg.Type === 'connection' || msg.Type === 'pong' || msg.Type === 'echo') {
                    return;
                }

                // 处理危急值消息
                if (msg.CrisisString) {
                    console.log('收到危急值消息:', {
                        PatientCrisisID: msg.PatientCrisisID,
                        CrisisString: msg.CrisisString,
                        PatientInfo: msg.PatientInfo,
                        ReceiveFlag: msg.ReceiveFlag
                    });

                    // 检查是否已存在该消息
                    const existingMessage = messageData.find(m => m.crisisId === msg.PatientCrisisID);

                    if (existingMessage) {
                        // 如果消息已存在
                        if (String(msg.ReceiveFlag) === '1' || msg.ReceiveFlag === 1) {
                            // ReceiveFlag = 1 表示已处理，更新消息状态
                            console.log('收到已处理的消息，更新状态:', msg.PatientCrisisID);
                            existingMessage.opinionStatus = 'processed';
                            existingMessage.isRead = true;
                            existingMessage.receiveFlag = msg.ReceiveFlag;

                            // 如果有处置意见，也更新
                            if (msg.DoctorOpinion) {
                                existingMessage.doctorOpinion = msg.DoctorOpinion;
                                existingMessage.fullContent = `患者信息：${msg.PatientInfo || '未知'}\n\n危急值内容：\n${msg.CrisisString}\n\n接收时间：${existingMessage.time}\n\n处置意见：\n${msg.DoctorOpinion}`;
                            }

                            // 更新界面
                            renderMessages();
                            updateUnreadCount();
                            layer.msg('消息状态已更新', { icon: 1, time: 1000 });
                        } else {
                            // 重复的未处理消息，忽略
                            console.log('收到重复消息，忽略:', msg.PatientCrisisID);
                        }
                        return;
                    }

                    // 如果是已处理的新消息，不添加
                    if (String(msg.ReceiveFlag) === '1' || msg.ReceiveFlag === 1) {
                        console.log('收到已处理的新消息，不添加到列表:', msg.PatientCrisisID);
                        return;
                    }

                    // 添加新的未处理消息
                    addNewMessage({
                        type: 'urgent',
                        title: `危急值通知：${msg.PatientInfo || '患者'}`,
                        content: msg.CrisisString,
                        sender: '系统推送',
                        fullContent: `患者信息：${msg.PatientInfo || '未知'}\n\n危急值内容：\n${msg.CrisisString}\n\n接收时间：${new Date().toLocaleString()}`,
                        crisisId: msg.PatientCrisisID,  // 使用 PatientCrisisID 作为危急值ID
                        patientInfo: msg.PatientInfo,
                        needOpinion: true,  // 标记需要医生处置意见
                        opinionStatus: 'pending'  // 处置状态：pending(待处理)、processed(已处理)
                    });

                    // 显示桌面通知
                    showDesktopNotification(msg);

                    // 播放提示音（如果需要）
                    playNotificationSound();
                }
            }

            // 删除消息（根据 crisisId）
            function removeMessage(crisisId) {
                const index = messageData.findIndex(msg => msg.crisisId === crisisId);
                if (index !== -1) {
                    messageData.splice(index, 1);
                    console.log('已删除消息:', crisisId);

                    // 更新界面
                    renderMessages();
                    updateUnreadCount();
                }
            }

            // 添加新消息
            function addNewMessage(messageInfo) {
                const newMessage = {
                    id: messageIdCounter++,
                    type: messageInfo.type || 'urgent',
                    title: messageInfo.title,
                    content: messageInfo.content,
                    sender: messageInfo.sender,
                    time: new Date().toLocaleString(),
                    isRead: false,
                    fullContent: messageInfo.fullContent,
                    crisisId: messageInfo.crisisId,  // 危急值ID
                    patientInfo: messageInfo.patientInfo,  // 患者信息
                    needOpinion: messageInfo.needOpinion || false,  // 是否需要处置意见
                    opinionStatus: messageInfo.opinionStatus || 'pending',  // 处置状态
                    doctorOpinion: messageInfo.doctorOpinion || ''  // 医生处置意见
                };

                // 添加到消息列表开头
                messageData.unshift(newMessage);

                // 更新界面
                renderMessages();
                updateUnreadCount();

                // 显示新消息提示
                layer.msg('收到新消息', { icon: 1, time: 1500 });
            }

            // 显示桌面通知
            function showDesktopNotification(msg) {
                if (WS_CONFIG.ENABLE_DESKTOP_NOTIFICATION &&
                    'Notification' in window &&
                    Notification.permission === 'granted') {
                    new Notification('危急值通知', {
                        body: msg.CrisisString,
                        icon: '/favicon.ico',
                        tag: 'crisis-notification',
                        requireInteraction: true // 需要用户交互才关闭
                    });
                }
            }

            // 播放提示音
            function playNotificationSound() {
                if (!WS_CONFIG.ENABLE_SOUND_NOTIFICATION) return;

                // 创建音频元素并播放
                const audio = new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBTGH0fPTgjMGHm7A7+OZUR');
                audio.play().catch(e => console.log('播放提示音失败:', e));
            }

            // 提交医生处置意见
            async function submitDoctorOpinion(messageId) {
                console.log('提交处置意见，消息ID:', messageId);
                const message = messageData.find(msg => msg.id === messageId);
                if (!message) {
                    layer.msg('消息不存在', { icon: 2 });
                    return;
                }

                const $opinionInput = $('#doctorOpinionInput');
                if ($opinionInput.length === 0) {
                    console.error('未找到处置意见输入框');
                    layer.msg('系统错误：未找到输入框', { icon: 2 });
                    return;
                }

                const opinion = $opinionInput.val().trim();
                if (!opinion) {
                    layer.msg('请输入处置意见', { icon: 0 });
                    return;
                }

                // 获取用户信息
                const userInfo = getUserInfo();

                // 显示加载提示
                const loadingIndex = layer.load(1, { shade: [0.3, '#000'] });

                try {
                    console.log('正在提交处置意见...', {
                        crisisId: message.crisisId,
                        userId: userInfo.userId,
                        opinion: opinion
                    });

                    const response = await fetch(`${WS_CONFIG.API_BASE}/message/opinion/doctor`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            CrisisId: message.crisisId,
                            UserId: userInfo.userId,
                            Opinion: opinion
                        })
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.Message || `HTTP ${response.status}`);
                    }

                    const result = await response.json();

                    // 关闭加载提示
                    layer.close(loadingIndex);

                    if (result.Success) {
                        // 更新消息状态
                        message.opinionStatus = 'processed';
                        message.doctorOpinion = opinion;

                        // 显示成功提示
                        layer.msg('处置意见提交成功', { icon: 1, time: 1500 });

                        // 关闭详情窗口
                        setTimeout(() => {
                            closeMessageDetail();
                            // 更新消息列表显示
                            renderMessages();
                        }, 1500);

                        console.log('✅ 处置意见提交成功');
                    } else {
                        throw new Error(result.Message || '提交失败');
                    }
                } catch (error) {
                    console.error('❌ 提交处置意见失败:', error);

                    // 关闭加载提示
                    layer.close(loadingIndex);
                    layer.msg('提交失败: ' + error.message, { icon: 2, time: 2000 });
                }
            }

            // 请求桌面通知权限
            function requestNotificationPermission() {
                if ('Notification' in window && Notification.permission === 'default') {
                    Notification.requestPermission();
                }
            }

            // 加载历史消息
            async function loadHistoryMessages() {
                const userInfo = getUserInfo();
                const wardCode = userInfo.wardCode;

                if (!wardCode) {
                    console.error('未获取到科室编号');
                    return;
                }

                // 显示加载提示
                const loadingIndex = layer.msg('正在加载消息...', {
                    icon: 16,
                    shade: 0.3,
                    time: 0  // 不自动关闭
                });

                try {
                    console.log('开始加载历史消息，科室编号:', wardCode);

                    // 并行请求未处理和已处理的消息
                    const [unprocessedRes, processedRes] = await Promise.all([
                        fetch(`${WS_CONFIG.API_BASE}/message/unprocessed/ward/${wardCode}`),
                        fetch(`${WS_CONFIG.API_BASE}/message/processed/ward/${wardCode}`)
                    ]);

                    if (!unprocessedRes.ok || !processedRes.ok) {
                        throw new Error('获取历史消息失败');
                    }

                    const unprocessedData = await unprocessedRes.json();
                    const processedData = await processedRes.json();

                    // 关闭加载提示
                    layer.close(loadingIndex);

                    if (unprocessedData.Success && processedData.Success) {
                        console.log('历史消息加载成功:', {
                            unprocessed: unprocessedData.Count,
                            processed: processedData.Count
                        });

                        // 处理未处理的消息
                        if (unprocessedData.Data && unprocessedData.Data.length > 0) {
                            unprocessedData.Data.forEach(msg => {
                                addHistoryMessage(msg);
                            });
                        }

                        // 处理已处理的消息
                        if (processedData.Data && processedData.Data.length > 0) {
                            processedData.Data.forEach(msg => {
                                addHistoryMessage(msg);
                            });
                        }

                        // 按时间倒序排序（最新的在前）
                        messageData.sort((a, b) => {
                            const timeA = new Date(a.time).getTime();
                            const timeB = new Date(b.time).getTime();
                            return timeB - timeA;  // 降序
                        });

                        // 更新界面
                        renderMessages();
                        updateUnreadCount();

                        const totalUnprocessed = unprocessedData.Count;
                        const totalProcessed = processedData.Count;
                        const totalCount = totalUnprocessed + totalProcessed;

                        if (totalCount > 0) {
                            layer.msg(`加载完成：${totalUnprocessed} 条待处置，${totalProcessed} 条已处置`, {
                                icon: 1,
                                time: 2000
                            });
                        } else {
                            layer.msg('暂无消息', {
                                icon: 1,
                                time: 1500
                            });
                        }
                    } else {
                        throw new Error('数据格式错误');
                    }
                } catch (error) {
                    console.error('❌ 加载历史消息失败:', error);
                    layer.close(loadingIndex);
                    layer.msg('加载消息失败: ' + error.message, { icon: 2, time: 2000 });
                }
            }

            // 添加历史消息（从API获取的消息）
            function addHistoryMessage(msg) {
                // 检查是否已存在（避免重复）
                const existingMessage = messageData.find(m => m.crisisId === msg.PatientCrisisID);
                if (existingMessage) {
                    console.log('历史消息已存在，跳过:', msg.PatientCrisisID);
                    return;
                }

                // 根据 ReceiveFlag 确定处置状态：1=已处置，0=未处置
                // ReceiveFlag 可能是字符串 '0'/'1' 或数字 0/1
                const isProcessed = String(msg.ReceiveFlag) === '1' || msg.ReceiveFlag === 1;
                const opinionStatus = isProcessed ? 'processed' : 'pending';
                console.log('消息状态 - ReceiveFlag:', msg.ReceiveFlag, 'isProcessed:', isProcessed);
                const newMessage = {
                    id: messageIdCounter++,
                    type: 'urgent',
                    title: `危急值通知：${msg.PatientInfo || '患者'}`,
                    content: msg.CrisisString || '危急值信息',
                    sender: '系统推送',
                    time: msg.SendTime ? new Date(msg.SendTime).toLocaleString() : new Date().toLocaleString(),
                    isRead: isProcessed,  // 已处理的标记为已读
                    fullContent: `患者信息：${msg.PatientInfo || '未知'}\n\n危急值内容：\n${msg.CrisisString || '未知'}\n\n发送时间：${msg.SendTime ? new Date(msg.SendTime).toLocaleString() : '未知'}${isProcessed && msg.DoctorOpinion ? '\n\n处置意见：\n' + msg.DoctorOpinion : ''}`,
                    crisisId: msg.PatientCrisisID,
                    patientInfo: msg.PatientInfo,
                    needOpinion: true,
                    opinionStatus: opinionStatus,  // 根据 ReceiveFlag 确定
                    doctorOpinion: msg.DoctorOpinion || '',
                    receiveFlag: msg.ReceiveFlag  // 保存原始 ReceiveFlag
                };

                // 添加到消息列表
                messageData.push(newMessage);
            }

            // 初始化函数
            async function init() {
                renderMessages();
                bindEvents();
                updateUnreadCount();

                // 先加载历史消息（不阻塞后续操作）
                try {
                    await loadHistoryMessages();
                } catch (error) {
                    console.error('历史消息加载失败，继续初始化WebSocket:', error);
                }

                // 然后连接 WebSocket 进行实时更新
                connectWebSocket();

                // 请求通知权限
                requestNotificationPermission();
            }

            // 页面加载完成后初始化
            // 由于在 layui.use 回调中,DOMContentLoaded 可能已经触发,所以直接检查状态
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                // DOM 已经加载完成,直接初始化
                init();
            }

            // 渲染消息列表（使用 jQuery）
            function renderMessages() {
                const $container = $('#messageContainer');
                let filteredMessages = messageData;

                // 根据筛选条件过滤消息
                switch (currentFilter) {
                    case 'unread':
                        filteredMessages = messageData.filter(msg => !msg.isRead);
                        break;
                    case 'pending':
                        // 待处置：显示状态为 pending 的消息
                        filteredMessages = messageData.filter(msg => msg.opinionStatus === 'pending');
                        break;
                    case 'processed':
                        // 已处置：显示状态为 processed 的消息
                        filteredMessages = messageData.filter(msg => msg.opinionStatus === 'processed');
                        break;
                    default:
                        filteredMessages = messageData;
                }

                if (filteredMessages.length === 0) {
                    $container.html(`
                    <div class="no-messages">
                        <div class="layui-icon layui-icon-email"></div>
                        <p>暂无消息</p>
                    </div>
                `);
                    return;
                }

                let html = '';
                filteredMessages.forEach(message => {
                    const typeClass = message.type;
                    const typeName = getTypeName(message.type);
                    const unreadClass = message.isRead ? '' : 'unread';

                    // 构建处置状态标签
                    let opinionStatusBadge = '';
                    if (message.needOpinion && message.type === 'urgent') {
                        if (message.opinionStatus === 'processed') {
                            opinionStatusBadge = '<span style="background: #52c41a; color: white; padding: 2px 8px; border-radius: 10px; font-size: 11px; margin-left: 5px;"><i class="layui-icon layui-icon-ok-circle" style="font-size: 11px;"></i> 已处置</span>';
                        } else {
                            opinionStatusBadge = '<span style="background: #faad14; color: white; padding: 2px 8px; border-radius: 10px; font-size: 11px; margin-left: 5px;"><i class="layui-icon layui-icon-time" style="font-size: 11px;"></i> 待处置</span>';
                        }
                    }

                    html += `
                    <div class="message-card ${unreadClass}" onclick="showMessageDetail(${message.id})">
                        <div class="message-header">
                            <div>
                                <span class="message-type ${typeClass}">${typeName}</span>
                                ${opinionStatusBadge}
                            </div>
                            <span class="message-time">${message.time}</span>
                        </div>
                        <div class="message-title-text">${message.title}</div>
                        <div class="message-content">${message.content}</div>
                        <div class="message-sender">
                            <i class="layui-icon layui-icon-username"></i>
                            ${message.sender}
                        </div>
                    </div>
                `;
                });

                $container.html(html);
            }

            // 获取消息类型名称
            function getTypeName(type) {
                const typeNames = {
                    'system': '系统',
                    'notice': '公告',
                    'work': '工作',
                    'urgent': '紧急'
                };
                return typeNames[type] || '消息';
            }

            // 绑定事件（使用 jQuery）
            function bindEvents() {
                // 筛选按钮事件
                $('.message-filter').on('click', function () {
                    $('.message-filter').removeClass('active');
                    $(this).addClass('active');
                    currentFilter = $(this).data('filter');
                    renderMessages();
                });
            }

            // 显示消息详情
            function showMessageDetail(messageId) {
                const message = messageData.find(msg => msg.id === messageId);
                if (!message) return;

                // 标记为已读
                if (!message.isRead) {
                    message.isRead = true;
                    updateUnreadCount();
                    renderMessages();
                }

                // 构建详情内容
                let detailHtml = `
                <div class="message-header" style="margin-bottom: 0px;">
                    <span class="message-type ${message.type}">${getTypeName(message.type)}</span>
                    <span class="message-time">${message.time}</span>
                </div>
                <div style="white-space: pre-line; margin-bottom: 15px;">
                    ${message.fullContent}
                </div>
            `;

                // 如果是危急值消息且需要医生处置意见
                if (message.needOpinion && message.type === 'urgent') {
                    const userInfo = getUserInfo();

                    // 显示处置状态
                    if (message.opinionStatus === 'processed' && message.doctorOpinion) {
                        // 已处理：显示处置意见
                        detailHtml += `
                        <div style="background: #f0f9ff; border-left: 4px solid #1890ff; padding: 15px; margin-bottom: 15px; border-radius: 4px;">
                            <div style="color: #1890ff; font-weight: bold; margin-bottom: 8px;">
                                <i class="layui-icon layui-icon-ok-circle"></i> 已处置
                            </div>
                            <div style="color: #333; line-height: 1.6;">
                                <strong>处置意见：</strong><br/>
                                ${message.doctorOpinion}
                            </div>
                        </div>
                    `;
                    } else if (userInfo.userRole === 'doctor') {
                        // 待处理：显示输入框（仅医生可见）
                        detailHtml += `
                        <div style="background: #fff7e6; border-left: 4px solid #faad14; padding: 15px; margin-bottom: 15px; border-radius: 4px;">
                            <div style="color: #fa8c16; font-weight: bold; margin-bottom: 10px;">
                                <i class="layui-icon layui-icon-tips"></i> 待处置
                            </div>
                            <textarea id="doctorOpinionInput" placeholder="请输入处置意见..." 
                                style="width: 100%; min-height: 100px; padding: 10px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 14px; line-height: 1.5; resize: vertical; font-family: inherit;"></textarea>
                            <div style="margin-top: 10px; text-align: right;">
                                <button onclick="submitDoctorOpinion(${message.id})" 
                                    style="background: #1890ff; color: white; border: none; padding: 8px 20px; border-radius: 4px; cursor: pointer; font-size: 14px;">
                                    <i class="layui-icon layui-icon-ok"></i> 提交处置意见
                                </button>
                            </div>
                        </div>
                    `;
                    } else {
                        // 护士查看：显示待处理状态
                        detailHtml += `
                        <div style="background: #fff7e6; border-left: 4px solid #faad14; padding: 15px; margin-bottom: 15px; border-radius: 4px;">
                            <div style="color: #fa8c16; font-weight: bold;">
                                <i class="layui-icon layui-icon-tips"></i> 待医生处置
                            </div>
                        </div>
                    `;
                    }
                }

                detailHtml += `
                <div class="message-sender">
                    <i class="layui-icon layui-icon-username"></i>
                    发送人：${message.sender}
                </div>
            `;

                // 显示详情弹窗（使用 jQuery）
                $('#detailTitle').text(message.title);
                $('#detailContent').html(detailHtml);
                $('#messageDetailOverlay').show();
            }

            // 关闭消息详情
            function closeMessageDetail() {
                $('#messageDetailOverlay').hide();
            }

            // 全部标记为已读
            function markAllAsRead() {
                if (messageData.length === 0) {
                    layer.msg('暂无消息', { icon: 0 });
                    return;
                }

                messageData.forEach(msg => msg.isRead = true);
                updateUnreadCount();
                renderMessages();
                layer.msg('所有消息已标记为已读', { icon: 1 });
            }

            // 更新未读数量
            function updateUnreadCount() {
                const unreadCount = messageData.filter(msg => !msg.isRead).length;
                const $countElement = $('#unreadCount');
                if (unreadCount > 0) {
                    $countElement.text(unreadCount).show();
                } else {
                    $countElement.hide();
                }
            }

            // 处理移动端返回键（在 iframe 子页面中）
            window.addEventListener('message', function (event) {
                // 检查是否有打开的 layer 弹层
                if (event.data && event.data.type === 'back') {
                    closeMessageDetail();
                    if (window.layui && layui.layer) {
                        var openLayers = document.querySelectorAll('.layui-layer');
                        if (openLayers && openLayers.length > 0) {
                            // 如果有弹层，关闭最上层的弹层
                            layui.layer.closeAll();
                            return;
                        }
                    }
                }

                // 如果没有弹层，不处理（让父页面处理返回逻辑）
            }, false);

            // 页面卸载时关闭 WebSocket
            window.addEventListener('beforeunload', function () {
                if (reconnectTimer) {
                    clearTimeout(reconnectTimer);
                }
                stopHeartbeat();
                if (ws) {
                    ws.close();
                    ws = null;
                }
            });

            // 将需要在 HTML onclick 中使用的函数暴露到全局作用域
            window.showMessageDetail = showMessageDetail;
            window.closeMessageDetail = closeMessageDetail;
            window.markAllAsRead = markAllAsRead;
            window.submitDoctorOpinion = submitDoctorOpinion;

        }); // 结束 layui.use
    </script>
</body>

</html>
