<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消息中心</title>
    <link rel="stylesheet" href="/lib/layui-v2.6.3/css/layui.css" media="all" />
    <link rel="stylesheet" href="/css/navpage/message.css" />
    <style>



    </style>
</head>

<body>
    <header>
        <div style="display: flex; align-items: center;">
            <span id="wsStatus" class="ws-status ws-offline" title="WebSocket连接状态">●</span>
        </div>
        <div class="message-title">
            消息中心
            <span class="message-count" id="unreadCount">0</span>
        </div>
        <i class="layui-icon layui-icon-more-vertical" style="cursor: pointer;"></i>
    </header>

    <div class="tool">
        <!-- <label class="message-filter" data-filter="all">全部</label>
        <label class="message-filter" data-filter="unread">未读</label> -->
        <label class="message-filter active" data-filter="pending">待处置</label>
        <label class="message-filter" data-filter="processed">已处置</label>
    </div>

    <main>
        <div class="message-container" id="messageContainer">
            <!-- 消息列表将通过 JavaScript 动态生成 -->
        </div>
    </main>

    <!-- 操作按钮 -->
    <div class="message-actions">
        <button class="action-btn" onclick="markAllAsRead()" title="全部标记为已读">
            <i class="layui-icon layui-icon-ok"></i>
        </button>
    </div>

    <!-- 消息详情弹窗 -->
    <div class="message-detail-overlay" id="messageDetailOverlay" onclick="closeMessageDetail()">
        <div class="message-detail-modal" onclick="event.stopPropagation()">
            <div class="message-detail-header">
                <h3 id="detailTitle">消息详情</h3>
                <button class="close-btn" onclick="closeMessageDetail()">×</button>
            </div>
            <div class="message-detail-body" id="detailContent">
                <!-- 详情内容 -->
            </div>
        </div>
    </div>

    <script src="/lib/layui-v2.6.3/layui.js" charset="utf-8"></script>
    <script src="/lib/lay-config.js" charset="utf-8"></script>
    <script src="../js/navpage/message.js" charset="utf-8"></script>
</body>

</html>
