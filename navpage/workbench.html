<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <link rel="stylesheet" href="/lib/layui-v2.6.3/css/layui.css" media="all" />
  <style>
    body,
    html {
      height: 100%;
    }

    header {
      font-size: 18px;
      font-weight: bold;
      line-height: 50px;
      height: 10%;
      text-align: center;
      color: #fff;
      background-color: rgb(4, 46, 167);
    }

    .workbench-area {
      box-sizing: border-box;
      margin: 10px;
      padding: 20px;
      padding-top: 10px;
      border-radius: 10px;
      background-color: #fff;
    }

    .workbench-area h3 {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .workbench-content {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
    }

    .work-item {
      height: 80px;
      text-align: center;
    }

    .work-item i {
      font-size: 32px;
    }

    .layui-icon.layui-icon-date {
      color: rgb(102, 172, 159);
    }

    .layui-icon.layui-icon-fire {
      color: rgb(225, 112, 85);
    }
  </style>
</head>

<body>
  <header>工作台</header>
  <main>
    <div class="workbench-area">
      <h3>医疗服务</h3>
      <div class="workbench-content">
        <div class="work-item">
          <i class="layui-icon layui-icon-fire"></i>
          <p>危机值管理</p>
        </div>
        <div class="work-item">
          <i class="layui-icon layui-icon-date"></i>
          <p>日程管理</p>
        </div>
        <div class="work-item">
          <i class="layui-icon layui-icon-date"></i>
          <p>日程管理</p>
        </div>
        <div class="work-item">
          <i class="layui-icon layui-icon-date"></i>
          <p>日程管理</p>
        </div>
        <div class="work-item">
          <i class="layui-icon layui-icon-date"></i>
          <p>日程管理</p>
        </div>
      </div>
    </div>
    <div class="workbench-area">
      <h3>辅助医疗</h3>
      <div class="workbench-content">
        <div class="work-item">
          <i class="layui-icon layui-icon-date"></i>
          <p>日程管理</p>
        </div>
      </div>
    </div>
    <div class="workbench-area">
      <h3>OA办公</h3>
      <div class="workbench-content">
        <div class="work-item">
          <i class="layui-icon layui-icon-date"></i>
          <p>日程管理</p>
        </div>
      </div>
    </div>
  </main>
  <script src="/lib/layui-v2.6.3/layui.js"></script>
  <script>
    // 处理移动端返回键（在 iframe 子页面中）
    window.addEventListener('message', function (event) {
      // 检查是否有打开的 layer 弹层
      if (event.data && event.data.type === 'back') {
        if (window.layui && layui.layer) {
          var openLayers = document.querySelectorAll('.layui-layer');
          if (openLayers && openLayers.length > 0) {
            // 如果有弹层，关闭最上层的弹层
            layui.layer.closeAll();
            return;
          }
        }
      }

      // 如果没有弹层，不处理（让父页面处理返回逻辑）
    }, false);
  </script>
</body>

</html>
