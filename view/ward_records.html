<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>查房记录</title>
  <link rel="stylesheet" href="/lib/layui-v2.6.3/css/layui.css" media="all" />
  <link rel="stylesheet" href="/css/public.css" media="all" />
  <!-- <link rel="stylesheet" href="/css/table/iframe.css" media="all" /> -->
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: transparent;
    }

    .layui-container {
      width: 100%;
      max-width: 100%;
      margin: 0;
      padding: 0;
    }

    /* 头部操作区域样式 */
    .header-controls {
      position: fixed;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      justify-content: space-between;
      box-sizing: border-box;
      width: 100%;
      height: 50px;
      padding: 8px;
      border: 1px solid #e9ecef;
      border-radius: 6px;
      background-color: rgb(4, 46, 167);
      gap: 10px;
    }

    .page-title {
      font-size: 18px;
      font-weight: bold;
      margin: 0;
      color: #fff;
    }

    /* 查房记录列表样式 */
    .record-list {
      overflow-y: auto;
      box-sizing: border-box;
      height: 90%;
      padding: 20px;
      padding-top: 70px;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .1);
    }

    .ward-record-item {
      display: flex;
      align-items: flex-start;
      margin-bottom: 15px;
      padding: 20px;
      transition: background-color .2s;
      border-bottom: 1px solid #f0f0f0;
      border-left: 4px solid #1e9fff;
      border-radius: 6px;
      background: #fafafa;
      gap: 15px;
    }

    .ward-record-item:hover {
      background-color: #f0f9ff;
    }

    .ward-record-info {
      flex: 1;
    }

    .ward-record-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .ward-record-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 5px;
      color: #333;
    }

    .ward-record-meta {
      font-size: 12px;
      display: flex;
      margin-bottom: 10px;
      color: #666;
      gap: 15px;
    }

    .ward-record-content {
      line-height: 1.6;
      margin-bottom: 10px;
      padding: 10px;
      color: #555;
      border: 1px solid #eee;
      border-radius: 4px;
      background: #fff;
    }

    .ward-record-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* 录音控件样式 */
    .recording-section {
      margin-top: 5px;
      padding: 10px;
    }

    .recording-controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 10px;
      gap: 10px;
    }

    .recording-controls span {
      width: 100%;
      text-align: center;
    }

    /* 音频播放器样式 */
    audio {
      width: 100%;
      max-width: 300px;
      height: 30px;
    }

    /* 音频控制区域样式 */
    .audio-controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 10px;
      gap: 10px;
    }

    .audio-controls audio {
      flex: 1;
      min-width: 200px;
    }

    /* 转文字按钮样式 */
    .convert-text-btn {
      font-weight: bold;
      flex-shrink: 0;
      transition: all .3s ease;
      color: white;
      border: none;
      background: linear-gradient(45deg, #1e9fff, #26c6da);
    }

    .convert-text-btn:hover {
      transform: translateY(-1px);
      background: linear-gradient(45deg, #0d8bf0, #1eb8cc);
      box-shadow: 0 4px 8px rgba(30, 159, 255, .3);
    }

    /* 表单样式优化 */
    .layui-form-item {
      margin-bottom: 5px;
    }

    .layui-textarea {
      min-height: 120px;
    }

    .layui-layer {
      top: 0;
      left: 0;
    }

    .ward-record-list-container {
      overflow-y: auto;
    }

    #btn-add-record {
      font-size: 16px;
      line-height: 30px;
      width: auto;
      height: 30px;
      padding: 0 5px;
      border-radius: 10px;
    }

    #btn-record-audio {
      width: 100px;
      height: 100px;
      border-radius: 50px;
    }

    .layui-layer-page .layui-layer-content {
      overflow: hidden;
      height: auto;
    }
  </style>
</head>

<body>
  <div class="layui-container">
    <!-- 头部操作区域 -->
    <div class="header-controls">
      <!-- 关闭弹窗 -->
      <i class="layui-icon layui-icon-return" id="backBtn" title="返回"
        style="cursor: pointer; font-size: 20px; color: #fff;"></i>
      <h2 class="page-title">
        <i class="layui-icon layui-icon-record"></i> 查房记录管理
      </h2>
      <div>
        <button type="button" id="btn-add-record" class="layui-btn layui-btn-normal">
          <i class="layui-icon layui-icon-add-1"></i> 新建查房记录
        </button>
      </div>
    </div>

    <!-- 查房记录列表区域 -->
    <div class="record-list">
      <div id="ward-record-list-container">
        <div style="text-align: center; padding: 40px; color: #999">
          <i class="layui-icon layui-icon-record" style="font-size: 48px; display: block; margin-bottom: 10px"></i>
          暂无查房记录，点击上方按钮新建记录
        </div>
      </div>
    </div>
  </div>

  <script src="/lib/layui-v2.6.3/layui.js" charset="utf-8"></script>
  <script src="/lib/lay-config.js?v=1.0.4" charset="utf-8"></script>
  <script>
    layui.use(["layer", "form", "appconfig"], function () {
      var $ = layui.jquery;
      var layer = layui.layer;
      var form = layui.form;
      var appconfig = layui.appconfig;
      // 获取患者信息
      var patientData = JSON.parse(localStorage.getItem("userData") || "{}");
      var userData = JSON.parse(localStorage.getItem("userData") || "{}");
      var loginUser = JSON.parse(localStorage.getItem("loginUser") || "{}");

      // 查房记录存储
      // let wardRecords = JSON.parse(
      //   localStorage.getItem("wardRecords") || "[]"
      // );
      let wardRecords = JSON.parse("[]"
      );

      // 录音功能变量
      let mediaRecorder;
      let audioChunks = [];
      let audioBlob = null;
      let isRecording = false;
      let recordingStartTime = null;
      let currentRecordId = null; // 当前正在编辑的查房记录ID

      // 初始化页面
      function init() {
        renderWardRecordList();
        bindEvents();
        // 注意：不在初始化时清理音频，而是在获取记录列表后清理
      }

      // 注释掉API获取查房记录列表，暂时只与本地localStorage交互

      $.ajax({
        url: appconfig.api + "/api/MobileWard/GetWardRoundsRecordList",
        type: "GET",
        data: {
          patient_id: userData.patient_id || "",
          admiss_times: userData.admiss_times || "",
        },
        success: function (res) {
          if (res.Status == 1) {
            wardRecords = res.Data || [];
            localStorage.setItem("wardRecords", JSON.stringify(wardRecords));
            renderWardRecordList();
            // 在获取到记录列表后，清理未使用的音频数据
            cleanupUnusedAudios();
          } else {
            layer.msg("获取查房记录失败：" + res.Message, { icon: 2 });
          }
        },
      });

      // 绑定事件
      function bindEvents() {
        // 新建查房记录按钮
        $("#btn-add-record").on("click", function () {
          console.log('点击新建查房记录按钮');

          // 因为这是弹窗页面，需要从顶层窗口获取 plus 对象
          var topPlus = null;
          try {
            topPlus = top.plus || parent.plus || window.plus;
          } catch (e) {
            topPlus = window.plus;
          }

          console.log('window.plus 存在:', !!window.plus);
          console.log('top.plus 存在:', !!(top && top.plus));
          console.log('parent.plus 存在:', !!(parent && parent.plus));
          console.log('最终使用的 plus 存在:', !!topPlus);
          console.log('plus.android 存在:', !!(topPlus && topPlus.android));
          console.log('plus.runtime 存在:', !!(topPlus && topPlus.runtime));

          // 在5+原生环境下，点击时检查并申请权限
          if (topPlus && topPlus.android) {
            console.log('检测到 Android 5+ 环境，开始申请权限');
            try {
              // 使用 plus.android.requestPermissions 申请权限
              console.log("正在申请麦克风权限...");

              topPlus.android.requestPermissions(
                ['android.permission.RECORD_AUDIO'],
                function (e) {
                  // 权限申请成功的回调
                  console.log("权限申请结果回调", e);

                  if (e.granted && e.granted.length > 0) {
                    // 权限被授予
                    console.log("麦克风权限已授权", e.granted);
                    layer.msg('权限已授予', { icon: 1, time: 1000 });
                    showAddRecordDialog();
                  } else if (e.deniedAlways && e.deniedAlways.length > 0) {
                    // 权限被永久拒绝
                    console.log("麦克风权限被永久拒绝", e.deniedAlways);
                    layer.confirm('麦克风权限被拒绝，需要前往设置中手动授权', {
                      icon: 3,
                      btn: ['前往设置', '取消']
                    }, function (idx) {
                      layer.close(idx);
                      try {
                        // 跳转到应用设置页
                        var main = topPlus.android.runtimeMainActivity();
                        var Intent = topPlus.android.importClass("android.content.Intent");
                        var Uri = topPlus.android.importClass("android.net.Uri");
                        var Settings = topPlus.android.importClass("android.provider.Settings");
                        var intent = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS);
                        var packageName = topPlus.android.invoke(main, "getPackageName");
                        var uri = Uri.fromParts("package", packageName, null);
                        intent.setData(uri);
                        main.startActivity(intent);
                      } catch (err) {
                        console.error("无法打开设置页", err);
                        layer.msg('请在系统设置中手动授予麦克风权限', { icon: 0, time: 3000 });
                      }
                    });
                  } else if (e.deniedPresent && e.deniedPresent.length > 0) {
                    // 权限被本次拒绝(但可以再次申请)
                    console.log("麦克风权限被拒绝", e.deniedPresent);
                    layer.msg('需要麦克风权限才能录音，请重新尝试并允许权限', { icon: 2, time: 3000 });
                  } else {
                    console.warn("未知的权限申请结果", e);
                    layer.msg('权限申请结果未知，请重试', { icon: 0, time: 2000 });
                  }
                },
                function (e) {
                  // 权限申请失败的回调
                  console.error("权限申请失败", e);
                  layer.msg("权限申请失败: " + JSON.stringify(e), { icon: 2, time: 3000 });
                }
              );
            } catch (err) {
              console.error("权限处理异常", err);
              layer.msg("权限处理异常: " + err.message, { icon: 2 });
              // 如果权限API出错，尝试直接打开对话框（让getUserMedia触发权限）
              showAddRecordDialog();
            }
          }
          // 非5+环境（浏览器/iOS webview）
          else if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            // 浏览器环境：尝试获取麦克风权限
            navigator.mediaDevices.getUserMedia({ audio: true })
              .then(stream => {
                // 获取权限成功，立即停止流
                stream.getTracks().forEach(track => track.stop());
                console.log("浏览器麦克风权限已授权");
                showAddRecordDialog();
              })
              .catch(err => {
                console.warn("浏览器麦克风权限被拒绝", err);
                layer.confirm('无法访问麦克风，请在浏览器设置中允许麦克风权限', {
                  icon: 3,
                  btn: ['知道了']
                });
              });
          }
          // 其他情况直接打开（比如PC调试环境）
          else {
            showAddRecordDialog();
          }
        });

        // 返回按钮
        $("#backBtn").on("click", function () {
          console.log("关闭查房记录弹窗");
          parent.layer.closeAll();
        });
      }

      // 显示新增查房记录对话框
      function showAddRecordDialog() {
        var now = new Date();
        var currentTime = formatDateTime(now);
        var patientName = userData.name || patientData.name || "未知患者";
        var bedNo = userData.bed_no || patientData.bed_no || "未知床号";
        var doctorName = loginUser.user_name || loginUser.name || "未知医生";

        layer.open({
          type: 1,
          title: "新建查房记录",
          area: ["100%", "auto"], // 使用百分比高度，自适应父页面
          maxHeight: "90%", // 最大高度不超过父页面90%
          offset: "auto",
          content: `
              <form class="layui-form" style="box-sizing: border-box; padding: 18px;" id="ward-record-form">
                <div class="layui-row">
                  <div class="layui-col-md6">
                    <div class="layui-form-item">
                      <label class="layui-form-label">患者姓名</label>
                      <div class="layui-input-block">
                        <input type="text" name="patient_name" value="${patientName}" readonly class="layui-input layui-disabled">
                      </div>
                    </div>
                  </div>
                  <div class="layui-col-md6">
                    <div class="layui-form-item">
                      <label class="layui-form-label">床号</label>
                      <div class="layui-input-block">
                        <input type="text" name="bed_no" value="${bedNo}" readonly class="layui-input layui-disabled">
                      </div>
                    </div>
                  </div>
                </div>

                <div class="layui-row">
                  <div class="layui-col-md6">
                    <div class="layui-form-item">
                      <label class="layui-form-label">查房医生</label>
                      <div class="layui-input-block">
                        <input type="text" name="doctor_name" value="${doctorName}" class="layui-input">
                      </div>
                    </div>
                  </div>
                  <div class="layui-col-md6">
                    <div class="layui-form-item">
                      <label class="layui-form-label">查房时间</label>
                      <div class="layui-input-block">
                        <input type="text" name="visit_time" value="${currentTime}" class="layui-input">
                      </div>
                    </div>
                  </div>
                </div>

                <!-- 隐藏的文字内容字段 -->
                <input type="hidden" name="record_content" id="record-content-input" value="">

                <!-- 录音功能区域 -->
                <div class="layui-form-item">
                  <div class="layui-input-block" style="margin:0 10px">
                    <div class="recording-section">
                      <div id="audio-container" style="visibility: hidden;">
                        <div class="audio-controls">
                          <audio id="audio-preview" controls style="flex: 1; min-width: 200px;"></audio>
                        </div>
                      </div>
                      
                      <div class="recording-controls">
                        <button type="button" id="btn-record-audio" class="layui-btn layui-btn-sm layui-btn-normal">
                          <i class="layui-icon layui-icon-mike"></i> 开始录音
                        </button>
                        
                        <span id="recording-status" style="color: #666; font-size: 12px;height:16px"></span>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="layui-form-item" id="btn-confirm-record" style="width:100%;text-align: center; margin-top: 10px; display: none;">
                  <button class="layui-btn layui-btn-normal" lay-submit lay-filter="save-record">
                    <i class="layui-icon layui-icon-ok"></i> 保存查房记录
                  </button>
                  <button type="button" class="layui-btn layui-btn-primary" onclick="layer.closeAll()">
                    <i class="layui-icon layui-icon-close"></i> 取消
                  </button>
                </div>
              </form>
            `,
          success: function (layero, index) {
            currentRecordId = "temp_" + Date.now(); // 临时ID

            // 重新渲染表单
            form.render();

            // 绑定录音功能
            bindRecordingEvents();

            // 监听表单提交
            form.on("submit(save-record)", function (data) {
              saveWardRecord(data.field, index);
              return false;
            });
          },
          end: function () {
            // 清理录音状态
            cleanupRecording();
          },
        });
      }

      // 绑定录音功能事件
      function bindRecordingEvents() {
        const recordBtn = document.getElementById("btn-record-audio");
        const audioPreview = document.getElementById("audio-preview");
        const statusSpan = document.getElementById("recording-status");

        if (recordBtn && audioPreview) {
          recordBtn.onclick = async function () {
            if (!isRecording) {
              await startRecording();
            } else {
              stopRecording();
            }
          };


        }
      }

      // 开始录音
      async function startRecording() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          layer.msg("当前浏览器不支持录音功能", { icon: 2 });
          return;
        }

        try {
          // 清理之前的音频和按钮
          const audioContainer = document.getElementById("audio-container");
          if (audioContainer) {
            audioContainer.style.visibility = "hidden";
            // 清除之前的转文字按钮
            const convertBtn = audioContainer.querySelector('.convert-text-btn');
            if (convertBtn) {
              convertBtn.remove();
            }
          }

          // 获取用户媒体流
          const stream = await navigator.mediaDevices.getUserMedia({
            audio: true,
          });
          //创建MediaRecorder实例
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = []; // 存储音频数据块的数组
          recordingStartTime = new Date();
          //设置数据处理回调
          mediaRecorder.ondataavailable = function (e) {
            if (e.data.size > 0) {
              audioChunks.push(e.data);//收集音频数据
            }
          };
          //设置录音结束回调
          mediaRecorder.onstop = function () {
            audioBlob = new Blob(audioChunks, { type: "audio/webm" });

            // 转换为WAV格式
            convertToWav(audioBlob)
              .then((wavBlob) => {
                audioBlob = wavBlob; // 更新为WAV格式
                const audioPreview = document.getElementById("audio-preview");
                const audioContainer = document.getElementById("audio-container");
                const audioControls = audioContainer.querySelector(".audio-controls");

                audioPreview.src = URL.createObjectURL(audioBlob);
                audioContainer.style.visibility = "visible";

                // 添加转文字按钮
                addConvertTextButton(audioControls);

                // 停止所有音频轨道
                stream.getTracks().forEach((track) => track.stop());
              })
              .catch((err) => {
                console.error("音频格式转换失败:", err);
                layer.msg(
                  "音频格式转换失败，将使用原始格式。转换文字功能可能受影响。",
                  {
                    icon: 2,
                    time: 3000,
                  }
                );

                // 如果转换失败，继续使用原格式
                const audioPreview = document.getElementById("audio-preview");
                const audioContainer = document.getElementById("audio-container");
                const audioControls = audioContainer.querySelector(".audio-controls");

                audioPreview.src = URL.createObjectURL(audioBlob);
                audioContainer.style.visibility = "visible";

                // 添加转文字按钮（即使转换失败也显示，让用户尝试）
                addConvertTextButton(audioControls);

                // 停止所有音频轨道
                stream.getTracks().forEach((track) => track.stop());
              });
          };

          mediaRecorder.start();
          isRecording = true;

          const recordBtn = document.getElementById("btn-record-audio");
          const statusSpan = document.getElementById("recording-status");

          recordBtn.innerHTML =
            '<i class="layui-icon layui-icon-pause"></i> 停止录音';
          recordBtn.className = "layui-btn layui-btn-sm layui-btn-danger";
          statusSpan.textContent = "正在录音中...";

          // 隐藏音频容器（在录音过程中）
          document.getElementById("audio-container").style.visibility = "hidden";
        } catch (err) {
          console.error("录音错误:", err);
          layer.msg("无法访问麦克风，请检查权限设置", { icon: 2 });
        }
      }

      // 停止录音
      function stopRecording() {
        if (mediaRecorder && mediaRecorder.state !== "inactive") {
          mediaRecorder.stop();
        }
        isRecording = false;

        const recordBtn = document.getElementById("btn-record-audio");
        const statusSpan = document.getElementById("recording-status");
        const confirmBtn = document.getElementById("btn-confirm-record");
        const layer = document.getElementsByClassName("layui-layer-content")[0];
        recordBtn.innerHTML =
          '<i class="layui-icon layui-icon-mike"></i> 开始录音';
        recordBtn.className = "layui-btn layui-btn-sm layui-btn-normal";
        statusSpan.textContent = "录音完成，可保存或者重新录制";
        confirmBtn.style.display = "inline-block";
        layer.style.height = "auto";
      }

      // 添加转文字按钮
      function addConvertTextButton(audioControls) {
        // 检查是否已经存在转文字按钮，避免重复添加
        if (audioControls.querySelector('.convert-text-btn')) {
          return;
        }

        const convertBtn = document.createElement('button');
        convertBtn.type = 'button';
        convertBtn.className = 'layui-btn layui-btn-sm convert-text-btn';
        convertBtn.innerHTML = '<i class="layui-icon layui-icon-fonts"></i> 转文字';
        convertBtn.title = '将录音转换为文字';

        // 绑定点击事件
        convertBtn.addEventListener('click', function () {
          convertAudioToText();
        });

        audioControls.appendChild(convertBtn);
      }

      // 音频转文字功能
      function convertAudioToText() {
        if (!audioBlob) {
          layer.msg('没有可转换的音频数据', { icon: 5 });
          return;
        }

        // 显示转换进度
        const loadingIndex = layer.msg('正在转换音频为文字，请稍候...', {
          icon: 16,
          shade: 0.3,
          time: 0
        });

        // 创建FormData对象

      // 将音频转换为WAV格式
      function convertToWav(audioBlob) {
        return new Promise((resolve, reject) => {
          try {
            const audioContext = new (window.AudioContext ||
              window.webkitAudioContext)();
            const fileReader = new FileReader();

            fileReader.onload = function (e) {
              audioContext
                .decodeAudioData(e.target.result)
                .then((audioBuffer) => {
                  try {
                    const wavBlob = audioBufferToWav(audioBuffer);
                    resolve(wavBlob);
                  } catch (err) {
                    console.error("WAV转换失败:", err);
                    reject(new Error("WAV格式转换失败"));
                  }
                })
                .catch((err) => {
                  console.error("音频解码失败:", err);
                  reject(new Error("音频解码失败，可能是不支持的音频格式"));
                });
            };

            fileReader.onerror = function (err) {
              console.error("文件读取失败:", err);
              reject(new Error("文件读取失败"));
            };

            fileReader.readAsArrayBuffer(audioBlob);
          } catch (err) {
            console.error("音频转换初始化失败:", err);
            reject(new Error("浏览器不支持音频处理功能"));
          }
        });
      }

      // 将AudioBuffer转换为16KHz WAV格式的Blob
      function audioBufferToWav(audioBuffer) {
        const originalSampleRate = audioBuffer.sampleRate;
        const targetSampleRate = 16000; // 后端要求的16KHz
        const numberOfChannels = 1; // 转为单声道，减少数据量

        // 重采样处理
        let resampledData;
        if (originalSampleRate === targetSampleRate) {
          // 如果采样率已经是16KHz，直接使用
          resampledData = audioBuffer.getChannelData(0);
        } else {
          // 需要重采样
          const resampleRatio = targetSampleRate / originalSampleRate;
          const originalData = audioBuffer.getChannelData(0);
          const resampledLength = Math.floor(
            originalData.length * resampleRatio
          );
          resampledData = new Float32Array(resampledLength);

          // 简单线性插值重采样
          for (let i = 0; i < resampledLength; i++) {
            const sourceIndex = i / resampleRatio;
            const index = Math.floor(sourceIndex);
            const fraction = sourceIndex - index;

            if (index + 1 < originalData.length) {
              resampledData[i] =
                originalData[index] * (1 - fraction) +
                originalData[index + 1] * fraction;
            } else {
              resampledData[i] = originalData[index] || 0;
            }
          }
        }

        const length = resampledData.length;
        const arrayBuffer = new ArrayBuffer(
          44 + length * numberOfChannels * 2
        );
        const view = new DataView(arrayBuffer);

        // WAV文件头
        const writeString = (offset, string) => {
          for (let i = 0; i < string.length; i++) {
            view.setUint8(offset + i, string.charCodeAt(i));
          }
        };

        writeString(0, "RIFF");
        view.setUint32(4, 36 + length * numberOfChannels * 2, true);
        writeString(8, "WAVE");
        writeString(12, "fmt ");
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, numberOfChannels, true);
        view.setUint32(24, targetSampleRate, true);
        view.setUint32(28, targetSampleRate * numberOfChannels * 2, true);
        view.setUint16(32, numberOfChannels * 2, true);
        view.setUint16(34, 16, true);
        writeString(36, "data");
        view.setUint32(40, length * numberOfChannels * 2, true);

        // 写入音频数据
        let offset = 44;
        for (let i = 0; i < length; i++) {
          const sample = resampledData[i];
          const int16Sample = Math.max(
            -32768,
            Math.min(32767, Math.floor(sample * 32767))
          );
          view.setInt16(offset, int16Sample, true);
          offset += 2;
        }

        console.log(
          `音频重采样: ${originalSampleRate}Hz -> ${targetSampleRate}Hz, 长度: ${audioBuffer.length} -> ${length}`
        );
        return new Blob([arrayBuffer], { type: "audio/wav" });
      }

      // 从localStorage中根据soundurl加载音频数据
      function loadAudioFromStorage(soundUrl) {
        if (!soundUrl) return [];
        console.log("拥有url并触发");

        const storedAudios = JSON.parse(localStorage.getItem("wardAudios") || "{}");
        const audioIds = soundUrl.split(',');
        const audioList = [];

        audioIds.forEach(audioId => {
          if (audioId && storedAudios[audioId]) {
            const audioData = storedAudios[audioId];
            // 创建Blob对象用于播放
            const byteCharacters = atob(audioData.data.split(',')[1]);
            const byteNumbers = new Array(byteCharacters.length);
            for (let i = 0; i < byteCharacters.length; i++) {
              byteNumbers[i] = byteCharacters.charCodeAt(i);
            }
            const byteArray = new Uint8Array(byteNumbers);
            const blob = new Blob([byteArray], { type: audioData.type });

            audioList.push({
              id: audioData.id,
              name: audioData.name,
              duration: audioData.duration,
              time: audioData.time,
              url: URL.createObjectURL(blob)
            });
          }
        });

        return audioList;
      }

          function (index) {
            // 先找到要删除的记录，保存音频ID信息
            const recordIndex = wardRecords.findIndex(
              (r) => r.id === recordId
            );
            let audioIdsToDelete = [];
            if (recordIndex !== -1) {
              const record = wardRecords[recordIndex];
              if (record.sound_url) {
                audioIdsToDelete = record.sound_url.split(',').filter(id => id.trim());
              }
            }

            $.ajax({
              url: appconfig.api + "/api/MobileWard/DelWardRoundsRecordById",
              method: "GET",
              data: {
                id: recordId
              },
              success: function (res) {
                if (res.Status == 1) {
                  layer.msg("查房记录删除成功", { icon: 1 });

                  // API删除成功后，清理本地数据
                  if (recordIndex !== -1) {
                    const record = wardRecords[recordIndex];

                    // 清理绑定的音频文件
                    if (audioIdsToDelete.length > 0) {
                      const storedAudios = JSON.parse(localStorage.getItem("wardAudios") || "{}");

                      audioIdsToDelete.forEach(audioId => {
                        if (audioId && storedAudios[audioId]) {
                          delete storedAudios[audioId];
                          console.log(`删除音频文件: ${audioId}`);
                        }
                      });

                      localStorage.setItem("wardAudios", JSON.stringify(storedAudios));
                    }

                    // 清理旧的audio_records（如果存在）
                    if (record.audio_records) {
                      record.audio_records.forEach((audio) => {
                        if (audio.url) {
                          URL.revokeObjectURL(audio.url);
                        }
                      });
                    }

                    // 从本地记录数组中删除
                    wardRecords.splice(recordIndex, 1);
                    localStorage.setItem("wardRecords", JSON.stringify(wardRecords));
                    renderWardRecordList();
                  }

                } else {
                  layer.msg("查房记录删除失败", { icon: 2 });
                }
              },
              error: function (xhr, status, error) {
                layer.msg("删除请求失败，请检查网络连接", { icon: 2 });
              }
            })

            layer.close(index);
            layer.msg("查房记录已删除", { icon: 1 });
          }
        );
      };

      // 计算录音时长
      function calculateDuration() {
        if (!recordingStartTime) return "未知";
        const duration =
          (new Date().getTime() - recordingStartTime.getTime()) / 1000;
        return Math.round(duration) + "秒";
      }

      // 格式化日期时间
      function formatDateTime(date) {
        return (
          date.getFullYear() +
          "-" +
          String(date.getMonth() + 1).padStart(2, "0") +
          "-" +
          String(date.getDate()).padStart(2, "0") +
          " " +
          String(date.getHours()).padStart(2, "0") +
          ":" +
          String(date.getMinutes()).padStart(2, "0")
        );
      }

      // 格式化时间（用于录音文件名）
      function formatTime(date) {
        return (
          String(date.getHours()).padStart(2, "0") +
          ":" +
          String(date.getMinutes()).padStart(2, "0") +
          ":" +
          String(date.getSeconds()).padStart(2, "0")
        );
      }

      // 页面加载完成后初始化
      // 因为这是弹窗页面（iframe），需要从顶层检测 plus
      var topPlus = null;
      try {
        topPlus = top.plus || parent.plus || window.plus;
      } catch (e) {
        topPlus = window.plus;
      }

      if (topPlus) {
        // top.plus 已经存在，直接初始化
        console.log('检测到顶层 plus 对象，直接初始化');
        init();
      } else if (window.plus) {
        // 当前窗口的 plus 存在，直接初始化
        console.log('检测到当前窗口 plus 对象，直接初始化');
        init();
      } else {
        // 监听plusready事件
        document.addEventListener('plusready', function () {
          console.log('5+ 环境已准备好（plusready事件）');
          init();
        }, false);

        // 如果不是5+环境（浏览器），设置一个短暂延迟后初始化
        setTimeout(function () {
          var checkPlus = null;
          try {
            checkPlus = top.plus || parent.plus || window.plus;
          } catch (e) {
            checkPlus = window.plus;
          }

          if (!checkPlus) {
            console.log('非5+环境（浏览器），直接初始化');
            init();
          }
        }, 500);
      }
    });
  </script>
</body>

</html>
