    <style>
body
{

}

{
    width: 100%;  max-width: 100%;  margin: 0;  padding: 0;
}

/* 头部操作区域样式 */
.header-controls
{
    display: flex;  align-items: center;  flex-wrap: wrap;  justify-content: space-between;  box-sizing: border-box;height: 10%; padding: 8px;  border: 1px solid #e9ecef;  border-radius: 6px;          background-color: rgb(4, 46, 167);

gap: 10px;
}

.page-title
{
    font-size: 18px;  font-weight: bold;  margin: 0;  color: #fff;
}

/* 查房记录列表样式 */
.record-list
{
    overflow-y: auto;  box-sizing: border-box;height: 90%;  padding: 20px;  border-radius: 8px;  background: #fff;  box-shadow: 0 2px 8px rgba(0, 0, 0, .1);
}

.ward-record-item
{
    display: flex;  align-items: flex-start;  margin-bottom: 15px;  padding: 20px;  transition: background-color .2s;  border-bottom: 1px solid #f0f0f0;  border-left: 4px solid #1e9fff;  border-radius: 6px;  background: #fafafa;  gap: 15px;
}

.ward-record-item:hover
{
    background-color: #f0f9ff;
}

.ward-record-info
{
    flex: 1;
}

.ward-record-header
{
    display: flex;  align-items: flex-start;  justify-content: space-between;  margin-bottom: 10px;
}

.ward-record-title
{
    font-size: 16px;  font-weight: bold;  margin-bottom: 5px;  color: #333;
}

.ward-record-meta
{
    font-size: 12px;  display: flex;  margin-bottom: 10px;  color: #666;  gap: 15px;
}

.ward-record-content
{
    line-height: 1.6;  margin-bottom: 10px;  padding: 10px;  color: #555;  border: 1px solid #eee;  border-radius: 4px;  background: #fff;
}

.ward-record-actions
{
    display: flex;  align-items: center;  gap: 10px;
}

/* 录音控件样式 */
.recording-section
{
    margin-top: 5px;  padding: 10px;
}

.recording-controls
{
    display: flex;  align-items: center;  flex-wrap: wrap; justify-content: center; margin-bottom: 10px;  gap: 10px;
}
.recording-controls span
{
    width: 100%;  text-align: center;
}
/* 音频播放器样式 */
audio
{
    width: 100%;  max-width: 300px;  height: 30px;
}

/* 音频控制区域样式 */
.audio-controls
{
    display: flex;  align-items: center;  flex-wrap: wrap;  justify-content: center;  margin-top: 10px;  gap: 10px;
}

.audio-controls audio
{
    flex: 1;  min-width: 200px;
}

/* 转文字按钮样式 */
.convert-text-btn
{
    font-weight: bold;  flex-shrink: 0;  transition: all .3s ease; color: white;  border: none;  background: linear-gradient(45deg, #1e9fff, #26c6da);
}

.convert-text-btn:hover
{
    transform: translateY(-1px);  background: linear-gradient(45deg, #0d8bf0, #1eb8cc);  box-shadow: 0 4px 8px rgba(30, 159, 255, .3);
}

/* 表单样式优化 */
.layui-form-item
{
    margin-bottom: 5px;
}

.layui-textarea
{
    min-height: 120px;
}
.layui-layer
{
    top: 0;  left: 0;
}
.ward-record-list-container
{
    overflow-y: auto;
}
#btn-add-record
{
    font-size: 16px;  line-height: 30px;  width: auto;  height: 30px;padding: 0 5px;border-radius: 10px;
}

#btn-record-audio
{
    width: 100px;  height: 100px;  border-radius: 50px;
}
.layui-layer-page .layui-layer-content
{
    overflow: hidden;  height: auto;
}

  </head>
  <body>
    <div class="layui-container">
      <!-- 头部操作区域 -->
      <div class="header-controls">
        <!-- 关闭弹窗 -->
         <i class="layui-icon layui-icon-return" id="backBtn" title="返回" style="cursor: pointer; font-size: 20px; color: #fff;"></i>
        <h2 class="page-title">
          <i class="layui-icon layui-icon-record"></i> 查房记录管理
        </h2>
        <div>
          <button
            type="button"
            id="btn-add-record"
            class="layui-btn layui-btn-normal"
          >
            <i class="layui-icon layui-icon-add-1"></i> 新建查房记录
          </button>
        </div>
      </div>

      <!-- 查房记录列表区域 -->
      <div class="record-list">
        <div id="ward-record-list-container">
          <div style="text-align: center; padding: 40px; color: #999">
            <i
              class="layui-icon layui-icon-record"
              style="font-size: 48px; display: block; margin-bottom: 10px"
            ></i>
            暂无查房记录，点击上方按钮新建记录
          </div>
        </div>
      </div>
    </div>

    <script src="/lib/layui-v2.6.3/layui.js" charset="utf-8"></script>
    <script src="/js/lay-config.js?v=1.0.4" charset="utf-8"></script>
    <script>
      layui.use(["layer", "form", "appconfig"], function () {
        var $ = layui.jquery;
        var layer = layui.layer;
        var form = layui.form;
        var appconfig = layui.appconfig;
        // 获取患者信息
        var patientData = JSON.parse(localStorage.getItem("userData") || "{}");
        var userData = JSON.parse(localStorage.getItem("userData") || "{}");
        var loginUser = JSON.parse(localStorage.getItem("loginUser") || "{}");

        // 查房记录存储
        // let wardRecords = JSON.parse(
        //   localStorage.getItem("wardRecords") || "[]"
        // );
        let wardRecords = JSON.parse("[]"
        );

        // 录音功能变量
        let mediaRecorder;
        let audioChunks = [];
        let audioBlob = null;
        let isRecording = false;
        let recordingStartTime = null;
        let currentRecordId = null; // 当前正在编辑的查房记录ID

        // 初始化页面
        function init() {
          renderWardRecordList();
          bindEvents();
          // 注意：不在初始化时清理音频，而是在获取记录列表后清理
        }

        // 注释掉API获取查房记录列表，暂时只与本地localStorage交互
        
        $.ajax({
          url: appconfig.api + "/api/MobileWard/GetWardRoundsRecordList",
          type: "GET",
          data: {
            patient_id: userData.patient_id || "",
            admiss_times: userData.admiss_times || "",
          },
          success: function (res) {
            if (res.Status == 1) {
              wardRecords = res.Data || [];
              localStorage.setItem("wardRecords", JSON.stringify(wardRecords));
              renderWardRecordList();
              // 在获取到记录列表后，清理未使用的音频数据
              cleanupUnusedAudios();
            } else {
              layer.msg("获取查房记录失败：" + res.Message, { icon: 2 });
            }
          },
        });
        
        // 绑定事件
        function bindEvents() {
          // 新建查房记录按钮
          $("#btn-add-record").on("click", function () {
            showAddRecordDialog();
          });
        }
        $("#backBtn").on("click", function () {
            console.log("关闭查房记录弹窗");
            
            parent.layer.closeAll();
          });
        // 显示新增查房记录对话框
        function showAddRecordDialog() {
          var now = new Date();
          var currentTime = formatDateTime(now);
          var patientName = userData.name || patientData.name || "未知患者";
          var bedNo = userData.bed_no || patientData.bed_no || "未知床号";
          var doctorName = loginUser.user_name || loginUser.name || "未知医生";

          layer.open({
            type: 1,
            title: "新建查房记录",
            area: ["100%", "auto"], // 使用百分比高度，自适应父页面
            maxHeight: "90%", // 最大高度不超过父页面90%
            offset: "auto",
            content: `
              <form class="layui-form" style="box-sizing: border-box; padding: 18px;" id="ward-record-form">
                <div class="layui-row">
                  <div class="layui-col-md6">
                    <div class="layui-form-item">
                      <label class="layui-form-label">患者姓名</label>
                      <div class="layui-input-block">
                        <input type="text" name="patient_name" value="${patientName}" readonly class="layui-input layui-disabled">
                      </div>
                    </div>
                  </div>
                  <div class="layui-col-md6">
                    <div class="layui-form-item">
                      <label class="layui-form-label">床号</label>
                      <div class="layui-input-block">
                        <input type="text" name="bed_no" value="${bedNo}" readonly class="layui-input layui-disabled">
                      </div>
                    </div>
                  </div>
                </div>

                <div class="layui-row">
                  <div class="layui-col-md6">
                    <div class="layui-form-item">
                      <label class="layui-form-label">查房医生</label>
                      <div class="layui-input-block">
                        <input type="text" name="doctor_name" value="${doctorName}" class="layui-input">
                      </div>
                    </div>
                  </div>
                  <div class="layui-col-md6">
                    <div class="layui-form-item">
                      <label class="layui-form-label">查房时间</label>
                      <div class="layui-input-block">
                        <input type="text" name="visit_time" value="${currentTime}" class="layui-input">
                      </div>
                    </div>
                  </div>
                </div>

                <!-- 录音功能区域 -->
                <div class="layui-form-item">
                  <div class="layui-input-block" style="margin:0 10px">
                    <div class="recording-section">
                      <div id="audio-container" style="visibility: hidden;">
                        <div class="audio-controls">
                          <audio id="audio-preview" controls style="flex: 1; min-width: 200px;"></audio>
                        </div>
                      </div>
                      
                      <div class="recording-controls">
                        <button type="button" id="btn-record-audio" class="layui-btn layui-btn-sm layui-btn-normal">
                          <i class="layui-icon layui-icon-mike"></i> 开始录音
                        </button>
                        
                        <span id="recording-status" style="color: #666; font-size: 12px;height:16px"></span>
                      </div>
                      
                      <div id="saved-audio-list" style="margin-top: 10px;"></div>
                    </div>
                  </div>
                </div>

                <div class="layui-form-item" id="btn-confirm-record" style="width:100%;text-align: center; margin-top: 10px; display: none;">
                  <button class="layui-btn layui-btn-normal" lay-submit lay-filter="save-record">
                    <i class="layui-icon layui-icon-ok"></i> 保存查房记录
                  </button>
                  <button type="button" class="layui-btn layui-btn-primary" onclick="layer.closeAll()">
                    <i class="layui-icon layui-icon-close"></i> 取消
                  </button>
                </div>
              </form>
            `,
            success: function (layero, index) {
              currentRecordId = "temp_" + Date.now(); // 临时ID

              // 重新渲染表单
              form.render();

              // 绑定录音功能
              bindRecordingEvents();

              // 监听表单提交
              form.on("submit(save-record)", function (data) {
                saveWardRecord(data.field, index);
                return false;
              });
            },
            end: function () {
              // 清理录音状态
              cleanupRecording();
            },
          });
        }

        // 绑定录音功能事件
        function bindRecordingEvents() {
          const recordBtn = document.getElementById("btn-record-audio");
          const audioPreview = document.getElementById("audio-preview");
          const statusSpan = document.getElementById("recording-status");

          if (recordBtn   && audioPreview) {
            recordBtn.onclick = async function () {
              if (!isRecording) {
                await startRecording();
              } else {
                stopRecording();
              }
            };

            
          }
        }

        // 开始录音
        async function startRecording() {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            layer.msg("当前浏览器不支持录音功能", { icon: 2 });
            return;
          }

          try {
            // 清理之前的音频和按钮
            const audioContainer = document.getElementById("audio-container");
            if (audioContainer) {
              audioContainer.style.visibility = "hidden";
              // 清除之前的转文字按钮
              const convertBtn = audioContainer.querySelector('.convert-text-btn');
              if (convertBtn) {
                convertBtn.remove();
              }
            }

            // 获取用户媒体流
            const stream = await navigator.mediaDevices.getUserMedia({
              audio: true,
            });
            //创建MediaRecorder实例
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = []; // 存储音频数据块的数组
            recordingStartTime = new Date();
            //设置数据处理回调
            mediaRecorder.ondataavailable = function (e) {
              if (e.data.size > 0) {
                audioChunks.push(e.data);//收集音频数据
              }
            };
            //设置录音结束回调
            mediaRecorder.onstop = function () {
              audioBlob = new Blob(audioChunks, { type: "audio/webm" });

              // 转换为WAV格式
              convertToWav(audioBlob)
                .then((wavBlob) => {
                  audioBlob = wavBlob; // 更新为WAV格式
                  const audioPreview = document.getElementById("audio-preview");
                  const audioContainer = document.getElementById("audio-container");
                  const audioControls = audioContainer.querySelector(".audio-controls");

                  audioPreview.src = URL.createObjectURL(audioBlob);
                  audioContainer.style.visibility = "visible";

                  // 添加转文字按钮
                  addConvertTextButton(audioControls);

                  // 停止所有音频轨道
                  stream.getTracks().forEach((track) => track.stop());
                })
                .catch((err) => {
                  console.error("音频格式转换失败:", err);
                  layer.msg(
                    "音频格式转换失败，将使用原始格式。转换文字功能可能受影响。",
                    {
                      icon: 2,
                      time: 3000,
                    }
                  );

                  // 如果转换失败，继续使用原格式
                  const audioPreview = document.getElementById("audio-preview");
                  const audioContainer = document.getElementById("audio-container");
                  const audioControls = audioContainer.querySelector(".audio-controls");

                  audioPreview.src = URL.createObjectURL(audioBlob);
                  audioContainer.style.visibility = "visible";

                  // 添加转文字按钮（即使转换失败也显示，让用户尝试）
                  addConvertTextButton(audioControls);

                  // 停止所有音频轨道
                  stream.getTracks().forEach((track) => track.stop());
                });
            };

            mediaRecorder.start();
            isRecording = true;

            const recordBtn = document.getElementById("btn-record-audio");
            const statusSpan = document.getElementById("recording-status");

            recordBtn.innerHTML =
              '<i class="layui-icon layui-icon-pause"></i> 停止录音';
            recordBtn.className = "layui-btn layui-btn-sm layui-btn-danger";
            statusSpan.textContent = "正在录音中...";

            // 隐藏音频容器（在录音过程中）
            document.getElementById("audio-container").style.visibility = "hidden";
          } catch (err) {
            console.error("录音错误:", err);
            layer.msg("无法访问麦克风，请检查权限设置", { icon: 2 });
          }
        }

        // 停止录音
        function stopRecording() {
          if (mediaRecorder && mediaRecorder.state !== "inactive") {
            mediaRecorder.stop();
          }
          isRecording = false;

          const recordBtn = document.getElementById("btn-record-audio");
          const statusSpan = document.getElementById("recording-status");
          const confirmBtn = document.getElementById("btn-confirm-record");
          const layer = document.getElementsByClassName("layui-layer-content")[0];
          recordBtn.innerHTML =
            '<i class="layui-icon layui-icon-mike"></i> 开始录音';
          recordBtn.className = "layui-btn layui-btn-sm layui-btn-normal";
          statusSpan.textContent = "录音完成，可保存或者重新录制";
          confirmBtn.style.display = "inline-block";
          layer.style.height = "auto";
        }

        // 添加转文字按钮
        function addConvertTextButton(audioControls) {
          // 检查是否已经存在转文字按钮，避免重复添加
          if (audioControls.querySelector('.convert-text-btn')) {
            return;
          }

          const convertBtn = document.createElement('button');
          convertBtn.type = 'button';
          convertBtn.className = 'layui-btn layui-btn-sm convert-text-btn';
          convertBtn.innerHTML = '<i class="layui-icon layui-icon-fonts"></i> 转文字';
          convertBtn.title = '将录音转换为文字';

          // 绑定点击事件
          convertBtn.addEventListener('click', function() {
            convertAudioToText();
          });

          audioControls.appendChild(convertBtn);
        }

        // 音频转文字功能
        function convertAudioToText() {
          if (!audioBlob) {
            layer.msg('没有可转换的音频数据', { icon: 5 });
            return;
          }

          // 显示转换进度
          const loadingIndex = layer.msg('正在转换音频为文字，请稍候...', {
            icon: 16,
            shade: 0.3,
            time: 0
          });

          // 创建FormData对象
          const formData = new FormData();
          formData.append('audio', audioBlob, 'recording.wav');

          // 调用后端转换API
          fetch('/api/audio/convert-to-text', {
            method: 'POST',
            body: formData
          })
          .then(response => {
            if (!response.ok) {
              throw new Error('网络请求失败');
            }
            return response.json();
          })
          .then(data => {
            layer.close(loadingIndex);
            
            if (data.success && data.text) {
              insertConvertedText(data.text);
            } else {
              layer.msg('音频转文字失败：' + (data.message || '未知错误'), { icon: 5 });
            }
          })
          .catch(error => {
            layer.close(loadingIndex);
            console.error('转换错误:', error);
            
            
          });
        }

        // 将音频转换为WAV格式
        function convertToWav(audioBlob) {
          return new Promise((resolve, reject) => {
            try {
              const audioContext = new (window.AudioContext ||
                window.webkitAudioContext)();
              const fileReader = new FileReader();

              fileReader.onload = function (e) {
                audioContext
                  .decodeAudioData(e.target.result)
                  .then((audioBuffer) => {
                    try {
                      const wavBlob = audioBufferToWav(audioBuffer);
                      resolve(wavBlob);
                    } catch (err) {
                      console.error("WAV转换失败:", err);
                      reject(new Error("WAV格式转换失败"));
                    }
                  })
                  .catch((err) => {
                    console.error("音频解码失败:", err);
                    reject(new Error("音频解码失败，可能是不支持的音频格式"));
                  });
              };

              fileReader.onerror = function (err) {
                console.error("文件读取失败:", err);
                reject(new Error("文件读取失败"));
              };

              fileReader.readAsArrayBuffer(audioBlob);
            } catch (err) {
              console.error("音频转换初始化失败:", err);
              reject(new Error("浏览器不支持音频处理功能"));
            }
          });
        }

        // 将AudioBuffer转换为16KHz WAV格式的Blob
        function audioBufferToWav(audioBuffer) {
          const originalSampleRate = audioBuffer.sampleRate;
          const targetSampleRate = 16000; // 后端要求的16KHz
          const numberOfChannels = 1; // 转为单声道，减少数据量

          // 重采样处理
          let resampledData;
          if (originalSampleRate === targetSampleRate) {
            // 如果采样率已经是16KHz，直接使用
            resampledData = audioBuffer.getChannelData(0);
          } else {
            // 需要重采样
            const resampleRatio = targetSampleRate / originalSampleRate;
            const originalData = audioBuffer.getChannelData(0);
            const resampledLength = Math.floor(
              originalData.length * resampleRatio
            );
            resampledData = new Float32Array(resampledLength);

            // 简单线性插值重采样
            for (let i = 0; i < resampledLength; i++) {
              const sourceIndex = i / resampleRatio;
              const index = Math.floor(sourceIndex);
              const fraction = sourceIndex - index;

              if (index + 1 < originalData.length) {
                resampledData[i] =
                  originalData[index] * (1 - fraction) +
                  originalData[index + 1] * fraction;
              } else {
                resampledData[i] = originalData[index] || 0;
              }
            }
          }

          const length = resampledData.length;
          const arrayBuffer = new ArrayBuffer(
            44 + length * numberOfChannels * 2
          );
          const view = new DataView(arrayBuffer);

          // WAV文件头
          const writeString = (offset, string) => {
            for (let i = 0; i < string.length; i++) {
              view.setUint8(offset + i, string.charCodeAt(i));
            }
          };

          writeString(0, "RIFF");
          view.setUint32(4, 36 + length * numberOfChannels * 2, true);
          writeString(8, "WAVE");
          writeString(12, "fmt ");
          view.setUint32(16, 16, true);
          view.setUint16(20, 1, true);
          view.setUint16(22, numberOfChannels, true);
          view.setUint32(24, targetSampleRate, true);
          view.setUint32(28, targetSampleRate * numberOfChannels * 2, true);
          view.setUint16(32, numberOfChannels * 2, true);
          view.setUint16(34, 16, true);
          writeString(36, "data");
          view.setUint32(40, length * numberOfChannels * 2, true);
          
          // 写入音频数据
          let offset = 44;
          for (let i = 0; i < length; i++) {
            const sample = resampledData[i];
            const int16Sample = Math.max(
              -32768,
              Math.min(32767, Math.floor(sample * 32767))
            );
            view.setInt16(offset, int16Sample, true);
            offset += 2;
          }

          console.log(
            `音频重采样: ${originalSampleRate}Hz -> ${targetSampleRate}Hz, 长度: ${audioBuffer.length} -> ${length}`
          );
          return new Blob([arrayBuffer], { type: "audio/wav" });
        }

        function transformAudio(audioBlob) {
          // 构建FormData对象
          const formData = new FormData();
          formData.append("audioFile", audioBlob, "recording.wav");

          // language作为URL参数传递
          $.ajax({
            url:
              appconfig.api +
              "/api/MobileWard/ConvertAudioToText?language=zh-CN",
            method: "POST",
            data: formData,
            accept: "text/plain", // 期望返回文本格式
            processData: false,
            contentType: "multipart/form-data", // 使用FormData时不需要设置contentType
            timeout: 30000, // 设置30秒超时
            success: function (res) {
              if (res.Status === 1) {
                layer.msg("音频转换成功", { icon: 1 });
                // 处理转换结果
                console.log("转换结果：", res.Data);
                // 可以在这里将转换结果填入文本框
                if (res.Data && res.Data.text) {
                  var currentContent = $(
                    'textarea[name="record_content"]'
                  ).val();
                  var newContent =
                    currentContent +
                    (currentContent ? "\n\n" : "") +
                    "语音转录：\n" +
                    res.Data.text;
                  $('textarea[name="record_content"]').val(newContent);
                  layer.msg("转换结果已添加到查房记录中", {
                    icon: 1,
                    time: 2000,
                  });
                }
              } else {
                // 详细的错误处理
                let errorMsg = "音频转换失败";
                if (res.Message) {
                  if (
                    res.Message.includes("mfplat.dll") ||
                    res.Message.includes("Unable to load DLL")
                  ) {
                    errorMsg =
                      "服务器音频处理组件未安装，请联系管理员安装Windows Media Foundation组件";
                  } else if (res.Message.includes("不支持的音频格式")) {
                    errorMsg = "音频格式不支持，请尝试重新录音";
                  } else if (
                    res.Message.includes("Only 16KHz sample rate is supported")
                  ) {
                    errorMsg =
                      "音频采样率不正确，系统已自动处理为16KHz，请重试";
                  } else {
                    errorMsg = "音频转换失败：" + res.Message;
                  }
                }
                layer.msg(errorMsg, { icon: 2, time: 5000 });
                console.error("音频转换详细错误：", res);
              }
            },
            error: function (xhr, status, error) {
              let errorMsg = "音频转换请求失败";
              if (status === "timeout") {
                errorMsg = "音频转换超时，请检查网络连接或稍后重试";
              } else if (xhr.status === 500) {
                errorMsg =
                  "服务器内部错误，可能是音频处理组件问题，请联系管理员";
              } else if (xhr.status === 0) {
                errorMsg = "网络连接失败，请检查网络状态";
              }
              layer.msg(errorMsg, { icon: 2, time: 5000 });
              console.error("AJAX错误详情：", {
                status: status,
                error: error,
                xhr: xhr,
              });
            },
          });
        }

        // 保存录音到列表
        function saveRecordingToList() {
          if (!audioBlob) {
            layer.msg("没有可保存的录音", { icon: 2 });
            return;
          }

          const recordTime = new Date();
          const recordName = "录音_" + formatTime(recordTime);
          const duration = calculateDuration();

          // 将音频转换为Base64字符串存储到localStorage
          const reader = new FileReader();
          reader.onload = function() {
            const audioBase64 = reader.result;
            const audioId = "audio_" + recordTime.getTime();
            
            // 保存音频数据到localStorage
            const audioData = {
              id: audioId,
              name: recordName,
              time: recordTime.toISOString(),
              duration: duration,
              data: audioBase64, // Base64格式的音频数据
              type: audioBlob.type
            };
            
            // 存储到localStorage中的音频库
            let storedAudios = JSON.parse(localStorage.getItem("wardAudios") || "{}");
            storedAudios[audioId] = audioData;
            localStorage.setItem("wardAudios", JSON.stringify(storedAudios));

            // 保存到临时存储（用于当前编辑会话）
            const audioRecord = {
              id: audioId,
              name: recordName,
              time: recordTime.toISOString(),
              duration: duration,
              blob: audioBlob,
              url: URL.createObjectURL(audioBlob),
            };

            // 添加到当前记录的录音列表
            if (!window.tempAudioRecords) {
              window.tempAudioRecords = [];
            }
            window.tempAudioRecords.push(audioRecord);

            // 更新显示
            updateSavedAudioList();

            // 清理当前录音状态
            audioBlob = null;
            document.getElementById("audio-preview").style.display = "none";
            document.getElementById("audio-preview").src = "";
            document.getElementById("recording-status").textContent = "";

            layer.msg("录音已保存到本地存储", { icon: 1, time: 1500 });
          };
          
          // 读取音频文件为Base64
          reader.readAsDataURL(audioBlob);
        }

        // 更新已保存的录音列表显示
        function updateSavedAudioList() {
          const container = document.getElementById("saved-audio-list");
          if (
            !window.tempAudioRecords ||
            window.tempAudioRecords.length === 0
          ) {
            container.innerHTML = "";
            return;
          }

          let html =
            "<div style='margin-top: 10px;'><strong>已添加的录音：</strong></div>";
          window.tempAudioRecords.forEach((record, index) => {
            html += `
              <div style="display: flex; align-items: center; gap: 10px; margin-top: 8px; padding: 8px; background: #fff; border-radius: 4px;">
                <span style="flex: 1; font-size: 12px;">${record.name} (${record.duration})</span>
                <audio controls style="width: 150px; height: 25px;">
                  <source src="${record.url}" type="audio/wav">
                </audio>
                <button type="button" class="layui-btn layui-btn-xs layui-btn-normal" onclick="convertAudioToText(${index})" title="转换为文字">
                  <i class="layui-icon layui-icon-edit"></i> 转文字
                </button>
                <button type="button" class="layui-btn layui-btn-xs layui-btn-danger" onclick="removeAudioRecord(${index})">
                  删除
                </button>
              </div>
            `;
          });
          container.innerHTML = html;
        }

        // 删除录音记录
        window.removeAudioRecord = function (index) {
          if (window.tempAudioRecords && window.tempAudioRecords[index]) {
            // 释放URL对象
            URL.revokeObjectURL(window.tempAudioRecords[index].url);
            window.tempAudioRecords.splice(index, 1);
            updateSavedAudioList();
            layer.msg("录音已删除", { icon: 1, time: 1000 });
          }
        };

        // 转换音频为文字
        window.convertAudioToText = function (index) {
          if (window.tempAudioRecords && window.tempAudioRecords[index]) {
            const audioRecord = window.tempAudioRecords[index];
            layer.msg("正在转换音频为文字，请稍候...", {
              icon: 16,
              time: 2000,
            });
            transformAudio(audioRecord.blob);
          }
        };

        // 转换记录列表中的音频为文字
        window.convertRecordAudioToText = function (audioId) {
          const storedAudios = JSON.parse(localStorage.getItem("wardAudios") || "{}");
          if (!storedAudios[audioId]) {
            layer.msg("音频文件不存在", { icon: 2 });
            return;
          }
          
          const audioData = storedAudios[audioId];
          // 将Base64转换回Blob
          const byteCharacters = atob(audioData.data.split(',')[1]);
          const byteNumbers = new Array(byteCharacters.length);
          for (let i = 0; i < byteCharacters.length; i++) {
            byteNumbers[i] = byteCharacters.charCodeAt(i);
          }
          const byteArray = new Uint8Array(byteNumbers);
          const audioBlob = new Blob([byteArray], { type: audioData.type });
          
          layer.msg("正在转换音频为文字，请稍候...", {
            icon: 16,
            time: 2000,
          });
          
          transformAudio(audioBlob);
        };

        // 清理录音状态
        function cleanupRecording() {
          if (mediaRecorder && mediaRecorder.state === "recording") {
            mediaRecorder.stop();
          }
          isRecording = false;
          audioBlob = null;
          currentRecordId = null;
          if (window.tempAudioRecords) {
            window.tempAudioRecords.forEach((record) => {
              if (record.url) {
                URL.revokeObjectURL(record.url);
              }
            });
            window.tempAudioRecords = [];
          }
        }

        // 保存查房记录
        function saveWardRecord(formData, layerIndex) {
          console.log("saveWardRecord called");
          
          // 检查是否正在录音中
          if (isRecording) {
            layer.msg("请先停止录音再保存记录", { icon: 2 });
            return;
          }
          
          // 检查是否有录音内容
          const hasCurrentRecording = audioBlob !== null; // 当前有未保存的录音
          const hasSavedRecordings = window.tempAudioRecords && window.tempAudioRecords.length > 0; // 有已保存的录音
          
          if (!hasCurrentRecording && !hasSavedRecordings) {
            layer.msg("请先录制音频再保存查房记录", { icon: 2 });
            return;
          }
          
          // 如果有未保存的录音，先自动保存
          if (hasCurrentRecording) {
            layer.msg("正在自动保存录音...", { icon: 16, time: 1000 });
            
            // 调用保存录音的逻辑，但不显示消息
            const recordTime = new Date();
            const recordName = "录音_" + formatTime(recordTime);
            const duration = calculateDuration();

            const reader = new FileReader();
            reader.onload = function() {
              const audioBase64 = reader.result;
              const audioId = "audio_" + recordTime.getTime();
              
              // 保存音频数据到localStorage
              const audioData = {
                id: audioId,
                name: recordName,
                time: recordTime.toISOString(),
                duration: duration,
                data: audioBase64,
                type: audioBlob.type
              };
              
              let storedAudios = JSON.parse(localStorage.getItem("wardAudios") || "{}");
              storedAudios[audioId] = audioData;
              localStorage.setItem("wardAudios", JSON.stringify(storedAudios));

              // 保存到临时存储
              const audioRecord = {
                id: audioId,
                name: recordName,
                time: recordTime.toISOString(),
                duration: duration,
                blob: audioBlob,
                url: URL.createObjectURL(audioBlob),
              };

              if (!window.tempAudioRecords) {
                window.tempAudioRecords = [];
              }
              window.tempAudioRecords.push(audioRecord);

              // 清理当前录音状态
              audioBlob = null;
              document.getElementById("audio-preview").style.display = "none";
              document.getElementById("audio-preview").src = "";
              document.getElementById("recording-status").textContent = "";

              // 更新显示
              updateSavedAudioList();
              
              // 录音保存完成后，继续保存查房记录
              proceedToSaveWardRecord(formData, layerIndex);
            };
            
            reader.readAsDataURL(audioBlob);
          } else {
            // 没有当前录音，直接保存查房记录
            proceedToSaveWardRecord(formData, layerIndex);
          }
        }
        
        // 实际保存查房记录的函数
        function proceedToSaveWardRecord(formData, layerIndex) {
          const recordTime = new Date();
          const recordId = "ward_" + recordTime.getTime();
          const currentTime = recordTime.toISOString();
          
          // 生成音频URL集合，用于绑定当前记录的所有音频
          let soundUrlArray = [];
          if (window.tempAudioRecords && window.tempAudioRecords.length > 0) {
            soundUrlArray = window.tempAudioRecords.map(audio => audio.id);
          }
          const soundUrl = soundUrlArray.join(','); // 多个音频ID用逗号分隔

          // 注释掉API保存查房记录，暂时只与本地localStorage交互
          const ajaxData = {
            patient_id: userData.patient_id || "",
            admiss_times: userData.admiss_times || "",
            name: userData.name || "",
            exec_dept: userData.dept,
            exec_ward: userData.ward,
            emp_sn: loginUser.user_mi,
            emp_name: loginUser.name,
            exec_date: currentTime,
            sound: formData.record_content || "查房记录",
            sound_url: soundUrl, // 使用音频ID作为soundurl
          };
          $.ajax({
            url: appconfig.api + "/api/MobileWard/AddWardRoundsRecord",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify(ajaxData),
            success: function (res) {
              if (res.Status == 1) {
                layer.msg("查房记录保存成功", { icon: 1 });
                
                // API保存成功后，将新记录添加到本地数组中
                const newRecord = {
                  id: res.Data ? res.Data.id : recordId, // 使用API返回的ID，如果没有则使用本地生成的ID
                  patient_id: ajaxData.patient_id,
                  admiss_times: ajaxData.admiss_times,
                  name: ajaxData.name,
                  exec_dept: ajaxData.exec_dept,
                  exec_ward: ajaxData.exec_ward,
                  emp_sn: ajaxData.emp_sn,
                  emp_name: ajaxData.emp_name,
                  exec_date: ajaxData.exec_date,
                  sound: ajaxData.sound,
                  sound_url: ajaxData.sound_url,
                  create_time: ajaxData.exec_date
                };
                
                // 将新记录添加到数组开头
                wardRecords.unshift(newRecord);
                localStorage.setItem("wardRecords", JSON.stringify(wardRecords));
                
                // 立即更新界面显示
                renderWardRecordList();
                
                // 关闭弹窗和清理状态
                layer.close(layerIndex);
                
                // 清理临时状态
                window.tempAudioRecords = [];
                
              } else {
                layer.msg("查房记录保存失败", { icon: 2 });
              }
            },
            error: function(xhr, status, error) {
              layer.msg("保存请求失败，请检查网络连接", { icon: 2 });
              console.error("保存查房记录错误：", error);
            }
          });
        }

        // 从localStorage中根据soundurl加载音频数据
        function loadAudioFromStorage(soundUrl) {
          if (!soundUrl) return [];
          console.log("拥有url并触发");
          
          const storedAudios = JSON.parse(localStorage.getItem("wardAudios") || "{}");
          const audioIds = soundUrl.split(',');
          const audioList = [];
          
          audioIds.forEach(audioId => {
            if (audioId && storedAudios[audioId]) {
              const audioData = storedAudios[audioId];
              // 创建Blob对象用于播放
              const byteCharacters = atob(audioData.data.split(',')[1]);
              const byteNumbers = new Array(byteCharacters.length);
              for (let i = 0; i < byteCharacters.length; i++) {
                byteNumbers[i] = byteCharacters.charCodeAt(i);
              }
              const byteArray = new Uint8Array(byteNumbers);
              const blob = new Blob([byteArray], { type: audioData.type });
              
              audioList.push({
                id: audioData.id,
                name: audioData.name,
                duration: audioData.duration,
                time: audioData.time,
                url: URL.createObjectURL(blob)
              });
            }
          });
          
          return audioList;
        }

        // 清理未使用的音频数据
        function cleanupUnusedAudios() {
          console.log('开始清理未使用的音频数据...');
          
          const storedAudios = JSON.parse(localStorage.getItem("wardAudios") || "{}");
          const usedAudioIds = new Set();
          
          console.log('当前存储的音频数量:', Object.keys(storedAudios).length);
          console.log('当前记录数量:', wardRecords.length);
          
          // 收集所有被使用的音频ID
          wardRecords.forEach((record, index) => {
            console.log(`记录${index}: sound_url = "${record.sound_url || ''}"`);
            if (record.sound_url && record.sound_url.trim()) {
              const audioIds = record.sound_url.split(',');
              audioIds.forEach(id => {
                const trimmedId = id.trim();
                if (trimmedId) {
                  usedAudioIds.add(trimmedId);
                  console.log(`标记音频ID为使用中: ${trimmedId}`);
                }
              });
            }
          });
          
          console.log('使用中的音频ID集合:', Array.from(usedAudioIds));
          
          // 删除未使用的音频
          const audioKeys = Object.keys(storedAudios);
          let cleanedCount = 0;
          audioKeys.forEach(audioId => {
            if (!usedAudioIds.has(audioId)) {
              console.log(`删除未使用的音频: ${audioId}`);
              delete storedAudios[audioId];
              cleanedCount++;
            }
          });
          
          if (cleanedCount > 0) {
            localStorage.setItem("wardAudios", JSON.stringify(storedAudios));
            console.log(`清理了 ${cleanedCount} 个未使用的音频文件`);
          } else {
            console.log('没有需要清理的音频文件');
          }
        }

        // 渲染查房记录列表
        function renderWardRecordList() {
          const container = document.getElementById(
            "ward-record-list-container"
          );
          console.log(wardRecords);

          if (wardRecords.length === 0) {
            container.innerHTML = `
              <div style="text-align: center; padding: 40px; color: #999;">
                <i class="layui-icon layui-icon-record" style="font-size: 48px; display: block; margin-bottom: 10px;"></i>
                暂无查房记录，点击上方按钮新建记录
              </div>
            `;
            return;
          }

          let html = "";
          wardRecords.forEach((record, index) => {
            const createDate = new Date(record.exec_date || record.create_time);
            const timeStr = createDate.toLocaleString();
            
            // 根据sound_url加载音频数据
            const audioList = loadAudioFromStorage(record.sound_url || '');

            html += `
              <div class="ward-record-item">
                <div class="ward-record-info">
                  <div class="ward-record-header">
                    <div class="ward-record-title">${record.emp_name || '未知医生'}</div>
                    <div class="ward-record-actions">
                      <button class="layui-btn layui-btn-xs layui-btn-danger" onclick="deleteWardRecord('${
                        record.id || index
                      }')">
                        <i class="layui-icon layui-icon-delete"></i> 删除
                      </button>
                    </div>
                  </div>
                  <div class="ward-record-meta">
                    
                    <span><i class="layui-icon layui-icon-time"></i> 查房时间：${timeStr}</span>
                  </div>
                  <div class="ward-record-content">
                    ${
                      record.sound &&
                      record.sound.length > 200
                        ? record.sound.substring(0, 200) + "..."
                        : record.sound || "暂无记录内容"
                    }
                  </div>`;
            
            // 显示绑定的音频文件
            if (audioList && audioList.length > 0) {
              // html += `
              //   <div style="margin-top: 15px; padding: 10px; background: #f8f9fa; border-radius: 4px;">
              //     <div style="margin-bottom: 10px; color: #666; font-size: 12px;">
              //       <i class="layui-icon layui-icon-voice"></i> 录音文件 (${audioList.length}个)
              //     </div>`;
              
              audioList.forEach((audio, audioIndex) => {
                html += `
                  <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 8px; padding: 8px; background: #fff; border-radius: 4px;">
                    <audio controls style="width: 200px; height: 30px;">
                      <source src="${audio.url}" type="audio/wav">
                      您的浏览器不支持音频播放
                    </audio>
                    <button type="button" class="layui-btn layui-btn-xs layui-btn-normal" onclick="convertRecordAudioToText('${audio.id}')" title="转换为文字">
                      <i class="layui-icon layui-icon-edit"></i> 转文字
                    </button>
                  </div>`;
              });
              
              html += `</div>`;
            }
            
            html += `
                </div>
              </div>
            `;
          });

          container.innerHTML = html;
        }

        
        // 删除查房记录
        window.deleteWardRecord = function (recordId) {
          console.log(typeof(recordId));

          layer.confirm(
            "确定要删除这条查房记录吗？相关的录音文件也会被删除。",
            {
              icon: 3,
              title: "删除确认",
            },
            function (index) {
              // 先找到要删除的记录，保存音频ID信息
              const recordIndex = wardRecords.findIndex(
                (r) => r.id === recordId
              );
              let audioIdsToDelete = [];
              if (recordIndex !== -1) {
                const record = wardRecords[recordIndex];
                if (record.sound_url) {
                  audioIdsToDelete = record.sound_url.split(',').filter(id => id.trim());
                }
              }

              $.ajax({
                url:appconfig.api+"/api/MobileWard/DelWardRoundsRecordById",
                method:"GET",
                data: {
                  id: recordId
                },
                success:function(res){
                  if(res.Status==1){
                    layer.msg("查房记录删除成功",{icon:1});
                    
                    // API删除成功后，清理本地数据
                    if (recordIndex !== -1) {
                      const record = wardRecords[recordIndex];
                      
                      // 清理绑定的音频文件
                      if (audioIdsToDelete.length > 0) {
                        const storedAudios = JSON.parse(localStorage.getItem("wardAudios") || "{}");
                        
                        audioIdsToDelete.forEach(audioId => {
                          if (audioId && storedAudios[audioId]) {
                            delete storedAudios[audioId];
                            console.log(`删除音频文件: ${audioId}`);
                          }
                        });
                        
                        localStorage.setItem("wardAudios", JSON.stringify(storedAudios));
                      }
                      
                      // 清理旧的audio_records（如果存在）
                      if (record.audio_records) {
                        record.audio_records.forEach((audio) => {
                          if (audio.url) {
                            URL.revokeObjectURL(audio.url);
                          }
                        });
                      }

                      // 从本地记录数组中删除
                      wardRecords.splice(recordIndex, 1);
                      localStorage.setItem("wardRecords", JSON.stringify(wardRecords));
                      renderWardRecordList();
                    }
                    
                  } else {
                    layer.msg("查房记录删除失败",{icon:2});
                  }
                },
                error: function(xhr, status, error) {
                  layer.msg("删除请求失败，请检查网络连接",{icon:2});
                }
              })

              layer.close(index);
              layer.msg("查房记录已删除", { icon: 1 });
            }
          );
        };

        // 计算录音时长
        function calculateDuration() {
          if (!recordingStartTime) return "未知";
          const duration =
            (new Date().getTime() - recordingStartTime.getTime()) / 1000;
          return Math.round(duration) + "秒";
        }

        // 格式化日期时间
        function formatDateTime(date) {
          return (
            date.getFullYear() +
            "-" +
            String(date.getMonth() + 1).padStart(2, "0") +
            "-" +
            String(date.getDate()).padStart(2, "0") +
            " " +
            String(date.getHours()).padStart(2, "0") +
            ":" +
            String(date.getMinutes()).padStart(2, "0")
          );
        }

        // 格式化时间（用于录音文件名）
        function formatTime(date) {
          return (
            String(date.getHours()).padStart(2, "0") +
            ":" +
            String(date.getMinutes()).padStart(2, "0") +
            ":" +
            String(date.getSeconds()).padStart(2, "0")
          );
        }

        // 页面加载完成后初始化
        init();
      });
    </script>
  </body>
</html>
