    <script>
      //js动态计算表格缩放比例
      const tempAppconfig = "http://10.102.38.107:5251/";
      function scaleTableForMobile() {
        const layuiTableBox = document.querySelector(".layui-table-box");
        if (!layuiTableBox) {
          console.log("未找到 .layui-table-box 元素");
          return;
        }
        const tableContainer = document.querySelector(".table-container");
        // 获取表格内容的真实宽度（而不是容器宽度）
        const layuiTable = layuiTableBox.querySelector(".layui-table");
        const tableHeader = layuiTableBox.querySelector(
          ".layui-table-header table"
        );
        const tableBody = layuiTableBox.querySelector(
          ".layui-table-body table"
        );
        // 优先使用表头的宽度，如果没有则使用表体宽度
        let tableRealWidth = 0;
        if (tableHeader) {
          tableRealWidth = tableHeader.offsetWidth;
        } else if (tableBody) {
          tableRealWidth = tableBody.offsetWidth;
        } else if (layuiTable) {
          tableRealWidth = layuiTable.scrollWidth; // 使用scrollWidth获取真实内容宽度
        } else {
          tableRealWidth = layuiTableBox.scrollWidth;
        }

        const windowWidth = window.innerWidth; // 手机屏幕或浏览器窗口的宽度
        const containerWidth = tableContainer.offsetWidth;

        if (tableRealWidth != containerWidth) {
          const scale = containerWidth / tableRealWidth;
          layuiTableBox.style.transform = `scale(${scale})`;
          layuiTableBox.style.transformOrigin = "top left";
          layuiTableBox.style.width = `${100 / scale}%`;
          layuiTableBox.style.height = `${100 / scale}%`;
        } else {
          layuiTableBox.style.transform = `scale(1)`;
          layuiTableBox.style.transformOrigin = "top left";
          layuiTableBox.style.width = `100%`;
        }
      }
      window.addEventListener("resize", scaleTableForMobile);

      layui.use(["table", "appconfig", "form"], function () {
        var table = layui.table;
        var $ = layui.jquery;
        var appconfig = layui.appconfig;
        var form = layui.form;

        // 草稿区 - 暂存未正式提交的医嘱
        var draftOrders = [];
        var selectedDraftIndex = -1; // 保存区当前选中的下标
        var manualOrderModalIndex = null; // 草稿弹窗的索引
        // 模板选择完成回调（若存在，则模板弹窗选择后不直接提交，而是回调回本弹窗）
        window.onTemplatePicked = null;

        // 立即渲染表单元素，确保select框能正常工作
        form.render();

        // 确保手动表单的 select 使用 Layui 的 select 事件（lay-filter），以便选择 option 后能可靠触发
        (function ensureLayuiSelectHandlers() {
          try {
            var map = [
              { sel: "#manual-unit-select", filter: "manualUnit" },
              { sel: "#manual-supply-select", filter: "manualSupply" },
              { sel: "#manual-frequ-select", filter: "manualFrequ" },
              { sel: "#manual-long-flag", filter: "manualLongFlag" },
            ];
            map.forEach(function (m) {
              var $el = $(m.sel);
              if ($el.length && !$el.attr("lay-filter")) {
                $el.attr("lay-filter", m.filter);
              }
            });
            // 重新渲染 select，确保 lay-filter 生效
            form.render("select");

            // 注册 Layui 的 select 事件回调（当用户选中 option 时 Layui 会触发）
            form.on("select(manualUnit)", function (data) {
              $("#manual-doseage-unit").val((data.value || "").trim());
              updateSelectedDraftFromForm();
            });
            form.on("select(manualSupply)", function (data) {
              updateSelectedDraftFromForm();
            });
            form.on("select(manualFrequ)", function (data) {
              updateSelectedDraftFromForm();
            });
            form.on("select(manualLongFlag)", function (data) {
              updateSelectedDraftFromForm();
            });
          } catch (e) {
            console.warn("ensureLayuiSelectHandlers error", e);
          }
        })();

        // 获取患者信息和病区信息
        var wardData = JSON.parse(localStorage.getItem("wardData") || "{}");
        var ward_sn = localStorage.getItem("ward_sn") || "";

        // 停止医嘱功能
        function stopMedicalOrder(orderData) {
          // 获取当前用户信息
          var currentUser = JSON.parse(
            localStorage.getItem("loginUser") || "{}"
          );
          var doctorName =
            currentUser.name || currentUser.user_name || "系统用户";
          var doctorCode = currentUser.user_mi || "00000";
          // 获取当前时间
          var now = new Date();
          var stopTime =
            String(now.getMonth() + 1).padStart(2, "0") +
            "/" +
            String(now.getDate()).padStart(2, "0") +
            "/" +
            now.getFullYear() +
            " " +
            String(now.getHours()).padStart(2, "0") +
            ":" +
            String(now.getMinutes()).padStart(2, "0") +
            ":" +
            String(now.getSeconds()).padStart(2, "0");

          // 确认对话框
          layer.confirm(
            "确定要停止此医嘱吗？<br>" +
              '<span style="color: #666; font-size: 12px;">医嘱内容：' +
              (orderData.order_name || "未知") +
              "</span>",
            {
              icon: 3,
              title: "停止医嘱确认",
              btn: ["确定停止", "取消"],
              area: ["400px", "200px"], // 设置对话框大小：宽度400px，高度200px
            },
            function (index) {
              // 构建API参数
              var apiParams = {
                patient_id: patient_id || orderData.patient_id,
                admiss_times: admiss_times || orderData.admiss_times,
                act_order_no: orderData.act_order_no || orderData.order_no,
                stop_doctor: doctorCode,
                stop_time: stopTime,
              };

              // 验证必要参数
              if (
                !apiParams.patient_id ||
                !apiParams.admiss_times ||
                !apiParams.act_order_no
              ) {
                layer.msg(
                  "缺少必要参数，无法停止医嘱<br>请检查患者ID、住院次数和医嘱编号",
                  {
                    icon: 2,
                    time: 3000,
                  }
                );
                console.error("参数验证失败:", apiParams);
                return;
              }

              // 显示加载提示
              var loadingIndex = layer.load(1, { shade: [0.3, "#000"] });

              // 调用停止医嘱API
              $.ajax({
                url: appconfig.api + "/api/MobileWard/StopActYz",
                method: "GET",
                data: apiParams,
                dataType: "json",
                success: function (response) {
                  layer.close(loadingIndex);

                  if (response && response.Status) {
                    layer.msg("医嘱停止成功", { icon: 1 });

                    // 刷新表格数据
                    loadYizhuData(function () {
                      applyFilters(); // 重新应用当前筛选条件
                    });
                  } else {
                    var errorMsg =
                      response && response.Message
                        ? response.Message
                        : "停止医嘱失败";
                    layer.msg(errorMsg, { icon: 2, time: 4000 });
                    console.error("API响应错误:", response);
                  }

                  layer.close(index);
                },
                error: function (xhr, status, error) {
                  layer.close(loadingIndex);
                  layer.close(index);

                  var errorMsg = "网络错误，停止医嘱失败";

                  // 详细的错误处理
                  if (xhr.responseJSON && xhr.responseJSON.Message) {
                    errorMsg = xhr.responseJSON.Message;

                    // 特殊处理SQL文件缺失错误
                    if (
                      errorMsg.indexOf("Could not find file") !== -1 &&
                      errorMsg.indexOf("yz_stop_order.sql") !== -1
                    ) {
                      errorMsg =
                        "服务器配置错误：缺少停止医嘱的SQL文件\n请联系系统管理员检查服务器配置";
                    }
                  } else if (xhr.status === 401) {
                    errorMsg = "权限不足，请重新登录";
                  } else if (xhr.status === 500) {
                    errorMsg = "服务器内部错误";
                  } else if (xhr.status === 404) {
                    errorMsg = "API接口不存在，请检查服务器配置";
                  }

                  layer.msg(errorMsg, { icon: 2, time: 5000 });
                  console.error("AJAX错误详情:", {
                    status: xhr.status,
                    statusText: xhr.statusText,
                    responseText: xhr.responseText,
                    error: error,
                  });
                },
              });
            }
          );
        }

          var key = (serial || "") + "|" + (order_code || "");
          if (doseUnitMapCache[key]) {
            cb && cb(doseUnitMapCache[key]);
            return;
          }
          if (!order_code) {

            data: { serial: serial || "00", order_code: order_code },

              var map = {};
              if (res && res.Status && res.Data && res.Data[0]) {
                var d = res.Data[0];
                if (d.mini_unit && d.mini1_name)
                  map[d.mini_unit] = d.mini1_name;
                if (d.pack_unit && d.pack_name) map[d.pack_unit] = d.pack_name;
                if (d.vol_unit && d.vol_name) map[d.vol_unit] = d.vol_name;
                if (d.weight_unit && d.weight_name)
                  map[d.weight_unit] = d.weight_name;

        function debounce(fn, wait) {
          var t;
          return function () {
            var args = arguments,
              ctx = this;
            clearTimeout(t);
            t = setTimeout(function () {
              fn.apply(ctx, args);
            }, wait);
          };
        }
        function filterOrderTemplates(query) {
          if (!query) return orderTemplates.slice(); // 返回所有
          var q = query.trim().toLowerCase();
          return orderTemplates.filter(function (item) {
            if (!item) return false;
            var name = (item.pattern_name || "").toLowerCase();
            var py = (item.py_code || "").toLowerCase();
            var d = (item.d_code || "").toLowerCase();
            return (
              name.indexOf(q) !== -1 ||
              py.indexOf(q) !== -1 ||
              d.indexOf(q) !== -1
            );
          });
        }

        // 批量提交小医嘱
        function submitBatchSuborders(todoList, layerIndex) {
          if (!todoList || todoList.length === 0) {
            layer.msg("没有可提交的小医嘱", { icon: 5 });
            return;
          }

          var loadingIndex = layer.load(1, { shade: [0.3, "#000"] });
          $.ajax({
            url: appconfig.api + "/api/MobileWard/AddActYz",
            method: "POST",
            contentType: "application/json",
            data: JSON.stringify(todoList),
            dataType: "json",
            success: function (response) {
              layer.close(loadingIndex);
              if (response && response.Status) {
                layer.msg("提交成功", { icon: 1 });
                if (typeof layerIndex === "number" && layerIndex > 0) {
                  layer.close(layerIndex);
                }
                loadYizhuData(function () {
                  applyFilters();
                });
              } else {
                var errorMsg =
                  response && response.Message ? response.Message : "提交失败";
                layer.msg(errorMsg, { icon: 2, time: 4000 });
              }
            },
            error: function (xhr) {
              layer.close(loadingIndex);
              var errorMsg = "网络错误，提交失败";
              if (xhr.responseJSON && xhr.responseJSON.Message)
                errorMsg = xhr.responseJSON.Message;
              layer.msg(errorMsg, { icon: 2, time: 5000 });
            },
          });
        }

        // 撤销医嘱功能
        function revokeMedicalOrder(orderData) {
          // console.log("撤销医嘱 orderData:", orderData);

          // 获取当前用户信息
          var currentUser = JSON.parse(
            localStorage.getItem("loginUser") || "{}"
          );
          var operatorCode = currentUser.user_mi || "00000";

          // 确认对话框
          layer.confirm(
            "确定要撤销此医嘱吗？<br>" +
              '<span style="color: #ff5722; font-size: 12px;">注意：撤销后医嘱将被永久删除</span><br>' +
              '<span style="color: #666; font-size: 12px;">医嘱内容：' +
              (orderData.order_name || "未知") +
              "</span>",
            {
              icon: 3,
              title: "撤销医嘱确认",
              btn: ["确定撤销", "取消"],
              area: ["400px", "250px"], // 设置对话框大小：宽度400px，高度250px（因为内容更多）
            },
            function (index) {
              // 构建API参数
              var apiParams = {
                patient_id: patient_id || orderData.patient_id,
                admiss_times: admiss_times || orderData.admiss_times,
                act_order_no: orderData.act_order_no || orderData.order_no,
                opera: loginUser.user_mi,
                cancel_mode: "1", // 撤销模式，1表示撤销
                pre_cancel_step: "2", // 预撤销步骤，1表示直接撤销
              };

              // 调试信息
              // console.log("撤销医嘱API参数:", apiParams);
              // console.log("医嘱数据:", orderData);

              // 验证必要参数
              if (
                !apiParams.patient_id ||
                !apiParams.admiss_times ||
                !apiParams.act_order_no
              ) {
                layer.msg(
                  "缺少必要参数，无法撤销医嘱<br>请检查患者ID、住院次数和医嘱编号",
                  {
                    icon: 2,
                    time: 3000,
                  }
                );
                console.error("参数验证失败:", apiParams);
                return;
              }

              // 显示加载提示
              var loadingIndex = layer.load(1, { shade: [0.3, "#000"] });

              // 调用撤销医嘱API
              $.ajax({
                url: appconfig.api + "/api/MobileWard/CancelActYz",
                method: "GET",
                data: apiParams,
                dataType: "json",
                success: function (response) {
                  layer.close(loadingIndex);

                  if (response && response.Status == 1) {
                    layer.msg("医嘱撤销成功", { icon: 1 });

                    // 刷新表格数据
                    loadYizhuData(function () {
                      applyFilters(); // 重新应用当前筛选条件
                    });
                  } else {
                    var errorMsg =
                      response && response.Message
                        ? response.Message
                        : "撤销医嘱失败";
                    layer.msg(errorMsg, { icon: 2, time: 4000 });
                    console.error("API响应错误:", response);
                  }

                  layer.close(index);
                },
                error: function (xhr, status, error) {
                  layer.close(loadingIndex);
                  layer.close(index);

                  var errorMsg = "网络错误，撤销医嘱失败";

                  // 详细的错误处理
                  if (xhr.responseJSON && xhr.responseJSON.Message) {
                    errorMsg = xhr.responseJSON.Message;
                  } else if (xhr.status === 401) {
                    errorMsg = "权限不足，请重新登录";
                  } else if (xhr.status === 500) {
                    errorMsg = "服务器内部错误";
                  } else if (xhr.status === 404) {
                    errorMsg = "API接口不存在，请检查服务器配置";
                  }

                  layer.msg(errorMsg, { icon: 2, time: 5000 });
                  console.error("AJAX错误详情:", {
                    status: xhr.status,
                    statusText: xhr.statusText,
                    responseText: xhr.responseText,
                    error: error,
                  });
                },
              });
            }
          );
        }

        function applyFilters() {
          var filtered = allYizhuData.filter(function (item) {
            var matchOrderType = true;
            var matchRoleType = true;
            var matchSearch = true;

            // 医嘱类型筛选
            if (currentFilters.orderType === "long") {
              matchOrderType = String(item.long_once_flag) === "1";
            } else if (currentFilters.orderType === "temp") {
              matchOrderType = String(item.long_once_flag) === "0";
            }
            // 'all' 不需要筛选条件

            // 开嘱人类型筛选
            if (currentFilters.roleType === "doctor") {
              matchRoleType = String(item.fit_flag) === "1";
            } else if (currentFilters.roleType === "nurse") {
              matchRoleType = String(item.fit_flag) === "0";
            } else if (currentFilters.roleType === "mine") {
              matchRoleType = item.order_doctor === loginUser.user_mi;
            }
            // 'all-role' 不需要筛选条件

            // 搜索筛选
            if (
              currentFilters.searchQuery &&
              currentFilters.searchQuery.trim()
            ) {
              var query = currentFilters.searchQuery.trim().toLowerCase();
              var orderName = (item.order_name || "").toLowerCase();
              var orderText = (item.order_text || "").toLowerCase();
              var doctorName = (item.order_doctor_name || "").toLowerCase();
              var instruction = (item.instruction || "").toLowerCase();
              var drugSpec = (item.drug_specification || "").toLowerCase();

              matchSearch =
                orderName.indexOf(query) !== -1 ||
                orderText.indexOf(query) !== -1 ||
                doctorName.indexOf(query) !== -1 ||
                instruction.indexOf(query) !== -1 ||
                drugSpec.indexOf(query) !== -1;
            }

            return matchOrderType && matchRoleType && matchSearch;
          });

          renderYizhuTable(filtered);

          var orderTypeText =
            currentFilters.orderType === "long"

            }

          pending = 0;
          if (!frequencyData || frequencyData.length === 0) {
            pending++;
            loadFrequencyData(after);

          if (!supplyData || supplyData.length === 0) {
            pending++;
            loadSupplyData(after);

          if (pending === 0) {
            after();

            if (
              selectedDraftIndex >= 0 &&
              selectedDraftIndex < draftOrders.length
            ) {
              draftOrders[selectedDraftIndex] = item;
              renderDraftTable();
              layer.msg("已更新当前草稿", { icon: 1 });
            } else {
              draftOrders.push(item);
              renderDraftTable();
              layer.msg("已保存到列表", { icon: 1 });
            }
          });

        // 事件：清空表单
        $(document)
          .off("click", "#btn-clear-form")
          .on("click", "#btn-clear-form", function () {
            $("#manual-order-form")[0].reset();
            form.render();
          });

        // 事件：删除草稿行
        $(document)
          .off("click", ".btn-delete-draft")
          .on("click", ".btn-delete-draft", function () {
            var idx = $(this).closest("tr").data("index");
            if (idx === undefined) return;
            draftOrders.splice(idx, 1);
            if (selectedDraftIndex === idx) {
              selectedDraftIndex = -1;
            } else if (selectedDraftIndex > idx) {
              selectedDraftIndex--;
            }
            renderDraftTable();
          });

        // 点击保存区某行 -> 选中并回填到基本信息

        // 表单字段变化时，实时更新选中草稿
        (function () {
          // 1) 监听表单内原生表单控件的 input/change
          $(document)
            .off("input change", "#manual-order-form :input")
            .on("input change", "#manual-order-form :input", function () {
              // 若是剂量单位下拉变化，顺便把文本框同步为相同值
              if (this && this.id === "manual-unit-select") {
                var v = ($(this).val && $(this).val()) || "";
                $("#manual-doseage-unit").val((v || "").trim());
              }
              updateSelectedDraftFromForm();
            });

          // 2) 暴力监听：Layui 的可视化下拉（.layui-form-select）及其下拉项点击
          // 这能捕获用户通过 Layui UI 进行选择，但原生 select change 可能在不同步时机触发的场景。
          $(document)
            .off(
              "click",
              "#manual-order-form .layui-form-select, #manual-order-form .layui-form-select dl dd, #manual-order-form select"
            )
            .on(
              "click",
              "#manual-order-form .layui-form-select, #manual-order-form .layui-form-select dl dd, #manual-order-form select",
              function (ev) {
                // 延迟一点时间，让 Layui 内部更新原生 select 的值
                setTimeout(function () {
                  try {
                    // 若有 manual-unit-select，同步文本框
                    var $sel = $("#manual-unit-select");
                    if ($sel.length)
                      $("#manual-doseage-unit").val(($sel.val() || "").trim());
                  } catch (e) {}
                  console.log("检测到点击，触发同步", ev && ev.target);
                  updateSelectedDraftFromForm();
                }, 80);
              }
            );
        })();

        // 事件：提交全部草稿
        $(document)
          .off("click", "#btn-submit-all-drafts")
          .on("click", "#btn-submit-all-drafts", function () {
            if (!draftOrders.length) {
              layer.msg("暂无可提交的医嘱", { icon: 2 });
              return;
            }
            // 简单校验：提示缺少编码的条目数量
            var missing = draftOrders.filter(function (x) {
              return !x.order_code;
            }).length;
            var tip = missing
              ? "\n其中 " + missing + " 条缺少编码，可能提交失败"
              : "";
            layer.confirm(
              "确定提交全部 " + draftOrders.length + " 条医嘱？" + tip,
              { icon: 3, title: "确认提交" },
              function (index) {
                layer.close(index);
                // 实际提交
                submitBatchSuborders(
                  draftOrders.slice(),
                  manualOrderModalIndex /* 传递草稿弹窗索引 */
                );
                // 提交后清空草稿并刷新列表（submitBatchSuborders 成功回调会刷新主表）
                draftOrders = [];
                renderDraftTable();
                // 重置弹窗索引
                manualOrderModalIndex = null;
              }
            );
          });

        // 事件：关闭草稿弹窗
        $(document)
          .off("click", "#btn-cancel-manual-order")
          .on("click", "#btn-cancel-manual-order", function () {
            // 关闭指定的草稿弹窗
            if (manualOrderModalIndex !== null) {
              layer.close(manualOrderModalIndex);
              manualOrderModalIndex = null;
            } else {
              // 如果索引不存在，则关闭最上层弹窗（兜底方案）
              layer.closeAll();
            }
          });

        // 默认加载全部并设置默认选中状态，首次加载后立即应用筛选条件
        loadOrderTemplates(function () {
          loadFrequencyData(function () {
            loadSupplyData(function () {
              loadYizhuData(applyFilters);
            });
          });
        });

        // 头工具栏事件
        table.on("toolbar(yizhu-table)", function (obj) {
          switch (obj.event) {
            case "refresh":
              table.reload("yizhu-table");
              break;
            case "export":
              layer.msg("导出功能开发中...");
              break;
          }
        });

        // 行工具栏事件
        table.on("tool(yizhu-table)", function (obj) {
          var data = obj.data;
          if (obj.event === "detail") {
            layer.open({
              type: 1,
              title: false,
              area: ["600px", "400px"],
              content:
                '<div style="padding: 20px;">' +
                "<p><strong>医嘱日期：</strong>" +
                data.order_date +
                " " +
                data.order_time +
                "</p>" +
                "<p><strong>医嘱类型：</strong>" +
                data.order_type_name +
                "</p>" +
                "<p><strong>医嘱内容：</strong>" +
                data.order_text +
                "</p>" +
                "<p><strong>剂量：</strong>" +
                (data.dosage || "") +
                "</p>" +
                "<p><strong>频次：</strong>" +
                (data.frequency || "") +
                "</p>" +
                "<p><strong>用法：</strong>" +
                (data.usage || "") +
                "</p>" +
                "<p><strong>开嘱医生：</strong>" +
                data.doctor_name +
                "</p>" +
                "<p><strong>状态：</strong>" +
                data.status_name +
                "</p>" +
                "</div>",
            });
          } else if (obj.event === "revoke") {
            revokeMedicalOrder(data);
          } else if (obj.event === "stop") {
            stopMedicalOrder(data);
          }
        });
        // 将 renderDraftTable 替换为卡片渲染，并替换相关事件
        // ...existing code...
        function renderDraftTable() {
          var $list = $("#manual-draft-list");
          if (!$list.length) return;

          if (!draftOrders.length) {
            $list.html('<div class="no-data">暂无草稿</div>');
            return;
          }

          var html = "";
          draftOrders.forEach(function (it, idx) {
            var typeText = it.long_once_flag == "1" ? "长" : "临";
            var freqName =
              frequencyCodeToName(it.frequ_code) || it.frequ_code || "";
            var supplyName =
              supplyCodeToName(it.supply_code) || it.supply_code || "";
            var selectedCls = idx === selectedDraftIndex ? " selected" : "";
            var dosePart = it.doseage
              ? "<span>剂量：" +
                (it.doseage || "") +
                (it.doseage_unit_name
                  ? " " + it.doseage_unit_name
                  : it.doseage_unit
                  ? " " + it.doseage_unit
                  : "") +
                "</span>"
              : "";

            html +=
              '<div class="draft-card' +
              selectedCls +
              '" data-index="' +
              idx +
              '">' +
              '<div class="title">' +
              '<span class="badge">' +
              typeText +
              "</span>" +
              '<span title="' +
              (it.order_name || "") +
              '">' +
              (it.order_name || "未命名医嘱") +
              "</span>" +
              "</div>" +
              '<div class="meta">' +
              "<span>数量：" +
              (it.charge_amount || "") +
              "</span>" +
              "<span>频率：" +
              freqName +
              "</span>" +
              "<span>用法：" +
              supplyName +
              "</span>" +
              (it.drug_specification
                ? "<span>规格：" + it.drug_specification + "</span>"
                : "") +
              dosePart +
              "</div>" +
              (it.instruction
                ? '<div class="desc">嘱托：' + it.instruction + "</div>"
                : "") +
              '<div class="actions">' +
              '<button type="button" class="layui-btn layui-btn-xs layui-btn-danger btn-delete-draft">删除</button>' +
              "</div>" +
              "</div>";
          });
          $list.html(html);
        }

        // 替换：点击卡片选择并回填
        $(document)
          .off("click", ".draft-card")
          .on("click", ".draft-card", function () {
            var idx = $(this).data("index");
            if (typeof idx === "undefined") return;
            loadDoseageUnitData(draftOrders[idx]);
            selectedDraftIndex = idx;
            fillFormFromDraft(draftOrders[idx]);
            renderDraftTable();
          });

        // 替换：删除草稿（从卡片容器取索引）
        $(document)
          .off("click", ".btn-delete-draft")
          .on("click", ".btn-delete-draft", function (e) {
            e.stopPropagation();
            var idx = $(this).closest(".draft-card").data("index");
            if (idx === undefined) return;
            draftOrders.splice(idx, 1);
            if (selectedDraftIndex === idx) selectedDraftIndex = -1;
            else if (selectedDraftIndex > idx) selectedDraftIndex--;
            renderDraftTable();
          });

        // 移除旧的表格交互（如仍在，请确保不要再绑定这些监听）
        // $(document).off("click", "#manual-draft-table tbody tr");
        // ...existing code...
      });
    </script>
