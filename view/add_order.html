<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../lib/layui-v2.6.3/css/layui.css" media="all" />

    <title>Document</title>
    <style>
body
{
    overflow: hidden;
}
header
{
    font-size: 1rem;  font-weight: bold;  position: relative;  display: flex;  align-items: center;  justify-content: center;  box-sizing: border-box;  height: 35px;  margin: 0;  padding: 3px 10px;  color: #fff;  border: none;  background-color: rgb(4, 46, 167);  box-shadow: 0 2px 8px rgba(66, 165, 245, .3);
}

.container
{
    display: flex;  height: calc(100vh - 35px - 60px); /* 减去header和搜索区域的高度 */  background-color: #fafafa;
}

.search-wrapper
{
    display: flex;  align-items: center;  height: 60px;  padding: 0 15px;  border-bottom: 1px solid #e8e8e8;  background-color: #fff;  box-shadow: 0 1px 4px rgba(0, 0, 0, .05);
}

.sidebar
{
    width: 100px;  padding: 15px 8px;  border-right: 1px solid #e8e8e8;  background-color: #fff;  box-shadow: 2px 0 4px rgba(0, 0, 0, .05);
}

.content
{
    overflow-y: auto;  flex: 1;  padding: 15px;  background-color: #fafafa;
}

.nav-item
{
    font-size: 13px;  margin: 6px 0;  padding: 10px 12px;  cursor: pointer;  transition: all .3s ease;  text-align: center;  border: 1px solid transparent;  border-radius: 6px;
}

.nav-item:hover
{
    border-color: #d4edda;  background-color: #e8f4fd;
}

.nav-item.active
{
    color: white;  background-color: #1890ff;  box-shadow: 0 2px 6px rgba(24, 144, 255, .3);
}

.template-grid
{
    display: grid;  margin-top: 0; /* 移除上边距，因为搜索框已经移到上方 */  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));  gap: 12px;
}

.template-card
{
    position: relative;  overflow: hidden;  padding: 10px 12px;  cursor: pointer;  transition: all .3s ease;  word-wrap: break-word;  border: 1px solid #e0e0e0;  border-radius: 6px;  background-color: white;  box-shadow: 0 2px 8px rgba(0, 0, 0, .06);
}

.template-card:hover
{
    transform: translateY(-2px);  border-color: #1890ff;  box-shadow: 0 4px 15px rgba(0, 0, 0, .12);
}

.template-card:active
{
    transform: translateY(-1px);
}

.template-card.selected
{
    border-color: #1890ff;  background-color: #f0f8ff;  box-shadow: 0 3px 12px rgba(24, 144, 255, .2);
}

.template-title
{
    font-size: 13px;  font-weight: 600;  line-height: 1.3;  overflow: hidden;  margin-bottom: 6px;  white-space: nowrap;  text-overflow: ellipsis;  color: #333;
}

.template-desc
{
    font-size: 11px;  line-height: 1.4;  display: -webkit-box;  overflow: hidden;  -webkit-box-orient: vertical;  color: #666;          -webkit-line-clamp: 3;                  line-clamp: 3;
}

.empty-state
{
    font-size: 14px;  font-style: italic;  margin-top: 80px;  text-align: center;  color: #999;
}

.loading
{
    font-size: 14px;  margin-top: 50px;  text-align: center;  color: #1890ff;
}

.search-container
{
    display: flex;  align-items: center;  flex: 1;  gap: 15px;
}

.search-box
{
    position: relative;  flex: 1;  max-width: 300px;
}

.search-input
{
    font-size: 13px;  box-sizing: border-box;  width: 100%;  padding: 8px 35px 8px 12px;  transition: border-color .3s;  border: 1px solid #d9d9d9;  border-radius: 4px;
}

.search-input:focus
{
    border-color: #1890ff;  outline: none;  box-shadow: 0 0 0 2px rgba(24, 144, 255, .2);
}

.search-icon
{
    font-size: 14px;  position: absolute;  top: 50%;  right: 10px;  cursor: pointer;  transform: translateY(-50%);  color: #999;
}

.clear-search
{
    font-size: 16px;  position: absolute;  top: 50%;  right: 10px;  display: none;  cursor: pointer;  transform: translateY(-50%);  color: #999;
}

.search-stats
{
    font-size: 12px;  margin-left: 10px;  color: #666;
}

.order-panel
{
    position: fixed;  z-index: 1001;  right: 0;  bottom: 0;  left: 0;

/* 默认隐藏 */

    display: none;

/* 使用flex布局确保actions固定在底部 */
    flex-direction: column;  max-height: 60vh;  border-top: 1px solid #e8e8e8;  border-radius: 8px 8px 0 0;  background-color: #fff;  box-shadow: 0 -2px 8px rgba(0, 0, 0, .1);
}

.order-panel.show
{
    display: flex; /* 显示时改为flex */  animation: slideUp .3s ease-out;
}

.order-overlay
{
    position: fixed;  z-index: 1000;  top: 0;  right: 0;  bottom: 0;  left: 0;  display: none;  background-color: rgba(0, 0, 0, .4);  backdrop-filter: blur(2px); /* 添加模糊效果 */
}

.order-overlay.show
{
    display: block;  animation: fadeIn .3s ease-out;
}

@keyframes slideUp
{
    from
    {
        transform: translateY(100%);
    }
    to
    {
        transform: translateY(0);
    }
}

@keyframes fadeIn
{
    from
    {
        opacity: 0;
    }
    to
    {
        opacity: 1;
    }
}

.order-panel-header
{
    display: flex;  align-items: center;

/* 固定头部，不参与滚动 */
    flex-shrink: 0;  justify-content: space-between;  padding: 12px 15px;  border-bottom: 1px solid #e8e8e8;  background-color: #f8f9fa;
}

.order-panel-title
{
    font-size: 14px;  font-weight: 600;  color: #333;
}

.order-panel-close
{
    font-size: 16px;  padding: 4px;  cursor: pointer;  color: #999;
}

.order-panel-close:hover
{
    color: #666;
}

.order-list
{
    overflow-y: auto;

/* 让列表区域占用剩余空间，但可以滚动 */
    flex: 1;  min-height: 0; /* 允许flex item缩小 */  padding: 10px 15px;
}

.order-item
{
    display: flex;  align-items: flex-start;  padding: 8px 0;  border-bottom: 1px solid #f0f0f0;  border-radius: 10px;  background-color: #fff;  gap: 10px;
}

.order-item:last-child
{
    border-bottom: none;
}

.order-checkbox
{
    margin-top: 2px;  cursor: pointer;
}

.order-content
{
    font-size: 12px;  line-height: 1.4;  flex: 1;
}

.order-name
{
    font-weight: 500;  margin-bottom: 4px;  color: #333;
}

.order-details
{
    font-size: 11px;  color: #666;
}

.order-actions
{
    display: flex;  align-items: center;

/* 固定底部，不参与滚动 */
    flex-shrink: 0;  justify-content: space-between;  min-height: 50px; /* 确保最小高度 */  padding: 10px 15px;  border-top: 1px solid #e8e8e8;  background-color: #f8f9fa;
}

.selected-count
{
    font-size: 12px;  color: #666;
}

.order-buttons
{
    display: flex;  gap: 10px;
}

.btn
{
    font-size: 12px;  padding: 6px 16px;  cursor: pointer;  transition: all .3s;  border: 1px solid;  border-radius: 4px;
}

.btn-primary
{
    color: white;  border-color: #1890ff;  background-color: #1890ff;
}

.btn-primary:hover
{
    border-color: #40a9ff;  background-color: #40a9ff;
}

.btn-secondary
{
    color: #666;  border-color: #d9d9d9;  background-color: white;
}

.btn-secondary:hover
{
    color: #1890ff;  border-color: #1890ff;
}
/* 已选医嘱汇总栏 */
.selected-summary-bar
{
    font-size: 13px;  line-height: 1;  position: fixed;  z-index: 900;  right: 0;  bottom: 0;  left: 0;  display: flex;  align-items: center;  justify-content: space-between;  height: 42px;  padding: 0 15px;  transition: transform .25s ease;  transform: translateY(100%);  border-top: 1px solid #e4e4e4;  background: #fff;  box-shadow: 0 -2px 6px rgba(0, 0, 0, .06);
}
.selected-summary-bar.show
{
    transform: translateY(0);
}
.selected-summary-left
{
    display: flex;  align-items: center;  color: #333;  gap: 8px;
}
.selected-summary-count
{
    font-weight: 600;  color: #1890ff;
}
.selected-summary-actions button
{
    font-size: 12px;  display: inline-flex;  align-items: center;  padding: 6px 14px;  cursor: pointer;  transition: background .25s;  color: #fff;  border: none;  border-radius: 4px;  background: #1890ff;  gap: 4px;
}
.selected-summary-actions button:hover
{
    background: #40a9ff;
}
.selected-summary-actions button:active
{
    background: #096dd9;
}

/* 全屏已选医嘱页面 */
.selected-orders-fullpage
{
    position: fixed;  z-index: 1100;  top: 0;  right: 0;  bottom: 0;  left: 0;  display: none;  flex-direction: column;  background: #fff;
}
.selected-orders-fullpage.show
{
    display: flex;
}

.fullpage-header
{
    display: flex;  align-items: center;  flex-shrink: 0;  justify-content: space-between;  padding: 15px 20px;  color: #fff;  border-bottom: 1px solid #e8e8e8;  background: rgb(4, 46, 167);
}

.fullpage-title
{
    font-size: 18px;  font-weight: 600;
}
.fullpage-close
{
    font-size: 20px;  padding: 8px;  cursor: pointer;  transition: all .3s;  color: #999;  border-radius: 4px;
}

.fullpage-close:hover
{
    color: #666;  background: #e9ecef;
}

.fullpage-content
{
    overflow-y: auto;  flex: 1;  padding: 20px;  background-color: #f8f9fa;
}

.fullpage-actions
{
    display: flex;  align-items: center;  flex-shrink: 0;  justify-content: space-between;  padding: 15px 20px;  border-top: 1px solid #e8e8e8;  background: #f8f9fa;
}




    </style>
  </head>
  <body>
    <header>
      <i
        class="layui-icon layui-icon-return"
        id="backBtn"
        title="返回医嘱列表"
        style="
          font-size: 18px;
          cursor: pointer;
          margin-right: 15px;
          position: absolute;
          left: 10px;
        "
      ></i>
      开立医嘱
    </header>
    <div class="search-wrapper">
      <div class="search-container">
        <div class="search-stats" id="searchStats"></div>
        <div class="search-box">
          <input
            type="text"
            class="search-input"
            placeholder="搜索医嘱模板名称或编码..."
            id="searchInput"
          />
          <i
            class="layui-icon layui-icon-search search-icon"
            id="searchIcon"
          ></i>
          <i
            class="layui-icon layui-icon-close clear-search"
            id="clearSearch"
            title="清空搜索"
          ></i>
        </div>
      </div>
    </div>
    <div class="container">
      <div class="sidebar">
        <div class="nav-item active" data-type="dept">科室模板</div>
        <div class="nav-item" data-type="personal">个人模板</div>
      </div>
      <div class="content">
        <div id="template-list" class="template-grid">
          <!-- 模板列表将在这里动态生成 -->
        </div>
      </div>
    </div>

    <!-- 已选医嘱汇总栏 -->
    <div class="selected-summary-bar" id="selectedSummaryBar">
      <div class="selected-summary-left">
        已选
        <span class="selected-summary-count" id="summarySelectedCount">0</span>
        条医嘱
      </div>
      <div class="selected-summary-actions">
        <button id="viewSelectedBtn" type="button">
          <i class="layui-icon layui-icon-list"></i> 查看已选
        </button>
      </div>
    </div>

    <!-- 蒙版遮罩 -->
    <div class="order-overlay" id="orderOverlay"></div>

    <!-- 全屏已选医嘱页面 -->
    <div class="selected-orders-fullpage" id="selectedOrdersFullpage">
      <div class="fullpage-header">
        <div class="fullpage-title" id="fullpageTitle">全局已选医嘱</div>
        <i
          class="layui-icon layui-icon-close fullpage-close"
          id="closeFullpage"
        ></i>
      </div>
      <div class="fullpage-content" id="fullpageContent">
        <!-- 已选医嘱列表将在这里动态生成 -->
      </div>
      <div class="fullpage-actions">
        <div class="selected-count" id="fullpageSelectedCount">
          全局已选 0 项
        </div>
        <div class="order-buttons">
          <button class="btn btn-primary" id="fullpageConfirmBtn">
            确认提交
          </button>
        </div>
      </div>
    </div>

    <!-- 医嘱选择面板 -->
    <div class="order-panel" id="orderPanel">
      <div class="order-panel-header">
        <div class="order-panel-title" id="orderPanelTitle">医嘱列表</div>
        <i
          class="layui-icon layui-icon-close order-panel-close"
          id="closeOrderPanel"
        ></i>
      </div>
      <div class="order-list" id="orderList">
        <!-- 医嘱列表将在这里动态生成 -->
      </div>
      <div class="order-actions">
        <div class="selected-count" id="selectedCount">已选择 0 项</div>
        <div class="order-buttons">
          <button class="btn btn-secondary" id="selectAllBtn">全选</button>
          <button class="btn btn-primary" id="confirmOrderBtn">确认添加</button>
        </div>
      </div>
    </div>

    <script src="../lib/layui-v2.6.3/layui.js" charset="utf-8"></script>
    <script src="../js/lay-config.js?v=1.0.4" charset="utf-8"></script>

    <script>
      layui.use(["appconfig"], function () {
        const appconfig = layui.appconfig;
        const $ = layui.$;
        const orderTemplates = [];
        let currentType = "dept"; // 当前选择的模板类型
        let filteredTemplates = []; // 搜索过滤后的模板
        let searchKeyword = ""; // 当前搜索关键词
        let currentOrderDetails = []; // 当前模板的医嘱详情
        let selectedOrders = []; // 当前模板中已选择的医嘱索引
        let globalSelectedOrders = []; // 全局已选医嘱列表，存储完整医嘱对象及来源信息
        let lastPatternName = ""; // 最近一次打开的模板名称
        let panelMode = "all"; // 面板模式: all | selected

        // 加载模板列表
        function loadYzPatternList() {
          $.ajax({
            url:
              appconfig.api +
              "/api/MobileWard/GetYzPatternList?dept_sn=1010300",
            type: "get",
            dataType: "json",
            success: function (res) {
              if (res.Status === 1) {
                orderTemplates.length = 0; // 清空现有数据
                res.Data.forEach((item) => {
                  orderTemplates.push(item);
                });
                console.log(orderTemplates);
                renderTemplateList();
              } else {
                alert("获取医嘱模板失败");
              }
            },
            error: function () {
              alert("网络错误，获取医嘱模板失败");
            },
          });
        }

        // 渲染模板列表
        function renderTemplateList() {
          const templateListContainer = $("#template-list");

          if (currentType === "dept") {
            if (orderTemplates.length === 0) {
              templateListContainer.html(
                '<div class="loading">正在加载模板...</div>'
              );
              updateSearchStats(0, 0);
              return;
            }

            // 根据搜索关键词过滤模板
            const templatesToShow = searchKeyword
              ? filteredTemplates
              : orderTemplates;

            templateListContainer.empty();

            if (templatesToShow.length === 0 && searchKeyword) {
              templateListContainer.html(
                '<div class="empty-state">未找到匹配的模板<br>请尝试其他关键词</div>'
              );
            } else {
              // 显示科室模板
              templatesToShow.forEach((template, index) => {
                const originalIndex = searchKeyword
                  ? orderTemplates.indexOf(template)
                  : index;
                const templateCard = `
                  <div class="template-card" data-index="${originalIndex}">
                    <div class="template-title">${
                      template.pattern_name || "模板" + (originalIndex + 1)
                    }</div>
                    <div class="template-desc">
                      <strong>模板编码:</strong> ${
                        template.pattern_code || "暂无"
                      }<br>
                      ${
                        template.description
                          ? "<strong>描述:</strong> " + template.description
                          : ""
                      }
                      ${
                        template.create_date
                          ? "<br><strong>创建时间:</strong> " +
                            template.create_date
                          : ""
                      }
                    </div>
                  </div>
                `;
                templateListContainer.append(templateCard);
              });
            }

            // 更新搜索统计
            updateSearchStats(templatesToShow.length, orderTemplates.length);
          } else {
            // 个人模板暂时为空
            templateListContainer.html(
              '<div class="empty-state">暂无个人模板<br>个人模板功能正在开发中...</div>'
            );
            updateSearchStats(0, 0);
          }

          // 绑定模板卡片点击事件
          $(".template-card").on("click", function () {
            const index = $(this).data("index");
            const selectedTemplate = orderTemplates[index];
            console.log("选择的模板:", selectedTemplate);

            // 添加视觉反馈
            $(".template-card").removeClass("selected");
            $(this).addClass("selected");

            // 获取模板详情
            if (selectedTemplate && selectedTemplate.pattern_code) {
              LoadYzPatternDetail(
                selectedTemplate.pattern_code,
                selectedTemplate.pattern_name
              );
            } else {
              alert("模板信息不完整，无法获取详情");
            }
          });
        }

        // 搜索模板
        function searchTemplates(keyword) {
          searchKeyword = keyword.toLowerCase().trim();

          if (!searchKeyword) {
            filteredTemplates = [];
            renderTemplateList();
            return;
          }

          filteredTemplates = orderTemplates.filter((template) => {
            const name = (template.pattern_name || "").toLowerCase();
            const code = (template.pattern_code || "").toLowerCase();
            const desc = (template.description || "").toLowerCase();

            return (
              name.includes(searchKeyword) ||
              code.includes(searchKeyword) ||
              desc.includes(searchKeyword)
            );
          });

          renderTemplateList();
        }

        // 更新搜索统计信息
        function updateSearchStats(showCount, totalCount) {
          const statsElement = $("#searchStats");
          if (searchKeyword && currentType === "dept") {
            statsElement.text(`找到 ${showCount} 个模板，共 ${totalCount} 个`);
          } else if (currentType === "dept" && totalCount > 0) {
            statsElement.text(`共 ${totalCount} 个模板`);
          } else {
            statsElement.text("");
          }
        }

        // 导航栏点击事件
        $(".nav-item").on("click", function () {
          $(".nav-item").removeClass("active");
          $(this).addClass("active");
          currentType = $(this).data("type");

          // 切换导航时重置搜索
          $("#searchInput").val("");
          $("#clearSearch").hide();
          $("#searchIcon").show();
          searchKeyword = "";
          filteredTemplates = [];

          renderTemplateList();
        });

        function LoadYzPatternDetail(patternCode, patternName) {
          if (!patternCode) {
            console.error("模板编码不能为空");
            return;
          }

          $.ajax({
            url: appconfig.api + "/api/MobileWard/GetYzPatternDetail",
            type: "get",
            dataType: "json",
            data: {
              dept_sn: "1010300",
              emp_sn: "00000",
              pattern_code: patternCode,
            },
            success: function (res) {
              if (res.Status === 1) {
                console.log("获取到模板详情:", res.Data);
                currentOrderDetails = res.Data || [];
                showOrderPanel(patternName, currentOrderDetails);
              } else {
                alert("获取医嘱模板明细失败: " + (res.Message || "未知错误"));
              }
            },
            error: function (xhr, status, error) {
              alert("网络错误，获取医嘱模板明细失败");
              console.error("获取模板详情失败:", error);
            },
          });
        }

        // 显示医嘱选择面板
        function showOrderPanel(patternName, orderDetails) {
          const panel = $("#orderPanel");
          const overlay = $("#orderOverlay");
          const title = $("#orderPanelTitle");
          const orderList = $("#orderList");

          // 设置标题
          title.text(`${patternName} - 医嘱列表`);
          lastPatternName = patternName || lastPatternName;
          panelMode = "all";

          // 重新加载当前模板的选择状态
          selectedOrders = [];
          orderDetails.forEach((order, index) => {
            const globalIndex = globalSelectedOrders.findIndex(
              (global) =>
                global.order_code === order.order_code &&
                global.pattern_name === patternName
            );
            if (globalIndex !== -1) {
              selectedOrders.push(index);
            }
          });

          // 生成医嘱列表
          orderList.empty();

          if (orderDetails.length === 0) {
            orderList.html(
              '<div style="text-align: center; padding: 20px; color: #999;">该模板暂无医嘱明细</div>'
            );
          } else {
            orderDetails.forEach((order, index) => {
              const checked = selectedOrders.includes(index) ? "checked" : "";
              const orderItem = `
                <div class="order-item">
                  <input type="checkbox" class="order-checkbox" data-index="${index}" id="order_${index}" ${checked}>
                  <div class="order-content">
                    <div class="order-name">${
                      order.order_name ||
                      order.drug_name ||
                      "医嘱" + (index + 1)
                    }</div>
                    <div class="order-details">
                      ${
                        order.drug_specification
                          ? "规格: " + order.drug_specification + " | "
                          : ""
                      }
                      ${order.doseage ? "剂量: " + order.doseage_unit_name + " | " : ""}
                      ${
                        order.frequ_name
                          ? "频次: " + order.frequ_name + " | "
                          : ""
                      }
                      ${order.supply_name ? "用法: " + order.supply_name : ""}
                      ${order.order_code ? "<br>编码: " + order.order_code : ""}
                    </div>
                  </div>
                </div>
              `;
              orderList.append(orderItem);
            });
          }

          // 显示蒙版和面板
          overlay.addClass("show");
          panel.removeClass("hide").addClass("show");

          // 更新选择计数
          updateSelectedCount();
        }

        // 显示全屏已选医嘱页面
        function showSelectedOrdersFullpage() {
          const fullpage = $("#selectedOrdersFullpage");
          const title = $("#fullpageTitle");
          const content = $("#fullpageContent");

          title.text(`全局已选医嘱 (${globalSelectedOrders.length})`);

          content.empty();
          if (globalSelectedOrders.length === 0) {
            content.html(
              '<div style="text-align:center;padding:60px;color:#999;font-size:16px;">暂无已选医嘱</div>'
            );
          } else {
            globalSelectedOrders.forEach((globalOrder, globalIndex) => {
              const orderItem = `
                <div class="order-item">
                  <input type="checkbox" class="global-order-checkbox" data-global-index="${globalIndex}" checked>
                  <div class="order-content">
                    <div class="order-name">${
                      globalOrder.order_name || globalOrder.drug_name || "医嘱"
                    }</div>
                    <div class="order-details">
                      <strong>来源模板:</strong> ${globalOrder.pattern_name}<br>
                      ${
                        globalOrder.drug_description
                          ? "规格: " + globalOrder.drug_description + " | "
                          : ""
                      }
                      ${
                        globalOrder.doseage
                          ? "剂量: " + globalOrder.doseage + globalOrder.doseage_unit_name + " | "
                          : ""
                      }
                      ${
                        globalOrder.frequ_name
                          ? "频次: " + globalOrder.frequ_name + " | "
                          : ""
                      }
                      ${globalOrder.supply_name ? "用法: " + globalOrder.supply_name : ""}
                      ${
                        globalOrder.order_code
                          ? "<br>编码: " + globalOrder.order_code
                          : ""
                      }
                    </div>
                  </div>
                </div>`;
              content.append(orderItem);
            });
          }

          // 更新计数
          $("#fullpageSelectedCount").text(
            `全局已选 ${globalSelectedOrders.length} 项`
          );

          fullpage.addClass("show");
        }

        // 隐藏全屏已选医嘱页面
        function hideSelectedOrdersFullpage() {
          $("#selectedOrdersFullpage").removeClass("show");
        }

        // 更新已选择医嘱计数
        function updateSelectedCount() {
          const currentCount = selectedOrders.length;
          const globalCount = globalSelectedOrders.length;

          $("#selectedCount").text(`已选择 ${currentCount} 项`);

          // 同步底部汇总栏（显示全局计数）
          $("#summarySelectedCount").text(globalCount);
          const summaryBar = $("#selectedSummaryBar");
          if (globalCount > 0) {
            summaryBar.addClass("show");
          } else {
            summaryBar.removeClass("show");
          }

          // 更新全选按钮文字
          const totalCount = currentOrderDetails.length;
          const selectAllBtn = $("#selectAllBtn");
          if (currentCount === totalCount && totalCount > 0) {
            selectAllBtn.text("取消全选");
          } else {
            selectAllBtn.text("全选");
          }
        }

        // 隐藏医嘱面板
        function hideOrderPanel() {
          const panel = $("#orderPanel");
          const overlay = $("#orderOverlay");

          panel.removeClass("show");
          overlay.removeClass("show");
          // 不清空 selectedOrders，保留汇总栏；仅隐藏面板
        }

        // 搜索框事件绑定
        function initSearchEvents() {
          const searchInput = $("#searchInput");
          const clearButton = $("#clearSearch");
          const searchIcon = $("#searchIcon");

          // 搜索输入事件 - 实时搜索
          searchInput.on("input", function () {
            const keyword = $(this).val();

            // 显示/隐藏清空按钮
            if (keyword) {
              clearButton.show();
              searchIcon.hide();
            } else {
              clearButton.hide();
              searchIcon.show();
            }

            // 执行搜索
            searchTemplates(keyword);
          });

          // 清空搜索
          clearButton.on("click", function () {
            searchInput.val("");
            clearButton.hide();
            searchIcon.show();
            searchTemplates("");
          });

          // 搜索图标点击
          searchIcon.on("click", function () {
            searchInput.focus();
          });

          // 回车搜索
          searchInput.on("keypress", function (e) {
            if (e.which === 13) {
              searchTemplates($(this).val());
            }
          });
        }

        // 医嘱面板事件绑定
        function initOrderPanelEvents() {
          // 关闭面板
          $("#closeOrderPanel").on("click", function () {
            hideOrderPanel();
          });

          // 点击蒙版关闭面板
          $("#orderOverlay").on("click", function () {
            hideOrderPanel();
          });

          // 防止面板内容点击事件冒泡到蒙版
          $("#orderPanel").on("click", function (e) {
            e.stopPropagation();
          });

          // 医嘱复选框变化
          $(document).on("change", ".order-checkbox", function () {
            const index = parseInt($(this).data("index"));
            const isChecked = $(this).is(":checked");
            const currentOrder = currentOrderDetails[index];

            if (isChecked) {
              // 添加到当前选择
              if (!selectedOrders.includes(index)) {
                selectedOrders.push(index);
              }
              // 添加到全局选择（避免重复）
              const existsInGlobal = globalSelectedOrders.findIndex(
                (global) =>
                  global.order_code === currentOrder.order_code &&
                  global.pattern_name === lastPatternName
              );
              if (existsInGlobal === -1) {
                globalSelectedOrders.push({
                  ...currentOrder,
                  pattern_name: lastPatternName,
                  original_index: index,
                });
              }
            } else {
              // 从当前选择中移除
              const pos = selectedOrders.indexOf(index);
              if (pos !== -1) {
                selectedOrders.splice(pos, 1);
              }
              // 从全局选择中移除
              const globalIndex = globalSelectedOrders.findIndex(
                (global) =>
                  global.order_code === currentOrder.order_code &&
                  global.pattern_name === lastPatternName
              );
              if (globalIndex !== -1) {
                globalSelectedOrders.splice(globalIndex, 1);
              }
            }

            updateSelectedCount();
            if (panelMode === "selected") {
              showSelectedOrdersFullpage();
            }
          });

          // 全局已选医嘱复选框变化
          $(document).on("change", ".global-order-checkbox", function () {
            const globalIndex = parseInt($(this).data("global-index"));
            const isChecked = $(this).is(":checked");

            if (!isChecked) {
              // 从全局选择中移除
              globalSelectedOrders.splice(globalIndex, 1);
              updateSelectedCount();
              showSelectedOrdersFullpage(); // 重新渲染
            }
          });

          // 全选/取消全选
          $("#selectAllBtn").on("click", function () {
            const totalCount = currentOrderDetails.length;
            const isSelectAll = selectedOrders.length !== totalCount;

            $(".order-checkbox").prop("checked", isSelectAll);

            if (isSelectAll) {
              // 全选：添加所有医嘱到当前和全局选择
              selectedOrders = [...Array(totalCount).keys()];
              currentOrderDetails.forEach((order, index) => {
                const existsInGlobal = globalSelectedOrders.findIndex(
                  (global) =>
                    global.order_code === order.order_code &&
                    global.pattern_name === lastPatternName
                );
                if (existsInGlobal === -1) {
                  globalSelectedOrders.push({
                    ...order,
                    pattern_name: lastPatternName,
                    original_index: index,
                  });
                }
              });
            } else {
              // 取消全选：从当前和全局选择中移除当前模板的所有医嘱
              selectedOrders = [];
              globalSelectedOrders = globalSelectedOrders.filter(
                (global) => global.pattern_name !== lastPatternName
              );
            }

            updateSelectedCount();
          });

          // 确认添加医嘱
          $("#confirmOrderBtn").on("click", function () {
            if (globalSelectedOrders.length === 0) {
              alert("请至少选择一个医嘱");
              return;
            }

            console.log("确认添加的全局医嘱:", globalSelectedOrders);

            // 这里可以添加提交医嘱的逻辑
            alert(
              `已选择 ${globalSelectedOrders.length} 个医嘱，准备添加到患者医嘱中`
            );

            // 隐藏面板
            hideOrderPanel();
          });

          // 查看已选：进入全屏模式
          $("#viewSelectedBtn").on("click", function () {
            if (globalSelectedOrders.length === 0) {
              alert("还没有勾选任何医嘱");
              return;
            }
            showSelectedOrdersFullpage();
          });

          // 关闭全屏页面
          $("#closeFullpage").on("click", function () {
            hideSelectedOrdersFullpage();
          });

          // 全屏页面确认添加
          $("#fullpageConfirmBtn").on("click", function () {
            if (globalSelectedOrders.length === 0) {
              alert("请至少选择一个医嘱");
              return;
            }

            console.log("确认添加的全局医嘱:", globalSelectedOrders);

            // 调用提交函数
            submitSelectedOrders();
          });
        }

        // 批量提交已选医嘱
        function submitSelectedOrders() {
          if (!globalSelectedOrders || globalSelectedOrders.length === 0) {
            alert("没有可提交的医嘱");
            return;
          }

          // 获取当前用户、病人和科室信息
          const currentUser = JSON.parse(
            localStorage.getItem("loginUser") || "{}"
          );
          const patientData = JSON.parse(
            localStorage.getItem("userData") || "{}"
          );
          const wardData = JSON.parse(localStorage.getItem("wardData") || "{}");

          // 获取当前时间
          const now = new Date();
          const currentTime =
            now.getFullYear() +
            "-" +
            String(now.getMonth() + 1).padStart(2, "0") +
            "-" +
            String(now.getDate()).padStart(2, "0") +
            " " +
            String(now.getHours()).padStart(2, "0") +
            ":" +
            String(now.getMinutes()).padStart(2, "0") +
            ":" +
            String(now.getSeconds()).padStart(2, "0");

          const doctorCode =
            currentUser.user_id || currentUser.user_mi || "00000";

          // 将globalSelectedOrders转换为API所需的格式
          const todoList = globalSelectedOrders.map(function (order) {
            return {
              act_order_no: order.act_order_no || "", // 后端生成
              add_opera: doctorCode,
              admiss_times: patientData.admiss_times || "1",
              ca_id_doctor: doctorCode,
              charge_amount: order.charge_amount || "1",
              discription: order.instruction || order.drug_description || "",
              drug_occ: order.drug_occ || "",
              drug_specification:
                order.drug_specification || order.order_spec || "",
              end_time: "",
              end_time_2: "",
              enter_oper: doctorCode,
              enter_time: currentTime,
              exec_unit: wardData.ward_sn || "",
              exclusive_type: "1",
              fit_flag: "1",
              frequ_code: (
                order.frequency ||
                order.frequ_code ||
                "ONCE"
              ).trim(),
              group_no: order.group_no || "000000",
              instruction: order.instruction || order.drug_description || "",
              is_new: true,
              long_once_flag: order.long_once_flag || "0",
              modify_price: "",
              order_code: order.order_code || "",
              order_doctor: doctorCode,
              order_name: order.order_name || order.drug_name || "",
              order_time: currentTime,
              order_type: (order.long_once_flag || "0") === "1" ? "3" : "4",
              parent_no: "65965879",
              patient_id: patientData.patient_id || "00000",
              prev_flag: "",
              Serial: order.serial || "",
              self_buy: "0",
              skin_test_flag: "",
              spinfo_type: "1",
              start_time: currentTime,
              status_flag: "0",
              supply_code: order.supply_code || "",
              doseage: order.dosage || order.doseage || null,
              doseage_unit: order.doseage_unit || null,
              doseage_unit_name:
                order.doseage_unit_name || order.doseage_unit || null,
              frequ_code: order.frequency || order.frequ_code || "ONCE",
              ward_sn: wardData.ward_sn || "",
            };
          });

          console.log("准备提交的医嘱数据:", todoList);

          // 显示加载中
          const loadingMsg = "正在提交医嘱...";
          console.log(loadingMsg);

          // 发送AJAX请求
          $.ajax({
            url: appconfig.api + "/api/MobileWard/AddActYz",
            method: "POST",
            contentType: "application/json",
            data: JSON.stringify(todoList),
            dataType: "json",
            success: function (response) {
              console.log("提交响应:", response);
              if (response && response.Status) {
                alert("提交成功！");
                // 清空已选医嘱
                globalSelectedOrders = [];
                selectedOrders = [];
                updateSelectedCount();
                hideSelectedOrdersFullpage();
                // 可以在这里添加刷新页面或跳转的逻辑
              } else {
                const errorMsg =
                  response && response.Message ? response.Message : "提交失败";
                alert(errorMsg);
              }
            },
            error: function (xhr) {
              console.error("提交失败:", xhr);
              let errorMsg = "网络错误，提交失败";
              if (xhr.responseJSON && xhr.responseJSON.Message) {
                errorMsg = xhr.responseJSON.Message;
              }
              alert(errorMsg);
            },
          });
        }

        // 初始化页面
        loadYzPatternList();
        initSearchEvents();
        initOrderPanelEvents();

        // 返回按钮事件
        $("#backBtn").on("click", function () {
          // 返回到医嘱列表页面
          // window.history.back();
          parent.layer.closeAll();
        });
      });
    </script>
  </body>
</html>
