<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/lib/layui-v2.6.3/css/layui.css" media="all" />

    <title>Document</title>
    <style>
      header {
        font-size: 1rem;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 35px;
        margin: 0;
        padding: 3px 10px;
        color: #fff;
        border: none;
        background-color: rgb(4, 46, 167);
        box-shadow: 0 2px 8px rgba(66, 165, 245, 0.3);
      }
    </style>
  </head>
  <body>
    <header>开立医嘱</header>
    <main></main>
    <script src="/lib/layui-v2.6.3/layui.js" charset="utf-8"></script>
    <script src="/js/lay-config.js?v=1.0.4" charset="utf-8"></script>

    <script>
      layui.use(["appconfig"], function () {
        const appconfig = layui.appconfig;
        const $ = layui.$;
        const orderTemplates = [];
        function loadOrderTemplates() {
          $.ajax({
            url:
              appconfig.api +
              "/api/MobileWard/GetYzPatternList?dept_sn=1010300",
            type: "get",
            dataType: "json",
            success: function (res) {
              if (res.Status === 1) {
                res.Data.forEach((item) => {
                  orderTemplates.push(item);
                });
                console.log(orderTemplates);
              } else {
                alert("获取医嘱模板失败");
              }
            },
          });
        }
        loadOrderTemplates();
      });
    </script>
  </body>
</html>
