<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../lib/layui-v2.6.3/css/layui.css" media="all" />
  <link rel="stylesheet" href="../lib/mobile-select/mobile-select.css">

  <title>Document</title>
  <style>
    body {
      overflow: hidden;
    }

    header {
      font-size: 1rem;
      font-weight: bold;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      height: 35px;
      margin: 0;
      padding: 3px 10px;
      color: #fff;
      border: none;
      background-color: rgb(4, 46, 167);
      box-shadow: 0 2px 8px rgba(66, 165, 245, .3);
    }

    .container {
      display: flex;
      height: calc(100vh - 35px - 60px);
      /* 减去header和搜索区域的高度 */
      background-color: #fafafa;
    }

    .search-wrapper {
      display: flex;
      align-items: center;
      height: 60px;
      padding: 0 15px;
      border-bottom: 1px solid #e8e8e8;
      background-color: #fff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .05);
    }

    .sidebar {
      width: 100px;
      padding: 15px 8px;
      border-right: 1px solid #e8e8e8;
      background-color: #fff;
      box-shadow: 2px 0 4px rgba(0, 0, 0, .05);
    }

    .content {
      overflow-y: auto;
      flex: 1;
      padding: 15px;
      background-color: #fafafa;
    }

    .nav-item {
      font-size: 13px;
      margin: 6px 0;
      padding: 10px 12px;
      cursor: pointer;
      transition: all .3s ease;
      text-align: center;
      border: 1px solid transparent;
      border-radius: 6px;
    }

    .nav-item:hover {
      border-color: #d4edda;
      background-color: #e8f4fd;
    }

    .nav-item.active {
      color: white;
      background-color: #1890ff;
      box-shadow: 0 2px 6px rgba(24, 144, 255, .3);
    }

    .template-grid {
      display: grid;
      margin-top: 0;
      /* 移除上边距，因为搜索框已经移到上方 */
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }

    .template-card {
      position: relative;
      overflow: hidden;
      padding: 10px 12px;
      cursor: pointer;
      transition: all .3s ease;
      word-wrap: break-word;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      background-color: white;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .06);
    }

    .template-card:hover {
      transform: translateY(-2px);
      border-color: #1890ff;
      box-shadow: 0 4px 15px rgba(0, 0, 0, .12);
    }

    .template-card:active {
      transform: translateY(-1px);
    }

    .template-card.selected {
      border-color: #1890ff;
      background-color: #f0f8ff;
      box-shadow: 0 3px 12px rgba(24, 144, 255, .2);
    }

    .template-title {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
      overflow: hidden;
      margin-bottom: 6px;
      white-space: nowrap;
      text-overflow: ellipsis;
      color: #333;
    }

    .template-desc {
      font-size: 11px;
      line-height: 1.4;
      display: -webkit-box;
      overflow: hidden;
      -webkit-box-orient: vertical;
      color: #666;
      -webkit-line-clamp: 3;
      line-clamp: 3;
    }

    .empty-state {
      font-size: 14px;
      font-style: italic;
      margin-top: 80px;
      text-align: center;
      color: #999;
    }

    .loading {
      font-size: 14px;
      margin-top: 50px;
      text-align: center;
      color: #1890ff;
    }

    .search-container {
      display: flex;
      align-items: center;
      flex: 1;
      gap: 15px;
    }

    .search-box {
      position: relative;
      flex: 1;
      max-width: 300px;
    }

    .search-input {
      font-size: 13px;
      box-sizing: border-box;
      width: 100%;
      padding: 8px 35px 8px 12px;
      transition: border-color .3s;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
    }

    .search-input:focus {
      border-color: #1890ff;
      outline: none;
      box-shadow: 0 0 0 2px rgba(24, 144, 255, .2);
    }

    .search-icon {
      font-size: 14px;
      position: absolute;
      top: 50%;
      right: 10px;
      cursor: pointer;
      transform: translateY(-50%);
      color: #999;
    }

    .clear-search {
      font-size: 16px;
      position: absolute;
      top: 50%;
      right: 10px;
      display: none;
      cursor: pointer;
      transform: translateY(-50%);
      color: #999;
    }

    .search-stats {
      font-size: 12px;
      margin-left: 10px;
      color: #666;
    }

    .order-panel {
      position: fixed;
      z-index: 1001;
      right: 0;
      bottom: 0;
      left: 0;

      /* 默认隐藏 */

      display: none;

      /* 使用flex布局确保actions固定在底部 */
      flex-direction: column;
      max-height: 60vh;
      border-top: 1px solid #e8e8e8;
      border-radius: 8px 8px 0 0;
      background-color: #fff;
      box-shadow: 0 -2px 8px rgba(0, 0, 0, .1);
    }

    .order-panel.show {
      display: flex;
      /* 显示时改为flex */
      animation: slideUp .3s ease-out;
    }

    .order-overlay {
      position: fixed;
      z-index: 1000;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      display: none;
      background-color: rgba(0, 0, 0, .4);
      backdrop-filter: blur(2px);
      /* 添加模糊效果 */
    }

    .order-overlay.show {
      display: block;
      animation: fadeIn .3s ease-out;
    }

    @keyframes slideUp {
      from {
        transform: translateY(100%);
      }

      to {
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .order-panel-header {
      display: flex;
      align-items: center;

      /* 固定头部，不参与滚动 */
      flex-shrink: 0;
      justify-content: space-between;
      padding: 12px 15px;
      border-bottom: 1px solid #e8e8e8;
      background-color: #f8f9fa;
    }

    .order-panel-title {
      font-size: 14px;
      font-weight: 600;
      color: #333;
    }

    .order-panel-close {
      font-size: 16px;
      padding: 4px;
      cursor: pointer;
      color: #999;
    }

    .order-panel-close:hover {
      color: #666;
    }

    .order-list {
      overflow-y: auto;

      /* 让列表区域占用剩余空间，但可以滚动 */
      flex: 1;
      min-height: 0;
      /* 允许flex item缩小 */
      padding: 10px 15px;
    }

    .order-item {
      display: flex;
      align-items: flex-start;
      padding: 8px 0;
      border-bottom: 1px solid #f0f0f0;
      border-radius: 10px;
      background-color: #fff;
      gap: 10px;
    }

    .order-item:last-child {
      border-bottom: none;
    }

    .order-checkbox {
      margin-top: 2px;
      cursor: pointer;
    }

    .order-content {
      font-size: 12px;
      line-height: 1.4;
      flex: 1;
    }

    .order-name {
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 4px;
      color: #333;
    }

    .order-details {
      font-size: 11px;
      color: #666;
    }

    .order-actions {
      display: flex;
      align-items: center;

      /* 固定底部，不参与滚动 */
      flex-shrink: 0;
      justify-content: space-between;
      min-height: 50px;
      /* 确保最小高度 */
      padding: 10px 15px;
      border-top: 1px solid #e8e8e8;
      background-color: #f8f9fa;
    }

    .selected-count {
      font-size: 12px;
      color: #666;
    }

    .order-buttons {
      display: flex;
      gap: 10px;
    }

    .btn {
      font-size: 12px;
      padding: 6px 16px;
      cursor: pointer;
      transition: all .3s;
      border: 1px solid;
      border-radius: 4px;
    }

    .btn-primary {
      color: white;
      border-color: #1890ff;
      background-color: #1890ff;
    }

    .btn-primary:hover {
      border-color: #40a9ff;
      background-color: #40a9ff;
    }

    .btn-secondary {
      color: #666;
      border-color: #d9d9d9;
      background-color: white;
    }

    .btn-secondary:hover {
      color: #1890ff;
      border-color: #1890ff;
    }

    /* 已选医嘱汇总栏 */
    .selected-summary-bar {
      font-size: 13px;
      line-height: 1;
      position: fixed;
      z-index: 900;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 42px;
      padding: 0 15px;
      transition: transform .25s ease;
      transform: translateY(100%);
      border-top: 1px solid #e4e4e4;
      background: #fff;
      box-shadow: 0 -2px 6px rgba(0, 0, 0, .06);
    }

    .selected-summary-bar.show {
      transform: translateY(0);
    }

    .selected-summary-left {
      display: flex;
      align-items: center;
      color: #333;
      gap: 8px;
    }

    .selected-summary-count {
      font-weight: 600;
      color: #1890ff;
    }

    .selected-summary-actions button {
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      padding: 6px 14px;
      cursor: pointer;
      transition: background .25s;
      color: #fff;
      border: none;
      border-radius: 4px;
      background: #1890ff;
      gap: 4px;
    }

    .selected-summary-actions button:hover {
      background: #40a9ff;
    }

    .selected-summary-actions button:active {
      background: #096dd9;
    }

    /* 全屏已选医嘱页面 */
    .selected-orders-fullpage {
      position: fixed;
      z-index: 1100;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      display: none;
      flex-direction: column;
      background: #fff;
    }

    .selected-orders-fullpage.show {
      display: flex;
    }

    .fullpage-header {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      justify-content: space-between;
      padding: 15px 20px;
      color: #fff;
      border-bottom: 1px solid #e8e8e8;
      background: rgb(4, 46, 167);
    }

    .fullpage-title {
      font-size: 18px;
      font-weight: 600;
    }

    .fullpage-close {
      font-size: 20px;
      padding: 8px;
      cursor: pointer;
      transition: all .3s;
      color: #999;
      border-radius: 4px;
    }

    .fullpage-close:hover {
      color: #666;
      background: #e9ecef;
    }

    .fullpage-content {
      overflow-y: auto;
      flex: 1;
      padding: 20px;
      background-color: #f8f9fa;
    }

    /* 全屏已选医嘱：将编辑/删除按钮固定在卡片右下角 */
    .selected-orders-fullpage .order-item {
      display: flex;
      flex-direction: column;
      /* 上下两层 */
      padding: 10px;
      border: 1px solid #f0f0f0;
      border-radius: 8px;
      background: #fff;
      gap: 8px;
    }

    .selected-orders-fullpage .order-main {
      display: flex;
      align-items: flex-start;
      width: 100%;
      gap: 10px;
    }

    .selected-orders-fullpage .order-main .order-content {
      overflow: hidden;
      flex: 1;
    }

    .selected-orders-fullpage .order-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      width: 100%;
      padding-top: 6px;
      border-top: 1px solid #f0f0f0;
      gap: 8px;
    }

    .selected-orders-fullpage .order-footer .action-buttons {
      display: flex;
      gap: 6px;
    }

    .selected-orders-fullpage .order-footer .btn {
      font-size: 13px;
      padding: 6px 10px;
    }

    .fullpage-actions {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      justify-content: space-between;
      padding: 15px 20px;
      border-top: 1px solid #e8e8e8;
      background: #f8f9fa;
    }

    /* 编辑弹窗现代化样式 */
    .edit-order-form .layui-form-label {
      font-weight: 600;
      padding: 9px 15px;
      text-align: right;
      /* 文本右对齐 */
      color: #333;
    }

    .edit-order-form .layui-input-wrapper {
      width: 100%;
    }

    .edit-order-form .layui-input,
    .edit-order-form .layui-select {
      border-radius: 4px;
    }

    .edit-order-form .layui-badge {
      font-size: 14px;
      padding: 4px 8px;
      color: #1890ff;
      border: 1px solid #d4edda;
      border-radius: 4px;
      background-color: #e8f4fd;
    }

    .edit-order-form .form-tip {
      font-size: 12px;
      margin-top: 4px;
      color: #999;
    }

    .edit-order-form .readonly-value {
      line-height: 22px;
      min-height: 38px;
      padding: 8px 12px;
      word-wrap: break-word;
      border-radius: 4px;
      background: #f5f5f5;
    }

    .custom-edit-layer {
      border-radius: 20px !important;
    }

    /* 优化编辑弹窗中 Layui 下拉选项清晰度（Windows/非 Retina 常见发虚） */
    .layui-layer .layui-form-select dl,
    .layui-layer .layui-form-select dl dd {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    .layui-layer .layui-form-select dl {
      font-size: 14px;
      /* 提升清晰度的常用字号 */
      line-height: 22px;
      color: #333;
      background-color: #fff;
    }

    .layui-layer .layui-form-select dl dd.layui-this {
      color: #1890ff;
      /* 选中项高对比度 */
    }

    .layui-form-item {
      display: flex;
      align-items: center;
    }

    .layui-form-item .layui-input-block {
      flex: 1;
      margin-left: 0;
    }

    .layui-form-item h3 {
      font-weight: bolder;
      margin-left: 20px;
    }

    .layui-form.edit-order-form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-column-gap: 20px;
    }

    .layui-form-label {
      width: auto;
      padding: 0;
    }

    /* 允许弹窗内容区的下拉框溢出，防止被裁剪 */
    .layui-layer-content {
      overflow: visible !important;
    }

    .layui-form-onswitch em {
      margin-left: 3px;
    }
  </style>
</head>

<body>
  <header>
    <!-- 返回按钮：使用 inline SVG 作为字体图标的回退，确保打包后依然可见 -->
    <button id="backBtn" title="返回医嘱列表" aria-label="返回" style="
          background: transparent;
          border: none;
          padding: 0;
          margin: 0;
          cursor: pointer;
          position: absolute;
          left: 10px;
          display: inline-flex;
          align-items: center;
          justify-content: center;
        ">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" focusable="false"
        aria-hidden="true">
        <path d="M19 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H19v-2z" fill="#ffffff" />
      </svg>
    </button>
    开立医嘱
  </header>
  <div class="search-wrapper">
    <div class="search-container">
      <div class="search-stats" id="searchStats"></div>
      <div class="search-box">
        <input type="text" class="search-input" placeholder="搜索医嘱模板名称或编码..." id="searchInput" />
        <i class="layui-icon layui-icon-search search-icon" id="searchIcon"></i>
        <i class="layui-icon layui-icon-close clear-search" id="clearSearch" title="清空搜索"></i>
      </div>
    </div>
  </div>
  <div class="container">
    <div class="sidebar">
      <div class="nav-item active" data-type="dept">科室模板</div>
      <div class="nav-item" data-type="personal">个人模板</div>
    </div>
    <div class="content">
      <div id="template-list" class="template-grid">
        <!-- 模板列表将在这里动态生成 -->
      </div>
    </div>
  </div>

  <!-- 已选医嘱汇总栏 -->
  <div class="selected-summary-bar" id="selectedSummaryBar">
    <div class="selected-summary-left">
      已选
      <span class="selected-summary-count" id="summarySelectedCount">0</span>
      条医嘱
    </div>
    <div class="selected-summary-actions">
      <button id="viewSelectedBtn" type="button">
        <i class="layui-icon layui-icon-list"></i> 查看已选
      </button>
    </div>
  </div>

  <!-- 蒙版遮罩 -->
  <div class="order-overlay" id="orderOverlay"></div>

  <!-- 全屏已选医嘱页面 -->
  <div class="selected-orders-fullpage" id="selectedOrdersFullpage">
    <div class="fullpage-header">
      <div class="fullpage-title" id="fullpageTitle">全局已选医嘱</div>
      <i class="layui-icon layui-icon-close fullpage-close" id="closeFullpage"></i>
    </div>
    <div class="fullpage-content" id="fullpageContent">
      <!-- 已选医嘱列表将在这里动态生成 -->
    </div>
    <div class="fullpage-actions">
      <div class="selected-count" id="fullpageSelectedCount">
        全局已选 0 项
      </div>
      <div class="order-buttons">
        <button class="btn btn-primary" id="fullpageConfirmBtn">
          确认提交
        </button>
      </div>
    </div>
  </div>

  <!-- 医嘱选择面板 -->
  <div class="order-panel" id="orderPanel">
    <div class="order-panel-header">
      <div class="order-panel-title" id="orderPanelTitle">医嘱列表</div>
      <i class="layui-icon layui-icon-close order-panel-close" id="closeOrderPanel"></i>
    </div>
    <div class="order-list" id="orderList">
      <!-- 医嘱列表将在这里动态生成 -->
    </div>
    <div class="order-actions">
      <div class="selected-count" id="selectedCount">已选择 0 项</div>
      <div class="order-buttons">
        <button class="btn btn-secondary" id="selectAllBtn">全选</button>
        <button class="btn btn-primary" id="confirmOrderBtn">确认添加</button>
      </div>
    </div>
  </div>

  <script src="../lib/layui-v2.6.3/layui.js" charset="utf-8"></script>
  <script src="../js/lay-config.js?v=1.0.4" charset="utf-8"></script>
  <script src="../lib/mobile-select/mobile-select.iife.js"></script>

  <script>
    layui.use(["appconfig", "form"], function () {
      const appconfig = layui.appconfig;
      const form = layui.form;
      const $ = layui.$;
      const orderTemplates = [];
      const userData = JSON.parse(localStorage.getItem("userData") || "{}");
      let currentType = "dept"; // 当前选择的模板类型
      let filteredTemplates = []; // 搜索过滤后的模板
      let searchKeyword = ""; // 当前搜索关键词
      let currentOrderDetails = []; // 当前模板的医嘱详情
      let selectedOrders = []; // 当前模板中已选择的医嘱索引
      let globalSelectedOrders = []; // 全局已选医嘱列表，存储完整医嘱对象及来源信息
      let lastPatternName = ""; // 最近一次打开的模板名称
      let panelMode = "all"; // 面板模式: all | selected

      // 选项缓存与辅助方法（参考 yizhu.html 逻辑，做轻量实现）
      const frequencyCache = {
        1: { loaded: false, list: [] },
        0: { loaded: false, list: [] },
      }; // 长期/临时分开缓存
      const supplyCache = { loaded: false, list: [] };
      const doseUnitCacheMap = {}; // key: serial|order_code -> [{unit_code, unit_name, unit_type}]

      function fetchFrequencyList(longOnceFlag = "1") {
        const flag = String(longOnceFlag);
        if (frequencyCache[flag] && frequencyCache[flag].loaded) {
          return Promise.resolve(frequencyCache[flag].list);
        }
        return new Promise((resolve) => {
          $.ajax({
            url: appconfig.api + "/api/MobileWard/GetYzFrequency",
            type: "GET",
            dataType: "json",
            data: { long_once_flag: flag },
            success: function (res) {
              const list =
                res && res.Status && Array.isArray(res.Data) ? res.Data : [];
              if (!frequencyCache[flag])
                frequencyCache[flag] = { loaded: false, list: [] };
              frequencyCache[flag].loaded = true;
              frequencyCache[flag].list = list;
              resolve(list);
            },
            error: function () {
              resolve([]);
            },
          });
        });
      }

      function fetchSupplyList() {
        if (supplyCache.loaded) return Promise.resolve(supplyCache.list);
        return new Promise((resolve) => {
          $.ajax({
            url: appconfig.api + "/api/MobileWard/GetYzSupplyList",
            type: "GET",
            dataType: "json",
            success: function (res) {
              const list =
                res && res.Status && Array.isArray(res.Data) ? res.Data : [];
              supplyCache.loaded = true;
              supplyCache.list = list;
              resolve(list);
            },
            error: function () {
              resolve([]);
            },
          });
        });
      }

      function fetchDoseUnitList(serial, order_code) {
        const key = (serial || "00") + "|" + (order_code || "");
        if (doseUnitCacheMap[key])
          return Promise.resolve(doseUnitCacheMap[key]);
        if (!order_code) return Promise.resolve([]);
        return new Promise((resolve) => {
          $.ajax({
            url: appconfig.api + "/api/MobileWard/GetYzDictList",
            type: "GET",
            dataType: "json",
            data: { serial: serial || "00", order_code: order_code },
            success: function (res) {
              const arr = [];
              const d =
                res && res.Status && res.Data && res.Data[0]
                  ? res.Data[0]
                  : null;
              if (d) {
                if (d.mini_unit && d.mini1_name)
                  arr.push({
                    unit_code: d.mini_unit,
                    unit_name: d.mini1_name,
                    unit_type: "mini",
                  });
                if (d.pack_unit && d.pack_name)
                  arr.push({
                    unit_code: d.pack_unit,
                    unit_name: d.pack_name,
                    unit_type: "pack",
                  });
                if (d.vol_unit && d.vol_name)
                  arr.push({
                    unit_code: d.vol_unit,
                    unit_name: d.vol_name,
                    unit_type: "vol",
                  });
                if (d.weight_unit && d.weight_name)
                  arr.push({
                    unit_code: d.weight_unit,
                    unit_name: d.weight_name,
                    unit_type: "weight",
                  });
              }
              doseUnitCacheMap[key] = arr;
              resolve(arr);
            },
            error: function () {
              resolve([]);
            },
          });
        });
      }

      function buildOptions(list, codeKey, nameKey, selectedCode) {
        let html = '<option value="">请选择</option>';
        (list || []).forEach(function (it) {
          const code = (it && it[codeKey]) || "";
          const name = (it && it[nameKey]) || code;
          const sel =
            String(code).trim().toUpperCase() ===
              String(selectedCode || "")
                .trim()
                .toUpperCase()
              ? " selected"
              : "";
          html +=
            '<option value="' +
            String(code).replace(/"/g, "&quot;") +
            '"' +
            sel +
            ">" +
            String(name).replace(/</g, "&lt;") +
            "</option>";
        });
        return html;
      }

      function findCodeByName(list, name, codeKey, nameKey) {
        if (!name) return "";
        const it = (list || []).find(function (x) {
          return String(x[nameKey] || "").trim() === String(name).trim();
        });
        return it ? it[codeKey] || "" : "";
      }

      // 渲染模板列表
      function renderTemplateList() {
        const templateListContainer = $("#template-list");

        if (currentType === "dept") {
          if (orderTemplates.length === 0) {
            templateListContainer.html(
              '<div class="loading">正在加载模板...</div>'
            );
            updateSearchStats(0, 0);
            return;
          }

          // 根据搜索关键词过滤模板
          const templatesToShow = searchKeyword
            ? filteredTemplates
            : orderTemplates;

          templateListContainer.empty();

          if (templatesToShow.length === 0 && searchKeyword) {
            templateListContainer.html(
              '<div class="empty-state">未找到匹配的模板<br>请尝试其他关键词</div>'
            );
          } else {
            // 显示科室模板
            templatesToShow.forEach((template, index) => {
              const originalIndex = searchKeyword
                ? orderTemplates.indexOf(template)
                : index;
              const templateCard = `
                  <div class="template-card" data-index="${originalIndex}">
                    <div class="template-title">${template.pattern_name || "模板" + (originalIndex + 1)
                }</div>
                    <div class="template-desc">
                      <strong>模板编码:</strong> ${template.pattern_code || "暂无"
                }<br>
                      ${template.description
                  ? "<strong>描述:</strong> " + template.description
                  : ""

                  ? "<br><strong>创建时间:</strong> " +
                  template.create_date
                  : ""
                }
                    </div>
                  </div>
                `;
              templateListContainer.append(templateCard);
            });
          }

          // 更新搜索统计
          updateSearchStats(templatesToShow.length, orderTemplates.length);
        } else {
          // 个人模板暂时为空
          templateListContainer.html(
            '<div class="empty-state">暂无个人模板<br>个人模板功能正在开发中...</div>'
          );
          updateSearchStats(0, 0);
        }

        // 绑定模板卡片点击事件
        $(".template-card").on("click", function () {
          const index = $(this).data("index");
          const selectedTemplate = orderTemplates[index];
          console.log("选择的模板:", selectedTemplate);

          // 添加视觉反馈
          $(".template-card").removeClass("selected");
          $(this).addClass("selected");

          // 获取模板详情
          if (selectedTemplate && selectedTemplate.pattern_code) {
            LoadYzPatternDetail(
              selectedTemplate.pattern_code,
              selectedTemplate.pattern_name
            );
          } else {
            layui.layer.msg("模板信息不完整，无法获取详情", {
              icon: 2,
              time: 3000,
            });
          }
        });
      }

      // 搜索模板
      function searchTemplates(keyword) {
        searchKeyword = keyword.toLowerCase().trim();

        if (!searchKeyword) {
          filteredTemplates = [];
          renderTemplateList();
          return;
        }

        filteredTemplates = orderTemplates.filter((template) => {
          const name = (template.pattern_name || "").toLowerCase();
          const code = (template.pattern_code || "").toLowerCase();
          const desc = (template.description || "").toLowerCase();

          return (
            name.includes(searchKeyword) ||
            code.includes(searchKeyword) ||
            desc.includes(searchKeyword)
          );
        });

        renderTemplateList();
      }

      // 更新搜索统计信息
      function updateSearchStats(showCount, totalCount) {
        const statsElement = $("#searchStats");
        if (searchKeyword && currentType === "dept") {
          statsElement.text(`找到 ${showCount} 个模板，共 ${totalCount} 个`);
        } else if (currentType === "dept" && totalCount > 0) {
          statsElement.text(`共 ${totalCount} 个模板`);
        } else {
          statsElement.text("");
        }
      }

      // 导航栏点击事件
      $(".nav-item").on("click", function () {

      // 搜索框事件绑定
      function initSearchEvents() {
        const searchInput = $("#searchInput");
        const clearButton = $("#clearSearch");
        const searchIcon = $("#searchIcon");

        // 搜索输入事件 - 实时搜索
        searchInput.on("input", function () {
          const keyword = $(this).val();

          // 显示/隐藏清空按钮
          if (keyword) {
            clearButton.show();
            searchIcon.hide();
          } else {
            clearButton.hide();
            searchIcon.show();
          }

          // 执行搜索
          searchTemplates(keyword);
        });

        // 清空搜索
        clearButton.on("click", function () {
          searchInput.val("");
          clearButton.hide();
          searchIcon.show();
          searchTemplates("");
        });

        // 搜索图标点击
        searchIcon.on("click", function () {
          searchInput.focus();
        });

        // 回车搜索
        searchInput.on("keypress", function (e) {
          if (e.which === 13) {
            searchTemplates($(this).val());
          }
        });
      }

      // 医嘱面板事件绑定
      function initOrderPanelEvents() {
        // 关闭面板
        $("#closeOrderPanel").on("click", function () {
          hideOrderPanel();
        });

        // 点击蒙版关闭面板
        $("#orderOverlay").on("click", function () {
          hideOrderPanel();
        });

        // 防止面板内容点击事件冒泡到蒙版
        $("#orderPanel").on("click", function (e) {
          e.stopPropagation();
        });

        // 医嘱复选框变化
        $(document).on("change", ".order-checkbox", function () {
          const index = parseInt($(this).data("index"));
          const isChecked = $(this).is(":checked");
          const currentOrder = currentOrderDetails[index];

          if (isChecked) {
            // 添加到当前选择
            if (!selectedOrders.includes(index)) {
              selectedOrders.push(index);
            }
            // 添加到全局选择（避免重复）
            const existsInGlobal = globalSelectedOrders.findIndex(
              (global) =>
                global.order_code === currentOrder.order_code &&
                global.pattern_name === lastPatternName
            );
            if (existsInGlobal === -1) {
              globalSelectedOrders.push({
                ...currentOrder,
                long_once_flag: "0", // 默认设置为临时医嘱
                pattern_name: lastPatternName,
                original_index: index,
              });
            }
          } else {
            // 从当前选择中移除
            const pos = selectedOrders.indexOf(index);
            if (pos !== -1) {
              selectedOrders.splice(pos, 1);
            }
            // 从全局选择中移除
            const globalIndex = globalSelectedOrders.findIndex(
              (global) =>
                global.order_code === currentOrder.order_code &&
                global.pattern_name === lastPatternName
            );
            if (globalIndex !== -1) {
              globalSelectedOrders.splice(globalIndex, 1);
            }
          }

          updateSelectedCount();
          if (panelMode === "selected") {
            showSelectedOrdersFullpage();
          }
        });

        // 全局已选医嘱 - 删除按钮
        $(document).on("click", ".global-delete-btn", function () {
          const globalIndex = parseInt($(this).data("global-index"));
          const orderName = globalSelectedOrders[globalIndex]
            ? globalSelectedOrders[globalIndex].order_name ||
            globalSelectedOrders[globalIndex].drug_name ||
            "医嘱"
            : "此医嘱";

          layui.layer.confirm(
            `确定删除 ${orderName} 吗？`,

            function (idx) {
              // 确认删除
              globalSelectedOrders.splice(globalIndex, 1);
              updateSelectedCount();
              showSelectedOrdersFullpage();
              layui.layer.close(idx);

                  </div>
                  <div class="layui-form-item">
                    <label class="layui-form-label">医嘱类型</label>
                    <div class="layui-input-block">
                      <input type="checkbox" name="long_once_flag" lay-skin="switch" lay-text="长|临" lay-filter="longOnceSwitch" ${order.long_once_flag === "0" ? "" : "checked"
              } value="1">
                    </div>
                  </div>
                  <div class="layui-form-item">
                    <label class="layui-form-label">剂量</label>
                    <div class="layui-input-block">
                      <input type="text" id="edit_order_doseage" name="doseage" class="layui-input" value="${order.doseage || ""
              }" placeholder="请输入剂量">
                    </div>
                  </div>
                  <div class="layui-form-item">
                    <label class="layui-form-label">单位</label>

                form.on("switch(longOnceSwitch)", function (data) {

                // 重新获取当前类型的频次列表以找到名称
                const currentFreqList =
                  frequencyCache[newLongOnceFlag].list || [];
                const frequItem = currentFreqList.find(
                  (x) =>
                    String(x.code || "").toUpperCase() ===
                    String(newFrequCode || "").toUpperCase()
                );
                const unitItem = (unitList || []).find(
                  (x) =>
                    String(x.unit_code || "").toUpperCase() ===
                    String(newDoseUnitCode || "").toUpperCase()
                );
                const supplyItem = (supplyList || []).find(
                  (x) =>
                    String(x.supply_code || "").toUpperCase() ===
                    String(newSupplyCode || "").toUpperCase()
                );

                order.doseage = newDose;
                order.charge_amount = newCharge;
                order.long_once_flag = newLongOnceFlag;
                order.frequ_code = newFrequCode || "";
                order.frequ_name =
                  (frequItem && (frequItem.name || frequItem.code)) || "";
                order.supply_code = newSupplyCode || "";
                order.supply_name =
                  (supplyItem &&
                    (supplyItem.supply_name || supplyItem.supply_code)) ||
                  "";
                order.doseage_unit = newDoseUnitCode || "";
                order.doseage_unit_name =
                  (unitItem && (unitItem.unit_name || unitItem.unit_code)) ||
                  "";

                globalSelectedOrders[globalIndex] = order;
                updateSelectedCount();
                showSelectedOrdersFullpage();
                layui.layer.close(index);
              },
            });
          });
        });

        // 全选/取消全选
        $("#selectAllBtn").on("click", function () {
          const totalCount = currentOrderDetails.length;
          const isSelectAll = selectedOrders.length !== totalCount;

          $(".order-checkbox").prop("checked", isSelectAll);

          if (isSelectAll) {
            // 全选：添加所有医嘱到当前和全局选择
            selectedOrders = [...Array(totalCount).keys()];
            currentOrderDetails.forEach((order, index) => {
              const existsInGlobal = globalSelectedOrders.findIndex(
                (global) =>
                  global.order_code === order.order_code &&
                  global.pattern_name === lastPatternName
              );
              if (existsInGlobal === -1) {
                globalSelectedOrders.push({
                  ...order,
                  long_once_flag: "0", // 默认设置为临时医嘱
                  pattern_name: lastPatternName,
                  original_index: index,
                });
              }
            });
          } else {
            // 取消全选：从当前和全局选择中移除当前模板的所有医嘱
            selectedOrders = [];
            globalSelectedOrders = globalSelectedOrders.filter(
              (global) => global.pattern_name !== lastPatternName
            );
          }

          updateSelectedCount();
        });

        // 确认添加医嘱
        $("#confirmOrderBtn").on("click", function () {
          if (globalSelectedOrders.length === 0) {
            layui.layer.msg("请至少选择一个医嘱", { icon: 2, time: 2000 });
            return;
          }

          console.log("确认添加的全局医嘱:", globalSelectedOrders);

          // 这里可以添加提交医嘱的逻辑
          layui.layer.msg(
            `已选择 ${globalSelectedOrders.length} 个医嘱，准备添加到患者医嘱中`,
            { icon: 1, time: 2000 }
          );

          // 隐藏面板
          hideOrderPanel();
        });

        // 查看已选：进入全屏模式
        $("#viewSelectedBtn").on("click", function () {
          if (globalSelectedOrders.length === 0) {
            layui.layer.msg("还没有勾选任何医嘱", { icon: 2, time: 2000 });
            return;
          }
          showSelectedOrdersFullpage();
        });

        // 关闭全屏页面
        $("#closeFullpage").on("click", function () {
          hideSelectedOrdersFullpage();
        });

        // 全屏页面确认添加
        $("#fullpageConfirmBtn").on("click", function () {
          if (globalSelectedOrders.length === 0) {
            layui.layer.msg("请至少选择一个医嘱", { icon: 2, time: 2000 });
            return;
          }

          console.log("确认添加的全局医嘱:", globalSelectedOrders);

          // 调用提交函数
          submitSelectedOrders();
        });
      }

      // 批量提交已选医嘱
      // 尝试刷新 yizhu 的简洁封装：会先尝试直接调用父/顶层/opener 函数，失败时使用 postMessage 回退
      function tryRefreshYizhu() {
        try {
          // 直接调用 parent.frames[0].refreshYizhu（你已确认该方法有效）
          if (
            parent &&
            parent.frames &&
            parent.frames[0] &&
            typeof parent.frames[0].refreshYizhu === "function"
          ) {
            parent.frames[0].refreshYizhu();
            console.log("调用 parent.frames[0].refreshYizhu 成功");
            return true;
          }
          // 回退：使用 postMessage 告知可接收方刷新
          var msg = { type: "refreshYizhuRequest" };
          try {
            if (parent && parent !== window && parent.postMessage)
              parent.postMessage(msg, "*");
          } catch (e) { }
          try {
            if (window.top && window.top !== window && window.top.postMessage)
              window.top.postMessage(msg, "*");
          } catch (e) { }
          try {
            if (window.opener && window.opener.postMessage)
              window.opener.postMessage(msg, "*");
          } catch (e) { }
          return false;
        } catch (e) {
          console.warn("tryRefreshYizhu 异常：", e);
          return false;
        }
      }
      function submitSelectedOrders() {
        if (!globalSelectedOrders || globalSelectedOrders.length === 0) {
          layui.layer.msg("没有可提交的医嘱", { icon: 2, time: 2000 });
          return;
        }

        // 获取当前用户、病人和科室信息
        const currentUser = JSON.parse(
          localStorage.getItem("loginUser") || "{}"
        );
        const patientData = JSON.parse(
          localStorage.getItem("userData") || "{}"
        );
        const wardData = JSON.parse(localStorage.getItem("wardData") || "{}");

        // 获取当前时间
        const now = new Date();
        const currentTime =
          now.getFullYear() +
          "-" +
          String(now.getMonth() + 1).padStart(2, "0") +
          "-" +
          String(now.getDate()).padStart(2, "0") +
          " " +
          String(now.getHours()).padStart(2, "0") +
          ":" +
          String(now.getMinutes()).padStart(2, "0") +
          ":" +
          String(now.getSeconds()).padStart(2, "0");

        const doctorCode =
          currentUser.user_id || currentUser.user_mi || "00000";

        // 将globalSelectedOrders转换为API所需的格式
        const todoList = globalSelectedOrders.map(function (order) {
          return {
            act_order_no: "", // 后端生成
            add_opera: doctorCode,
            admiss_times: patientData.admiss_times || "1",
            ca_id_doctor: doctorCode,
            charge_amount: order.charge_amount || "1",
            discription: order.instruction || order.drug_description || "",
            drug_occ: order.drug_occ || "",
            drug_specification:
              order.drug_specification || order.order_spec || "",
            end_time: "",
            end_time_2: "",
            enter_oper: doctorCode,
            enter_time: currentTime,
            exec_unit: userData.admiss_ward || "",
            exclusive_type: "1",
            fit_flag: "1",
            frequ_code: (
              order.frequency ||
              order.frequ_code ||
              "ONCE"
            ).trim(),
            group_no: order.group_no || "000000",
            instruction: order.instruction || order.drug_description || "",
            is_new: true,
            long_once_flag: order.long_once_flag || "0",
            modify_price: "",
            order_code: order.order_code || "",
            order_doctor: doctorCode,
            order_name: order.order_name || order.drug_name || "",
            order_time: currentTime,
            order_type: (order.long_once_flag || "0") === "1" ? "3" : "4",
            parent_no: "65965879",
            patient_id: patientData.patient_id || "00000",
            prev_flag: "",
            Serial: order.serial || "",
            self_buy: "0",
            skin_test_flag: "",
            spinfo_type: "1",
            start_time: currentTime,
            status_flag: "0",
            supply_code: order.supply_code || "",
            doseage: order.dosage || order.doseage || null,
            doseage_unit: order.doseage_unit || null,
            doseage_unit_name:
              order.doseage_unit_name || order.doseage_unit || null,
            frequ_code: order.frequency || order.frequ_code || "ONCE",
            ward_sn: userData.admiss_ward || "",
          };
        });

        console.log("准备提交的医嘱数据:", todoList);

        // 显示加载中
        const loadingMsg = "正在提交医嘱...";
        console.log(loadingMsg);

        // 发送AJAX请求
        $.ajax({
          url: appconfig.api + "/api/MobileWard/AddActYz",
          method: "POST",
          contentType: "application/json",
          data: JSON.stringify(todoList),
          dataType: "json",
          success: function (response) {
            console.log("提交响应:", response);
            if (response && response.Status) {
              layui.layer.msg("提交成功！", { icon: 1, time: 2000 });
              // 清空已选医嘱
              globalSelectedOrders = [];
              selectedOrders = [];
              updateSelectedCount();
              hideSelectedOrdersFullpage();
              // 简洁调用：尝试刷新 yizhu（内部实现包含直接调用与 postMessage 回退）
              tryRefreshYizhu();
              // 可以在这里添加刷新页面或跳转的逻辑
            } else {
              const errorMsg =
                response && response.Message ? response.Message : "提交失败";
              layui.layer.msg(errorMsg, { icon: 2, time: 3000 });
            }
          },
          error: function (xhr) {
            console.error("提交失败:", xhr);
            let errorMsg = "网络错误，提交失败";
            if (xhr.responseJSON && xhr.responseJSON.Message) {
              errorMsg = xhr.responseJSON.Message;
            }
            layui.layer.msg(errorMsg, { icon: 2, time: 3000 });
          },
        });
      }

      // 初始化页面
      loadYzPatternList();
      initSearchEvents();
      initOrderPanelEvents();

      // 返回按钮事件
      $("#backBtn").on("click", function () {
        // 返回到医嘱列表页面
        // window.history.back();
        parent.layer.closeAll();
      });
    });
  </script>
</body>

</html>
