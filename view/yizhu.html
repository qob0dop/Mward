<!DOCTYPE html>
<html lang="en">
  <head>

      name="viewport"

    <style>
.layui-layer-setwin
{
    display: none;
}
.layui-layer-msg
{
    line-height: 1.5 !important;  max-height: 100px; /* 限制最大高度 */  padding: 10px !important;
}
.font-grey
{
    color: #999;
}
.font-black
{
    color: #333;
}
.font-green
{
    color: #52c41a;
}
.font-red
{
    color: #e74c3c;
}
.font-purple
{
    color: rgb(255, 0, 255); /* 紫色字体 */
}
.order-type-long
{
    background-color: rgb(192, 220, 192); /* 浅绿色背景 */
}
.order-type-once
{
    background-color: rgb(238, 251, 250); /* 浅黄色背景 */
}

/* 父子医嘱样式 */
.parent-order-row
{
    font-weight: bold;  box-sizing: border-box;border-left: 4px solid #1890ff !important; /* 蓝色左边框 */  background-color: #e6f7ff !important; /* 浅蓝色背景 */
}

.child-order-row
{
    position: relative;

/* padding-left: 20px !important; 左边缩进 */

    box-sizing: border-box;border-left: 4px solid #52c41a !important; /* 绿色左边框 */  background-color: #f6ffed !important; /* 浅绿色背景 */
}

/* 为子医嘱添加连接线 */
/* .child-order-row::before
{
    font-weight: bold;  position: absolute;  left: 5px;  content: '├─';  color: #52c41a;
} */

/* 最后一个子医嘱的连接线样式 */
.child-order-row.last-child::before
{
    content: '└─';
}
/* .myorder {
        background-color: rgb(206, 227, 236);
      } */
/* 选中按钮高亮样式，兼容不同色系 */
.btn-active
{
    font-weight: bold !important;  position: relative;  z-index: 1;  border-width: 2.5px !important;  outline: none !important;  box-shadow: 0 2px 8px rgba(30, 185, 90, .18), 0 0 0 2px #b2f0c0 inset !important;
}
/* 针对绿色按钮（layui-btn-warm）选中时加深色 */
.layui-btn-warm.btn-active
{
    color: #fff !important;  border-color: #1eae5b !important;  background-color: #3ec97c !important;
}
/* 针对红色按钮（layui-btn-danger）选中时加深色 */
.layui-btn-danger.btn-active
{
    color: #fff !important;  border-color: #c0392b !important;  background-color: #e74c3c !important;
}
/* 针对蓝色按钮（layui-btn-primary/normal/cyan）选中时加深色 */
.layui-btn-primary.btn-active,
.layui-btn-normal.btn-active,
.layui-btn-cyan.btn-active
{
    color: #fff !important;  border-color: #1786d4 !important;  background-color: #1e9fff !important;
}
/* 兼容小屏幕按钮点击反馈 */
.btn-active:active
{
    box-shadow: 0 1px 4px rgba(30, 185, 90, .12) !important;
}

/* 按钮悬停效果 */
.layui-btn:not(.btn-active):hover
{
    transition: all .2s ease;  transform: translateY(-1px);  box-shadow: 0 2px 4px rgba(0, 0, 0, .2);
}

/* select框样式优化 */
.layui-form-select
{
    width: auto !important;  height: auto !important;
}

.layui-form-select .layui-select-title
{
    font-size: 14px !important;  line-height: 38px !important;  position: relative;  width: auto !important;  height: 38px !important;  color: #333 !important;  border-radius: 2px !important;
}

.layui-form-select .layui-select-title input
{
    font-size: 14px !important;  line-height: 36px !important;  width: 100px;  height: 36px !important;  padding-right: 30px !important;  padding-left: 7px;  color: #333 !important;
}

.layui-form-select dl
{
    font-size: 14px !important;  max-height: 200px;
}

/* 兼容不同浏览器的select样式 */
.layui-form-select .layui-select-title
{
    overflow: hidden !important;  box-sizing: border-box !important;
}

/* 修复Edge浏览器箭头错位问题 */
@supports (-ms-ime-align: auto)
{
    .layui-form-select .layui-select-title i
    {
        top: 12px !important;  right: 8px !important;  transform: none !important;
    }
}

/* 修复Edge Legacy浏览器兼容性 */
@media screen and (-ms-high-contrast: active), (-ms-high-contrast: none)
{
    .layui-form-select .layui-select-title i
    {
        top: 12px !important;  right: 8px !important;  transform: none !important;
    }
}

.layui-form-select dl dd
{
    line-height: 36px !important;  color: #333 !important;
}

/* 新增医嘱弹窗样式 */
#add-order-modal
{
    width: 100%;  height: 100%;
}

/* 弹窗两列布局容器样式（疗程 + 小医嘱卡片） */
.order-form-container
{
    display: flex;  flex-direction: column;  width: 100%;  height: 100%;
}

.order-selector
{
    display: flex;  overflow: hidden;  height: 80vh;  min-height: 420px;  border-radius: 4px;  box-shadow: 0 2px 8px rgba(0, 0, 0, .1);
}

/* 两列布局通用样式 */
.order-left,
.order-right
{
    display: flex;  flex-direction: column;  border-right: 1px solid #e6e6e6;
}
.order-left
{
    flex: 0 0 240px;  background: #fafafa;
}

.order-right
{
    flex: 1;  border-right: none;  background: #fff;
}
.layui-container .layui-table-body
{
    overflow-x: hidden;
}
/* 区域标题样式 */
.section-header
{
    font-size: 14px;  font-weight: bold;  display: flex;  align-items: center;  justify-content: center;  padding: 12px 16px;  text-align: center;  color: #fff;  background: #1e9fff;  gap: 6px;
}

.section-header i
{
    font-size: 16px;
}

/* 分类列表样式 */
.category-list
{
    overflow-y: auto;  flex: 1;  padding: 8px 0;
}

.category-item
{
    font-size: 13px;  line-height: 1.4;  padding: 12px 16px;  cursor: pointer;  transition: all .2s ease;  border-bottom: 1px solid #e6e6e6;
}

.category-item:hover
{
    background-color: #e1f3ff;
}

.category-item.selected
{
    /* color: #fff; */
    font-weight: bold;  background-color: lightgray;
}

.category-item .category-name
{
    font-weight: bold;  margin-bottom: 4px;
}

.category-item .category-desc
{
    font-size: 12px;  color: #999;
}

/* 无选择状态样式 */
.no-data,
.no-selection
{
    font-size: 13px;  padding: 40px 20px;  text-align: center;  color: #999;
}
/* 按钮区域样式 */
.dialog-buttons
{
    padding: 10px;  text-align: center;  border-top: 1px solid #e6e6e6;  background: #fafafa;
}

.dialog-buttons .layui-btn
{
    margin: 0 8px;
}

/* 滚动条美化 */
.category-list::-webkit-scrollbar,
.template-list::-webkit-scrollbar,
.form-content::-webkit-scrollbar
{
    width: 6px;
}

.category-list::-webkit-scrollbar-track,
.template-list::-webkit-scrollbar-track,
.form-content::-webkit-scrollbar-track
{
    border-radius: 3px;  background: #f1f1f1;
}

.category-list::-webkit-scrollbar-thumb,
.template-list::-webkit-scrollbar-thumb,
.form-content::-webkit-scrollbar-thumb
{
    border-radius: 3px;  background: #c1c1c1;
}

.category-list::-webkit-scrollbar-thumb:hover,
.template-list::-webkit-scrollbar-thumb:hover,
.form-content::-webkit-scrollbar-thumb:hover
{
    background: #a8a8a8;
}

/* 响应式优化：上下分布 */

/* 小医嘱卡片样式 */
.suborder-cards-container
{
    /* max-height: 420px; */
    overflow-y: auto;  padding: 12px;
}

.suborder-card
{
    position: relative;  margin-bottom: 12px;  padding: 16px;  transition: all .2s ease;  border: 1px solid #e6e6e6;  border-radius: 8px;  background: #fff;  box-shadow: 0 2px 4px rgba(0, 0, 0, .05);
}

.suborder-card:hover
{
    transform: translateY(-1px);  border-color: #1e9fff;  box-shadow: 0 4px 12px rgba(30, 159, 255, .15);
}

.suborder-card.selected
{
    border-color: #1e9fff;  background: #f8fcff;  box-shadow: 0 4px 12px rgba(30, 159, 255, .2);
}

.suborder-card-header
{
    display: flex;  align-items: center;  justify-content: space-between;  margin-bottom: 12px;
}

.suborder-checkbox
{
    margin-right: 12px;
}

.suborder-name
{
    font-size: 14px;  font-weight: bold;  flex: 1;  cursor: pointer;  color: #333;
}

.suborder-type
{
    font-size: 12px;  margin-left: 8px;  padding: 2px 8px;  color: white;  border-radius: 12px;  background: #1e9fff;
}

.suborder-body
{
    display: grid;  margin-bottom: 12px;  grid-template-columns: 1fr 1fr;  gap: 8px 16px;
}

.suborder-field
{
    font-size: 13px;  display: flex;  align-items: center;
}

.suborder-field-label
{
    font-weight: 500;  min-width: 40px;  margin-right: 8px;  color: #666;
}

.suborder-field-value
{
    flex: 1;  word-break: break-all;  color: #333;
}

.suborder-field-value.editable
{
    padding: 2px 6px;  cursor: text;  transition: all .2s ease;  border: 1px solid transparent;  border-radius: 3px;  background: #f9f9f9;
}

.suborder-field-value.editable:hover
{
    border-color: #d9d9d9;  background: #fff;
}

.suborder-field-value.editable:focus
{
    border-color: #1e9fff;  outline: none;  box-shadow: 0 0 0 2px rgba(30, 159, 255, .1);
}

.suborder-instruction
{
    margin-top: 8px;  grid-column: 1 / -1;
}

.suborder-instruction .suborder-field-value
{
    min-height: 20px;  padding: 8px;  word-break: break-word;  border-radius: 4px;  background: #f5f5f5;
}

/* 草稿卡片不完整状态样式 */
.draft-card.incomplete
{
    border-color: #ff5722 !important;  background: #fff3f0 !important;  box-shadow: 0 2px 8px rgba(255, 87, 34, .15) !important;
}

.draft-card.incomplete .title
{
    color: #ff5722;
}

.draft-card.incomplete .title::after
{
    font-weight: bold;  margin-left: 8px;  content: ' ⚠️';  color: #ff5722;
}
@media (max-width: 768px)
{
    .layui-table-page
    {
        visibility: hidden;
    }
    .order-selector
    {
        flex-direction: column;  height: 100%;
    }
    .order-left
    {
        height: 40%;
    }
    .order-right
    {
        width: 100%;  height: 60%;  margin-top: 8px;  border: none;
    }
    /* .layui-table-box {
          transform: scale(0.5);
          transform-origin: top left;
          width: 200%;
        } */
    .layui-container .layui-table-view
    {
        display: block;
    }
    /* 调整"类"列宽度为20px - 使用多种选择器确保生效 */
    .layui-table-view th[data-field='long_once_flag'],
    .layui-table-view td[data-field='long_once_flag']
    {
        width: 20px !important;  min-width: 20px !important;  max-width: 20px !important;
    }
    .layui-table-view th[data-field='start_time_mm_dd'],
    .layui-table-view td[data-field='start_time_mm_dd'],
    .layui-table-view th[data-field='enter_time_mm_dd'],
    .layui-table-view td[data-field='enter_time_mm_dd'],
    .layui-table-view th[data-field='end_time_mm_dd'],
    .layui-table-view td[data-field='end_time_mm_dd']
    {
        width: 40px !important;  min-width: 40px !important;  max-width: 40px !important;
    }
    .layui-table-view th[data-field='order_doctor_name'],
    .layui-table-view td[data-field='order_doctor_name']
    {
        width: 60px !important;  min-width: 60px !important;  max-width: 60px !important;
    }
}

/* 医生单元格背景色样式 */
.doctor-cell-primary
{
    /* background-color: LightGray !important; */
    /* color: #1e9fff !important; */
    font-weight: bold;
}
.doctor-cell-nurse
{
    background-color: #f6ffed !important;

}
.doctor-cell-special

    background-color: #fff1f0 !important;

}

#layui-layer2
{
    height: 100%;
}
.layui-row
{
    height: auto;  min-height: auto;
}
.layui-table td,
.layui-table th
{
      padding: 5px 8px;      padding: 8px; /* 单元格内边距 */  border: 1px solid skyblue; /* 单元格边框 */
}
.layui-table thead tr
{
    height: 30px; /* 设置行高为30px */  border-left: 4px solid #fff !important;
}

/* 搜索框样式 */
#yizhu-search-input
{
    padding-left: 0;  transition: all .3s ease;
}

#yizhu-search-input:focus
{
    border-color: #1e9fff;  box-shadow: 0 0 5px rgba(30, 159, 255, .3);
}

#clear-search-btn
{
    cursor: pointer;  transition: all .3s ease;  color: #999;  border: none;  background-color: transparent;
}

#clear-search-btn:hover
{
    color: #1e9fff;  background-color: rgba(30, 159, 255, .1);
}

/* 表格缩放优化样式 */
.layui-table-box
{
    opacity: 0;  /* 初始状态隐藏，避免加载时闪烁 */
    transition: opacity 0.3s ease;
}

.layui-table-box.table-ready
{
    opacity: 1;  /* 准备完成后显示 */
}

.layui-icon-add-circle-fine
{
    font-size: 30px;
}
#search-icon
{
    line-height: 38px;  height: 38px;  padding: 0 5px;  cursor: pointer;  cursor: pointer;  text-align: center;  border-right: 0;  border-radius: 15px 0 0 15px;  background-color: #fff;
}
.role-label
{
    font-size: 14px;  font-weight: bold;  line-height: 36px;  height: 36px;  white-space: nowrap;  text-overflow: ellipsis;  color: #666;
}
.filter-condition
{
    font-size: 16px;  display: flex; justify-content: center; width: 100%;  height: 30px;
}
.filter-condition span
{
  margin-right: 15px;
    line-height: 30px;
}
.filter-condition label
{
    line-height: 30px;  height: 30px;  padding: 0 5px;  color: #333;  border-radius: 5px;  background-color: #f0f0f0;
}
.filter-condition .layui-icon
{
    display: none;
}
.filter-condition .layui-form-radio *
{
    font-size: 14px;
}
.filter-condition .layui-form-radio:hover *{
  color: rgb(36, 67, 119);
}
.filter-condition .layui-form-radio
{
  border: 1px solid gray;
    line-height: 30px;  height: 30px;  margin: 0 10px;  padding: 0 5px; border-radius: 10px; background-color: #fff;
}
.filter-condition .layui-form-radioed ,.layui-form-radioed>i
{
    background-color:rgb(189, 203, 248);
    color: rgb(36, 67, 119);
}

  <body>
    <div class="layui-container" style="display: flex; flex-direction: column">
      <!-- 操作栏 -->
      <form class="layui-form">
        <div
          class="layui-btn-container filter-buttons"
          id="order-btn-container"
          style="
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            height: 40px;
            overflow: hidden;
            transition: height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
          "
        >
          <div style="display: flex; gap: 8px; align-items: center">
            <!-- 新增医嘱按钮 -->
            <div>
              <i
                class="layui-icon layui-icon-add-circle-fine"
                id="btn-add-order"
                style="font-size: 30px; cursor: pointer"
              ></i>
            </div>
            <div style="position: relative; display: flex; align-items: center">
              <div
                class="layui-input-split layui-input-suffix layui-input"
                id="search-icon"

                <i

                  style="font-size: 20px"

              </div>
              <input

                type="text"
                placeholder="医嘱名称/医生姓名/备注"
                class="layui-input"
                style="
                  width: 160px;
                  font-size: 13px;
                  border-left: 0px;
                  border-radius: 0 15px 15px 0;
                "
              />
              <button
                type="button"
                id="clear-search-btn"
                class="layui-btn layui-btn-xs"
                style="
                  width: 20px;
                  position: absolute;
                  right: 10px;
                  display: none;
                "
                title="清空搜索"

                ✕
              </button>
            </div>
          </div>

          <div id="btn-filter-container" style="border-radius: 5px">
            <i
              class="layui-icon layui-icon-slider"
              id="btn-filter-order"
              style="font-size: 25px; cursor: pointer"
            ></i>
          </div>

              gap: 8px;
              align-items: center;

                <input type="radio" id="order-type3" name="order-type" value="3" title="长期" lay-filter="order-type">
              </div>
            </div>
            <div class="filter-condition">
              <span>数据来源:</span>
              <!-- <label for="data-source1">全部</label>
              <label for="data-source2">医生</label>
              <label for="data-source3">护士</label> -->
              <div>
                <input type="radio" id="data-source1" name="data-source" value="1" title="全部" lay-filter="data-source">
                <input type="radio" id="data-source2" name="data-source" value="2" title="医生" checked lay-filter="data-source">
                <input type="radio" id="data-source3" name="data-source" value="3" title="护士" lay-filter="data-source">
              </div>
            </div>
            <!-- <span class="role-label">类型:</span>
            <select
            
              id="order-type-select"
              lay-filter="order-type-select"
              class="layui-select"
              style="font-size: 13px; width: 80px;"
            >
              <option value="long">长期医嘱</option>
              <option value="temp" selected>临时医嘱</option>
              <option value="all">全部医嘱</option>
            </select>
            <span class="role-label">开嘱人:</span>
            <select
              id="role-type-select"
              lay-filter="role-type-select"
              class="layui-select"
              style="font-size: 13px; width: 120px;"
            >
              <option value="doctor" selected>医生</option>
              <option value="nurse">护士</option>
              <option value="mine">我的医嘱</option>
              <option value="all-role">全部</option>
            </select> -->
          </div>

          <!-- 搜索框 -->
        </div>
      </form>
      <!-- 医嘱表格容器 -->
      <div class="table-container">
        <table
          class="layui-hide"
          id="yizhu-table"
          lay-filter="yizhu-table"
        ></table>
      </div>
    </div>

    <!-- 新增医嘱弹窗（两部分：疗程分类 + 小医嘱卡片） -->
    <div id="add-order-modal" style="display: none">
      <div class="order-form-container">
        <div class="order-selector">
          <!-- 左侧：一级分类（疗程） -->
          <div class="order-left">
            <div class="section-header">
              <i class="layui-icon layui-icon-template-1"></i>
              模板列表
            </div>
            <input
              type="search"
              id="template-search"
              placeholder="搜索模板..."
              class="layui-input"
            />
            <div class="category-list" id="category-list">
              <div class="no-data">正在加载分类...</div>
            </div>
          </div>
          <!-- 右侧：小医嘱卡片 -->
          <div class="order-right">
            <div class="section-header">
              <i class="layui-icon layui-icon-template-1"></i>
              医嘱卡片
            </div>
            <div
              class="suborders-panel"
              id="suborders-panel"
              style="flex: 1; overflow: auto; padding: 12px"
            >
              <div class="no-selection">
                请选择左侧一级分类（疗程），默认全选所含小医嘱
              </div>
            </div>
          </div>
        </div>

        <div class="dialog-buttons">
          <button
            type="button"
            id="btn-submit-suborders"
            class="layui-btn layui-btn-normal"
          >
            <i class="layui-icon layui-icon-ok"></i> 确认提交
          </button>
          <button
            type="button"
            class="layui-btn layui-btn-primary"
            id="cancel-add-order"
          >
            <i class="layui-icon layui-icon-close"></i> 取消
          </button>

      //js动态计算表格缩放比例
      const tempAppconfig = "http://10.102.38.101:5251/";
      let scaleTimeout = null;
      function scaleTableForMobile() {
        const layuiTableBox = document.querySelector(".layui-table-box");
        if (!layuiTableBox) {
          console.log("未找到 .layui-table-box 元素");
          return;
        }
        
        // 清除之前的延时器，防抖处理
        if (scaleTimeout) {
          clearTimeout(scaleTimeout);
        }
        
        const tableContainer = document.querySelector(".table-container");
        
        // 先移除ready类，隐藏表格
        layuiTableBox.classList.remove('table-ready');
        
        // 延时处理，避免频繁调用
        scaleTimeout = setTimeout(() => {
          // 使用 requestAnimationFrame 确保隐藏效果生效后再进行缩放计算
          requestAnimationFrame(() => {
            // 获取表格内容的真实宽度（而不是容器宽度）
            const layuiTable = layuiTableBox.querySelector(".layui-table");
            const tableHeader = layuiTableBox.querySelector(
              ".layui-table-header table"
            );
            const tableBody = layuiTableBox.querySelector(
              ".layui-table-body table"
            );
            // 优先使用表头的宽度，如果没有则使用表体宽度
            let tableRealWidth = 0;
            if (tableHeader) {
              tableRealWidth = tableHeader.offsetWidth;
            } else if (tableBody) {
              tableRealWidth = tableBody.offsetWidth;
            } else if (layuiTable) {
              tableRealWidth = layuiTable.scrollWidth; // 使用scrollWidth获取真实内容宽度
            } else {
              tableRealWidth = layuiTableBox.scrollWidth;
            }

            const windowWidth = window.innerWidth; // 手机屏幕或浏览器窗口的宽度
            const containerWidth = tableContainer.offsetWidth;

            if (tableRealWidth != containerWidth) {
              const scale = containerWidth / tableRealWidth;
              layuiTableBox.style.transform = `scale(${scale})`;
              layuiTableBox.style.transformOrigin = "top left";
              layuiTableBox.style.width = `${100 / scale}%`;
              layuiTableBox.style.height = `${100 / scale}%`;
            } else {
              layuiTableBox.style.transform = `scale(1)`;
              layuiTableBox.style.transformOrigin = "top left";
              layuiTableBox.style.width = `100%`;
            }
            
            // 缩放完成后，添加ready类显示表格
            requestAnimationFrame(() => {
              layuiTableBox.classList.add('table-ready');
            });
          });
        }, 50); // 50ms防抖延时
      }

        // 父子医嘱排序函数
        function sortYizhuDataWithParentChild(data) {
          if (!data || data.length === 0) return data;
          
          console.log("排序前医嘱数量:", data.length);
          
          // 首先创建父子医嘱映射
          const childrenMap = new Map();
          const processedIds = new Set();
          
          // 收集所有有parent_no的医嘱（子医嘱）
          data.forEach(order => {
            if (order.parent_no && order.parent_no.trim()) {
              const parentKey = order.parent_no.trim();
              if (!childrenMap.has(parentKey)) {
                childrenMap.set(parentKey, []);
              }
              childrenMap.get(parentKey).push(order);
            }
          });
          
          // 创建医嘱组（每个组要么是单个普通医嘱，要么是父医嘱+子医嘱的组合）
          const orderGroups = [];
          
          data.forEach(order => {
            const orderId = order.act_order_no || order.order_no;
            
            // 如果已经处理过这个医嘱，跳过
            if (processedIds.has(orderId)) {
              return;
            }
            
            // 如果这个医嘱是子医嘱，跳过（会在处理父医嘱时一起处理）
            if (order.parent_no && order.parent_no.trim()) {
              return;
            }
            
            // 检查这个医嘱是否是父医嘱
            const children = childrenMap.get(orderId) || [];
            
            if (children.length > 0) {
              // 这是父医嘱，创建一个父子医嘱组
              const group = {
                sortTime: new Date(order.enter_time),
                isParentGroup: true,
                orders: [
                  {...order, _isParent: true},
                  ...children.map((child, index) => ({
                    ...child, 
                    _isChild: true,
                    _isLastChild: index === children.length - 1
                  }))
                ]
              };
              
              orderGroups.push(group);
              processedIds.add(orderId);
              
              // 标记所有子医嘱为已处理
              children.forEach(child => {
                const childId = child.act_order_no || child.order_no;
                processedIds.add(childId);
              });
            } else {
              // 这是普通医嘱，创建单个医嘱组
              const group = {
                sortTime: new Date(order.enter_time),
                isParentGroup: false,
                orders: [{...order, _isNormal: true}]
              };
              
              orderGroups.push(group);
              processedIds.add(orderId);
            }
          });
          
          // 处理可能遗漏的孤儿子医嘱
          data.forEach(order => {
            const orderId = order.act_order_no || order.order_no;
            
            if (!processedIds.has(orderId) && order.parent_no && order.parent_no.trim()) {
              console.warn("发现孤儿子医嘱:", order.order_name, "parent_no:", order.parent_no);
              const group = {
                sortTime: new Date(order.enter_time),
                isParentGroup: false,
                orders: [{...order, _isOrphan: true}]
              };
              orderGroups.push(group);
              processedIds.add(orderId);
            }
          });
          
          // 按日期对所有医嘱组进行排序
          orderGroups.sort((a, b) => a.sortTime - b.sortTime);
          
          // 将所有组的医嘱合并成最终结果
          const result = [];
          orderGroups.forEach(group => {
            result.push(...group.orders);
          });
          
          console.log("排序后医嘱数量:", result.length);
          console.log("医嘱组数量:", orderGroups.length);
          console.log("父医嘱组数量:", orderGroups.filter(g => g.isParentGroup).length);
          console.log("父医嘱数量:", result.filter(r => r._isParent).length);
          console.log("子医嘱数量:", result.filter(r => r._isChild).length);
          console.log("普通医嘱数量:", result.filter(r => r._isNormal).length);
          console.log("孤儿医嘱数量:", result.filter(r => r._isOrphan).length);
          
          return result;
        }

        // 停止医嘱功能
        function stopMedicalOrder(orderData) {
          // 获取当前用户信息
          var currentUser = JSON.parse(
            localStorage.getItem("loginUser") || "{}"
          );
          var doctorName =
            currentUser.name || currentUser.user_name || "系统用户";
          var doctorCode = currentUser.user_mi || "00000";
          // 获取当前时间
          var now = new Date();
          var stopTime =
            String(now.getMonth() + 1).padStart(2, "0") +
            "/" +
            String(now.getDate()).padStart(2, "0") +
            "/" +
            now.getFullYear() +
            " " +
            String(now.getHours()).padStart(2, "0") +
            ":" +
            String(now.getMinutes()).padStart(2, "0") +
            ":" +
            String(now.getSeconds()).padStart(2, "0");

          // 确认对话框
          layer.confirm(
            "确定要停止此医嘱吗？<br>" +
              '<span style="color: #666; font-size: 12px;">医嘱内容：' +
              (orderData.order_name || "未知") +
              "</span>",
            {
              icon: 3,
              title: "停止医嘱确认",
              btn: ["确定停止", "取消"],
              area: ["400px", "200px"], // 设置对话框大小：宽度400px，高度200px
            },
            function (index) {
              // 构建API参数
              var apiParams = {
                patient_id: patient_id || orderData.patient_id,
                admiss_times: admiss_times || orderData.admiss_times,
                act_order_no: orderData.act_order_no || orderData.order_no,
                stop_doctor: doctorCode,
                stop_time: stopTime,
              };

              // 验证必要参数
              if (
                !apiParams.patient_id ||
                !apiParams.admiss_times ||
                !apiParams.act_order_no
              ) {
                layer.msg(
                  "缺少必要参数，无法停止医嘱<br>请检查患者ID、住院次数和医嘱编号",
                  {
                    icon: 2,
                    time: 3000,
                  }
                );
                console.error("参数验证失败:", apiParams);
                return;
              }

              // 显示加载提示
              var loadingIndex = layer.load(1, { shade: [0.3, "#000"] });

              // 调用停止医嘱API
              $.ajax({
                url: appconfig.api + "/api/MobileWard/StopActYz",
                method: "GET",
                data: apiParams,
                dataType: "json",
                success: function (response) {
                  layer.close(loadingIndex);

                  if (response && response.Status) {
                    layer.msg("医嘱停止成功", { icon: 1 });

                    // 刷新表格数据
                    loadYizhuData(function () {
                      applyFilters(); // 重新应用当前筛选条件
                    });
                  } else {
                    var errorMsg =
                      response && response.Message
                        ? response.Message
                        : "停止医嘱失败";
                    layer.msg(errorMsg, { icon: 2, time: 4000 });
                    console.error("API响应错误:", response);
                  }

                  layer.close(index);
                },
                error: function (xhr, status, error) {
                  layer.close(loadingIndex);
                  layer.close(index);

                  var errorMsg = "网络错误，停止医嘱失败";

                  // 详细的错误处理
                  if (xhr.responseJSON && xhr.responseJSON.Message) {
                    errorMsg = xhr.responseJSON.Message;

                    // 特殊处理SQL文件缺失错误
                    if (
                      errorMsg.indexOf("Could not find file") !== -1 &&
                      errorMsg.indexOf("yz_stop_order.sql") !== -1
                    ) {
                      errorMsg =
                        "服务器配置错误：缺少停止医嘱的SQL文件\n请联系系统管理员检查服务器配置";
                    }
                  } else if (xhr.status === 401) {
                    errorMsg = "权限不足，请重新登录";
                  } else if (xhr.status === 500) {
                    errorMsg = "服务器内部错误";
                  } else if (xhr.status === 404) {
                    errorMsg = "API接口不存在，请检查服务器配置";
                  }

                  layer.msg(errorMsg, { icon: 2, time: 5000 });
                  console.error("AJAX错误详情:", {
                    status: xhr.status,
                    statusText: xhr.statusText,
                    responseText: xhr.responseText,
                    error: error,
                  });
                },
              });
            }
          );
        }

        // 加载剂量单位数据
        function loadDoseageUnitData(templateData, callback) {
          // 从模板数据中获取 serial 和 order_code
          doseageUnitData = [];

          var serial = templateData.Serial || templateData.serial || "00";
          var order_code = templateData.order_code;

          if (!order_code) {
            console.warn("缺少 order_code，无法加载剂量单位数据");
            if (typeof callback === "function") callback();
            return;
          }

          $.ajax({
            url: tempAppconfig + "api/MobileWard/GetYzDictList",
            method: "GET",
            dataType: "json",
            data: {
              serial: serial,
              order_code: order_code,
            },
            success: function (res) {
              if (res && res.Status && res.Data) {
                // 解析返回的数据，提取四种单位类型
                var unitOptions = [];
                var data = res.Data[0];
                if (!data) {
                  updateDoseageUnitOptions();
                  return;
                }
                // 检查并添加各种单位类型
                if (data.mini_unit && data.mini1_name) {
                  unitOptions.push({
                    unit_code: data.mini_unit,
                    unit_name: data.mini1_name,

                    unit_type: "mini",
                  });
                }

                if (data.pack_unit && data.pack_name) {
                  unitOptions.push({
                    unit_code: data.pack_unit,
                    unit_name: data.pack_name,
                    unit_type: "pack",
                  });
                }

                if (data.vol_unit && data.vol_name) {
                  unitOptions.push({
                    unit_code: data.vol_unit,
                    unit_name: data.vol_name,
                    unit_type: "vol",
                  });
                }

                if (data.weight_unit && data.weight_name) {
                  unitOptions.push({
                    unit_code: data.weight_unit,
                    unit_name: data.weight_name,
                    unit_type: "weight",
                  });
                }

                doseageUnitData = unitOptions;
                // 更新剂量单位选择框选项
                updateDoseageUnitOptions();
              } else {
                console.warn("剂量单位数据格式异常:", res);
                doseageUnitData = [];
                updateDoseageUnitOptions();
              }
              if (typeof callback === "function") callback();
            },
            error: function (xhr, status, error) {
              console.error("加载剂量单位数据失败:", error);
              // 提供一些默认剂量单位作为备用
              doseageUnitData = [
                {
                  unit_code: "mg",
                  unit_name: "毫克(mg)",
                  unit_type: "default",
                },
                { unit_code: "g", unit_name: "克(g)", unit_type: "default" },
                {
                  unit_code: "ml",
                  unit_name: "毫升(ml)",
                  unit_type: "default",
                },
                { unit_code: "片", unit_name: "片", unit_type: "default" },
                { unit_code: "粒", unit_name: "粒", unit_type: "default" },
                { unit_code: "支", unit_name: "支", unit_type: "default" },
              ];
              updateDoseageUnitOptions();
              if (typeof callback === "function") callback();
            },
          });
        }

        // 剂量单位名称缓存与获取（按 serial|order_code 聚合）
        var doseUnitMapCache = {};
        function getDoseUnitMapWithCache(serial, order_code, cb) {
          var key = (serial || "") + "|" + (order_code || "");
          if (doseUnitMapCache[key]) {
            cb && cb(doseUnitMapCache[key]);
            return;
          }
          if (!order_code) {
            cb && cb({});
            return;
          }
          $.ajax({
            url: tempAppconfig + "api/MobileWard/GetYzDictList",
            method: "GET",
            dataType: "json",
            data: { serial: serial || "00", order_code: order_code },
            success: function (res) {
              var map = {};
              if (res && res.Status && res.Data && res.Data[0]) {
                var d = res.Data[0];
                if (d.mini_unit && d.mini1_name)
                  map[d.mini_unit] = d.mini1_name;
                if (d.pack_unit && d.pack_name) map[d.pack_unit] = d.pack_name;
                if (d.vol_unit && d.vol_name) map[d.vol_unit] = d.vol_name;
                if (d.weight_unit && d.weight_name)
                  map[d.weight_unit] = d.weight_name;
              }
              doseUnitMapCache[key] = map;
              cb && cb(map);
            },
            error: function () {
              cb && cb({});
            },
          });
        }

        function debounce(fn, wait) {
          var t;
          return function () {
            var args = arguments,
              ctx = this;
            clearTimeout(t);
            t = setTimeout(function () {
              fn.apply(ctx, args);
            }, wait);
          };
        }
        function filterOrderTemplates(query) {
          if (!query) return orderTemplates.slice(); // 返回所有
          var q = query.trim().toLowerCase();
          return orderTemplates.filter(function (item) {
            if (!item) return false;
            var name = (item.pattern_name || "").toLowerCase();
            var py = (item.py_code || "").toLowerCase();
            var d = (item.d_code || "").toLowerCase();
            return (
              name.indexOf(q) !== -1 ||
              py.indexOf(q) !== -1 ||
              d.indexOf(q) !== -1
            );
          });
        }

                return {

                  selected: true, // 默认选中

                  drug_specification: item.drug_specification || "",
                  doseage: item.doseage || "",
                  doseage_unit: item.doseage_unit || "",
                  doseage_unit_name: item.doseage_unit || "",
                  charge_amount: item.charge_amount || "1",
                  frequ_code: item.frequ_code || "",
                  frequ_name: frequencyCodeToName(item.frequ_code || ""),
                  supply_code: item.supply_code || "",
                  supply_name: supplyCodeToName(item.supply_code || ""),
                  instruction: item.instruction || "",
                  long_once_flag: item.order_type === "3" ? "1" : "0",
                  serial: serial,
                  order_code: order_code,
                };
              });

              // 异步补齐单位名称
              (function populateDoseUnitNames() {
                var keyToIndexes = {};
                cardData.forEach(function (item, idx) {
                  var key = (item.serial || "") + "|" + (item.order_code || "");
                  if (!keyToIndexes[key]) keyToIndexes[key] = [];
                  keyToIndexes[key].push(idx);
                });
                var keys = Object.keys(keyToIndexes);
                var pending = keys.length;
                if (pending === 0) {
                  renderCards(); // 直接渲染
                  return;
                }
                keys.forEach(function (key) {
                  var parts = key.split("|");
                  var serial = parts[0];
                  var order_code = parts[1];
                  getDoseUnitMapWithCache(serial, order_code, function (map) {
                    (keyToIndexes[key] || []).forEach(function (i) {
                      var code = cardData[i].doseage_unit;
                      cardData[i].doseage_unit_name = map[code] || code || "";
                    });
                    pending--;
                    if (pending === 0) {
                      renderCards(); // 全部映射完成后渲染
                    }
                  });
                });
              })();

              // 绑定卡片事件
              function bindCardEvents() {
                // 复选框改变事件
                $(document)
                  .off("change", ".suborder-checkbox input")
                  .on("change", ".suborder-checkbox input", function () {
                    var index = $(this).data("index");
                    var checked = $(this).prop("checked");
                    cardData[index].selected = checked;

                    var $card = $(this).closest(".suborder-card");
                    if (checked) {
                      $card.addClass("selected");
                    } else {
                      $card.removeClass("selected");
                    }
                  });

                // 卡片点击事件（切换选择状态）
                $(document)
                  .off("click", ".suborder-card")
                  .on("click", ".suborder-card", function (e) {
                    // 如果点击的是可编辑元素，不触发选择
                    if (
                      $(e.target).attr("contenteditable") === "true" ||
                      $(e.target).is('input[type="checkbox"]')
                    ) {
                      return;
                    }

                    var $checkbox = $(this).find('input[type="checkbox"]');
                    $checkbox
                      .prop("checked", !$checkbox.prop("checked"))
                      .trigger("change");
                  });

                // 可编辑字段失焦事件
                $(document)
                  .off("blur", ".suborder-field-value.editable")
                  .on("blur", ".suborder-field-value.editable", function () {
                    var index = $(this).data("index");
                    var field = $(this).data("field");
                    var value = $(this).text().trim();

                    if (
                      typeof index !== "undefined" &&
                      field &&
                      cardData[index]
                    ) {
                      // 特殊处理剂量字段，分离数值和单位
                      if (field === "doseage") {
                        var parts = value.split(/\s+/);
                        if (parts.length >= 2) {
                          cardData[index].doseage = parts[0];
                          // 单位部分不更新，保持原有逻辑
                        } else {
                          cardData[index].doseage = value;
                        }
                      } else {
                        cardData[index][field] = value;
                      }
                    }
                  });

                // 回车键完成编辑
                $(document)
                  .off("keypress", ".suborder-field-value.editable")
                  .on(
                    "keypress",
                    ".suborder-field-value.editable",
                    function (e) {
                      if (e.which === 13) {
                        // 回车键
                        e.preventDefault();
                        $(this).blur();
                      }
                    }
                  );
              }

              // 保存当前数据，供提交使用
              $("#suborders-panel").data("cardData", cardData);
              $("#suborders-panel").data("detailMap", detailMap);

              // 兼容原有的表格接口（供提交按钮使用）
              $("#suborders-panel").data("tableData", cardData);

        // 批量提交小医嘱
        function submitBatchSuborders(todoList, layerIndex) {
          if (!todoList || todoList.length === 0) {
            layer.msg("没有可提交的小医嘱", { icon: 5 });
            return;
          }

          var loadingIndex = layer.load(1, { shade: [0.3, "#000"] });
          $.ajax({
            url: appconfig.api + "/api/MobileWard/AddActYz",
            method: "POST",
            contentType: "application/json",
            data: JSON.stringify(todoList),
            dataType: "json",
            success: function (response) {
              layer.close(loadingIndex);
              if (response && response.Status) {
                layer.msg("提交成功", { icon: 1 });
                if (typeof layerIndex === "number" && layerIndex > 0) {
                  layer.close(layerIndex);
                }
                loadYizhuData(function () {
                  applyFilters();
                });
              } else {
                var errorMsg =
                  response && response.Message ? response.Message : "提交失败";
                layer.msg(errorMsg, { icon: 2, time: 4000 });
              }
            },
            error: function (xhr) {
              layer.close(loadingIndex);
              var errorMsg = "网络错误，提交失败";
              if (xhr.responseJSON && xhr.responseJSON.Message)
                errorMsg = xhr.responseJSON.Message;
              layer.msg(errorMsg, { icon: 2, time: 5000 });
            },
          });
        }

        // 应用筛选条件
        function applyFilters() {
          console.log("应用筛选前:", allYizhuData);
          var filtered = allYizhuData.filter(function (item) {
            var matchOrderType = true;
            var matchRoleType = true;
            var matchSearch = true;

            // 医嘱类型筛选
            if (currentFilters.orderType === "long") {
              matchOrderType = String(item.long_once_flag) === "1";
            } else if (currentFilters.orderType === "temp") {
              matchOrderType = String(item.long_once_flag) === "0";
            }
            // 'all' 不需要筛选条件

            // 开嘱人类型筛选
            if (currentFilters.roleType === "doctor") {
              matchRoleType = String(item.fit_flag) === "1";
            } else if (currentFilters.roleType === "nurse") {
              matchRoleType = String(item.fit_flag) === "0";
            } else if (currentFilters.roleType === "mine") {
              matchRoleType = item.order_doctor === loginUser.user_mi;
            }
            // 'all-role' 不需要筛选条件

        // 通用的医嘱剂量和单位验证函数
        function validateOrdersCompleteness(orders, orderType) {
          var validationErrors = [];
          var incompleteOrders = [];

          orders.forEach(function (order, index) {
            var orderName = order.order_name || "";
            var doseage = (order.doseage || "").toString().trim();
            var doseageUnit = (order.doseage_unit || "").toString().trim();
            var doseageUnitName = (order.doseage_unit_name || "")
              .toString()
              .trim();

            // 检查是否需要剂量（通常药品类医嘱需要剂量）
            var needsDoseage = true; // 默认都需要剂量

            // 某些特殊医嘱可能不需要剂量，比如检查类、手术类等
            var nonDoseageKeywords = [
              "检查",
              "拍片",
              "心电图",
              "CT",
              "MRI",
              "B超",
              "手术",
              "换药",
              "护理",
              "观察",
            ];
            nonDoseageKeywords.forEach(function (keyword) {
              if (orderName.indexOf(keyword) !== -1) {
                needsDoseage = false;
              }
            });

            if (needsDoseage) {
              var hasValidDoseage =
                doseage && doseage !== "" && doseage !== "0";
              var hasValidUnit =
                (doseageUnit && doseageUnit !== "") ||
                (doseageUnitName && doseageUnitName !== "");

              if (!hasValidDoseage || !hasValidUnit) {
                incompleteOrders.push({
                  index: index + 1,
                  name: orderName || "未命名医嘱",
                  missingDoseage: !hasValidDoseage,
                  missingUnit: !hasValidUnit,
                });
              }
            }
          });

          // 如果有不完整的医嘱，返回错误信息
          if (incompleteOrders.length > 0) {
            var errorMessages = [
              "以下" + orderType + "缺少必要的剂量或单位信息：<br><br>",
            ];
            incompleteOrders.forEach(function (order) {
              var missing = [];
              if (order.missingDoseage) missing.push("剂量");
              if (order.missingUnit) missing.push("单位");

              errorMessages.push(
                "• <strong>" +
                  order.name +
                  "</strong><br>" +
                  "  缺少：<span style='color: #ff5722;'>" +
                  missing.join("、") +
                  "</span><br>"
              );
            });

            return {
              isValid: false,
              errorMessage: errorMessages.join(""),
              incompleteCount: incompleteOrders.length,
            };
          }

          return { isValid: true };
        }

                  title: "草稿医嘱信息不完整",
                  area: ["450px", "auto"],
                  btn: ["我知道了"],
                  btnAlign: "c",
                }
              );
              return;
            }

            // 简单校验：提示缺少编码的条目数量
            var missing = draftOrders.filter(function (x) {
              return !x.order_code;
            }).length;
            var tip = missing
              ? "\n其中 " + missing + " 条缺少编码，可能提交失败"
              : "";
            layer.confirm(
              "确定提交全部 " +
                draftOrders.length +
                " 条医嘱？" +
                tip +
                "\n\n✅ 保存区医嘱的剂量和单位信息均已完整",
              { icon: 3, title: "确认提交" },
              function (index) {
                layer.close(index);
                // 实际提交
                submitBatchSuborders(
                  draftOrders.slice(),
                  manualOrderModalIndex /* 传递草稿弹窗索引 */
                );
                // 提交后清空草稿并刷新列表（submitBatchSuborders 成功回调会刷新主表）
                draftOrders = [];
                renderDraftTable();
                // 重置弹窗索引
                manualOrderModalIndex = null;
              }
            );
          });

        // 事件：关闭草稿弹窗
        $(document)
          .off("click", "#btn-cancel-manual-order")
          .on("click", "#btn-cancel-manual-order", function () {
            // 关闭指定的草稿弹窗
            if (manualOrderModalIndex !== null) {
              layer.close(manualOrderModalIndex);
              manualOrderModalIndex = null;
            } else {
              // 如果索引不存在，则关闭最上层弹窗（兜底方案）
              layer.closeAll();
            }
          });

        // 默认加载全部并设置默认选中状态，首次加载后立即应用筛选条件
        loadOrderTemplates(function () {
          loadFrequencyData(function () {
            loadSupplyData(function () {
              loadYizhuData(function() {
                // 首次加载完成后，确保表格显示
                setTimeout(() => {
                  const layuiTableBox = document.querySelector(".layui-table-box");
                  if (layuiTableBox) {
                    layuiTableBox.classList.add('table-ready');
                  }
                }, 100);
                applyFilters();
              });
            });
          });
        });

        // 头工具栏事件
        table.on("toolbar(yizhu-table)", function (obj) {
          switch (obj.event) {
            case "refresh":
              table.reload("yizhu-table");
              break;
            case "export":
              layer.msg("导出功能开发中...");
              break;
          }
        });

        // 行工具栏事件
        table.on("tool(yizhu-table)", function (obj) {
          var data = obj.data;
          if (obj.event === "detail") {
            layer.open({
              type: 1,
              title: false,
              area: ["600px", "400px"],
              content:
                '<div style="padding: 20px;">' +
                "<p><strong>医嘱日期：</strong>" +
                data.order_date +
                " " +
                data.order_time +
                "</p>" +
                "<p><strong>医嘱类型：</strong>" +
                data.order_type_name +
                "</p>" +
                "<p><strong>医嘱内容：</strong>" +
                data.order_text +
                "</p>" +
                "<p><strong>剂量：</strong>" +
                (data.dosage || "") +
                "</p>" +
                "<p><strong>频次：</strong>" +
                (data.frequency || "") +
                "</p>" +
                "<p><strong>用法：</strong>" +
                (data.usage || "") +
                "</p>" +
                "<p><strong>开嘱医生：</strong>" +
                data.doctor_name +
                "</p>" +
                "<p><strong>状态：</strong>" +
                data.status_name +
                "</p>" +
                "</div>",
            });
          } else if (obj.event === "revoke") {
            revokeMedicalOrder(data);
          } else if (obj.event === "stop") {
            stopMedicalOrder(data);
          }
        });
        // 将 renderDraftTable 替换为卡片渲染，并替换相关事件
        // ...existing code...
        function renderDraftTable() {
          var $list = $("#manual-draft-list");
          if (!$list.length) return;

          if (!draftOrders.length) {
            $list.html('<div class="no-data">暂无草稿</div>');
            return;
          }

          var html = "";
          draftOrders.forEach(function (it, idx) {
            var typeText = it.long_once_flag == "1" ? "长" : "临";
            var freqName =
              frequencyCodeToName(it.frequ_code) || it.frequ_code || "";
            var supplyName =
              supplyCodeToName(it.supply_code) || it.supply_code || "";
            var selectedCls = idx === selectedDraftIndex ? " selected" : "";

            // 检查剂量和单位是否完整
            var orderName = it.order_name || "";
            var doseage = (it.doseage || "").toString().trim();
            var doseageUnit = (it.doseage_unit || "").toString().trim();
            var doseageUnitName = (it.doseage_unit_name || "")
              .toString()
              .trim();

            // 判断是否需要剂量
            var needsDoseage = true;
            var nonDoseageKeywords = [
              "检查",
              "拍片",
              "心电图",
              "CT",
              "MRI",
              "B超",
              "手术",
              "换药",
              "护理",
              "观察",
            ];
            nonDoseageKeywords.forEach(function (keyword) {
              if (orderName.indexOf(keyword) !== -1) {
                needsDoseage = false;
              }
            });

            var hasValidDoseage =
              !needsDoseage || (doseage && doseage !== "" && doseage !== "0");
            var hasValidUnit =
              !needsDoseage ||
              (doseageUnit && doseageUnit !== "") ||
              (doseageUnitName && doseageUnitName !== "");
            var isIncomplete =
              needsDoseage && (!hasValidDoseage || !hasValidUnit);
            var incompleteCls = isIncomplete ? " incomplete" : "";

            var dosePart = "";
            if (needsDoseage) {
              if (it.doseage || it.doseage_unit || it.doseage_unit_name) {
                dosePart =
                  "<span" +
                  (!hasValidDoseage || !hasValidUnit
                    ? ' style="color: #ff5722; font-weight: bold;"'
                    : "") +
                  ">剂量：" +
                  (it.doseage ||
                    "<span style='color: #ff5722;'>缺少剂量</span>") +
                  (it.doseage_unit_name
                    ? " " + it.doseage_unit_name
                    : it.doseage_unit
                    ? " " + it.doseage_unit
                    : "<span style='color: #ff5722;'> 缺少单位</span>") +
                  "</span>";
              } else {
                dosePart =
                  "<span style='color: #ff5722; font-weight: bold;'>剂量：缺少剂量和单位</span>";
              }
            } else {
              dosePart = "<span style='color: #999;'>剂量：不适用</span>";
            }

            html +=
              '<div class="draft-card' +
              selectedCls +
              incompleteCls +
              '" data-index="' +
              idx +
              '">' +
              '<div class="title">' +
              '<span class="badge">' +
              typeText +
              "</span>" +
              '<span title="' +
              (it.order_name || "") +
              '">' +
              (it.order_name || "未命名医嘱") +
              "</span>" +
              "</div>" +
              '<div class="meta">' +
              "<span>数量：" +
              (it.charge_amount || "") +
              "</span>" +
              "<span>频率：" +
              freqName +
              "</span>" +
              (supplyName ? "<span>用法：" + supplyName + "</span>" : "") +
              (it.drug_specification
                ? "<span>规格：" + it.drug_specification + "</span>"
                : "") +
              dosePart +
              "</div>" +
              (it.instruction
                ? '<div class="desc">嘱托：' + it.instruction + "</div>"
                : "") +
              '<div class="actions">' +
              '<button type="button" class="layui-btn layui-btn-xs layui-btn-danger btn-delete-draft">删除</button>' +
              "</div>" +
              "</div>";
          });
          $list.html(html);
        }

        // 替换：点击卡片选择并回填
        $(document)
          .off("click", ".draft-card")
          .on("click", ".draft-card", function () {
            var idx = $(this).data("index");
            if (typeof idx === "undefined") return;
            loadDoseageUnitData(draftOrders[idx]);
            selectedDraftIndex = idx;
            fillFormFromDraft(draftOrders[idx]);
            renderDraftTable();
          });

        // 替换：删除草稿（从卡片容器取索引）
        $(document)
          .off("click", ".btn-delete-draft")
          .on("click", ".btn-delete-draft", function (e) {
            e.stopPropagation();
            var idx = $(this).closest(".draft-card").data("index");
            if (idx === undefined) return;
            draftOrders.splice(idx, 1);
            if (selectedDraftIndex === idx) selectedDraftIndex = -1;
            else if (selectedDraftIndex > idx) selectedDraftIndex--;
            renderDraftTable();
          });

        // 移除旧的表格交互（如仍在，请确保不要再绑定这些监听）
        // $(document).off("click", "#manual-draft-table tbody tr");
        // ...existing code...
      });
    </script>
