<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>医嘱信息</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="stylesheet" href="/lib/layui-v2.6.3/css/layui.css" media="all" />
  <link rel="stylesheet" href="/css/public.css" media="all" />
  <link rel="stylesheet" href="/css/table/iframe.css" media="all" />

  <style>
.layui-layer-setwin
{
    display: none;
}

.layui-layer-msg
{
    line-height: 1.5 !important;  max-height: 100px;

/* 限制最大高度 */
    padding: 10px !important;
}

.font-grey
{
    color: #999;
}

.font-black
{
    color: #333;
}

.font-green
{
    color: #52c41a;
}

.font-red
{
    color: #e74c3c;
}

.font-purple
{
    color: rgb(255, 0, 255);
    /* 紫色字体 */
}

.order-type-long
{
    background-color: rgb(192, 220, 192);
    /* 浅绿色背景 */
}

.order-type-once
{
    background-color: rgb(238, 251, 250);
    /* 浅黄色背景 */
}


/* 选中按钮高亮样式，兼容不同色系 */
.btn-active
{
    font-weight: bold !important;  position: relative;  z-index: 1;  border-width: 2.5px !important;  outline: none !important;  box-shadow: 0 2px 8px rgba(30, 185, 90, .18), 0 0 0 2px #b2f0c0 inset !important;
}

/* 针对绿色按钮（layui-btn-warm）选中时加深色 */
.layui-btn-warm.btn-active
{
    color: #fff !important;  border-color: #1eae5b !important;  background-color: #3ec97c !important;
}

/* 针对红色按钮（layui-btn-danger）选中时加深色 */
.layui-btn-danger.btn-active
{
    color: #fff !important;  border-color: #c0392b !important;  background-color: #e74c3c !important;
}

/* 针对蓝色按钮（layui-btn-primary/normal/cyan）选中时加深色 */
.layui-btn-primary.btn-active,
.layui-btn-normal.btn-active,
.layui-btn-cyan.btn-active
{
    color: #fff !important;  border-color: #1786d4 !important;  background-color: #1e9fff !important;
}

/* 兼容小屏幕按钮点击反馈 */
.btn-active:active
{
    box-shadow: 0 1px 4px rgba(30, 185, 90, .12) !important;
}

/* 按钮悬停效果 */
.layui-btn:not(.btn-active):hover
{
    transition: all .2s ease;  transform: translateY(-1px);  box-shadow: 0 2px 4px rgba(0, 0, 0, .2);
}

/* select框样式优化 */
.layui-form-select
{
    width: auto !important;  height: auto !important;
}

.layui-form-select .layui-select-title
{
    font-size: 14px !important;  line-height: 38px !important;  position: relative;  width: auto !important;  height: 38px !important;  color: #333 !important;  border-radius: 2px !important;
}

.layui-form-select .layui-select-title input
{
    font-size: 14px !important;  line-height: 36px !important;  width: 100px;  height: 36px !important;  padding-right: 30px !important;  padding-left: 7px;  color: #333 !important;
}

.layui-form-select dl
{
    font-size: 14px !important;  max-height: 200px;
}

/* 兼容不同浏览器的select样式 */
.layui-form-select .layui-select-title
{
    overflow: hidden !important;  box-sizing: border-box !important;
}

/* 修复Edge浏览器箭头错位问题 */
@supports (-ms-ime-align: auto)
{
    .layui-form-select .layui-select-title i
    {
        top: 12px !important;  right: 8px !important;  transform: none !important;
    }
}

/* 修复Edge Legacy浏览器兼容性 */
@media screen and (-ms-high-contrast: active),
    (-ms-high-contrast: none)
{
    .layui-form-select .layui-select-title i
    {
        top: 12px !important;  right: 8px !important;  transform: none !important;
    }
}

.layui-form-select dl dd
{
    line-height: 36px !important;  color: #333 !important;
}

/* 新增医嘱弹窗样式 */
#add-order-modal
{
    width: 100%;  height: 100%;
}

/* 弹窗两列布局容器样式（疗程 + 小医嘱卡片） */
.order-form-container
{
    display: flex;  flex-direction: column;  width: 100%;  height: 100%;
}

.order-selector
{
    display: flex;  overflow: hidden;  height: 80vh;  min-height: 420px;  border-radius: 4px;  box-shadow: 0 2px 8px rgba(0, 0, 0, .1);
}

/* 两列布局通用样式 */
.order-left,
.order-right
{
    display: flex;  flex-direction: column;  border-right: 1px solid #e6e6e6;
}

.order-left
{
    flex: 0 0 240px;  background: #fafafa;
}

.order-right
{
    flex: 1;  border-right: none;  background: #fff;
}

.layui-container .layui-table-body
{
    overflow-x: hidden;
}

/* 区域标题样式 */
.section-header
{
    font-size: 14px;  font-weight: bold;  display: flex;  align-items: center;  justify-content: center;  padding: 12px 16px;  text-align: center;  color: #fff;  background: #1e9fff;  gap: 6px;
}

.section-header i
{
    font-size: 16px;
}

/* 分类列表样式 */
.category-list
{
    overflow-y: auto;  flex: 1;  padding: 8px 0;
}

.category-item
{
    font-size: 13px;  line-height: 1.4;  padding: 12px 16px;  cursor: pointer;  transition: all .2s ease;  border-bottom: 1px solid #e6e6e6;
}

.category-item:hover
{
    background-color: #e1f3ff;
}

.category-item.selected
{
    /* color: #fff; */
    font-weight: bold;  background-color: lightgray;
}

.category-item .category-name
{
    font-weight: bold;  margin-bottom: 4px;
}

.category-item .category-desc
{
    font-size: 12px;  color: #999;
}

/* 无选择状态样式 */
.no-data,
.no-selection
{
    font-size: 13px;  padding: 40px 20px;  text-align: center;  color: #999;
}

/* 按钮区域样式 */
.dialog-buttons
{
    padding: 10px;  text-align: center;  border-top: 1px solid #e6e6e6;  background: #fafafa;
}

.dialog-buttons .layui-btn
{
    margin: 0 8px;
}

/* 滚动条美化 */
.category-list::-webkit-scrollbar,
.template-list::-webkit-scrollbar,
.form-content::-webkit-scrollbar
{
    width: 6px;
}

.category-list::-webkit-scrollbar-track,
.template-list::-webkit-scrollbar-track,
.form-content::-webkit-scrollbar-track
{
    border-radius: 3px;  background: #f1f1f1;
}

.category-list::-webkit-scrollbar-thumb,
.template-list::-webkit-scrollbar-thumb,
.form-content::-webkit-scrollbar-thumb
{
    border-radius: 3px;  background: #c1c1c1;
}

.category-list::-webkit-scrollbar-thumb:hover,
.template-list::-webkit-scrollbar-thumb:hover,
.form-content::-webkit-scrollbar-thumb:hover
{
    background: #a8a8a8;
}

/* 响应式优化：上下分布 */

/* 小医嘱卡片样式 */
.suborder-cards-container
{
    /* max-height: 420px; */
    overflow-y: auto;  padding: 12px;
}

.suborder-card
{
    position: relative;  margin-bottom: 12px;  padding: 16px;  transition: all .2s ease;  border: 1px solid #e6e6e6;  border-radius: 8px;  background: #fff;  box-shadow: 0 2px 4px rgba(0, 0, 0, .05);
}

.suborder-card:hover
{
    transform: translateY(-1px);  border-color: #1e9fff;  box-shadow: 0 4px 12px rgba(30, 159, 255, .15);
}

.suborder-card.selected
{
    border-color: #1e9fff;  background: #f8fcff;  box-shadow: 0 4px 12px rgba(30, 159, 255, .2);
}

.suborder-card-header
{
    display: flex;  align-items: center;  justify-content: space-between;  margin-bottom: 12px;
}

.suborder-checkbox
{
    margin-right: 12px;
}

.suborder-name
{
    font-size: 14px;  font-weight: bold;  flex: 1;  cursor: pointer;  color: #333;
}

.suborder-type
{
    font-size: 12px;  margin-left: 8px;  padding: 2px 8px;  color: white;  border-radius: 12px;  background: #1e9fff;
}

.suborder-body
{
    display: grid;  margin-bottom: 12px;  grid-template-columns: 1fr 1fr;  gap: 8px 16px;
}

.suborder-field
{
    font-size: 13px;  display: flex;  align-items: center;
}

.suborder-field-label
{
    font-weight: 500;  min-width: 40px;  margin-right: 8px;  color: #666;
}

.suborder-field-value
{
    flex: 1;  word-break: break-all;  color: #333;
}

.suborder-field-value.editable
{
    padding: 2px 6px;  cursor: text;  transition: all .2s ease;  border: 1px solid transparent;  border-radius: 3px;  background: #f9f9f9;
}

.suborder-field-value.editable:hover
{
    border-color: #d9d9d9;  background: #fff;
}

.suborder-field-value.editable:focus
{
    border-color: #1e9fff;  outline: none;  box-shadow: 0 0 0 2px rgba(30, 159, 255, .1);
}

.suborder-instruction
{
    margin-top: 8px;  grid-column: 1 / -1;
}

.suborder-instruction .suborder-field-value
{
    min-height: 20px;  padding: 8px;  word-break: break-word;  border-radius: 4px;  background: #f5f5f5;
}

/* 草稿卡片不完整状态样式 */
.draft-card.incomplete
{
    border-color: #ff5722 !important;  background: #fff3f0 !important;  box-shadow: 0 2px 8px rgba(255, 87, 34, .15) !important;
}

.draft-card.incomplete .title
{
    color: #ff5722;
}

.draft-card.incomplete .title::after
{
    font-weight: bold;  margin-left: 8px;  content: ' ⚠️';  color: #ff5722;
}

@media (max-width: 768px)
{
    .layui-table-page
    {
        visibility: hidden;
    }

    .order-selector
    {
        flex-direction: column;  height: 100%;
    }

    .order-left
    {
        height: 40%;
    }

    .order-right
    {
        width: 100%;  height: 60%;  margin-top: 8px;  border: none;
    }
}

/* 搜索框样式 */
#yizhu-search-input
{
    padding-left: 0;  transition: all .3s ease;
}

#yizhu-search-input:focus
{
    border-color: #1e9fff;  box-shadow: 0 0 5px rgba(30, 159, 255, .3);
}

#clear-search-btn
{
    cursor: pointer;  transition: all .3s ease;  color: #999;  border: none;  background-color: transparent;
}

#clear-search-btn:hover
{
    color: #1e9fff;  background-color: rgba(30, 159, 255, .1);
}

.layui-icon-add-circle-fine
{
    font-size: 30px;
}

#search-icon
{
    line-height: 38px;  height: 38px;  padding: 0 5px;  cursor: pointer;  cursor: pointer;  text-align: center;  border-right: 0;  border-radius: 15px 0 0 15px;  background-color: #fff;
}

.role-label
{
    font-size: 14px;  font-weight: bold;  line-height: 36px;  height: 36px;  white-space: nowrap;  text-overflow: ellipsis;  color: #666;
}

.filter-condition
{
    font-size: 16px;  display: flex;  justify-content: center;  width: 100%;  height: 30px;
}

.filter-condition span
{
    line-height: 30px;  margin-right: 15px;
}

.filter-condition label
{
    line-height: 30px;  height: 30px;  padding: 0 5px;  color: #333;  border-radius: 5px;  background-color: #f0f0f0;
}

.filter-condition .layui-icon
{
    display: none;
}

.filter-condition .layui-form-radio *
{
    font-size: 14px;
}

.filter-condition .layui-form-radio:hover *
{
    color: rgb(36, 67, 119);
}

.filter-condition .layui-form-radio
{
    line-height: 30px;  height: 30px;  margin: 0 10px;  padding: 0 5px;  border: 1px solid gray;  border-radius: 10px;  background-color: #fff;
}

.filter-condition .layui-form-radioed,
.layui-form-radioed > i
{
    color: rgb(36, 67, 119);  background-color: rgb(189, 203, 248);
}

/* 卡片视图简约现代覆盖样式（仅当前页生效） */
:root
{
    --card-bg: #fff;  --card-border: #e5e7eb;

/* Tailwind zinc-200 */
    --card-shadow: 0 1px 2px rgba(0, 0, 0, .04),
    0 1px 1px rgba(0, 0, 0, .02);  --card-shadow-hover: 0 4px 12px rgba(0, 0, 0, .08);  --text-main: #111827;

/* gray-900 */
    --text-muted: #6b7280;

/* gray-500 */
    --surface-muted: #f3f4f6;

/* gray-100 */
    --ok: #047857;  --ok-weak: #ecfdf5;  --ok-border: #a7f3d0;  --warn: #b45309;  --warn-weak: #fffbeb;  --warn-border: #fde68a;  --parent: #2563eb;

/* blue-600 */
    --child: #16a34a;
    /* green-600 */
}

.ordercardlists-container
{
    display: block;  padding: 8px 8px 12px 8px;  background: #fafafa;
}

.order-card
{
    box-sizing: border-box;  width: 100%;  margin: 0 0 10px 0;  padding: 0;  transition: box-shadow .2s ease, transform .2s ease,
    border-color .2s ease;  border-radius: 10px;  background: var(--card-bg);
}

.order-card:hover
{
    transform: translateY(-1px);  box-shadow: var(--card-shadow-hover);
}

/* 头部：去色背景，提升信息层级 */
.order-card-header
{
    display: flex;  align-items: center;  justify-content: space-between;  height: auto !important;  padding: 10px 12px !important;  cursor: pointer;  border: 1px solid;  border-radius: 10px 10px 0 0;  background: white;
}

.order-card-header .order-name
{
    font-size: 15px !important;  font-weight: 600;  width: 100%;
    /* color: #2c5282; */
}

.order-card-header .order-name small
{
    font-size: 12px;  margin-left: 8px;  color: #9ca3af;
}

.order-card-header .order-name .enter-time
{
    font-size: 12px;  position: absolute;  right: 10px;  color: black;
}

.order-card-header .order-type
{
    font-size: 12px;  line-height: 15px;  padding: 6px 10px;  color: #374151;  border: 1px solid #e5e7eb;  border-radius: 9999px;  background: var(--surface-muted);
}

.order-card-header .order-type.badge-long
{
    color: var(--ok);  border-color: var(--ok-border);  background: var(--ok-weak);
}

.order-card-header .order-type.badge-once
{
    color: var(--warn);  border-color: var(--warn-border);  background: var(--warn-weak);
}

/* 主体：默认两列，中屏三列，宽屏四列 */
.order-card-body
{
    display: grid;  padding: 10px 12px;  grid-template-columns: repeat(2, minmax(0, 1fr));  gap: 6px 12px;
}

.order-card .field
{
    display: flex;  align-items: center;  min-height: 18px;  gap: 6px;
}

.order-card .field label
{
    font-size: 11px;  white-space: nowrap;  color: var(--text-muted);
}

.order-card .field .value
{
    font-size: 13px;  color: var(--text-main);
}

/* 并列时间行 */
.order-card .field-row.times-row
{
    display: grid;  grid-template-columns: repeat(2, minmax(0, 1fr));  gap: 6px 12px;
}

/* 嘱托弱化 */
.order-card .field.instruction label
{
    color: #9ca3af;
}

.order-card .field.instruction .value
{
    font-size: 12px;  color: var(--text-muted);
}

/* 徽标组（合并多信息到一行） */
.order-card .field-chips
{
    gap: 6px;
}

.order-card .field-chips .chip
{
    font-size: 11px;  line-height: 16px;  height: 18px;  padding: 0 6px;  border: 1px solid #e5e7eb;  border-radius: 9999px;  background: #f3f4f6;
}

/* 操作区：弱化按钮为“幽灵按钮”风格 */
.order-card .order-card-actions
{
    display: flex;  align-items: center;  justify-content: flex-end;  padding: 8px 10px;  border-top: 1px solid var(--surface-muted);  gap: 8px;
}

/* 折叠逻辑：默认折叠，点击卡片头展开 */
.order-card:not(.expanded) .order-card-body,
.order-card:not(.expanded) .order-card-actions,
.order-card:not(.expanded) .child-orders-container .child-order-body
{
    display: none !important;
}

.order-card .order-card-actions .layui-btn
{
    line-height: 28px;  height: 28px;  padding: 0 10px;  color: #374151;  border: 1px solid #e5e7eb;  border-radius: 8px;  background: transparent !important;
}

.order-card .order-card-actions .layui-btn:hover
{
    background: #f9fafb !important;
}

.order-card .order-card-actions .layui-btn-danger
{
    color: #b91c1c !important;  border-color: #fecaca;
}

.order-card .order-card-actions .layui-btn-warm
{
    color: #b45309 !important;  border-color: #fde68a;
}

/* 展开子医嘱按钮容器 */
.expand-children-btn-container
{
    width: 100%;  padding: 0;  border-top: 1px solid #e5e7eb;
}

/* 展开子医嘱按钮 */
.btn-expand-children
{
    font-size: 14px;  font-weight: 500;  display: flex;  align-items: center;  justify-content: center;  width: 100%;  height: 40px;  cursor: pointer;  transition: all .3s ease;  color: var(--parent);  border: none;  border-radius: 0 0 10px 10px;  background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);  gap: 8px;
}

.btn-expand-children:hover
{
    background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%);
}

.btn-expand-children:active
{
    color: white;  background: var(--parent);
}

.btn-expand-children .layui-icon
{
    font-size: 16px;  transition: transform .3s ease;
}

.btn-expand-children.expanded .layui-icon
{
    transform: rotate(180deg);
}

/* 子医嘱列表容器 */
.child-orders-container
{
    padding: 8px;  border-top: 1px solid #e5e7eb;  background: #f9fafb;
}

/* 子医嘱项 */
.child-order-item
{
    margin-bottom: 10px;  padding: 10px 12px;  border-radius: 6px;  background: white;  box-shadow: 0 1px 3px rgba(0, 0, 0, .05);
}

.child-order-item:last-child
{
    margin-bottom: 0;
}

/* 子医嘱头部 */
.child-order-header
{
    display: flex;  align-items: center;  padding-bottom: 6px;  border-bottom: 1px solid #e5e7eb;  gap: 8px;
}

.child-order-index
{
    font-size: 12px;  font-weight: 600;  display: inline-flex;  align-items: center;  flex-shrink: 0;  justify-content: center;  width: 22px;  height: 22px;  color: white;  border-radius: 50%;  background: var(--child);
}

.child-order-name
{
    font-size: 14px;  font-weight: 500;  flex: 1;  color: #1f2937;
}

.child-order-name small
{
    font-size: 11px;  font-weight: normal;  margin-left: 6px;  color: #9ca3af;
}

.child-order-type
{
    font-size: 11px;  flex-shrink: 0;  padding: 2px 6px;  border-radius: 3px;
}

/* 子医嘱时间 */
.child-order-times
{
    font-size: 12px;  display: flex;  margin: 8px 0;  padding: 6px 8px;  border-radius: 4px;  background: #f9fafb;  gap: 16px;
}

.child-time-field
{
    display: flex;  align-items: center;
}

.child-time-field label
{
    font-weight: 500;  margin-right: 4px;  color: #9ca3af;
}

.child-time-field span
{
    color: #4b5563;
}

/* 子医嘱详情 */
.child-order-body
{
    font-size: 13px;  display: grid;  grid-template-columns: repeat(2, 1fr);  gap: 8px;
}

.child-field
{
    display: flex;  align-items: baseline;
}

.child-field label
{
    font-weight: 500;  margin-right: 4px;  white-space: nowrap;  color: #9ca3af;
}

.child-field span
{
    flex: 1;  color: #4b5563;
}

/* 子医嘱嘱托 */
.child-order-instruction
{
    font-size: 12px;  line-height: 1.5;  margin-top: 8px;  padding: 6px 8px;  color: #92400e;  border-left: 2px solid #f59e0b;  border-radius: 4px;  background: #fef3c7;  grid-column: 1/3;
}

/* 响应式：小屏幕下单列显示 */
@media (max-width: 576px)
{
    .child-order-body
    {
        grid-template-columns: repeat(2, 1fr);
    }
}

/* 状态：以顶部细线提示，避免整卡变色 */
.order-card-header.font-grey
{
    color: inherit;      color: rgb(178, 190, 195);
}

.order-card-header.font-green
{
    color: inherit;      color: rgb(85, 239, 196);
}

.order-card-header.font-red
{
    color: inherit;      color: rgb(255, 118, 117);
}

.order-card-header.font-purple
{
    color: inherit;      color: #e9d5ff;
}

/* 取消类型类对卡片底色的影响（继承自旧样式的覆盖） */
.order-card.order-type-long,
.order-card.order-type-once
{
    background: var(--card-bg) !important;
}

/* 中屏：主体三列信息 */
@media (min-width: 992px)
{
    .order-card-body
    {

  <script src="/lib/lay-config.js?v=1.0.4" charset="utf-8"></script>
  <script>
    layui.use(["table", "appconfig", "form"], function () {
      var table = layui.table;
      var $ = layui.jquery;
      var appconfig = layui.appconfig;
      var form = layui.form;
      const tempAppconfig = appconfig.api;

      // 草稿区 - 暂存未正式提交的医嘱
      var draftOrders = [];
      var selectedDraftIndex = -1; // 保存区当前选中的下标
      var manualOrderModalIndex = null; // 草稿弹窗的索引
      // 模板选择完成回调（若存在，则模板弹窗选择后不直接提交，而是回调回本弹窗）
      window.onTemplatePicked = null;

      // 立即渲染表单元素，确保select框能正常工作
      form.render();
      $(document).on("click", "#btn-filter-order", function () {
        const $panel = $("#order-filter-panel");
        const $btnFilterContainer = $("#btn-filter-container");
        const isOpen = $panel.is(":visible");

        if (isOpen) {
          $panel.slideUp(150);
          $btnFilterContainer.css("background-color", "rgba(0, 0, 0, 0)");
        } else {
          $panel.slideDown(150);
          $btnFilterContainer.css("background-color", "lightgrey");
        }
      });
      // 确保手动表单的 select 使用 Layui 的 select 事件（lay-filter），以便选择 option 后能可靠触发
      (function ensureLayuiSelectHandlers() {
        try {
          var map = [
            { sel: "#manual-unit-select", filter: "manualUnit" },
            { sel: "#manual-supply-select", filter: "manualSupply" },
            { sel: "#manual-frequ-select", filter: "manualFrequ" },
            { sel: "#manual-long-flag", filter: "manualLongFlag" },
          ];
          map.forEach(function (m) {
            var $el = $(m.sel);
            if ($el.length && !$el.attr("lay-filter")) {
              $el.attr("lay-filter", m.filter);
            }
          });
          // 重新渲染 select，确保 lay-filter 生效
          form.render("select");

          // 注册 Layui 的 select 事件回调（当用户选中 option 时 Layui 会触发）
          form.on("select(manualUnit)", function (data) {
            $("#manual-doseage-unit").val((data.value || "").trim());
            updateSelectedDraftFromForm();
          });
          form.on("select(manualSupply)", function (data) {
            updateSelectedDraftFromForm();
          });
          form.on("select(manualFrequ)", function (data) {
            updateSelectedDraftFromForm();
          });
          form.on("select(manualLongFlag)", function (data) {
            updateSelectedDraftFromForm();
          });
        } catch (e) {
          console.warn("ensureLayuiSelectHandlers error", e);
        }
      })();

      // 获取患者信息和病区信息
      var wardData = JSON.parse(localStorage.getItem("selectedWard") || "{}");
      var ward_sn = localStorage.getItem("ward_sn") || "";
      var userData = JSON.parse(localStorage.getItem("userData") || "{}");
      var loginUser = JSON.parse(localStorage.getItem("loginUser") || "{}");
      var patient_id = userData.patient_id;
      var admiss_times = userData.admiss_times;
      if (userData === null) {
        layer.msg("请先选择患者！");
        return;
      }

      // 缓存全部医嘱数据
      var allYizhuData = [];
      // 最近一次渲染到卡片的数据（供按钮事件索引回取）
      var lastRenderedYizhuData = [];

      // 医嘱模板数据 - 从API获取
      var orderTemplates = [];

      // 频率数据缓存
      var frequencyData = [];

      // 用法数据缓存
      var supplyData = [];

      // 剂量单位数据缓存
      var doseageUnitData = [];

      // 存储选择的模板数据
      var selectedCategoryData = null; // 一级分类数据
      var selectedDetailData = null; // 二级分类数据

      // 当前筛选条件
      var currentFilters = {
        orderType: "all", // 'long', 'temp', 'all' - 默认临时医嘱（与单选框默认值一致）
        roleType: "doctor", // 'doctor', 'nurse',"mine", 'all-role' - 默认医生（与单选框默认值一致）
        itemType: "all", // 'treatment'(诊疗), 'drug'(药品), 'all'
        searchQuery: "", // 搜索关键词
      };
      // 父子医嘱排序函数
      function sortYizhuDataWithParentChild(data) {
        if (!data || data.length === 0) return data;

        console.log("排序前医嘱数量:", data.length);

        // 首先创建父子医嘱映射
        const childrenMap = new Map();
        const processedIds = new Set();

        // 收集所有有parent_no的医嘱（子医嘱）
        data.forEach((order) => {
          if (order.parent_no && order.parent_no.trim()) {
            const parentKey = order.parent_no.trim();
            if (!childrenMap.has(parentKey)) {
              childrenMap.set(parentKey, []);
            }
            childrenMap.get(parentKey).push(order);
          }
        });

        // 创建医嘱组（每个组要么是单个普通医嘱，要么是父医嘱+子医嘱的组合）
        const orderGroups = [];

        data.forEach((order) => {
          const orderId = order.act_order_no || order.order_no;

          // 如果已经处理过这个医嘱，跳过
          if (processedIds.has(orderId)) {
            return;
          }

          // 如果这个医嘱是子医嘱，跳过（会在处理父医嘱时一起处理）
          if (order.parent_no && order.parent_no.trim()) {
            return;
          }

          // 检查这个医嘱是否是父医嘱
          const children = childrenMap.get(orderId) || [];

          if (children.length > 0) {
            // 这是父医嘱，创建一个父子医嘱组
            const group = {
              sortTime: new Date(order.enter_time),
              isParentGroup: true,
              orders: [
                { ...order, _isParent: true },
                ...children.map((child, index) => ({
                  ...child,
                  _isChild: true,
                  _isLastChild: index === children.length - 1,
                })),
              ],
            };

            orderGroups.push(group);
            processedIds.add(orderId);

            // 标记所有子医嘱为已处理
            children.forEach((child) => {
              const childId = child.act_order_no || child.order_no;
              processedIds.add(childId);
            });
          } else {
            // 这是普通医嘱，创建单个医嘱组
            const group = {
              sortTime: new Date(order.enter_time),
              isParentGroup: false,
              orders: [{ ...order, _isNormal: true }],
            };

            orderGroups.push(group);
            processedIds.add(orderId);
          }
        });

        // 处理可能遗漏的孤儿子医嘱
        data.forEach((order) => {
          const orderId = order.act_order_no || order.order_no;

          if (
            !processedIds.has(orderId) &&
            order.parent_no &&
            order.parent_no.trim()
          ) {
            console.warn(
              "发现孤儿子医嘱:",
              order.order_name,
              "parent_no:",
              order.parent_no
            );
            const group = {
              sortTime: new Date(order.enter_time),
              isParentGroup: false,
              orders: [{ ...order, _isOrphan: true }],
            };
            orderGroups.push(group);
            processedIds.add(orderId);
          }
        });

        // 按日期对所有医嘱组进行倒序排序（最新的在前面）
        orderGroups.sort((a, b) => b.sortTime - a.sortTime);

        // 将所有组的医嘱合并成最终结果
        const result = [];
        orderGroups.forEach((group) => {
          result.push(...group.orders);
        });

        console.log("排序后医嘱数量:", result.length);
        console.log("医嘱组数量:", orderGroups.length);
        console.log(
          "父医嘱组数量:",
          orderGroups.filter((g) => g.isParentGroup).length
        );
        console.log("父医嘱数量:", result.filter((r) => r._isParent).length);
        console.log("子医嘱数量:", result.filter((r) => r._isChild).length);
        console.log(
          "普通医嘱数量:",
          result.filter((r) => r._isNormal).length
        );
        console.log(
          "孤儿医嘱数量:",
          result.filter((r) => r._isOrphan).length
        );

        return result;
      }

      // 首次加载数据
      function loadYizhuData(callback) {
        $.ajax({
          url:
            appconfig.api +
            "/api/MobileWard/GetYzManageEOPOrders?ward_sn=" +
            userData.ward +
            "&inpatient_no=" +
            userData.inpatient_no,
          method: "GET",
          dataType: "json",
          success: function (res) {
            allYizhuData = res.Data || [];

            // 对数据按父子关系排序
            console.log(allYizhuData);

            allYizhuData = sortYizhuDataWithParentChild(allYizhuData);
            console.log(allYizhuData);

            renderYizhuCards(allYizhuData);
            if (typeof callback === "function") callback();
          },
          error: function () {
            allYizhuData = [];
            renderYizhuCards([]);
            if (typeof callback === "function") callback();
          },
        });
      }

      // 停止医嘱功能
      function stopMedicalOrder(orderData) {
        // 获取当前用户信息
        var currentUser = JSON.parse(
          localStorage.getItem("loginUser") || "{}"
        );
        var doctorName =
          currentUser.name || currentUser.user_name || "系统用户";
        var doctorCode = currentUser.user_mi || "00000";
        // 获取当前时间
        var now = new Date();
        var stopTime =
          String(now.getMonth() + 1).padStart(2, "0") +
          "/" +
          String(now.getDate()).padStart(2, "0") +
          "/" +
          now.getFullYear() +
          " " +
          String(now.getHours()).padStart(2, "0") +
          ":" +
          String(now.getMinutes()).padStart(2, "0") +
          ":" +
          String(now.getSeconds()).padStart(2, "0");

        // 检查是否有子医嘱
        var orderId = orderData.act_order_no || orderData.order_no;
        var children = allYizhuData.filter(function (item) {
          return item._isChild && item.parent_no === orderId;
        });

        var confirmMsg = `确定要停止医嘱【${orderData.order_name || "未知"}】吗？`;
        if (children.length > 0) {
          confirmMsg += `\n\n该医嘱包含 ${children.length} 个子医嘱，将一并停止：\n`;
          children.forEach(function (child, idx) {
            confirmMsg += `${idx + 1}. ${child.order_name}\n`;
          });
        }

        // 确认对话框
        layer.confirm(
          confirmMsg,
          { icon: 3, title: "停止医嘱确认" },
          function (index) {
            // 构建需要停止的医嘱列表（父医嘱 + 子医嘱）
            var ordersToStop = [orderData];
            if (children.length > 0) {
              ordersToStop = ordersToStop.concat(children);
            }

            // 显示加载提示
            var loadingIndex = layer.load(1, { shade: [0.3, "#000"] });

            // 结果统计
            var successCount = 0;
            var failCount = 0;
            var totalCount = ordersToStop.length;
            var errors = [];

            // 串行停止医嘱（逐个执行，避免并发冲突）
            var currentIndex = 0;

            function stopNextOrder() {
              if (currentIndex >= ordersToStop.length) {
                // 所有医嘱都处理完成
                layer.close(loadingIndex);
                layer.close(index);

                // 显示结果
                if (failCount === 0) {
                  layer.msg("医嘱停止成功" + (children.length > 0 ? "（含 " + children.length + " 个子医嘱）" : ""), { icon: 1 });
                } else if (successCount === 0) {
                  layer.msg("医嘱停止失败\n" + errors.join("\n"), { icon: 2, time: 5000 });
                } else {
                  layer.msg("部分医嘱停止成功（成功: " + successCount + ", 失败: " + failCount + "）\n失败原因：\n" + errors.join("\n"), { icon: 0, time: 5000 });
                }

                // 刷新表格数据
                loadYizhuData(function () {
                  applyFilters(); // 重新应用当前筛选条件
                });
                return;
              }

              var order = ordersToStop[currentIndex];
              currentIndex++;

              var apiParams = {
                patient_id: patient_id || order.patient_id,
                admiss_times: admiss_times || order.admiss_times,
                act_order_no: order.act_order_no || order.order_no,
                stop_doctor: doctorCode,
                stop_time: stopTime,
              };

              // 验证必要参数
              if (
                !apiParams.patient_id ||
                !apiParams.admiss_times ||
                !apiParams.act_order_no
              ) {
                failCount++;
                errors.push(order.order_name + ": 缺少必要参数");
                stopNextOrder(); // 继续下一个
                return;
              }

              // 调用停止医嘱API
              $.ajax({
                url: appconfig.api + "/api/MobileWard/StopActYz",
                method: "GET",
                data: apiParams,
                dataType: "json",
                success: function (response) {
                  if (response && response.Status === 1) {
                    successCount++;
                  } else {
                    failCount++;
                    var errorMsg = response && response.Message ? response.Message : "停止失败";
                    errors.push(order.order_name + ": " + errorMsg);
                  }
                  // 等待一小段时间后继续下一个（避免后端还在处理）
                  setTimeout(function () {
                    stopNextOrder();
                  }, 300);
                },
                error: function (xhr, status, error) {
                  failCount++;
                  var errorMsg = "网络错误";
                  if (xhr.responseJSON && xhr.responseJSON.Message) {
                    errorMsg = xhr.responseJSON.Message;
                  }
                  errors.push(order.order_name + ": " + errorMsg);
                  // 等待一小段时间后继续下一个
                  setTimeout(function () {
                    stopNextOrder();
                  }, 300);
                }
              });
            }

            // 开始串行执行
            stopNextOrder();
          }
        );
      }

      // 加载医嘱模板数据
      function loadOrderTemplates(callback) {
        // 获取病区信息用于API调用
        var wardData = JSON.parse(localStorage.getItem("wardData") || "{}");
        var dept_sn = userData.dept || ""; // 默认科室编号，实际应从用户数据获取

        $.ajax({
          url:
            appconfig.api +
            "/api/MobileWard/GetYzPatternList?dept_sn=" +
            dept_sn,
          method: "GET",
          dataType: "json",
          success: function (res) {
            if (res && res.Status && res.Data) {
              // 直接使用API返回的数据格式
              orderTemplates = res.Data.map(function (item) {
                return {
                  pattern_code: item.pattern_code,
                  pattern_name: item.pattern_name,
                  py_code: item.py_code,
                  d_code: item.d_code,
                  sort_code: item.sort_code,
                  dept_sn: item.dept_sn,
                  ward_sn: item.ward_sn,
                  create_opera: item.create_opera,
                  create_name: item.create_name,
                  flag: item.flag,
                  Id: item.Id,
                };
              });

              // console.log("加载医嘱模板成功:", orderTemplates);
            } else {
              console.warn("医嘱模板数据格式异常:", res);
              orderTemplates = [];
            }

                  unit_code: data.vol_unit,
                  unit_name: data.vol_name,
                  unit_type: "vol",
                });

                  unit_name: data.weight_name,
                  unit_type: "weight",

      // 剂量单位名称缓存与获取（按 serial|order_code 聚合）
      var doseUnitMapCache = {};
      function getDoseUnitMapWithCache(serial, order_code, cb) {
        var key = (serial || "") + "|" + (order_code || "");
        if (doseUnitMapCache[key]) {
          cb && cb(doseUnitMapCache[key]);
          return;
        }
        if (!order_code) {
          cb && cb({});
          return;
        }
        $.ajax({
          url: appconfig.api + "/api/MobileWard/GetYzDictList",
          method: "GET",
          dataType: "json",
          data: { serial: serial || "00", order_code: order_code },
          success: function (res) {
            var map = {};
            if (res && res.Status && res.Data && res.Data[0]) {
              var d = res.Data[0];
              if (d.mini_unit && d.mini1_name)
                map[d.mini_unit] = d.mini1_name;
              if (d.pack_unit && d.pack_name) map[d.pack_unit] = d.pack_name;
              if (d.vol_unit && d.vol_name) map[d.vol_unit] = d.vol_name;
              if (d.weight_unit && d.weight_name)
                map[d.weight_unit] = d.weight_name;
            }
            doseUnitMapCache[key] = map;
            cb && cb(map);
          },
          error: function () {
            cb && cb({});
          },
        });
      }

      function debounce(fn, wait) {
        var t;
        return function () {
          var args = arguments,
            ctx = this;
          clearTimeout(t);
          t = setTimeout(function () {
            fn.apply(ctx, args);
          }, wait);
        };
      }
      function filterOrderTemplates(query) {
        if (!query) return orderTemplates.slice(); // 返回所有
        var q = query.trim().toLowerCase();
        return orderTemplates.filter(function (item) {
          if (!item) return false;
          var name = (item.pattern_name || "").toLowerCase();
          var py = (item.py_code || "").toLowerCase();
          var d = (item.d_code || "").toLowerCase();
          return (
            name.indexOf(q) !== -1 ||
            py.indexOf(q) !== -1 ||
            d.indexOf(q) !== -1
          );
        });
      }

              var serial = item.serial || item.Serial;
              var order_code = item.order_code;
              var key = String(serial || "") + "|" + String(order_code || "");
              // 缓存原始对象
              if (key) detailMap[key] = item;
              return {
                _row_id: idx,
                _key: key, // 用于回查原始明细
                selected: true, // 默认选中
                order_name: item.order_name || "",
                drug_specification: item.drug_specification || "",
                doseage: item.doseage || "",
                doseage_unit: item.doseage_unit || "",
                doseage_unit_name: item.doseage_unit || "",
                charge_amount: item.charge_amount || "1",

                supply_code: item.supply_code || "",
                supply_name: supplyCodeToName(item.supply_code || ""),
                instruction: item.instruction || "",
                long_once_flag: item.order_type === "3" ? "1" : "0",
                serial: serial,
                order_code: order_code,
              };
            });

            // 异步补齐单位名称
            (function populateDoseUnitNames() {
              var keyToIndexes = {};
              cardData.forEach(function (item, idx) {
                var key = (item.serial || "") + "|" + (item.order_code || "");
                if (!keyToIndexes[key]) keyToIndexes[key] = [];
                keyToIndexes[key].push(idx);
              });
              var keys = Object.keys(keyToIndexes);
              var pending = keys.length;
              if (pending === 0) {
                renderCards(); // 直接渲染
                return;
              }
              keys.forEach(function (key) {
                var parts = key.split("|");
                var serial = parts[0];
                var order_code = parts[1];
                getDoseUnitMapWithCache(serial, order_code, function (map) {
                  (keyToIndexes[key] || []).forEach(function (i) {
                    var code = cardData[i].doseage_unit;
                    cardData[i].doseage_unit_name = map[code] || code || "";
                  });
                  pending--;
                  if (pending === 0) {
                    renderCards(); // 全部映射完成后渲染
                  }
                });
              });
            })();

            // 绑定卡片事件
            function bindCardEvents() {
              // 复选框改变事件
              $(document)
                .off("change", ".suborder-checkbox input")
                .on("change", ".suborder-checkbox input", function () {
                  var index = $(this).data("index");
                  var checked = $(this).prop("checked");
                  cardData[index].selected = checked;

                  var $card = $(this).closest(".suborder-card");
                  if (checked) {
                    $card.addClass("selected");
                  } else {
                    $card.removeClass("selected");
                  }
                });

              // 卡片点击事件（切换选择状态）

      // 撤销医嘱功能
      function revokeMedicalOrder(orderData) {
        // 获取当前用户信息
        var currentUser = JSON.parse(
          localStorage.getItem("loginUser") || "{}"
        );
        var operatorCode = currentUser.user_mi || "00000";

        // 检查是否有子医嘱
        var children = [];
        if (orderData._isParent && allYizhuData && allYizhuData.length > 0) {
          var parentId = orderData.act_order_no || orderData.order_no;
          children = allYizhuData.filter(function (item) {
            return item._isChild && item.parent_no === parentId;
          });
        }

        // 构建确认消息
        var confirmMsg = "确定要撤销医嘱【" + (orderData.order_name || "未知") + "】吗？";
        if (children.length > 0) {
          confirmMsg += "<br><br>该医嘱包含 " + children.length + " 个子医嘱，将一并撤销：<br>";
          children.forEach(function (child, idx) {
            confirmMsg += (idx + 1) + ". " + (child.order_name || "未知子医嘱") + "<br>";
          });
        }

        // 确认对话框
        layer.confirm(
          confirmMsg,
          { icon: 3, title: "撤销医嘱确认" },
          function (index) {
            // 构建需要撤销的医嘱列表（父医嘱 + 子医嘱）
            var ordersToCancel = [orderData];
            if (children.length > 0) {
              ordersToCancel = ordersToCancel.concat(children);
            }

            // 显示加载提示
            var loadingIndex = layer.load(1, { shade: [0.3, "#000"] });

            // 结果统计
            var successCount = 0;
            var failCount = 0;
            var totalCount = ordersToCancel.length;
            var errors = [];

            // 串行撤销医嘱（逐个执行，避免并发冲突）
            var currentIndex = 0;

            function cancelNextOrder() {
              if (currentIndex >= ordersToCancel.length) {
                // 所有医嘱都处理完成
                layer.close(loadingIndex);
                layer.close(index);

                // 显示结果
                if (failCount === 0) {
                  layer.msg("医嘱撤销成功" + (children.length > 0 ? "（含 " + children.length + " 个子医嘱）" : ""), { icon: 1 });
                } else if (successCount === 0) {
                  layer.msg("医嘱撤销失败\n" + errors.join("\n"), { icon: 2, time: 5000 });
                } else {
                  layer.msg("部分医嘱撤销成功（成功: " + successCount + ", 失败: " + failCount + "）\n失败原因：\n" + errors.join("\n"), { icon: 0, time: 5000 });
                }

                // 刷新表格数据
                loadYizhuData(function () {
                  applyFilters(); // 重新应用当前筛选条件
                });
                return;
              }

              var order = ordersToCancel[currentIndex];
              currentIndex++;

              var apiParams = {
                patient_id: patient_id || order.patient_id,
                admiss_times: admiss_times || order.admiss_times,
                act_order_no: order.act_order_no || order.order_no,
                opera: loginUser.user_mi,
                cancel_mode: "1", // 撤销模式，1表示撤销
                pre_cancel_step: "2", // 预撤销步骤，2表示直接撤销
              };

              // 验证必要参数
              if (
                !apiParams.patient_id ||
                !apiParams.admiss_times ||
                !apiParams.act_order_no
              ) {
                failCount++;
                errors.push(order.order_name + ": 缺少必要参数");
                cancelNextOrder(); // 继续下一个
                return;
              }

              // 调用撤销医嘱API
              $.ajax({
                url: appconfig.api + "/api/MobileWard/CancelActYz",
                method: "GET",
                data: apiParams,
                dataType: "json",
                success: function (response) {
                  if (response && response.Status === 1) {
                    successCount++;
                  } else {
                    failCount++;
                    var errorMsg = response && response.Message ? response.Message : "撤销失败";
                    errors.push(order.order_name + ": " + errorMsg);
                  }
                  // 等待一小段时间后继续下一个（避免后端还在处理）
                  setTimeout(function () {
                    cancelNextOrder();
                  }, 300);
                },
                error: function (xhr, status, error) {
                  failCount++;
                  var errorMsg = "网络错误";
                  if (xhr.responseJSON && xhr.responseJSON.Message) {
                    errorMsg = xhr.responseJSON.Message;
                  }
                  errors.push(order.order_name + ": " + errorMsg);
                  // 等待一小段时间后继续下一个
                  setTimeout(function () {
                    cancelNextOrder();
                  }, 300);
                }
              });
            }

            // 开始串行执行
            cancelNextOrder();
          }
        );
      }

      // 卡片渲染
      function renderYizhuCards(data) {
        var $cards = $("#yizhu-cards");
        if (!$cards.length) return;

        lastRenderedYizhuData = Array.isArray(data) ? data.slice() : [];

        if (!lastRenderedYizhuData.length) {
          $cards.html('<div class="no-data">暂无医嘱数据</div>');
          return;
        }

        // 格式化日期为分钟精度 (YYYY-MM-DD HH:mm)
        function formatToMinute(dateStr) {
          if (!dateStr) return "";
          try {
            var date = new Date(dateStr);
            if (isNaN(date.getTime())) return dateStr; // 如果无法解析,返回原值

            var year = date.getFullYear();
            // 过滤掉无效的默认日期（如1900-01-01、1970-01-01等）
            if (year < 2000) return "";

            var month = (date.getMonth() + 1).toString().padStart(2, "0");
            var day = date.getDate().toString().padStart(2, "0");
            var hours = date.getHours().toString().padStart(2, "0");
            var minutes = date.getMinutes().toString().padStart(2, "0");
            return year + "-" + month + "-" + day + " " + hours + ":" + minutes;
          } catch (e) {
            return dateStr;
          }
        }

        function text(v) {
          return v == null ? "" : String(v);
        }
        function joinDose(dose, unit, unitName) {
          var d = (dose || "").toString().trim();
          var u = (unitName || unit || "").toString().trim();
          if (!d && !u) return "";
          if (!d) return u;
          if (!u) return d;
          return d + " " + u;
        }

        var html = "";
        lastRenderedYizhuData.forEach(function (item, idx) {
          // 跳过子医嘱，子医嘱只在父医嘱内部显示
          if (item._isChild) return;

          var isLong = String(item.long_once_flag) === "1";
          var typeText = isLong ? "长" : "临";
          var typeCls = isLong ? "order-type-long" : "order-type-once";

          var statusCls = "";
          if (String(item.status_flag) === "5" || !isLong)
            statusCls = "font-red";
          else if (String(item.status_flag) === "2") statusCls = "font-green";
          else if (String(item.status_flag) === "0") statusCls = "font-grey";
          else if (String(item.status_flag) === "7")
            statusCls = "font-purple";

          var pcCls = item._isParent ? "parent-order-card" : "";

          var doseText = joinDose(
            item.doseage,
            item.doseage_unit,
            item.doseage_unit_name
          );
          var instruction = text(item.instruction || item.discription);
          var drugSpec = text(item.drug_specification);

          html +=
            '<div class="order-card ' +
            typeCls +
            " " +
            pcCls +
            '">' +
            '<div class="order-card-header ' + " " + statusCls + '">' +
            '<span class="order-type ' +
            (isLong ? "badge-long" : "badge-once") +
            '">' +
            typeText +
            "</span>" + '<span class="order-name">' +
            (text(item.order_name) || "未命名医嘱") +
            (item.enter_time
              ? '<small class="enter-time"> ' +
              formatToMinute(item.enter_time) +
              "</small>"
              : "") +
            "</span>" +

            "</div>" +
            '<div class="order-card-body">' +
            '<div class="field-row times-row" style="grid-column:1/-1">' +
            '<div class="field"><label>开始</label><span class="value">' +
            formatToMinute(item.start_time || item.order_date || "") +

      // 应用筛选条件
      function applyFilters() {
        // 先进行基本筛选
        var filtered = allYizhuData.filter(function (item) {
          var matchOrderType = true;
          var matchRoleType = true;
          var matchSearch = true;
          var matchItemType = true;

          // 医嘱类型筛选
          if (currentFilters.orderType === "long") {
            matchOrderType = String(item.long_once_flag) === "1";
          } else if (currentFilters.orderType === "temp") {
            matchOrderType = String(item.long_once_flag) === "0";
          }
          // 'all' 不需要筛选条件

          // 开嘱人类型筛选
          if (currentFilters.roleType === "doctor") {
            matchRoleType = String(item.fit_flag) === "1";
          } else if (currentFilters.roleType === "nurse") {
            matchRoleType = String(item.fit_flag) === "0";
          } else if (currentFilters.roleType === "mine") {
            matchRoleType = item.order_doctor === loginUser.user_mi;
          }
          // 'all-role' 不需要筛选条件

          // 项目类型筛选（靠 Serial 区分）
          var serialVal = item.Serial || item.serial || "";
          if (currentFilters.itemType === "treatment") {
            matchItemType = String(serialVal) === "**";
          } else if (currentFilters.itemType === "drug") {
            matchItemType = String(serialVal) !== "**";
          }
          // 'all' 不需要筛选条件

          // 搜索筛选
          if (
            currentFilters.searchQuery &&
            currentFilters.searchQuery.trim()
          ) {
            var query = currentFilters.searchQuery.trim().toLowerCase();
            var orderName = (item.order_name || "").toLowerCase();
            var orderText = (item.order_text || "").toLowerCase();
            var doctorName = (item.order_doctor_name || "").toLowerCase();
            var instruction = (item.instruction || "").toLowerCase();
            var drugSpec = (item.drug_specification || "").toLowerCase();

            matchSearch =
              orderName.indexOf(query) !== -1 ||
              orderText.indexOf(query) !== -1 ||
              doctorName.indexOf(query) !== -1 ||
              instruction.indexOf(query) !== -1 ||
              drugSpec.indexOf(query) !== -1;
          }

          return matchOrderType && matchRoleType && matchSearch && matchItemType;
        });

        // 补充父子医嘱：如果父医嘱被筛选出来，自动包含其所有子医嘱
        var filteredIds = new Set(filtered.map(item => item.act_order_no || item.order_no));
        var additionalChildren = [];

        allYizhuData.forEach(function (item) {
          // 如果是子医嘱，且其父医嘱在筛选结果中，但自己不在，则添加进来
          if (item._isChild && item.parent_no && filteredIds.has(item.parent_no) && !filteredIds.has(item.act_order_no || item.order_no)) {
            additionalChildren.push(item);
          }
        });

        if (additionalChildren.length > 0) {
          filtered = filtered.concat(additionalChildren);
        }

        // 对筛选后的数据进行父子医嘱排序
        var sortedData = sortYizhuDataWithParentChild(filtered);
        renderYizhuCards(sortedData);

        // 显示筛选结果提示
        var orderTypeText =
          currentFilters.orderType === "long"
            ? "长期医嘱"
            : currentFilters.orderType === "temp"
              ? "临时医嘱"
              : "全部医嘱";
        var roleTypeText =
          currentFilters.roleType === "doctor"
            ? "医生医嘱"
            : currentFilters.roleType === "nurse"
              ? "护士医嘱"
              : currentFilters.roleType === "mine"
                ? "我的医嘱"
                : "全部";

        var itemTypeText =
          currentFilters.itemType === "treatment"
            ? "诊疗"
            : currentFilters.itemType === "drug"
              ? "药品"
              : "全部";

        var hasFilters =
          currentFilters.orderType !== "all" ||
          currentFilters.roleType !== "all-role" ||
          currentFilters.itemType !== "all" ||
          (currentFilters.searchQuery && currentFilters.searchQuery.trim());

        if (hasFilters) {
          var msgParts = [`${orderTypeText} - ${roleTypeText} - ${itemTypeText}`];
          if (
            currentFilters.searchQuery &&
            currentFilters.searchQuery.trim()
          ) {
            msgParts.push(`搜索"${currentFilters.searchQuery.trim()}"`);
          }
          msgParts.push(`(${filtered.length}条)`);
          layer.msg(`已筛选：${msgParts.join(" ")}`, {
            icon: 1,
            time: 1500,
          });
        } else {
          layer.msg(`已显示全部医嘱 (${filtered.length}条)`, {
            icon: 1,
            time: 1000,
          });
        }
      }

      function openManualOrderModal() {
        ensureManualStyles();

        // 确保频率与用法已加载
        var pending = 0;
        function after() {
          if (--pending <= 0) {
            renderManualFrequencyOptions();
            renderManualSupplyOptions();
            form.render();
            // 打开弹窗
            manualOrderModalIndex = layer.open({
              type: 1,
              title: false,
              area: ["100%", "100%"],
              maxmin: true,
              content: $("#manual-order-modal"),
              success: function () {

              },
              end: function () {
                // 弹窗关闭时重置索引
                manualOrderModalIndex = null;
              },
            });
          }
        }
        pending = 0;
        if (!frequencyData || frequencyData.length === 0) {
          pending++;
          loadFrequencyData(after);
        }
        if (!supplyData || supplyData.length === 0) {
          pending++;
          loadSupplyData(after);
        }
        if (pending === 0) {
          after();
        }
      }

      // 通用的医嘱剂量和单位验证函数
      function validateOrdersCompleteness(orders, orderType) {
        var validationErrors = [];
        var incompleteOrders = [];

        orders.forEach(function (order, index) {
          var orderName = order.order_name || "";
          var doseage = (order.doseage || "").toString().trim();
          var doseageUnit = (order.doseage_unit || "").toString().trim();
          var doseageUnitName = (order.doseage_unit_name || "")
            .toString()
            .trim();

          // 检查是否需要剂量（通常药品类医嘱需要剂量）
          var needsDoseage = false; // 默认都需要剂量

          // 某些特殊医嘱可能不需要剂量，比如检查类、手术类等
          var nonDoseageKeywords = [
            "检查",
            "拍片",
            "心电图",
            "CT",
            "MRI",
            "B超",
            "手术",
            "换药",
            "护理",
            "观察",
          ];
          nonDoseageKeywords.forEach(function (keyword) {
            if (orderName.indexOf(keyword) !== -1) {
              needsDoseage = false;
            }
          });

          if (needsDoseage) {
            var hasValidDoseage =
              doseage && doseage !== "" && doseage !== "0";
            var hasValidUnit =
              (doseageUnit && doseageUnit !== "") ||
              (doseageUnitName && doseageUnitName !== "");

            if (!hasValidDoseage || !hasValidUnit) {
              incompleteOrders.push({
                index: index + 1,
                name: orderName || "未命名医嘱",
                missingDoseage: !hasValidDoseage,
                missingUnit: !hasValidUnit,
              });
            }
          }
        });

        // 如果有不完整的医嘱，返回错误信息
        if (incompleteOrders.length > 0) {
          var errorMessages = [
            "以下" + orderType + "缺少必要的剂量或单位信息：<br><br>",
          ];
          incompleteOrders.forEach(function (order) {
            var missing = [];
            if (order.missingDoseage) missing.push("剂量");
            if (order.missingUnit) missing.push("单位");

            errorMessages.push(
              "• <strong>" +
              order.name +
              "</strong><br>" +
              "  缺少：<span style='color: #ff5722;'>" +
              missing.join("、") +
              "</span><br>"
            );
          });

          return {
            isValid: false,
            errorMessage: errorMessages.join(""),
            incompleteCount: incompleteOrders.length,
          };
        }

        return { isValid: true };
      }

      // 日期格式化：输出 YYYY-MM-DD，兼容 8 位数字/Date/可解析字符串
      function formatToYMD(val) {
        if (!val) return "";

        function toDate(input) {
          if (input instanceof Date) return input;
          if (typeof input === "string") {
            var s = input.trim();
            if (/^\d{8}$/.test(s)) {
              var y = s.slice(0, 4);
              var m = s.slice(4, 6);
              var d = s.slice(6, 8);
              return new Date(y + "-" + m + "-" + d);
            }
            var parsedStr = new Date(s.replace(/\//g, "-"));
            if (!isNaN(parsedStr.getTime())) return parsedStr;
          }
          var parsed = new Date(input);
          return isNaN(parsed.getTime()) ? null : parsed;
        }

        var d = toDate(val);
        if (!d) return val || "";
        var y = d.getFullYear();
        var m = String(d.getMonth() + 1).padStart(2, "0");
        var day = String(d.getDate()).padStart(2, "0");
        return y + "-" + m + "-" + day + " " + val.toString().split(" ")[1];
      }

{
    padding: 10px;
}

#manual-order-modal .layui-col-sm5,
#manual-order-modal .layui-col-sm7
{
    width: 100%;  max-height: 50%;  padding: 6px;
}

/* 保存区高亮 */

#manual-order-form
{
    display: grid;  align-content: start;  width: 100%;  grid-template-columns: 1fr 1fr;

/* 固定两列 */
    gap: 15px;
}

/* 简化后的字段容器样式 */
#manual-order-form .layui-inline
{
    display: flex !important;  align-items: center !important;  width: 100% !important;

/* Grid子项占满网格单元 */
    margin: 0 !important;  padding: 0 !important;  gap: 8px !important;
}

#manual-order-form .layui-form-label
{
    font-size: 14px !important;  line-height: 38px !important;  width: auto !important;  min-width: 60px !important;  margin: 0 !important;  padding: 0 !important;  white-space: nowrap !important;  color: #333 !important;
}

#manual-order-form .layui-input,
#manual-order-form select
{
    font-size: 14px !important;  line-height: 38px !important;  flex: 1 !important;  width: 100%;  min-width: 0 !important;  height: 38px !important;  padding: 0 10px !important;  border: 1px solid #e6e6e6;  border-radius: 2px !important;
}

/* 按钮行样式 - 跨越两列 */
#manual-order-form .form-buttons
{
    display: flex;  flex-wrap: wrap;  justify-content: space-around;  margin-top: 5px;  grid-column: 1 / -1;

/* 跨越所有列 */
    gap: 8px;
}

/* 基本信息表单中的select样式修复 */
#manual-order-form .layui-form-select
{
    flex: 1 !important;  min-width: 0 !important;
}

#manual-order-form .layui-form-select .layui-select-title
{
    line-height: 38px !important;  width: 100% !important;  height: 38px !important;  border: 1px solid #e6e6e6 !important;  border-radius: 2px !important;
}

#manual-order-form .layui-form-select .layui-select-title input
{
    line-height: 36px !important;  height: 36px !important;  padding-right: 30px !important;
}

/* 确保select在flex容器中正常显示 */
#manual-order-form .layui-inline .layui-form-select
{
    display: block !important;  flex: 1 !important;
}

/* 保存区：卡片列表 */
#manual-order-modal #manual-draft-list
{
    display: grid;  grid-template-columns: 1fr;  gap: 8px;
}

@media (min-width: 992px)
{
    #manual-order-modal #manual-draft-list
    {
        grid-template-columns: 1fr 1fr;
    }
}

#manual-order-modal .draft-card
{
    display: flex;  flex-direction: column;  padding: 10px 12px;  cursor: pointer;  border: 1px solid #e6e6e6;  border-radius: 6px;  background: #fff;  gap: 6px;
}

#manual-order-modal .draft-card .title
{
    font-size: 14px;  font-weight: 600;  line-height: 1.4;  display: flex;  align-items: center;  color: #333;  gap: 8px;
}

#manual-order-modal .draft-card .badge
{
    font-size: 12px;  line-height: 18px;  display: inline-block;  padding: 0 6px;  color: #1e9fff;  border: 1px solid #d6ecff;  border-radius: 3px;  background: #f0f7ff;
}

#manual-order-modal .draft-card .meta
{
    font-size: 12px;  display: flex;  flex-wrap: wrap;  color: #666;  gap: 10px 16px;
}

#manual-order-modal .draft-card .meta span
{
    white-space: nowrap;
}

#manual-order-modal .draft-card .desc
{
    font-size: 12px;  overflow: hidden;  white-space: nowrap;  text-overflow: ellipsis;  color: #666;
}

#manual-order-modal .draft-card .actions
{
    display: flex;  justify-content: flex-end;  margin-top: 4px;  gap: 8px;
}

#manual-order-modal .draft-card .layui-btn
{
    font-size: 12px;  line-height: 24px;  height: 24px;  padding: 0 10px;
}

#manual-order-modal .draft-card.selected
{
    outline: 2px solid #1e9fff;  background: #f0f7ff;
}

/* ...existing code... */
/* 在小屏幕上调整布局，left/right 垂直堆叠 */
@media (max-width: 640px)
{
    #manual-order-modal .layui-col-sm5,
    #manual-order-modal .layui-col-sm7
    {
        width: 100%;
    }

    /* 小屏幕下保持双列，但调整间距和标签宽度 */
    #manual-order-form
    {
        gap: 10px !important;
        /* 减小间距 */
    }

    #manual-order-form .layui-inline
    {
        gap: 4px !important;
        /* 减小内部间距 */
    }

    #manual-order-form .layui-form-label
    {
        font-size: 13px !important;

/* 缩小字体 */

        min-width: 40px !important;

        /* 缩小标签宽度 */
    }

    #manual-order-form .layui-input,
    #manual-order-form select
    {
        font-size: 13px !important;
        /* 缩小输入框字体 */
    }
}
