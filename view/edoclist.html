<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>电子病历</title>
  <style>
    /* 布局 */
    body,
    html {
      font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #f5f6fa;
    }

    main {
      position: relative;
      display: flex;
      overflow: hidden;
      height: 100vh;
    }

    .left_area {
      display: flex;
      overflow: auto;
      flex-direction: column;
      width: 100%;
      border-right: 1px solid #e6e9ef;
      background: #fff;
    }

    .right_area,
    .right_are {
      position: relative;
      overflow: hidden;
      flex: 1;
      background: #f9fafc;
      --zoom-scale: 1;
    }

    .zoom-toolbar {
      position: absolute;
      z-index: 2;
      top: 12px;
      right: 12px;
      display: inline-flex;
      padding: 6px 8px;
      border: 1px solid #d6d9e0;
      border-radius: 8px;
      background: rgba(255, 255, 255, .9);
      box-shadow: 0 4px 12px rgba(0, 0, 0, .08);
      gap: 6px;
      backdrop-filter: blur(4px);
    }

    .zoom-btn {
      font-size: 13px;
      line-height: 1;
      min-width: 46px;
      height: 28px;
      padding: 0 10px;
      cursor: pointer;
      transition: background .2s ease, color .2s ease, transform .2s ease;
      color: #2c3e50;
      border: 1px solid #cbd2dc;
      border-radius: 6px;
      background: #f8fafc;
    }

    .zoom-btn:hover {
      color: #1b62f0;
      border-color: #b8c3d6;
      background: #eef3ff;
    }

    .zoom-btn:active {
      transform: translateY(1px);
    }

    .doc-content {
      display: block;
      overflow: auto;
      box-sizing: border-box;
      width: calc(100% / var(--zoom-scale));
      height: calc(100% / var(--zoom-scale));
      padding: 12px;
      transform: scale(var(--zoom-scale));
      transform-origin: 0 0;
      border: 0;
      background: #fff;
      touch-action: pan-x pan-y;
    }

    /* 折叠按钮 */
    .toggle-btn {
      position: absolute;
      z-index: 10;
      top: 12px;
      left: 310px;
      display: none;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      cursor: pointer;
      transition: left .2s ease, transform .2s ease, background .2s ease;
      color: #4a5568;
      border: 1px solid #d6d9e0;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
    }

    .toggle-btn:hover {
      background: #f3f6fb;
    }

    .toggle-btn .toggle-icon {
      font-size: 14px;
      line-height: 1;
      transform: translateX(-1px);
    }

    /* 折叠状态 */
    .menu-collapsed .left_area {
      width: 0;
      min-width: 0;
      border: none;
    }

    .menu-collapsed .left_area .main-menu {
      display: none;
    }

    .menu-collapsed .toggle-btn {
      left: 12px;
      display: inline-flex;
      /* transform: rotate(180deg); */
    }

    /* 菜单样式 */
    .main-menu {
      overflow-y: auto;
      box-sizing: border-box;
      height: 100%;
      padding: 10px;
      background: linear-gradient(180deg, #fff, #f9fbff);
    }

    .menu-item {
      overflow: hidden;
      margin-bottom: 10px;
      border: 1px solid #e5e9f2;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 1px 3px rgba(18, 38, 63, .05);
    }

    .menu-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      cursor: pointer;
      user-select: none;
      transition: background .2s ease;
      background: #f3f6fb;
    }

    .menu-head:hover {
      background: #e8efff;
    }

    .menu-title {
      font-size: 14px;
      font-weight: 600;
      color: #2c3e50;
    }

    .menu-switch {
      width: 18px;
      height: 18px;
      transition: transform .2s ease;
      background-repeat: no-repeat;
      background-position: center;
      background-size: 100% 100%;
    }

    .menu-item.open .menu-switch {
      transform: rotate(90deg);
    }

    .subItems {
      display: none;
      padding: 6px 0;
      background: #fff;
    }

    .menu-item.open .subItems {
      display: block;
    }

    .subItem {
      font-size: 13px;
      line-height: 1.4;
      display: block;
      padding: 8px 14px;
      transition: background .15s ease, color .15s ease;
      text-decoration: none;
      word-break: break-all;
      color: #34495e;
      border-left: 2px solid transparent;
    }

    .subItem:hover {
      color: #1b62f0;
      border-left-color: #1b62f0;
      background: #f0f5ff;
    }

    .subItem.active {
      font-weight: 600;
      color: #1554c7;
      border-left-color: #1554c7;
      background: #e6f0ff;
    }

    /* 滚动条优化 */
    .main-menu::-webkit-scrollbar {
      width: 8px;
    }

    .main-menu::-webkit-scrollbar-thumb {
      border-radius: 10px;
      background: rgba(0, 0, 0, .15);
    }

    .main-menu::-webkit-scrollbar-track {
      background: transparent;
    }

    /* 空状态 */
    .empty-menu {
      font-size: 13px;
      padding: 24px;
      text-align: center;
      color: #98a6b5;
    }
  </style>
</head>

<body>
  <main>
    <div class="left_area"></div>
    <div class="right_area">
      <!-- <div class="zoom-toolbar">
        <button type="button" class="zoom-btn" data-action="out" title="缩小">-</button>
        <button type="button" class="zoom-btn" data-action="reset" title="重置">50%</button>
        <button type="button" class="zoom-btn" data-action="in" title="放大">+</button>
      </div> -->
      <div class="doc-content" title="文档预览"></div>
    </div>
  </main>
  <script src="/lib/layui-v2.6.3/layui.js" charset="utf-8"></script>
  <script src="/lib/lay-config.js?v=1.0.4" charset="utf-8"></script>
  <script>
    layui.use(["tree", "appconfig", "element"], function () {
      const $ = layui.jquery;
      const appconfig = layui.appconfig;
      const userData = JSON.parse(localStorage.getItem("userData"));
      getLeftMenu();

      // 插入折叠按钮
      const $toggleBtn = $('<button class="toggle-btn" id="toggle-menu" title="折叠/展开左侧菜单"><span class="toggle-icon">⟨</span></button>');
      $("main").append($toggleBtn);

      // 折叠逻辑
      $(document).on("click", "#toggle-menu", function () {
        const $main = $("main");
        const collapsed = $main.hasClass("menu-collapsed");
        if (collapsed) {
          $main.removeClass("menu-collapsed");
        } else {
          $main.addClass("menu-collapsed");
        }
      });

      // 缩放控制
      const zoomState = {
        value: 0.5,
        min: 0.5,
        max: 2,
        step: 0.1
      };

      function applyZoom() {
        const rightArea = document.querySelector('.right_area');
        if (!rightArea) return;
        rightArea.style.setProperty('--zoom-scale', zoomState.value);
        const resetBtn = document.querySelector('.zoom-btn[data-action="reset"]');
        if (resetBtn) {
          resetBtn.textContent = Math.round(zoomState.value * 100) + '%';
        }
      }

      // 双指缩放（移动端）
      (function initPinchZoom() {
        const content = document.querySelector('.doc-content');
        if (!content) return;

        const state = {
          active: false,
          startDist: 0,
          startZoom: zoomState.value,
        };

        function getDistance(touches) {
          const dx = touches[0].pageX - touches[1].pageX;
          const dy = touches[0].pageY - touches[1].pageY;
          return Math.sqrt(dx * dx + dy * dy);
        }

        content.addEventListener('touchstart', function (e) {
          if (e.touches.length === 2) {
            state.active = true;
            state.startDist = getDistance(e.touches);
            state.startZoom = zoomState.value;
          }
        }, { passive: true });

        content.addEventListener('touchmove', function (e) {
          if (state.active && e.touches.length === 2) {
            e.preventDefault();
            const dist = getDistance(e.touches);
            const scale = dist / state.startDist;
            zoomState.value = Math.min(zoomState.max, Math.max(zoomState.min, +(state.startZoom * scale).toFixed(2)));
            applyZoom();
          }
        }, { passive: false });

        const endHandler = function (e) {
          if (e.touches.length < 2) {
            state.active = false;
          }
        };

        content.addEventListener('touchend', endHandler, { passive: true });
        content.addEventListener('touchcancel', endHandler, { passive: true });
      })();

      $(document).on('click', '.zoom-btn', function () {
        const action = $(this).data('action');
        if (action === 'in') {
          zoomState.value = Math.min(zoomState.max, +(zoomState.value + zoomState.step).toFixed(2));
        } else if (action === 'out') {
          zoomState.value = Math.max(zoomState.min, +(zoomState.value - zoomState.step).toFixed(2));
        } else if (action === 'reset') {
          zoomState.value = 0.5;
        }
        applyZoom();
      });

      applyZoom();

      function setSwitchIcon($switch, isOpen) {
        const openIcon = $switch.attr("open") || "";
        const closeIcon = $switch.attr("close") || "";
        const icon = isOpen ? openIcon : closeIcon;
        if (icon) {
          $switch.css("background-image", `url(${icon})`);
        } else {
          // 如果没有提供图片，用简单箭头
          $switch.css({
            "background-image": "none",
            "border-left": "6px solid #718096",
            "border-top": "5px solid transparent",
            "border-bottom": "5px solid transparent",
            width: "0",
            height: "0",
          });
          if (isOpen) {
            $switch.css({ transform: "rotate(90deg)" });
          } else {
            $switch.css({ transform: "rotate(0deg)" });
          }
        }
      }

      function bindMenuInteractions() {
        // 默认展开第一个菜单
        const $firstItem = $(".main-menu .menu-item").first();
        $firstItem.addClass("open");
        $firstItem.find(".subItems").show();
        setSwitchIcon($firstItem.find(".menu-switch"), true);

        // 事件委托：切换折叠/展开
        $(document).on("click", ".menu-head", function () {
          const $item = $(this).closest(".menu-item");
          const $sub = $item.children(".subItems");
          const $switch = $(this).find(".menu-switch");
          const isOpen = $item.hasClass("open");

          // 单开模式：关闭兄弟项

          // $item.siblings(".menu-item").removeClass("open").children(".subItems").slideUp(150);
          // $item.siblings(".menu-item").find(".menu-switch").each(function () {
          //   setSwitchIcon($(this), false);
          // });
          if (isOpen) {
            $item.removeClass("open");
            $sub.slideUp(150);
            setSwitchIcon($switch, false);
          } else {
            $item.addClass("open");
            $sub.slideDown(150);
            setSwitchIcon($switch, true);
          }
        });

        // 子项激活态
        $(document).on("click", ".subItem", function (e) {
          $(".subItem").removeClass("active");
          $(this).addClass("active");
          // 继续调用原有的 GetHtmlStr
        });
      }

      function getLeftMenu() {
        $.ajax({
          url: appconfig.api + '/api/Report/GetBlPageHtml?inp_no=' + userData.inpatient_no,
          type: 'GET',
          success: function (data) {
            console.log(data);

            if (data) {
              $('.left_area').html(data);
              bindMenuInteractions();
            } else {
              $('.left_area').html('<div class="empty-menu">暂无菜单数据</div>');
            }
          },
          error: function () {
            $('.left_area').html('<div class="empty-menu">菜单加载失败，请重试</div>');
          }
        })
      }
      // 暴露到全局，供 inline onclick 调用
      window.GetHtmlStr = function (file_id) {
        $.ajax({
          url: appconfig.api + '/api/Report/GetBlDetailHtml?file_id=' + file_id,
          type: 'GET',
          success: function (html) {
            const container = document.querySelector('.doc-content');
            if (container) {
              $('main').addClass("menu-collapsed");
              container.innerHTML = html || '<div style="padding:16px;font-family:Segoe UI,Microsoft YaHei,sans-serif;color:#4a5568;">暂无内容</div>';
            } else {
              $('.right_area').html(html);
            }
          },
          error: function () {
            const container = document.querySelector('.doc-content');
            if (container) {
              container.innerHTML = '<div style="padding:16px;font-family:Segoe UI,Microsoft YaHei,sans-serif;color:#c53030;">加载文档失败，请重试</div>';
            }
            layer.msg('加载文档失败', { icon: 5 });
          }
        });
      };
    });
  </script>
</body>

</html>
