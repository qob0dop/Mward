  <style>
    /* 套餐选择弹窗样式（检验页面） */
    .package-form {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .package-content {
      overflow: hidden;
      flex: 1;
    }

    .package-selector {
      display: flex;
      flex-direction: column;
      height: 100%;
      gap: 15px;
    }

    .package-select-area {
      flex: 0 0 auto;
      padding: 15px;
      border-bottom: 1px solid #e6e6e6;
      background: #f8f9fa;
    }

    .package-select-label {
      font-size: 14px;
      font-weight: bold;
      display: block;
      margin-bottom: 8px;
      color: #333;
    }

    .package-select {
      position: relative;
      width: 100%;
      height: 36px;
      cursor: pointer;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: white;
    }

    .package-select-display {
      font-size: 13px;
      line-height: 36px;
      width: 100%;
      height: 100%;
      padding: 0 30px 0 10px;
      cursor: pointer;
      user-select: none;
      color: #333;
      border: none;
      outline: none;
      background: transparent;
    }

    .package-select-display.placeholder {
      color: #999;
    }

    .package-select-arrow {
      font-size: 12px;
      position: absolute;
      top: 50%;
      right: 10px;
      transition: transform .2s ease;
      transform: translateY(-50%);
      pointer-events: none;
      color: #666;
    }

    .package-select.open .package-select-arrow {
      transform: translateY(-50%) rotate(180deg);
    }

    .package-select:focus {
      border-color: #1e9fff;
      box-shadow: 0 0 3px rgba(30, 159, 255, .3);
    }

    .package-dropdown {
      position: absolute;
      z-index: 1000;
      top: 100%;
      right: 0;
      left: 0;
      display: none;
      overflow-y: auto;
      max-height: 200px;
      border: 1px solid #ddd;
      border-top: none;
      border-radius: 0 0 4px 4px;
      background: white;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .1);
    }

    .package-dropdown.show {
      display: block;
    }

    .package-option {
      font-size: 13px;
      padding: 8px 10px;
      cursor: pointer;
      transition: background-color .2s ease;
      color: #333;
      border-bottom: 1px solid #f5f5f5;
    }

    .package-option:hover {
      background: #f5f5f5;
    }

    .package-option:last-child {
      border-bottom: none;
    }

    .package-option.selected {
      color: white;
      background: #1e9fff;
    }

    .package-items-area {
      display: flex;
      flex: 1;
      flex-direction: column;
      min-height: 0;
    }

    .items-container {
      overflow-y: auto;
      flex: 1;
      max-height: 280px;
    }

    .items-header {
      font-size: 13px;
      font-weight: bold;
      padding: 8px;
      text-align: center;
      color: #fff;
      background: #1e9fff;
    }

    .items-list {
      padding: 10px;
    }

    .item-checkbox {

      border-bottom: 1px solid #f0f0f0;

    /* 卡片视图样式 */
    .cards-view {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: #f5f5f5;
    }

    .toolbar-container {
      display: flex;

      flex-shrink: 0;

      padding: 10px 15px;
      border-bottom: 1px solid #e6e6e6;
      background: #fff;
    }

    }

      margin-right: 6px;

    }

    .toolbar-actions {

    .cards-container {
      /* 改为网格布局，尽可能展示更多卡片 */
      display: grid;
      overflow-y: auto;

      padding: 10px;

      box-shadow: 0 1px 3px rgba(0, 0, 0, .08);

    .card-header {

      font-weight: 600;
      line-height: 1.2;
      display: flex;
      align-items: center;
      justify-content: space-between;

    .card-title {
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      color: #2c5282;

    .card-title i {
      font-size: 14px;
      margin-right: 5px;
    }

      color: #666;

    .card-status {

  <script src="/lib/pdfjs/build/pdf.mjs" type="module"></script>

  <script>
    // 防抖函数
    function debounce(func, wait) {
      let timeout;
      return function executedFunction(...args) {
        const later = () => {
          clearTimeout(timeout);
          func(...args);
        };
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
      };
    }

    layui.use(["appconfig", "layer", "form"], function () {
      var $ = layui.jquery;
      var appconfig = layui.appconfig;
      var layer = layui.layer;
      var form = layui.form;
      const userData = localStorage.getItem("userData") ? JSON.parse(localStorage.getItem("userData")) : {};
      // 获取URL参数
      function getUrlParam(name) {
        var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)");
        var r = window.location.search.substr(1).match(reg);
        if (r != null) return unescape(r[2]);
        return null;
      }

      var patient_id = getUrlParam("patient_id");
      var admiss_times = getUrlParam("admiss_times");

      // 获取患者信息 (已在顶部显示，此处不再重复)

      // 套餐数据变量
      var testPackages = [];
      var allTestItems = []; // 所有检验项目数据
      var cardsData = []; // 卡片数据

      // 格式化状态显示
      function formatStatus(status) {
        switch (status) {
          case "0":
            return { text: "申请", class: "status-pending" };
          case "1":
            return { text: "已登记", class: "status-completed" };
          default:
            return { text: "未保存", class: "status-cancelled" };
        }
      }

      // 格式化日期显示（精确到分钟）
      function formatDate(dateStr) {
        if (!dateStr) return "-";
        try {
          var date = new Date(dateStr);
          var year = date.getFullYear();
          var month = (date.getMonth() + 1).toString().padStart(2, "0");
          var day = date.getDate().toString().padStart(2, "0");
          var hours = date.getHours().toString().padStart(2, "0");
          var minutes = date.getMinutes().toString().padStart(2, "0");
          return (
            year +
            "-" +
            month +
            "-" +
            day +
            " " +
            hours +
            ":" +
            minutes

      // 渲染卡片（按reg_date降序排列）
      function renderCards(data) {
        var container = document.getElementById("cards-container");

        if (!data || data.length === 0) {
          container.innerHTML =
            '<div class="empty-state">' +
            '<i class="layui-icon layui-icon-template-1"></i>' +
            '<div class="empty-state-text">暂无检验申请数据</div>' +
            '<div class="empty-state-desc">点击"新建申请"按钮创建检验申请</div>' +
            "</div>";
          return;
        }

        // 按时间倒序排列（最新的在前面）
        var sortedData = data.slice().sort(function (a, b) {
          var timeA = new Date(a.reg_date || 0).getTime();
          var timeB = new Date(b.reg_date || 0).getTime();
          return timeB - timeA;
        });

        var cardsHTML = "";
        sortedData.forEach(function (item) {
          cardsHTML += generateCardHTML(item);
        });

        container.innerHTML = cardsHTML;
      }

            admiss_times,
          type: "GET",
          dataType: "json",
          success: function (res) {
            var parseRes = {
              code: res.Status === 1 ? 0 : res.Status,
              msg: res.msg || "",
              count: res.Data ? res.Data.length : 0,
              data: res.Data || [],
            };
            if (parseRes.code === 0) {
              cardsData = parseRes.data;
              renderCards(cardsData);
            } else {
              cardsData = [];
              renderCards([]);
            }
          },
          error: function () {
            layer.msg("获取数据失败", { icon: 5 });
            renderCards([]);
          },
        });

      // 提交检验申请
      function submitTestApply(selectedItems, callback) {
        console.log("提交检验申请 - selectedItems:", selectedItems);
        console.log("提交检验申请 - allTestItems长度:", allTestItems.length);

        var loginUser = localStorage.getItem("loginUser");
        var patientData = JSON.parse(
          localStorage.getItem("patientData") || "{}"
        );

        if (!loginUser) {
          layer.msg("登录信息已过期，请重新登录", { icon: 5 });
          callback(false);
          return;
        }

        var loginUserData = JSON.parse(loginUser);
        var todoList = [];
        var completedCount = 0;
        var totalCount = selectedItems.length;

        console.log("开始处理 selectedItems，总数:", totalCount);

        // 为每个选中的项目创建申请记录
        selectedItems.forEach(function (selectedItem) {
          console.log("处理 selectedItem:", selectedItem);

          // 从allTestItems中找到完整的项目信息
          var fullItem = allTestItems.find(function (item) {
            return (
              item.id == selectedItem.id ||
              item.code == selectedItem.id ||
              item.sub_code == selectedItem.id ||
              item.item_id == selectedItem.id
            );
          });

          console.log("找到的 fullItem:", fullItem);

          if (!fullItem) {
            console.log(
              "未找到对应的 fullItem，selectedItem.id:",
              selectedItem.id
            );
            console.log("allTestItems 样例数据:", allTestItems.slice(0, 3));
            completedCount++;
            if (completedCount === totalCount) {
              submitAllApplies();
            }
            return;
          }

          // 获取申请单编号
          getApplySn(function (success, applyData) {
            console.log(
              "getApplySn 结果 - success:",
              success,
              "applyData:",
              applyData
            );

            if (success && applyData) {
              // 获取当前本地时间
              var now = new Date();
              var localDateTime =
                now.getFullYear() +
                "-" +
                (now.getMonth() + 1).toString().padStart(2, "0") +
                "-" +
                now.getDate().toString().padStart(2, "0") +
                " " +
                now.getHours().toString().padStart(2, "0") +
                ":" +
                now.getMinutes().toString().padStart(2, "0") +
                ":" +
                now.getSeconds().toString().padStart(2, "0");

              var applyModel = {
                jyapply_no:
                  applyData.apply_date +
                  applyData.apply_sn.toString().padStart(5, "0"),
                reg_date: localDateTime,
                admiss_diag: patientData.admiss_diag || "",
                admiss_times: admiss_times,
                age: (patientData.age || "").replace("岁", ""),
                bed_no: patientData.bed_no || "",
                birth_date: patientData.birth_date
                  ? new Date(patientData.birth_date)
                    .toLocaleDateString("zh-CN")
                    .replace(/\//g, "-")
                  : "",
                charge_amount: "1",
                dept: patientData.dept || "",
                doctor_code: loginUserData.user_mi,
                erem_flag: "0", // 默认值，可能需要根据实际情况调整
                exec_unit: fullItem.exec_unit || "",
                grp_code: fullItem.code || "",
                grp_name:
                  fullItem.sub_code_name ||
                  fullItem.name ||
                  fullItem.item_name,
                inpatient_no: patientData.inpatient_no || "",
                name: patientData.name || "",
                patient_id: patient_id,
                patient_type: "2", // 1:门诊，2：住院
                purpose: patientData.admiss_diag_name || "",
                samp_id:
                  applyData.apply_date +
                  applyData.apply_sn.toString().padStart(5, "0"),
                sample_type: fullItem.sample_type || "",
                sample_type_name: fullItem.sample_type_name || "",
                sex: patientData.sex || "",
                status: "0",
                add_new: true,
                ward: userData.admiss_ward || "",
                status_name: "未保存",
              };

              console.log("创建的 applyModel:", applyModel);
              todoList.push(applyModel);
              console.log("添加到 todoList 后，长度:", todoList.length);
            } else {
              console.log("获取申请单编号失败");
            }

            completedCount++;
            if (completedCount === totalCount) {
              submitAllApplies();
            }
          });
        });

        // 提交所有申请
        function submitAllApplies() {
          console.log("submitAllApplies - todoList长度:", todoList.length);
          console.log("submitAllApplies - todoList内容:", todoList);

          if (todoList.length === 0) {
            layer.msg("没有有效的申请数据", { icon: 5 });
            callback(false);
            return;
          }

          $.ajax({
            url: appconfig.api + "/api/JcJy/JianyanSubmit",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify(todoList),
            dataType: "json",
            success: function (res) {
              if (res.Status === 1) {
                callback(true);
              } else {
                layer.msg("提交申请失败: " + (res.Msg || "未知错误"), {
                  icon: 5,
                });
                callback(false);
              }
            },
            error: function () {
              layer.msg("网络错误，申请提交失败", { icon: 5 });
              callback(false);
            },
          });
        }
      }

          time: 0,
        });

          loadPackages(function (packagesSuccess) {

            var packageOptionsHtml = "";

                (pkg.value || "") +
                '">' +

                "</div>";

              maxmin: false,
              resize: false,
              content:
                '<div class="package-form">' +
                '<div class="package-content">' +
                '<div class="package-selector">' +
                '<div class="package-select-area">' +
                '<label class="package-select-label">选择检验套餐：</label>' +
                '<div class="package-select" id="package-select" tabindex="0">' +
                '<div class="package-select-display placeholder">请选择检验套餐</div>' +
                '<i class="layui-icon layui-icon-down package-select-arrow"></i>' +
                '<div class="package-dropdown">' +
                packageOptionsHtml +
                "</div>" +
                "</div>" +
                "</div>" +
                '<div class="package-items-area">' +
                '<div class="items-container">' +
                '<div class="no-package-selected">' +
                '<i class="layui-icon layui-icon-file" style="font-size: 36px; display: block; margin-bottom: 8px;"></i>' +
                "请先选择检验套餐" +
                "</div>" +
                "</div>" +
                "</div>" +
                "</div>" +
                "</div>" +
                '<div class="dialog-buttons">' +
                '<button class="layui-btn layui-btn-normal" id="confirm-items">' +
                '<i class="layui-icon layui-icon-ok"></i> 确认申请' +
                "</button>" +
                '<button class="layui-btn layui-btn-primary" id="cancel-items">' +
                '<i class="layui-icon layui-icon-close"></i> 取消' +
                "</button>" +
                "</div>" +
                "</div>",
              success: function (layero, index) {
                var selectedPackage = null;
                var selectedItems = [];

                // 显示项目列表
                function showItems(pkg) {
                  var pkgTitle = pkg.title || pkg.name || "未命名套餐";
                  var itemsHtml =
                    '<div class="items-header">' +
                    pkgTitle +
                    " - 检验项目</div>" +
                    '<div class="items-list">';

                  // 根据套餐的value值过滤项目
                  var packageItems = [];
                  if (pkg.value && allTestItems.length > 0) {
                    var valueIds = pkg.value.split(",");
                    valueIds.forEach(function (id) {
                      var trimmedId = id.trim();
                      var item = allTestItems.find(function (testItem) {
                        return (
                          testItem.id == trimmedId ||
                          testItem.code == trimmedId
                        );
                      });
                      if (item) {
                        packageItems.push(item);
                      }
                    });
                  }

                  if (packageItems.length > 0) {
                    packageItems.forEach(function (item) {
                      console.log("生成checkbox的item数据:", item);

                      // 尝试多个可能的id字段名
                      var itemId =
                        item.id ||
                        item.code ||
                        item.sub_code ||
                        item.item_id ||
                        "";
                      console.log("使用的itemId:", itemId);

                      itemsHtml +=
                        '<label class="item-checkbox">' +
                        '<input type="checkbox" value="' +
                        itemId +
                        '" data-name="' +
                        (item.name || item.item_name || item.sub_code_name) +
                        '" data-price="' +
                        (item.price || item.charge_amount || "0.00") +
                        '">' +
                        '<span class="item-name">' +
                        (item.name || item.item_name || item.sub_code_name) +
                        "</span>" +
                        "</label>";
                    });
                  } else {
                    itemsHtml +=
                      '<div style="text-align: center; padding: 50px; color: #999;">该套餐暂无项目数据</div>';
                  }

                  itemsHtml += "</div>";

                  $(layero).find(".items-container").html(itemsHtml);

                  // 监听项目选择
                  $(layero)
                    .find(".item-checkbox input")
                    .change(function () {
                      updateSelectedItems();
                    });
                }

                // 更新选中项目列表
                function updateSelectedItems() {
                  selectedItems = [];
                  $(layero)
                    .find(".item-checkbox input:checked")
                    .each(function () {
                      selectedItems.push({
                        id: $(this).val(),
                        name: $(this).data("name"),
                        price: $(this).data("price"),
                      });
                    });
                }

                // 套餐选择事件
                var $packageSelect = $(layero).find("#package-select");
                var $packageDisplay = $packageSelect.find(
                  ".package-select-display"
                );
                var $packageDropdown =
                  $packageSelect.find(".package-dropdown");

                // 点击显示/隐藏下拉框
                $packageSelect.on("click", function (e) {
                  e.stopPropagation();
                  if ($packageDropdown.hasClass("show")) {
                    $packageDropdown.removeClass("show");
                    $packageSelect.removeClass("open");
                  } else {
                    $packageDropdown.addClass("show");
                    $packageSelect.addClass("open");
                  }
                });

                // 选择选项
                $packageDropdown.on("click", ".package-option", function (e) {
                  e.stopPropagation();
                  var packageId = $(this).data("id");
                  var packageName = $(this).text();

                  // 更新显示
                  $packageDisplay
                    .text(packageName)
                    .removeClass("placeholder");
                  $packageDropdown
                    .find(".package-option")
                    .removeClass("selected");
                  $(this).addClass("selected");

                  // 隐藏下拉框
                  $packageDropdown.removeClass("show");
                  $packageSelect.removeClass("open");

                  // 处理选择逻辑
                  if (packageId) {
                    selectedPackage = testPackages.find(
                      (pkg) => pkg.id == packageId
                    );
                    selectedItems = []; // 切换套餐时清空已选项目
                    showItems(selectedPackage);
                  }
                });

                // 点击其他地方关闭下拉框
                $(document).on("click", function () {
                  $packageDropdown.removeClass("show");
                  $packageSelect.removeClass("open");
                });

                // 键盘支持
                $packageSelect.on("keydown", function (e) {
                  if (e.keyCode === 13 || e.keyCode === 32) {
                    // Enter或Space
                    e.preventDefault();
                    $(this).click();
                  }
                });

                // 确认申请
                $(layero)
                  .find("#confirm-items")
                  .click(function () {
                    if (!selectedPackage) {
                      layer.msg("请先选择一个检验套餐", { icon: 5 });
                      return;
                    }

                    if (selectedItems.length === 0) {
                      layer.msg("请至少选择一个检验项目", { icon: 5 });
                      return;
                    }

                    // 显示提交进度
                    var submitIndex = layer.msg("正在提交申请...", {
                      icon: 16,
                      shade: 0.3,
                      time: 0,
                    });

                    // 提交申请
                    submitTestApply(selectedItems, function (success) {
                      layer.close(submitIndex);
                      if (success) {
                        layer.msg("检验项目申请成功！", {
                          icon: 1,
                          time: 2000,
                          end: function () {
                            layer.close(index);
                            // 重新加载卡片数据
                            loadCardsData();
                          },
                        });
                      }
                    });
                  });

                // 取消申请
                $(layero)
                  .find("#cancel-items")
                  .click(function () {
                    layer.close(index);
                  });
              },
            });
          });
        });
      }
