<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>手术信息</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="stylesheet" href="/lib/layui-v2.6.3/css/layui.css" media="all" />
  <link rel="stylesheet" href="/css/public.css" media="all" />
  <style>
    /* 卡片视图样式 */
    .cards-view {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: #f5f5f5;
    }

    .toolbar-container {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      justify-content: space-between;
      padding: 10px 15px;
      border-bottom: 1px solid #e6e6e6;
      background: #fff;
    }

    .toolbar-title {
      font-size: 16px;
      font-weight: bold;
      display: flex;
      align-items: center;
      color: #333;
    }

    .toolbar-title i {
      font-size: 16px;
      margin-right: 6px;
      color: #1e9fff;
    }

    .toolbar-actions {
      display: flex;
      gap: 8px;
    }

    .cards-container {
      overflow-y: auto;
      flex: 1;
      padding: 10px;
    }

    .card-item {
      margin-bottom: 8px;
      transition: all .3s ease;
      border: 1px solid #e6e6e6;
      border-radius: 6px;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .1);
    }

    .card-item:hover {
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, .15);
    }

    .card-header {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 32px;
      padding: 8px 12px;
      color: #2c5282;
      border-bottom: 1px solid #dbeafe;
      border-radius: 6px 6px 0 0;
      background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      flex: 1;
      min-width: 0;
      color: #2c5282;
    }

    .card-title i {
      font-size: 16px;
      margin-right: 5px;
      flex-shrink: 0;
    }

    .op-name {
      font-size: 13px;
      font-weight: 700;
      overflow: hidden;
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      text-overflow: ellipsis;
      color: inherit;
    }

    .op-code {
      font-size: 10px;
      font-weight: 400;
      margin-left: 6px;
      opacity: .7;
      color: inherit;
      flex-shrink: 0;
    }

    .card-status {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 10px;
      cursor: default;
      pointer-events: none;
      color: #fff;
      border: none;
      border-radius: 999px;
      box-shadow: inset 0 -1px 0 rgba(0, 0, 0, .1);
      flex-shrink: 0;
    }

    .status-scheduled {
      background: #2196f3;
      /* 蓝色 - 已安排 */
    }

    .status-completed {
      background: #4caf50;
      /* 绿色 - 已完成 */
    }

    .status-pending {
      background: #ff9800;
      /* 橙色 - 待安排 */
    }

    .status-cancelled {
      background: #9e9e9e;
      /* 灰色 - 已取消 */
    }

    .card-body {
      padding: 10px 12px;
    }

    .info-row {
      font-size: 12px;
      display: flex;
      align-items: flex-start;
      margin-bottom: 8px;
      color: #666;
    }

    .info-row:last-child {
      margin-bottom: 0;
    }

    .info-label {
      font-weight: 600;
      display: flex;
      align-items: center;
      min-width: 75px;
      color: #333;
      flex-shrink: 0;
    }

    .info-label i {
      font-size: 14px;
      margin-right: 4px;
      color: #1e9fff;
    }

    .info-value {
      flex: 1;
      min-width: 0;
      word-break: break-all;
    }

    .time-info {
      display: grid;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #f0f0f0;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .time-item {
      font-size: 11px;
      display: flex;
      flex-direction: column;
    }

    .time-label {
      font-size: 10px;
      margin-bottom: 2px;
      color: #999;
    }

    .time-value {
      font-size: 11px;
      font-weight: 500;
      color: #333;
    }

    .card-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #f0f0f0;
      gap: 6px;
    }

    .card-btn {
      font-size: 11px;
      display: flex;
      align-items: center;
      padding: 4px 12px;
      cursor: pointer;
      transition: all .2s ease;
      border: none;
      border-radius: 4px;
      gap: 3px;
    }

    .card-btn-detail {
      color: #1976d2;
      border: 1px solid #bbdefb;
      background: #e3f2fd;
    }

    .card-btn-detail:hover {
      transform: scale(1.05);
      color: #fff;
      background: #2196f3;
    }

    .card-btn-edit {
      color: #f57c00;
      border: 1px solid #ffe0b2;
      background: #fff3e0;
    }

    .card-btn-edit:hover {
      transform: scale(1.05);
      color: #fff;
      background: #ff9800;
    }

    .card-btn-delete {
      color: #c62828;
      border: 1px solid #ffcdd2;
      background: #ffebee;
    }

    .card-btn-delete:hover {
      transform: scale(1.05);
      color: #fff;
      background: #e57373;
    }

    .empty-state {
      padding: 60px 20px;
      text-align: center;
      color: #999;
    }

    .empty-state i {
      font-size: 64px;
      display: block;
      margin-bottom: 16px;
      opacity: .3;
    }

    .empty-state-text {
      font-size: 16px;
      margin-bottom: 8px;
      color: #666;
    }

    .empty-state-desc {
      font-size: 13px;
      opacity: .7;
    }

    /* 详情弹窗样式 */
    .detail-content {
      padding: 15px;
    }

    .detail-section {
      margin-bottom: 20px;
    }

    .detail-section:last-child {
      margin-bottom: 0;
    }

    .detail-section-title {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 12px;
      padding-bottom: 8px;
      color: #333;
      border-bottom: 2px solid #1e9fff;
    }

    .detail-item {
      font-size: 13px;
      display: flex;
      margin-bottom: 10px;
      padding: 8px;
      border-radius: 4px;
      background: #f8f9fa;
    }

    .detail-item:last-child {
      margin-bottom: 0;
    }

    .detail-label {
      font-weight: 600;
      min-width: 100px;
      color: #666;
    }

    .detail-value {
      flex: 1;
      color: #333;
    }

    /* 时间轴样式 */
    .timeline {
      position: relative;
      padding-left: 30px;
    }

    .timeline-item {
      position: relative;
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 1px dashed #e6e6e6;
    }

    .timeline-item:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }

    .timeline-item::before {
      position: absolute;
      left: -26px;
      width: 12px;
      height: 12px;
      content: '';
      border: 2px solid #1e9fff;
      border-radius: 50%;
      background: #fff;
    }

    .timeline-item::after {
      position: absolute;
      top: 12px;
      bottom: -15px;
      left: -21px;
      width: 2px;
      content: '';
      background: #e6e6e6;
    }

    .timeline-item:last-child::after {
      display: none;
    }

    .timeline-time {
      font-size: 12px;
      font-weight: 600;
      color: #1e9fff;
    }

    .timeline-content {
      font-size: 12px;
      margin-top: 5px;
      color: #666;
    }

    /* 移动端适配 */
    @media (max-width: 768px) {
      .toolbar-container {
        padding: 8px 12px;
      }

      .toolbar-title {
        font-size: 15px;
      }

      .cards-container {
        padding: 8px;
      }

      .card-item {
        margin-bottom: 6px;
      }

      .card-header {
        padding: 6px 10px;
      }

      .card-title {
        font-size: 13px;
      }

      .op-name {
        font-size: 12px;
      }

      .op-code {
        font-size: 9px;
      }

      .card-status {
        font-size: 9px;
        padding: 2px 8px;
      }

      .card-body {
        padding: 8px 10px;
      }

      .info-row {
        font-size: 11px;
        margin-bottom: 6px;
      }

      .info-label {
        min-width: 65px;
      }

      .time-info {
        gap: 6px;
      }

      .detail-content {
        padding: 10px;
      }

      .detail-item {
        font-size: 12px;
        flex-direction: column;
      }

      .detail-label {
        margin-bottom: 4px;
      }
    }

    /* 新建申请按钮样式 */
    #btn-new-apply-card {
      color: #435cab;
      border-radius: 15px;
      background-color: #d2d8e7;
    }
  </style>
</head>

<body>
  <div class="layui-container" style="height: 100%">
    <div class="layui-row" style="height: 100%">
      <div class="layui-col-md12" style="height: 100%">
        <!-- 卡片视图容器 -->
        <div class="cards-view" id="cards-view">
          <!-- 工具栏 -->
          <div class="toolbar-container">
            <div class="toolbar-title">
              <i class="layui-icon layui-icon-template-1"></i>
              手术信息列表
            </div>
            <div class="toolbar-actions">
              <button class="layui-btn layui-btn-warm layui-btn-sm" id="btn-new-apply-card">
                <i class="layui-icon layui-icon-add-1"></i> 新建申请
              </button>
            </div>
          </div>

          <!-- 卡片容器 -->
          <div class="cards-container" id="cards-container">
            <div class="empty-state">
              <i class="layui-icon layui-icon-template-1"></i>
              <div class="empty-state-text">暂无手术信息数据</div>
              <div class="empty-state-desc">点击"新建申请"按钮创建手术申请</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/lib/layui-v2.6.3/layui.js" charset="utf-8"></script>
  <script src="/js/lay-config.js?v=1.0.4" charset="utf-8"></script>
  <script>
    layui.use(["appconfig", "layer", "form"], function () {
      var $ = layui.jquery;
      var appconfig = layui.appconfig;
      var layer = layui.layer;
      var form = layui.form;
      const userData = JSON.parse(window.localStorage.getItem("userData")) || {};
      // 获取URL参数
      function getUrlParam(name) {
        var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)");
        var r = window.location.search.substr(1).match(reg);
        if (r != null) return unescape(r[2]);
        return null;
      }

      var patient_id = userData.patient_id;
      var admiss_times = userData.admiss_times;

      // 卡片数据
      var cardsData = [];

      // 判断手术状态
      function getOpStatus(item) {
        var now = new Date();
        var opStart = item.op_datetime ? new Date(item.op_datetime) : null;
        var opEnd = item.op_endtime ? new Date(item.op_endtime) : null;

        if (opEnd && now > opEnd) {
          return { text: "已完成", class: "status-completed" };
        } else if (opStart && now >= opStart && opEnd && now <= opEnd) {
          return { text: "进行中", class: "status-scheduled" };
        } else if (opStart && now < opStart) {
          return { text: "已安排", class: "status-pending" };
        } else {
          return { text: "待安排", class: "status-pending" };
        }
      }

      // 格式化日期显示（精确到分钟）
      function formatDate(dateStr) {
        if (!dateStr) return "-";
        try {
          var date = new Date(dateStr);
          var year = date.getFullYear();
          var month = (date.getMonth() + 1).toString().padStart(2, "0");
          var day = date.getDate().toString().padStart(2, "0");
          var hours = date.getHours().toString().padStart(2, "0");
          var minutes = date.getMinutes().toString().padStart(2, "0");
          return year + "-" + month + "-" + day + " " + hours + ":" + minutes;
        } catch (e) {
          return "-";
        }
      }

      // 格式化简短日期（只显示日期）
      function formatShortDate(dateStr) {
        if (!dateStr) return "-";
        try {
          var date = new Date(dateStr);
          var year = date.getFullYear();
          var month = (date.getMonth() + 1).toString().padStart(2, "0");
          var day = date.getDate().toString().padStart(2, "0");
          return year + "-" + month + "-" + day;
        } catch (e) {
          return "-";
        }
      }

      // 格式化时间（只显示时间）
      function formatTime(dateStr) {
        if (!dateStr) return "-";
        try {
          var date = new Date(dateStr);
          var hours = date.getHours().toString().padStart(2, "0");
          var minutes = date.getMinutes().toString().padStart(2, "0");
          return hours + ":" + minutes;
        } catch (e) {
          return "-";
        }
      }

      // 生成卡片HTML
      function generateCardHTML(item) {
        var statusInfo = getOpStatus(item);
        var formattedApplyDate = formatDate(item.apply_date);
        var opDate = formatShortDate(item.op_datetime);
        var opStartTime = formatTime(item.op_datetime);
        var opEndTime = formatTime(item.op_endtime);

        return (
          '<div class="card-item" data-id="' + (item.op_record_ID || "") + '">' +
          '<div class="card-header">' +
          '<div class="card-title">' +
          '<i class="layui-icon layui-icon-template-1"></i>' +
          '<span class="op-name" title="' + (item.op_code_name || "未指定手术") + '">' +
          (item.op_code_name || "未指定手术") +
          '</span>' +
          '<span class="op-code">(' + (item.op_code || "").trim() + ')</span>' +
          '</div>' +
          '<div class="card-status ' + statusInfo.class + '">' +
          statusInfo.text +
          '</div>' +
          '</div>' +
          '<div class="card-body">' +
          '<div class="info-row">' +
          '<div class="info-label"><i class="layui-icon layui-icon-file"></i>术前诊断</div>' +
          '<div class="info-value">' + (item.diag_before_op || "-") + '</div>' +
          '</div>' +
          '<div class="info-row">' +
          '<div class="info-label"><i class="layui-icon layui-icon-location"></i>执行科室</div>' +
          '<div class="info-value">' + (item.exec_unit_name || "-") + '</div>' +
          '</div>' +
          '<div class="info-row">' +
          '<div class="info-label"><i class="layui-icon layui-icon-username"></i>申请医生</div>' +
          '<div class="info-value">' + (item.apply_user_name || "-") + '</div>' +
          '</div>' +
          '<div class="time-info">' +
          '<div class="time-item">' +
          '<div class="time-label">手术日期</div>' +
          '<div class="time-value">' + opDate + '</div>' +
          '</div>' +
          '<div class="time-item">' +
          '<div class="time-label">开始时间</div>' +
          '<div class="time-value">' + opStartTime + '</div>' +
          '</div>' +
          '<div class="time-item">' +
          '<div class="time-label">结束时间</div>' +
          '<div class="time-value">' + opEndTime + '</div>' +
          '</div>' +
          '<div class="time-item">' +
          '<div class="time-label">申请时间</div>' +
          '<div class="time-value">' + formatShortDate(item.apply_date) + '</div>' +
          '</div>' +
          '</div>' +
          '<div class="card-actions">' +
          '<button class="card-btn card-btn-detail" onclick="viewCardDetail(\'' +
          (item.op_record_ID || "") + '\', \'' + (item.patient_id || "") + '\')"><i class="layui-icon layui-icon-search"></i>详情</button>' +
          '<button class="card-btn card-btn-delete" onclick="deleteCardItem(\'' +
          (item.op_record_ID || "") + '\')"><i class="layui-icon layui-icon-delete"></i>删除</button>' +
          '</div>' +
          '</div>' +
          '</div>'
        );
      }

      // 渲染卡片（按申请时间降序排列）
      function renderCards(data) {
        var container = document.getElementById("cards-container");

        if (!data || data.length === 0) {
          container.innerHTML =
            '<div class="empty-state">' +
            '<i class="layui-icon layui-icon-template-1"></i>' +
            '<div class="empty-state-text">暂无手术信息数据</div>' +
            '<div class="empty-state-desc">点击"新建申请"按钮创建手术申请</div>' +
            '</div>';
          return;
        }

        // 按申请时间倒序排列（最新的在前面）
        var sortedData = data.slice().sort(function (a, b) {
          var timeA = new Date(a.apply_date || 0).getTime();
          var timeB = new Date(b.apply_date || 0).getTime();
          return timeB - timeA;
        });

        var cardsHTML = "";
        sortedData.forEach(function (item) {
          cardsHTML += generateCardHTML(item);
        });

        container.innerHTML = cardsHTML;
      }

      // 加载卡片数据
      function loadCardsData() {
        if (!patient_id || !admiss_times) {
          layer.msg("缺少患者信息参数", { icon: 5 });
          return;
        }

        var loadingIndex = layer.load(1, { shade: [0.1, '#fff'] });

        $.ajax({
          url: appconfig.api + "/api/MobileWard/Ydcf_GetPatientOpList?patient_id=" + patient_id + "&admiss_times=" + admiss_times,
          type: "GET",
          dataType: "json",
          success: function (res) {
            layer.close(loadingIndex);
            if (res.Status === 1) {
              cardsData = res.Data || [];
              renderCards(cardsData);
            } else {
              layer.msg("获取数据失败: " + (res.Message || "未知错误"), { icon: 5 });
              renderCards([]);
            }
          },
          error: function (xhr, status, error) {
            layer.close(loadingIndex);
            layer.msg("网络错误，获取数据失败", { icon: 5 });
            console.error("获取手术数据失败:", error);
            renderCards([]);
          },
        });
      }

      // 查看卡片详情
      window.viewCardDetail = function (op_record_ID, patient_id) {
        var item = cardsData.find(function (d) {
          return d.op_record_ID == op_record_ID || d.patient_id == patient_id;
        });

        if (!item) {
          layer.msg("未找到该手术信息", { icon: 5 });
          return;
        }

        var statusInfo = getOpStatus(item);

        var detailHTML =
          '<div class="detail-content">' +
          '<div class="detail-section">' +
          '<div class="detail-section-title"><i class="layui-icon layui-icon-template-1"></i> 手术基本信息</div>' +
          '<div class="detail-item"><div class="detail-label">手术名称：</div><div class="detail-value">' + (item.op_code_name || "-") + '</div></div>' +
          '<div class="detail-item"><div class="detail-label">手术编码：</div><div class="detail-value">' + (item.op_code || "").trim() + '</div></div>' +
          '<div class="detail-item"><div class="detail-label">术前诊断：</div><div class="detail-value">' + (item.diag_before_op || "-") + '</div></div>' +
          '<div class="detail-item"><div class="detail-label">当前状态：</div><div class="detail-value"><span class="card-status ' + statusInfo.class + '">' + statusInfo.text + '</span></div></div>' +
          '</div>' +
          '<div class="detail-section">' +
          '<div class="detail-section-title"><i class="layui-icon layui-icon-time"></i> 时间安排</div>' +
          '<div class="timeline">' +
          '<div class="timeline-item">' +
          '<div class="timeline-time">申请时间</div>' +
          '<div class="timeline-content">' + formatDate(item.apply_date) + '</div>' +
          '</div>' +
          '<div class="timeline-item">' +
          '<div class="timeline-time">手术开始</div>' +
          '<div class="timeline-content">' + formatDate(item.op_datetime) + '</div>' +
          '</div>' +
          '<div class="timeline-item">' +
          '<div class="timeline-time">手术结束</div>' +
          '<div class="timeline-content">' + formatDate(item.op_endtime) + '</div>' +
          '</div>' +
          '</div>' +
          '</div>' +
          '<div class="detail-section">' +
          '<div class="detail-section-title"><i class="layui-icon layui-icon-username"></i> 相关人员</div>' +
          '<div class="detail-item"><div class="detail-label">申请医生：</div><div class="detail-value">' + (item.apply_user_name || "-") + ' (' + (item.apply_user || "-") + ')</div></div>' +
          '<div class="detail-item"><div class="detail-label">执行科室：</div><div class="detail-value">' + (item.exec_unit_name || "-") + ' (' + (item.exec_code || "-") + ')</div></div>' +
          '</div>' +
          '<div class="detail-section">' +
          '<div class="detail-section-title"><i class="layui-icon layui-icon-user"></i> 患者信息</div>' +
          '<div class="detail-item"><div class="detail-label">患者ID：</div><div class="detail-value">' + (item.patient_id || "-") + '</div></div>' +
          '<div class="detail-item"><div class="detail-label">住院次数：</div><div class="detail-value">' + (item.admit_times || "-") + '</div></div>' +
          '</div>' +
          '</div>';

        layer.open({
          type: 1,
          title: '<i class="layui-icon layui-icon-template-1"></i> 手术详情',
          area: ['90%', '90%'],
          maxmin: true,
          content: detailHTML,
          btn: ['关闭'],
          yes: function (index) {
            layer.close(index);
          }
        });
      };

      // 删除卡片项目
      window.deleteCardItem = function (op_record_ID) {
        layer.confirm(
