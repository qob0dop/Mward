<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>手术信息</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="stylesheet" href="/lib/layui-v2.6.3/css/layui.css" media="all" />
  <link rel="stylesheet" href="/css/public.css" media="all" />
  <style>
/* 卡片视图样式 */
.cards-view
{
    display: flex;  flex-direction: column;  height: 100%;  background: #f5f5f5;
}

.toolbar-container
{
    display: flex;  align-items: center;  flex-shrink: 0;  justify-content: space-between;  padding: 10px 15px;  border-bottom: 1px solid #e6e6e6;  background: #fff;
}

.toolbar-title
{
    font-size: 16px;  font-weight: bold;  display: flex;  align-items: center;  color: #333;
}

.toolbar-title i
{
    font-size: 16px;  margin-right: 6px;  color: #1e9fff;
}

.toolbar-actions
{
    display: flex;  gap: 8px;
}

.cards-container
{
    overflow-y: auto;  flex: 1;  padding: 10px;
}

.card-item
{
    margin-bottom: 8px;  transition: all .3s ease;  border: 1px solid #e6e6e6;  border-radius: 6px;  background: #fff;  box-shadow: 0 1px 4px rgba(0, 0, 0, .1);
}

.card-item:hover
{
    transform: translateY(-1px);  box-shadow: 0 2px 8px rgba(0, 0, 0, .15);
}

.card-header
{
    font-size: 14px;  font-weight: 600;  line-height: 1.2;  display: flex;  align-items: center;  justify-content: space-between;  min-height: 32px;  padding: 8px 12px;  color: #2c5282;  border-bottom: 1px solid #dbeafe;  border-radius: 6px 6px 0 0;  background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
}

.card-title
{
    font-size: 14px;  font-weight: 600;  display: flex;  align-items: center;  flex: 1;  min-width: 0;  color: #2c5282;
}

.card-title i
{
    font-size: 16px;  flex-shrink: 0;  margin-right: 5px;
}

.op-name
{
    font-size: 13px;  font-weight: 700;  overflow: hidden;  flex: 1;  min-width: 0;  white-space: nowrap;  text-overflow: ellipsis;  color: inherit;
}

.op-code
{
    font-size: 10px;  font-weight: 400;  flex-shrink: 0;  margin-left: 6px;  opacity: .7;  color: inherit;
}

.card-status
{
    font-size: 10px;  font-weight: 700;  flex-shrink: 0;  padding: 3px 10px;  cursor: default;  pointer-events: none;  color: #fff;  border: none;  border-radius: 999px;  box-shadow: inset 0 -1px 0 rgba(0, 0, 0, .1);
}

.status-scheduled
{
    background: #2196f3;
    /* 蓝色 - 已安排 */
}

.status-completed
{
    background: #4caf50;
    /* 绿色 - 已完成 */
}

.status-pending
{
    background: #ff9800;
    /* 橙色 - 待安排 */
}

.status-cancelled
{
    background: #9e9e9e;
    /* 灰色 - 已取消 */
}

.card-body
{
    padding: 10px 12px;
}

.info-row
{
    font-size: 12px;  display: flex;  align-items: flex-start;  margin-bottom: 8px;  color: #666;
}

.info-row:last-child
{
    margin-bottom: 0;
}

.info-label
{
    font-weight: 600;  display: flex;  align-items: center;  flex-shrink: 0;  min-width: 75px;  color: #333;
}

.info-label i
{
    font-size: 14px;  margin-right: 4px;  color: #1e9fff;
}

.info-value
{
    flex: 1;  min-width: 0;  word-break: break-all;
}

.time-info
{
    display: grid;  margin-top: 10px;  padding-top: 10px;  border-top: 1px solid #f0f0f0;  grid-template-columns: repeat(2, 1fr);  gap: 8px;
}

.time-item
{
    font-size: 11px;  display: flex;  flex-direction: column;
}

.time-label
{
    font-size: 10px;  margin-bottom: 2px;  color: #999;
}

.time-value
{
    font-size: 11px;  font-weight: 500;  color: #333;
}

.card-actions
{
    display: flex;  justify-content: flex-end;  margin-top: 10px;  padding-top: 8px;  border-top: 1px solid #f0f0f0;  gap: 6px;
}

.card-btn
{
    font-size: 11px;  display: flex;  align-items: center;  padding: 4px 12px;  cursor: pointer;  transition: all .2s ease;  border: none;  border-radius: 4px;  gap: 3px;
}

.card-btn-detail
{
    color: #1976d2;  border: 1px solid #bbdefb;  background: #e3f2fd;
}

.card-btn-detail:hover
{
    transform: scale(1.05);  color: #fff;  background: #2196f3;
}

.card-btn-edit
{
    color: #f57c00;  border: 1px solid #ffe0b2;  background: #fff3e0;
}

.card-btn-edit:hover
{
    transform: scale(1.05);  color: #fff;  background: #ff9800;
}

.card-btn-delete
{
    color: #c62828;  border: 1px solid #ffcdd2;  background: #ffebee;
}

.card-btn-delete:hover
{
    transform: scale(1.05);  color: #fff;  background: #e57373;
}

.empty-state
{
    padding: 60px 20px;  text-align: center;  color: #999;
}

.empty-state i
{
    font-size: 64px;  display: block;  margin-bottom: 16px;  opacity: .3;
}

.empty-state-text
{
    font-size: 16px;  margin-bottom: 8px;  color: #666;
}

.empty-state-desc
{
    font-size: 13px;  opacity: .7;
}

/* 详情弹窗样式 */
.detail-content
{
    padding: 15px;
}

.detail-section
{
    margin-bottom: 20px;
}

.detail-section:last-child
{
    margin-bottom: 0;
}

.detail-section-title
{
    font-size: 14px;  font-weight: bold;  margin-bottom: 12px;  padding-bottom: 8px;  color: #333;  border-bottom: 2px solid #1e9fff;
}

.detail-item
{
    font-size: 13px;  display: flex;  margin-bottom: 10px;  padding: 8px;  border-radius: 4px;  background: #f8f9fa;
}

.detail-item:last-child
{
    margin-bottom: 0;
}

.detail-label
{
    font-weight: 600;  min-width: 100px;  color: #666;
}

.detail-value
{
    flex: 1;  color: #333;
}

/* 时间轴样式 */
.timeline
{
    position: relative;  padding-left: 30px;
}

.timeline-item
{
    position: relative;  margin-bottom: 15px;  padding-bottom: 15px;  border-bottom: 1px dashed #e6e6e6;
}

.timeline-item:last-child
{
    margin-bottom: 0;  padding-bottom: 0;  border-bottom: none;
}

.timeline-item::before
{
    position: absolute;  left: -26px;  width: 12px;  height: 12px;  content: '';  border: 2px solid #1e9fff;  border-radius: 50%;  background: #fff;
}

.timeline-item::after
{
    position: absolute;  top: 12px;  bottom: -15px;  left: -21px;  width: 2px;  content: '';  background: #e6e6e6;
}

.timeline-item:last-child::after
{
    display: none;
}

.timeline-time
{
    font-size: 12px;  font-weight: 600;  color: #1e9fff;
}

.timeline-content
{
    font-size: 12px;  margin-top: 5px;  color: #666;
}

/* 移动端适配 */
@media (max-width: 768px)
{
    .toolbar-container
    {
        padding: 8px 12px;
    }

    .toolbar-title
    {
        font-size: 15px;
    }

    .cards-container
    {
        padding: 8px;
    }

    .card-item
    {
        margin-bottom: 6px;
    }

    .card-header
    {
        padding: 6px 10px;
    }

    .card-title
    {
        font-size: 13px;
    }

    .op-name
    {
        font-size: 12px;
    }

    .op-code
    {
        font-size: 9px;
    }

    .card-status
    {
        font-size: 9px;  padding: 2px 8px;
    }

    .card-body
    {
        padding: 8px 10px;
    }

    .info-row
    {
        font-size: 11px;  margin-bottom: 6px;
    }

    .info-label
    {
        min-width: 65px;
    }

    .time-info
    {
        gap: 6px;
    }

    .detail-content
    {
        padding: 10px;
    }

    .detail-item
    {
        font-size: 12px;  flex-direction: column;
    }

    .detail-label
    {
        margin-bottom: 4px;
    }
}

/* 新建申请按钮样式 */
#btn-new-apply-card
{
    color: #435cab;  border-radius: 15px;  background-color: #d2d8e7;
}

  </style>
</head>

<body>
  <div class="layui-container" style="height: 100%">
    <div class="layui-row" style="height: 100%">
      <div class="layui-col-md12" style="height: 100%">
        <!-- 卡片视图容器 -->
        <div class="cards-view" id="cards-view">
          <!-- 工具栏 -->
          <div class="toolbar-container">
            <div class="toolbar-title">
              <i class="layui-icon layui-icon-template-1"></i>
              手术信息列表
            </div>
            <div class="toolbar-actions">
              <button class="layui-btn layui-btn-warm layui-btn-sm" id="btn-new-apply-card">
                <i class="layui-icon layui-icon-add-1"></i> 新建申请
              </button>
            </div>
          </div>

          <!-- 卡片容器 -->
          <div class="cards-container" id="cards-container">
            <div class="empty-state">
              <i class="layui-icon layui-icon-template-1"></i>
              <div class="empty-state-text">暂无手术信息数据</div>
              <div class="empty-state-desc">点击"新建申请"按钮创建手术申请</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/lib/layui-v2.6.3/layui.js" charset="utf-8"></script>
  <script src="/lib/lay-config.js?v=1.0.4" charset="utf-8"></script>
  <script src="../js/view/oplist.js">

  </script>
</body>

</html>
