<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* Fullscreen horizontal pager */
      html,
      body {
        height: 100%;
        margin: 0;
        -webkit-user-select: none; /* prevent accidental text selection during drag */
        user-select: none;
        overflow: hidden;
        font-family: Arial, Helvetica, sans-serif;
      }
      .container {
        height: 100vh;
        /* width will be set dynamically in JS to pages.length * viewport */
        display: flex;
        flex-direction: row;
        overflow: hidden;
        touch-action: none; /* let JS handle gestures */
        will-change: transform;
        background: #000;
        position: relative;
        left: 0;
        top: 0;
      }
      .page {
        flex: 0 0 auto;
        height: 100vh;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 48px;
        color: #fff;
      }
      /* Distinguish pages with colors */
      #page1 {
        background: linear-gradient(135deg, #1abc9c, #16a085);
      }
      #page2 {
        background: linear-gradient(135deg, #3498db, #2980b9);
      }
      #page3 {
        background: linear-gradient(135deg, #9b59b6, #8e44ad);
      }
      #page4 {
        background: linear-gradient(135deg, #e67e22, #d35400);
      }
      #page5 {
        background: linear-gradient(135deg, #e74c3c, #c0392b);
      }

      .page .box {
        text-align: center;
      }
      .page .box h1 {
        margin: 0 0 8px;
        font-size: 56px;
        letter-spacing: 1px;
      }
      .page .box p {
        margin: 0;
        opacity: 0.9;
      }

      /* small page indicator */
      .indicator {
        position: fixed;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        gap: 8px;
        z-index: 20;
      }
      .indicator .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.4);
        transition: all 200ms ease;
      }
      .indicator .dot.active {
        width: 14px;
        height: 14px;
        background: rgba(255, 255, 255, 0.95);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="page" id="page1">
        <div class="box">
          <h1>页面 1</h1>
          <p>向左或向右滑动切换</p>
        </div>
      </div>
      <div class="page" id="page2">
        <div class="box">
          <h1>页面 2</h1>
          <p>支持触摸和鼠标拖拽</p>
        </div>
      </div>
      <div class="page" id="page3">
        <div class="box">
          <h1>页面 3</h1>
          <p>每页占满容器</p>
        </div>
      </div>
      <div class="page" id="page4">
        <div class="box">
          <h1>页面 4</h1>
          <p>带有简易指示器</p>
        </div>
      </div>
      <div class="page" id="page5">
        <div class="box">
          <h1>页面 5</h1>
          <p>左右箭头也可切换</p>
        </div>
      </div>
    </div>
    <div class="indicator" aria-hidden>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <script>
      (function () {
        const container = document.querySelector(".container");
        const pages = Array.from(document.querySelectorAll(".page"));
        const dots = Array.from(document.querySelectorAll(".indicator .dot"));
        let index = 0;
        let startX = 0;
        let currentX = 0;
        let isDragging = false;
        let width = window.innerWidth;
        let trackWidth = 0;

        function applyTranslate(x, animate = true) {
          if (animate) container.style.transition = "transform 300ms ease";
          else container.style.transition = "none";
          // clamp to bounds
          const minX = -(trackWidth - width);
          const clamped = Math.max(minX, Math.min(0, x));
          container.style.transform = `translate3d(${clamped}px,0,0)`;
        }

        function goTo(i) {
          index = Math.max(0, Math.min(pages.length - 1, i));
          applyTranslate(-index * width, true);
          updateActive();
        }

        function updateActive() {
          pages.forEach((p, idx) =>
            p.classList.toggle("active", idx === index)
          );
          if (dots.length) {
            dots.forEach((d, idx) =>
              d.classList.toggle("active", idx === index)
            );
          }
        }

        function onStart(clientX) {
          isDragging = true;
          startX = clientX;
          currentX = startX;
          applyTranslate(-index * width, false);
        }

        function onMove(clientX) {
          if (!isDragging) return;
          currentX = clientX;
          const delta = currentX - startX;
          applyTranslate(-index * width + delta, false);
        }

        function onEnd() {
          if (!isDragging) return;
          isDragging = false;
          const delta = currentX - startX;
          const threshold = width * 0.2; // 20%
          if (delta > threshold) goTo(index - 1);
          else if (delta < -threshold) goTo(index + 1);
          else goTo(index);
        }

        // Touch events
        container.addEventListener(
          "touchstart",
          (e) => {
            if (e.touches.length > 1) return;
            onStart(e.touches[0].clientX);
          },
          { passive: true }
        );

        container.addEventListener(
          "touchmove",
          (e) => {
            if (!isDragging) return;
            onMove(e.touches[0].clientX);
            e.preventDefault();
          },
          { passive: false }
        );

        container.addEventListener("touchend", (e) => onEnd());
        container.addEventListener("touchcancel", (e) => onEnd());

        // Mouse events for desktop
        container.addEventListener("mousedown", (e) => {
          e.preventDefault();
          onStart(e.clientX);
        });
        window.addEventListener("mousemove", (e) => onMove(e.clientX));
        window.addEventListener("mouseup", (e) => onEnd());

        // Keyboard navigation
        window.addEventListener("keydown", (e) => {
          if (e.key === "ArrowLeft") goTo(index - 1);
          if (e.key === "ArrowRight") goTo(index + 1);
        });

        // dot click
        if (dots.length) {
          dots.forEach((d, idx) =>
            d.addEventListener("click", () => goTo(idx))
          );
        }

        // Resize handling
        function refreshSize() {
          width = window.innerWidth;
          // set each page width and container total width
          pages.forEach((p) => (p.style.width = width + "px"));
          trackWidth = width * pages.length;
          container.style.width = trackWidth + "px";
          // reposition to current index
          applyTranslate(-index * width, false);
        }
        window.addEventListener("resize", refreshSize);

        // init
        refreshSize();
        updateActive();
      })();
    </script>
  </body>
</html>
