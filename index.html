<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>移动查房系统-登录</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <!-- 本地 WGT 版本，直接在构建/发版时改这里，无需再读文件 -->
  <meta name="wgt-version" content="1.0.3" />

  <!--<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta http-equiv="Access-Control-Allow-Origin" content="*">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">-->
  <link rel="stylesheet" href="./lib/layui-v2.6.3/css/layui.css" media="all" />
  <!--[if lt IE 9]>
      <script src="https://cdn.staticfile.org/html5shiv/r29/html5.min.js"></script>
      <script src="https://cdn.staticfile.org/respond.js/1.4.2/respond.min.js"></script>
    <![endif]-->
  <style>
    .main-body {
      position: absolute;
      top: 50%;
      left: 50%;
      overflow: hidden;
      -webkit-transform: translate(-50%, -50%);
      -moz-transform: translate(-50%, -50%);
      -ms-transform: translate(-50%, -50%);
      -o-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .login-main .login-bottom .center .item input {
      font-size: 14px;
      position: absolute;
      display: inline-block;
      width: 227px;
      height: 22px;
      padding: 0;
      letter-spacing: 0;
      border: 0;
      outline: 0;
    }

    .login-main .login-bottom .center .item .icon-1 {
      background: url(images/icon-login.png) no-repeat 1px 0;
    }

    .login-main .login-bottom .center .item .icon-2 {
      background: url(images/icon-login.png) no-repeat -54px 0;
    }

    .login-main .login-bottom .center .item .icon-3 {
      background: url(images/icon-login.png) no-repeat -106px 0;
    }

    .login-main .login-bottom .center .item .icon-4 {
      position: absolute;
      right: -10px;
      cursor: pointer;
      background: url(images/icon-login.png) no-repeat 0 -43px;
    }

    .login-main .login-bottom .center .item .icon-5 {
      background: url(images/icon-login.png) no-repeat -55px -43px;
    }

    .login-main .login-bottom .center .item .icon-6 {
      position: absolute;
      right: -10px;
      margin-top: 8px;
      cursor: pointer;
      background: url(images/icon-login.png) no-repeat 0 -93px;
    }

    .login-main .login-bottom .tip .icon-nocheck {
      position: relative;
      top: 2px;
      display: inline-block;
      width: 10px;
      height: 10px;
      margin: 1px 8px 1px 1px;
      cursor: pointer;
      border: solid 1px #9abcda;
      border-radius: 2px;
    }

    .login-main .login-bottom .tip .icon-check {
      width: 14px;
      height: 14px;
      margin: 0 7px 0 0;
      border: none;
      background: url(images/icon-login.png) no-repeat -111px -48px;
    }

    .login-main .login-bottom .center .item .icon {
      display: inline-block;
      width: 33px;
      height: 22px;
    }

    .login-main .login-bottom .center .item {
      width: 288px;
      height: 35px;
      margin-bottom: 35px;
      border-bottom: 1px solid #dae1e6;
    }

    .login-main {
      position: relative;
      float: left;
      width: 428px;
    }

    .login-main .login-top {
      font-family: SourceHanSansCN-Regular;
      font-size: 30px;
      font-weight: 400;
      font-stretch: normal;
      line-height: 117px;
      overflow: hidden;
      height: 117px;
      -webkit-transform: rotate(0);
      -moz-transform: rotate(0);
      -ms-transform: rotate(0);
      -o-transform: rotate(0);
      transform: rotate(0);
      text-align: center;
      letter-spacing: 0;
      color: #fff;
      border-radius: 12px 12px 0 0;
      background-color: #148be4;
    }

    .login-main .login-top .bg1 {
      position: absolute;
      top: 43px;
      left: 0;
      display: inline-block;
      width: 74px;
      height: 74px;
      opacity: .1;
      border-radius: 0 74px 0 0;
      background: #fff;
    }

    .login-main .login-top .bg2 {
      position: absolute;
      top: -16px;
      right: -16px;
      display: inline-block;
      width: 94px;
      height: 94px;
      opacity: .1;
      border-radius: 50%;
      background: #fff;
    }

    .login-main .login-bottom {
      width: 428px;
      padding-bottom: 53px;
      border-radius: 0 0 12px 12px;
      background: #fff;
    }

    .login-main .login-bottom .center {
      position: relative;
      width: 288px;
      margin: 0 auto;
      padding-top: 40px;
      padding-bottom: 15px;
    }

    .login-main .login-bottom .tip {
      line-height: 16px;
      clear: both;
      width: 288px;
      height: 16px;
      margin: 0 auto;
    }

    body {
      font-size: 12px;
      position: static;
      background: url(images/loginbg.png) 0 0 / cover no-repeat;
    }

    input::-webkit-input-placeholder {
      color: #a6aebf;
    }

    input::-moz-placeholder {
      /* Mozilla Firefox 19+ */
      color: #a6aebf;
    }

    input:-moz-placeholder {
      /* Mozilla Firefox 4 to 18 */
      color: #a6aebf;
    }

    input:-ms-input-placeholder {
      /* Internet Explorer 10-11 */
      color: #a6aebf;
    }

    input:-webkit-autofill {
      /* 取消Chrome记住密码的背景颜色 */
      -webkit-box-shadow: 0 0 0 1000px white inset !important;
    }

    html {
      height: 100%;
    }

    .login-main .login-bottom .tip .login-tip {
      font-family: MicrosoftYaHei;
      font-size: 12px;
      font-weight: 400;
      font-stretch: normal;
      cursor: pointer;
      letter-spacing: 0;
      color: #9abcda;
    }

    .login-main .login-bottom .tip .forget-password {
      font-stretch: normal;
      position: absolute;
      right: 62px;
      text-decoration: none;
      letter-spacing: 0;
      color: #1391ff;
    }

    .login-main .login-bottom .login-btn {
      font-size: 14px;
      line-height: 40px;
      width: 288px;
      height: 40px;
      margin: 24px auto 0;
      cursor: pointer;
      text-align: center;
      letter-spacing: 0;
      color: #fff;
      border: none;
      border-radius: 16px;
      background-color: #1e9fff;
    }

    .login-main .login-bottom .center .item .validateImg {
      position: absolute;
      right: 1px;
      height: 36px;
      cursor: pointer;
      border: 1px solid #e6e6e6;
    }

    .footer {
      font-size: 14px;
      line-height: 30px;
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding-bottom: 10px;
      text-align: center;
      color: #fff;
      text-shadow: #000 .1em .1em .1em;
    }

    .padding-5 {
      padding: 5px !important;
    }

    .footer a,
    .footer span {
      color: #fff;
    }

    /* 设置图标样式 */
    .setting-icon {
      font-size: 20px;
      position: absolute;
      top: 15px;
      right: 15px;
      cursor: pointer;
      transition: color .3s;
      color: rgba(255, 255, 255, .8);
    }

    .setting-icon:hover {
      color: #fff;
    }

    @media screen and (max-width: 428px) {
      .login-main {
        width: 360px !important;
      }

      .login-main .login-top {
        width: 360px !important;
      }

      .login-main .login-bottom {
        width: 360px !important;
      }
    }

    #version {
      font-size: 14px;
      line-height: 20px;
      position: absolute;
      top: 5px;
      right: 15px;
      height: 20px;
      color: rgba(255, 255, 255, .8);
    }
  </style>
</head>

<body>
  <div class="main-body">
    <div class="login-main">
      <div class="login-top">
        <span id="version"></span>
        <span>移动医生查房系统</span>

        <span class="bg1"></span>
        <span class="bg2"></span>
        <i class="layui-icon layui-icon-set-sm setting-icon" id="setting-btn" title="设置"></i>
      </div>

      <form class="layui-form login-bottom">
        <div class="center">
          <div class="item">
            <span class="icon icon-2"></span>
            <input type="text" name="username" lay-verify="required" placeholder="请输入登录账号" maxlength="24" />
            <span class="bind-password icon icon-4" style="background: url()" id="existname"><i
                class="layui-icon layui-icon-down"></i></span>
          </div>

          <div class="item">
            <span class="icon icon-3"></span>
            <input type="password" name="password" placeholder="请输入密码" maxlength="20" />
            <span class="bind-password icon icon-4"></span>
          </div>

          <!--<div id="validatePanel" class="item" style="width: 137px;">
                        <input type="text" name="captcha" placeholder="请输入验证码" maxlength="4">
                        <img id="refreshCaptcha" class="validateImg"  src="/images/captcha.jpg" >
                    </div>-->
        </div>
        <!--<div class="tip">
                    <span class="icon-nocheck"></span>
                    <span class="login-tip">保持登录</span>
                    <a href="javascript:" class="forget-password">忘记密码？</a>
                </div>-->
        <div class="layui-form-item" style="text-align: center; width: 100%; height: 100%; margin: 0px">
          <button class="login-btn" lay-submit="" lay-filter="login">
            立即登录
          </button>
        </div>
      </form>
    </div>
  </div>
  <div class="footer">
    谷翔科技 ©2024<!--<span class="padding-5">|</span><a target="_blank" href="http://www.miitbeian.gov.cn"></a>-->
  </div>
  <script src="./lib/layui-v2.6.3/layui.js" charset="utf-8"></script>
  <script src="./js/lay-config.js" charset="utf-8"></script>
  <script>

    layui.use(["form", "jquery", "appconfig", "dropdown"], function () {
      var $ = layui.jquery,
        form = layui.form,
        appconfig = layui.appconfig,
        layer = layui.layer;
      dropdown = layui.dropdown;
      // 统一将错误对象转换为字符串，便于日志查看
      function errToString(err) {
        if (err == null) return '';
        if (typeof err === 'string') return err;
        // 常见的 Error 或含 message/stack 的对象（包含 5+ 的错误对象）
        var msg = '';
        if (err.message) msg = String(err.message);
        if (err.stack) msg = (msg ? msg + '\n' : '') + String(err.stack);
        if (msg) return msg;
        try {
          return JSON.stringify(err);
        } catch (e) {
          try { return String(err); } catch (e2) { return '[Unserializable error]'; }
        }
      }
      // 检查更新（最直接：从 <meta name="wgt-version"> 读取本地版本）
      function checkUpdate() {
        var meta = document.querySelector('meta[name="wgt-version"]');
        var localWgtVersion = meta ? meta.getAttribute('content') : '';
        console.log('本地版本号:', localWgtVersion);
        $("#version").text("V " + localWgtVersion);

        const serverUrl = appconfig.api + "/wgt/update-manifest.json";
        fetch(serverUrl)
          .then(response => response.json())
          .then(serverData => {
            console.log('服务器最新版本号:', serverData.latest);
            console.log('本地版本号:', localWgtVersion);
            if (serverData.latest > localWgtVersion) {
              if (confirm("检测到新版本，是否立即下载更新？")) {
                console.log(appconfig.api + serverData.files[0].url);
                downloadWgt(appconfig.api + serverData.files[0].url);
              } else {
                console.log("用户取消了更新");
              }
            } else {
              console.log("已是最新版本");
            }
          })
          .catch(err => console.error("检查更新失败：", errToString(err)));
      }

      // 下载 WGT 文件
      function downloadWgt(wgtUrl) {
        console.log("进入下载", wgtUrl)
        const downloadTask = plus.downloader.createDownload(wgtUrl, {}, (download, status) => {
          if (status === 200) {
            console.log("下载成功：" + download.filename);
            installWgt(download.filename); // 安装更新文件
          } else {
            console.error("下载失败");
          }
        });
        downloadTask.start();
      }

      // 安装 WGT 文件
      function installWgt(path) {
        plus.runtime.install(path, {}, () => {
          console.log("安装成功，准备重启");
          plus.runtime.restart(); // 重启应用
        }, err => {
          console.error("安装失败：", errToString(err)); // 打印详细错误信息
        });
      }

      // 页面加载完成后检查更新
      document.addEventListener("plusready", checkUpdate);
      // 检查localStorage中是否有保存的API地址
      var savedApiUrl = localStorage.getItem("api_url");
      if (savedApiUrl) {
        appconfig.api = savedApiUrl;
      }

      // 设置图标点击事件
      $("#setting-btn").on("click", function () {
        var currentApiUrl =
          localStorage.getItem("api_url") || "https://www.annotokyo.fun:8123";
        layer.open({
          type: 1,
          title: "API设置",
          area: ["400px", "250px"],
          content:
            '<div style="padding: 20px;">' +
            '<div class="layui-form-item">' +
            '<label class="layui-form-label">API地址:</label>' +
            '<div class="layui-input-block">' +
            '<input type="text" id="modal-api-url" placeholder="请输入API地址" class="layui-input" value="' +
            currentApiUrl +
            '">' +
            "</div>" +
            "</div>" +
            "</div>",
          btn: ["保存", "重置", "取消"],
          btn1: function (index) {
            var newApiUrl = $("#modal-api-url").val().trim();
            if (newApiUrl) {
              localStorage.setItem("api_url", newApiUrl);
              appconfig.api = newApiUrl;
              layer.msg("API地址已保存", { icon: 1 });
              layer.close(index);
            } else {
              layer.msg("请输入有效的API地址", { icon: 2 });
            }
          },
          btn2: function () {
            $("#modal-api-url").val("https://www.annotokyo.fun:8123");
            return false; // 不关闭弹窗
          },
          btn3: function (index) {
            layer.close(index);
          },
        });
      });

      // 登录过期的时候，跳出ifram框架
      if (top.location != self.location) top.location = self.location;

      $(".bind-password").on("click", function () {
        if ($(this).hasClass("icon-5")) {
          $(this).removeClass("icon-5");
          $("input[name='password']").attr("type", "password");
        } else {
          $(this).addClass("icon-5");
          $("input[name='password']").attr("type", "text");
        }
      });

      $(".icon-nocheck").on("click", function () {
        if ($(this).hasClass("icon-check")) {
          $(this).removeClass("icon-check");
        } else {
          $(this).addClass("icon-check");
        }
      });
      var loginUserData = localStorage.getItem("loginUserList");

      var showLoginList = [];
      if (loginUserData != null) {
        showLoginList = JSON.parse(loginUserData);
      }

      //自定义事件 - mousedown
      dropdown.render({
        elem: "#existname",
        trigger: "mousedown",
        //, data: [{
        //    title: 'test1'
        //    , id: 100
        //}, {
        //    title: 'test2'
        //    , id: 101
        //}, {
        //    title: 'test3'
        //    , id: 102
        //}],
        data: showLoginList,
        click: function (obj) {
          $("#username").val(obj.title);

          layui.jquery("input[name='username']").val(obj.title);
          this.elem.find("span").text(obj.title);
        },
      });
      // 进行登录操作
      form.on("submit(login)", function (data) {
        data = data.field;
        var username = data.username;
        var password = data.password;
        var apiurl = appconfig.api; // 使用当前设置的API地址

        if (data.username == "") {
          layer.msg("用户名不能为空");
          return false;
        }

        // 确保有有效的API地址
        if (!apiurl || apiurl.trim() === "") {
          layer.msg("请先设置API地址");
          return false;
        }

        //if (data.password == '') {
        //    layer.msg('密码不能为空');
        //    return false;
        //}
        //if (data.captcha == '') {
        //    layer.msg('验证码不能为空');
        //    return false;
        //}

        $.ajax({
          //绑定病区列表
          url:
            apiurl +
            "/api/MobileWard/GetLoginUser?uname=" +
            data.username +
            "&pwd=" +
            data.password +
            "&subsys_id=" +
            appconfig.subsys_id, //   获取控制器URL地址
          type: "get",
          dataType: "json",
          success: function (data) {
            if (data.Data.length > 0) {
              //layer.msg(JSON.stringify(data));

              localStorage.setItem("loginUser", JSON.stringify(data.Data[0]));
              layer.msg("登录成功");
              //保存登录名

              var loginlist;
              var arr = {
                title: username,
                id: password,
              };
              if (loginUserData === null) {
                loginlist = new Array(); //创建一个数组
                loginlist.push(arr);
                localStorage.setItem(
                  "loginUserList",
                  JSON.stringify(loginlist)
                );
              } else {
                loginlist = JSON.parse(loginUserData);
                var isExist = false;
                $.each(loginlist, function (i, item) {
                  if (item.title === username) {
                    isExist = true;
                  }
                });
                if (isExist === false) {
                  loginlist.push(arr);
                  localStorage.setItem(
                    "loginUserList",
                    JSON.stringify(loginlist)
                  );
                }
              }

              setTimeout(function () {
                // window.location = "view/wardlist.html";
                window.location = "home.html";
              }, 1000);
            } else {
              layer.msg("用户名或密码不正确。");
            }
          },
          error: function (data) {
            layer.msg("访问数据失败！请检查网络链接是否畅通。");
          },
        });

        //layer.msg('登录成功');
        //window.location = 'view/wardlist.html';
        return false;
      });
    });
    // 替换当前历史记录
    history.replaceState(null, null, location.href);

    // 监听浏览器前进后退按钮事件
    window.onpopstate = function (event) {
      history.replaceState(null, null, location.href);
    };

  </script>
</body>

</html>
