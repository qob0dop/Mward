<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>应用更新包上传管理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB',
                'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .type-selector {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            padding: 15px;
            background: #f8f9ff;
            border-radius: 8px;
        }

        .type-option {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            background: white;
        }

        .type-option:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .type-option.active {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .type-option .icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .type-option .title {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .type-option .desc {
            font-size: 12px;
            opacity: 0.8;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .label-optional {
            color: #999;
            font-weight: normal;
            font-size: 12px;
        }

        .label-required {
            color: #ff4d4f;
            margin-left: 2px;
        }

        input[type="text"],
        input[type="password"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
        }

        .file-upload {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .file-upload-input {
            display: none;
        }

        .file-upload-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 40px 20px;
            border: 2px dashed #667eea;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            background: #f8f9ff;
            color: #667eea;
            font-weight: 500;
        }

        .file-upload-label:hover {
            border-color: #764ba2;
            background: #f0f1ff;
            color: #764ba2;
        }

        .file-upload-label.has-file {
            border-color: #52c41a;
            background: #f6ffed;
            color: #52c41a;
        }

        .file-info {
            margin-top: 10px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 6px;
            font-size: 13px;
            color: #666;
            display: none;
        }

        .file-info.show {
            display: block;
        }

        .file-info-row {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 100%;
            justify-content: center;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            animation: slideIn 0.3s;
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background: #f6ffed;
            border: 1px solid #b7eb8f;
            color: #52c41a;
        }

        .alert-error {
            background: #fff2f0;
            border: 1px solid #ffccc7;
            color: #ff4d4f;
        }

        .alert-warning {
            background: #fffbe6;
            border: 1px solid #ffe58f;
            color: #faad14;
        }

        .progress-container {
            margin-top: 20px;
            display: none;
        }

        .progress-container.show {
            display: block;
        }

        .progress-bar {
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s;
        }

        .progress-text {
            text-align: center;
            color: #666;
            font-size: 14px;
        }

        .result-container {
            display: none;
            margin-top: 20px;
        }

        .result-container.show {
            display: block;
        }

        .result-json {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 15px;
            overflow-x: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
        }

        .help-text {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        .settings-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            cursor: pointer;
            color: #667eea;
            font-weight: 500;
            font-size: 14px;
        }

        .settings-toggle:hover {
            color: #764ba2;
        }

        .settings-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .settings-content.expanded {
            max-height: 300px;
        }

        .icon {
            width: 20px;
            height: 20px;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 10px;
            }

            .card {
                padding: 20px;
            }

            h1 {
                font-size: 24px;
            }

            .type-selector {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <h1>
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                应用更新包上传
            </h1>
            <div class="subtitle">支持 WGT 热更新包和 APK 完整安装包</div>

            <!-- 包类型选择 -->
            <div class="type-selector">
                <div class="type-option active" onclick="selectType('wgt')" id="type-wgt">
                    <div class="icon">📦</div>
                    <div class="title">WGT 热更新</div>
                    <div class="desc">小更新，无需重装</div>
                </div>
                <div class="type-option" onclick="selectType('apk')" id="type-apk">
                    <div class="icon">🤖</div>
                    <div class="title">APK 安装包</div>
                    <div class="desc">大版本更新</div>
                </div>
            </div>

            <!-- 设置区域 -->
            <div class="settings-toggle" onclick="toggleSettings()">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path
                        d="M12 1v6m0 6v6m-8.66-8.66l4.24 4.24m4.24 4.24l4.24 4.24M1 12h6m6 0h6m-4.24-8.66l-4.24 4.24m-4.24 4.24l-4.24 4.24">
                    </path>
                </svg>
                <span id="settingsToggleText">展开设置</span>
            </div>

            <div class="settings-content" id="settingsContent">
                <div class="form-group">
                    <label>API 地址</label>
                    <input type="text" id="apiUrl" value="/api/wgt/upload" placeholder="例如：/api/wgt/upload">
                    <div class="help-text">修改上传 API 的地址，支持相对路径和绝对路径</div>
                </div>

                <div class="form-group">
                    <label>API Key <span class="label-optional">(可选)</span></label>
                    <input type="password" id="apiKey" placeholder="如果配置了 API Key，请在此输入">
                    <div class="help-text">在 appsettings.json 中配置的 Wgt:ApiKey</div>
                </div>
            </div>

            <!-- 消息提示 -->
            <div class="alert alert-success" id="successAlert"></div>
            <div class="alert alert-error" id="errorAlert"></div>
            <div class="alert alert-warning" id="warningAlert"></div>

            <!-- 文件上传 -->
            <div class="form-group">
                <label>选择更新包文件 <span class="label-required">*</span></label>
                <div class="file-upload">
                    <input type="file" id="fileInput" class="file-upload-input" accept=".wgt,.apk"
                        onchange="handleFileSelect(event)">
                    <label for="fileInput" class="file-upload-label" id="fileLabel">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        <span id="fileLabelText">点击选择或拖拽文件到此处</span>
                    </label>
                </div>
                <div class="file-info" id="fileInfo">
                    <div class="file-info-row">
                        <strong>文件名：</strong>
                        <span id="fileName"></span>
                    </div>
                    <div class="file-info-row">
                        <strong>文件大小：</strong>
                        <span id="fileSize"></span>
                    </div>
                    <div class="file-info-row">
                        <strong>文件类型：</strong>
                        <span id="fileType"></span>
                    </div>
                </div>
            </div>

            <!-- 可选字段 -->
            <div class="form-group">
                <label>版本号 <span class="label-optional">(可选，留空将自动解析)</span></label>
                <input type="text" id="version" placeholder="例如：1.2.0">
                <div class="help-text">手动指定版本号会覆盖自动解析的版本信息</div>
            </div>

            <div class="form-group">
                <label>版本代码 <span class="label-optional">(可选)</span></label>
                <input type="text" id="versionCode" placeholder="例如：20250121">
                <div class="help-text">数字格式的版本代码，用于版本比较（建议使用日期格式 yyyyMMdd）</div>
            </div>

            <div class="form-group">
                <label>发布日期 <span class="label-optional">(可选，格式：yyyyMMdd)</span></label>
                <input type="text" id="publishedAt" placeholder="例如：20250121">
                <div class="help-text">留空将使用当前日期</div>
            </div>

            <div class="form-group">
                <label>更新说明 <span class="label-optional">(可选)</span></label>
                <textarea id="description" placeholder="例如：&#10;- 修复了若干 Bug&#10;- 优化了性能&#10;- 新增了某某功能"></textarea>
                <div class="help-text">描述本次更新的内容</div>
            </div>

            <!-- 上传按钮 -->
            <button class="btn btn-primary" id="uploadBtn" onclick="uploadFile()" disabled>
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                <span id="uploadBtnText">上传更新包</span>
            </button>

            <!-- 上传进度 -->
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text" id="progressText">上传中... 0%</div>
            </div>

            <!-- 上传结果 -->
            <div class="result-container" id="resultContainer">
                <label>上传结果</label>
                <pre class="result-json" id="resultJson"></pre>
            </div>
        </div>
    </div>

    <script>
        let selectedFile = null;
        let selectedType = 'wgt';
        const api = localStorage.getItem("api_url");
        document.getElementById('apiUrl').value = api + '/api/wgt/upload';
        // 选择包类型
        function selectType(type) {
            selectedType = type;
            document.getElementById('type-wgt').classList.toggle('active', type === 'wgt');
            document.getElementById('type-apk').classList.toggle('active', type === 'apk');

            // 更新文件上传接受的类型
            const fileInput = document.getElementById('fileInput');
            if (type === 'wgt') {
                fileInput.setAttribute('accept', '.wgt');
                document.getElementById('fileLabelText').textContent = '点击选择或拖拽 WGT 文件到此处';
            } else {
                fileInput.setAttribute('accept', '.apk');
                document.getElementById('fileLabelText').textContent = '点击选择或拖拽 APK 文件到此处';
            }

            // 清除已选文件
            fileInput.value = '';
            selectedFile = null;
            document.getElementById('fileLabel').classList.remove('has-file');
            document.getElementById('fileInfo').classList.remove('show');
            document.getElementById('uploadBtn').disabled = true;
        }

        // 切换设置面板
        function toggleSettings() {
            const content = document.getElementById('settingsContent');
            const toggleText = document.getElementById('settingsToggleText');
            const isExpanded = content.classList.contains('expanded');

            if (isExpanded) {
                content.classList.remove('expanded');
                toggleText.textContent = '展开设置';
            } else {
                content.classList.add('expanded');
                toggleText.textContent = '收起设置';
            }
        }

        // 处理文件选择
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const ext = file.name.toLowerCase().split('.').pop();

            // 验证文件类型
            if (selectedType === 'wgt' && ext !== 'wgt') {
                showError('请选择 .wgt 文件');
                return;
            }
            if (selectedType === 'apk' && ext !== 'apk') {
                showError('请选择 .apk 文件');
                return;
            }

            selectedFile = file;

            // 更新 UI
            document.getElementById('fileLabel').classList.add('has-file');
            document.getElementById('fileLabelText').textContent = '✓ 文件已选择';

            // 显示文件信息
            document.getElementById('fileName').textContent = file.name;
            document.getElementById('fileSize').textContent = formatFileSize(file.size);
            document.getElementById('fileType').textContent = selectedType.toUpperCase();
            document.getElementById('fileInfo').classList.add('show');

            // 启用上传按钮
            document.getElementById('uploadBtn').disabled = false;

            // 清除之前的消息
            clearAlerts();
        }

        // 上传文件
        async function uploadFile() {
            if (!selectedFile) {
                showError('请先选择文件');
                return;
            }

            const apiUrl = document.getElementById('apiUrl').value.trim();
            const apiKey = document.getElementById('apiKey').value.trim();
            const version = document.getElementById('version').value.trim();
            const versionCode = document.getElementById('versionCode').value.trim();
            const publishedAt = document.getElementById('publishedAt').value.trim();
            const description = document.getElementById('description').value.trim();

            if (!apiUrl) {
                showError('请输入 API 地址');
                return;
            }

            // 构建 FormData
            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('packageType', selectedType);
            if (version) formData.append('version', version);
            if (versionCode) formData.append('versionCode', versionCode);
            if (publishedAt) formData.append('publishedAt', publishedAt);
            if (description) formData.append('description', description);

            // 准备请求头
            const headers = {};
            if (apiKey) {
                headers['X-Api-Key'] = apiKey;
            }

            // 显示进度
            showProgress();
            disableUpload();
            clearAlerts();

            try {
                const xhr = new XMLHttpRequest();

                // 监听上传进度
                xhr.upload.addEventListener('progress', (e) => {
                    if (e.lengthComputable) {
                        const percent = Math.round((e.loaded / e.total) * 100);
                        updateProgress(percent);
                    }
                });

                // 监听完成
                xhr.addEventListener('load', () => {
                    hideProgress();
                    enableUpload();

                    if (xhr.status >= 200 && xhr.status < 300) {
                        const result = JSON.parse(xhr.responseText);
                        showSuccess(`上传成功！版本：${result.version} (${result.type.toUpperCase()})`);
                        showResult(result);
                    } else {
                        let errorMsg = '上传失败';
                        try {
                            const error = JSON.parse(xhr.responseText);
                            errorMsg = error.error || error.message || errorMsg;
                            if (error.details) {
                                errorMsg += ': ' + error.details;
                            }
                        } catch (e) {
                            errorMsg = xhr.statusText || errorMsg;
                        }
                        showError(`${errorMsg} (HTTP ${xhr.status})`);
                    }
                });

                // 监听错误
                xhr.addEventListener('error', () => {
                    hideProgress();
                    enableUpload();
                    showError('网络错误，请检查连接');
                });

                // 发送请求
                xhr.open('POST', apiUrl);

                for (const [key, value] of Object.entries(headers)) {
                    xhr.setRequestHeader(key, value);
                }

                xhr.send(formData);

            } catch (error) {
                hideProgress();
                enableUpload();
                showError('上传失败: ' + error.message);
            }
        }

        // 显示进度
        function showProgress() {
            document.getElementById('progressContainer').classList.add('show');
            updateProgress(0);
        }

        // 隐藏进度
        function hideProgress() {
            document.getElementById('progressContainer').classList.remove('show');
        }

        // 更新进度
        function updateProgress(percent) {
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('progressText').textContent = `上传中... ${percent}%`;
        }

        // 显示结果
        function showResult(result) {
            document.getElementById('resultJson').textContent = JSON.stringify(result, null, 2);
            document.getElementById('resultContainer').classList.add('show');
        }

        // 禁用上传按钮
        function disableUpload() {
            const btn = document.getElementById('uploadBtn');
            btn.disabled = true;
            document.getElementById('uploadBtnText').textContent = '上传中...';
        }

        // 启用上传按钮
        function enableUpload() {
            const btn = document.getElementById('uploadBtn');
            btn.disabled = false;
            document.getElementById('uploadBtnText').textContent = '上传更新包';
        }

        // 显示成功消息
        function showSuccess(message) {
            clearAlerts();
            const alert = document.getElementById('successAlert');
            alert.textContent = '✓ ' + message;
            alert.classList.add('show');
        }

        // 显示错误消息
        function showError(message) {
            clearAlerts();
            const alert = document.getElementById('errorAlert');
            alert.textContent = '✗ ' + message;
            alert.classList.add('show');
        }

        // 显示警告消息
        function showWarning(message) {
            clearAlerts();
            const alert = document.getElementById('warningAlert');
            alert.textContent = '⚠ ' + message;
            alert.classList.add('show');
        }

        // 清除所有消息
        function clearAlerts() {
            document.querySelectorAll('.alert').forEach(alert => {
                alert.classList.remove('show');
            });
        }

        // 格式化文件大小
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        // 支持拖拽上传
        const fileLabel = document.getElementById('fileLabel');

        fileLabel.addEventListener('dragover', (e) => {
            e.preventDefault();
            fileLabel.style.borderColor = '#764ba2';
            fileLabel.style.background = '#f0f1ff';
        });

        fileLabel.addEventListener('dragleave', (e) => {
            e.preventDefault();
            fileLabel.style.borderColor = '#667eea';
            fileLabel.style.background = '#f8f9ff';
        });

        fileLabel.addEventListener('drop', (e) => {
            e.preventDefault();
            fileLabel.style.borderColor = '#667eea';
            fileLabel.style.background = '#f8f9ff';

            const files = e.dataTransfer.files;
            if (files.length > 0) {
                document.getElementById('fileInput').files = files;
                handleFileSelect({ target: { files: files } });
            }
        });

        // 页面加载时填充默认日期
        window.addEventListener('load', () => {
            const today = new Date();
            const dateStr = today.getFullYear() +
                String(today.getMonth() + 1).padStart(2, '0') +
                String(today.getDate()).padStart(2, '0');
            document.getElementById('publishedAt').placeholder = `例如：${dateStr}（今天）`;
        });
    </script>
</body>

</html>
