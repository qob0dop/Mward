<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket 危急值推送测试工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn {
            width: 100%;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .btn-success:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.4);
        }

        .btn-warning {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-warning:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4);
        }

        .btn-info {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin: 5px;
        }

        .status-online {
            background: #d4edda;
            color: #155724;
        }

        .status-offline {
            background: #f8d7da;
            color: #721c24;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .stat-card .number {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-card .label {
            font-size: 14px;
            opacity: 0.9;
        }

        .log-area {
            background: #1e1e1e;
            color: #00ff00;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            max-height: 400px;
            overflow-y: auto;
            margin-top: 20px;
        }

        .log-entry {
            margin-bottom: 5px;
            line-height: 1.5;
        }

        .log-entry.error {
            color: #ff6b6b;
        }

        .log-entry.success {
            color: #51cf66;
        }

        .log-entry.info {
            color: #74c0fc;
        }

        .user-list {
            max-height: 300px;
            overflow-y: auto;
            margin-top: 15px;
        }

        .user-item {
            background: #f8f9fa;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            border-left: 4px solid #667eea;
        }

        .user-item strong {
            color: #667eea;
        }

        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .api-url {
            background: #f8f9fa;
            padding: 8px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            margin-top: 5px;
            word-break: break-all;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🏥 WebSocket 危急值推送测试工具</h1>

        <!-- 统计卡片 -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="number" id="totalOnline">0</div>
                <div class="label">在线用户</div>
            </div>
            <div class="stat-card">
                <div class="number" id="doctorOnline">0</div>
                <div class="label">在线医生</div>
            </div>
            <div class="stat-card">
                <div class="number" id="nurseOnline">0</div>
                <div class="label">在线护士</div>
            </div>
        </div>

        <div class="grid">
            <!-- 建立连接 -->
            <div class="card">
                <h2>🔌 建立 WebSocket 连接</h2>
                <div class="form-group">
                    <label>用户ID</label>
                    <input type="text" id="connUserId" placeholder="例如: DOC001" value="DOC001">
                </div>
                <div class="form-group">
                    <label>用户角色</label>
                    <select id="connUserRole">
                        <option value="doctor">医生 (doctor)</option>
                        <option value="nurse">护士 (nurse)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>科室编号</label>
                    <input type="text" id="connWardCode" placeholder="例如: NK001" value="NK001">
                </div>
                <button class="btn btn-success" onclick="connectWebSocket()">连接 WebSocket</button>
                <button class="btn btn-warning" onclick="disconnectWebSocket()">断开连接</button>
                <div id="connStatus" style="margin-top: 15px; text-align: center;">
                    <span class="status-badge status-offline">未连接</span>
                </div>
            </div>

            <!-- 向指定用户发送 -->
            <div class="card">
                <h2>👤 向指定用户发送测试消息</h2>
                <div class="form-group">
                    <label>目标用户ID</label>
                    <input type="text" id="targetUserId" placeholder="例如: DOC001" value="DOC001">
                </div>
                <div class="form-group">
                    <label>患者信息</label>
                    <input type="text" id="targetPatientInfo" placeholder="例如: 张三，男，45岁" value="张三，男，45岁">
                </div>
                <div class="form-group">
                    <label>危急值内容</label>
                    <textarea id="targetCrisisString"
                        placeholder="例如: 白细胞计数 25.6×10^9/L（参考范围：4-10）">白细胞计数 25.6×10^9/L（参考范围：4-10）</textarea>
                </div>
                <button class="btn btn-primary" onclick="sendToUser()">发送消息</button>
            </div>

            <!-- 向科室发送 -->
            <div class="card">
                <h2>🏢 向科室发送测试消息</h2>
                <div class="form-group">
                    <label>科室编号</label>
                    <input type="text" id="wardCode" placeholder="例如: NK001" value="NK001">
                </div>
                <div class="form-group">
                    <label>科室名称</label>
                    <input type="text" id="wardName" placeholder="例如: 内科" value="内科">
                </div>
                <div class="form-group">
                    <label>目标角色</label>
                    <select id="wardTargetRole">
                        <option value="all">全部（医生+护士）</option>
                        <option value="doctor">仅医生</option>
                        <option value="nurse">仅护士</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>危急值内容</label>
                    <textarea id="wardCrisisString" placeholder="危急值内容">检验危急值：血钾浓度 6.5 mmol/L（参考范围：3.5-5.5）</textarea>
                </div>
                <button class="btn btn-primary" onclick="sendToWard()">发送到科室</button>
            </div>

            <!-- 广播消息 -->
            <div class="card">
                <h2>📢 广播测试消息</h2>
                <div class="form-group">
                    <label>广播内容</label>
                    <textarea id="broadcastMessage" placeholder="输入广播内容">系统测试广播：所有在线用户都会收到此消息</textarea>
                </div>
                <button class="btn btn-warning" onclick="broadcast()">广播消息</button>
            </div>

            <!-- 在线用户列表 -->
            <div class="card">
                <h2>👥 在线用户列表</h2>
                <button class="btn btn-info" onclick="refreshOnlineUsers()">刷新列表</button>
                <div class="user-list" id="userList">
                    <p style="text-align: center; color: #999; padding: 20px;">点击刷新按钮获取在线用户</p>
                </div>
            </div>

            <!-- 快捷操作 -->
            <div class="card">
                <h2>⚡ 快捷操作</h2>
                <div class="quick-actions">
                    <button class="btn btn-info" onclick="checkUserOnline()">检查用户在线</button>
                    <button class="btn btn-info" onclick="getOnlineStats()">获取统计数据</button>
                    <button class="btn btn-warning" onclick="clearLogs()">清空日志</button>
                </div>
                <div class="form-group" style="margin-top: 15px;">
                    <label>检查用户ID</label>
                    <input type="text" id="checkUserId" placeholder="输入用户ID" value="DOC001">
                </div>
            </div>
        </div>

        <!-- 日志区域 -->
        <div class="card">
            <h2>📋 操作日志</h2>
            <div class="log-area" id="logArea">
                <div class="log-entry info">[系统] 测试工具已加载</div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5251/api'; // 根据实际情况修改
        const WS_BASE = 'ws://localhost:5251/ws';
        let ws = null;

        // 日志函数
        function log(message, type = 'info') {
            const logArea = document.getElementById('logArea');
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${time}] ${message}`;
            logArea.appendChild(entry);
            logArea.scrollTop = logArea.scrollHeight;
        }

        function clearLogs() {
            document.getElementById('logArea').innerHTML = '<div class="log-entry info">[系统] 日志已清空</div>';
        }

        // WebSocket 连接
        function connectWebSocket() {
            const userId = document.getElementById('connUserId').value.trim();
            const userRole = document.getElementById('connUserRole').value;
            const wardCode = document.getElementById('connWardCode').value.trim();

            if (!userId) {
                alert('请输入用户ID');
                return;
            }

            const wsUrl = `${WS_BASE}?userId=${userId}&userRole=${userRole}&wardCode=${wardCode}`;
            log(`正在连接: ${wsUrl}`, 'info');

            ws = new WebSocket(wsUrl);

            ws.onopen = function () {
                log(`✅ WebSocket 连接成功 (${userId}, ${userRole}, ${wardCode})`, 'success');
                document.getElementById('connStatus').innerHTML = '<span class="status-badge status-online">已连接</span>';
                refreshOnlineUsers();
            };

            ws.onmessage = function (event) {
                log(`📨 收到消息: ${event.data}`, 'success');
                try {
                    const msg = JSON.parse(event.data);
                    if (msg.CrisisString) {

                        // 美化显示消息
                        let displayMsg = '';
                        if (msg.Type === 'connection') {
                            displayMsg = `${msg.Message} - 用户: ${msg.UserId}, 角色: ${msg.UserRole}`;
                        } else if (msg.CrisisString) {
                            displayMsg = `危急值通知 - ${msg.PatientInfo || '未知患者'}: ${msg.CrisisString}`;
                            showNotification(msg);
                        } else if (msg.Type === 'pong') {
                            displayMsg = '心跳响应 (pong)';
                        } else if (msg.Type === 'echo') {
                            displayMsg = msg.Message;
                        } else {
                            displayMsg = JSON.stringify(msg, null, 2);
                        }

                        log(`📨 收到消息: ${displayMsg}`, 'success');
                    }
                } catch (e) {
                    console.error('解析消息失败:', e);
                    // 如果解析失败，显示原始消息
                    log(`📨 收到消息: ${event.data}`, 'success');
                }
            };

            ws.onerror = function (error) {
                log(`❌ WebSocket 错误: ${error}`, 'error');
            };

            ws.onclose = function () {
                log('🔌 WebSocket 连接已关闭', 'info');
                document.getElementById('connStatus').innerHTML = '<span class="status-badge status-offline">未连接</span>';
            };
        }

        function disconnectWebSocket() {
            if (ws) {
                ws.close();
                ws = null;
            }
        }

        function showNotification(msg) {
            if (Notification.permission === "granted") {
                new Notification('危急值通知', {
                    body: msg.CrisisString,
                    icon: '/favicon.ico'
                });
            }
        }

        // 向指定用户发送
        async function sendToUser() {
            const userId = document.getElementById('targetUserId').value.trim();
            const patientInfo = document.getElementById('targetPatientInfo').value.trim();
            const crisisString = document.getElementById('targetCrisisString').value.trim();

            if (!userId) {
                alert('请输入目标用户ID');
                return;
            }

            try {
                log(`🔄 正在向用户 ${userId} 发送消息...`, 'info');

                const response = await fetch(`${API_BASE}/message/test/send-to-user`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        UserId: userId,
                        PatientInfo: patientInfo,
                        CrisisString: crisisString,
                        PatientInfo: patientInfo || '测试患者，男，45岁',
                        CrisisString: crisisString || '这是一条测试危急值消息'
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    const errorMsg = errorData.title || errorData.Message || JSON.stringify(errorData);
                    log(`❌ 发送失败 (HTTP ${response.status}): ${errorMsg}`, 'error');
                    console.error('详细错误:', errorData);
                    return;
                }

                const result = await response.json();
                if (result.Success) {
                    log(`✅ 向用户 ${userId} 发送成功`, 'success');
                } else {
                    log(`❌ 发送失败: ${result.Message}`, 'error');
                }
            } catch (error) {
                log(`❌ 发送失败: ${error.message}`, 'error');
                console.error('详细错误:', error);
            }
        }

        // 向科室发送
        async function sendToWard() {
            const wardCode = document.getElementById('wardCode').value.trim();
            const wardName = document.getElementById('wardName').value.trim();
            const targetRole = document.getElementById('wardTargetRole').value;
            const crisisString = document.getElementById('wardCrisisString').value.trim();

            if (!wardCode) {
                alert('请输入科室编号');
                return;
            }

            try {
                log(`🔄 正在向科室 ${wardCode} 发送消息...`, 'info');

                const response = await fetch(`${API_BASE}/message/test/send-to-ward`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        WardCode: wardCode,
                        WardName: wardName,
                        CrisisString: crisisString,
                        WardName: wardName || wardCode,
                        CrisisString: crisisString || `[测试] 科室 ${wardCode} 的危急值消息`,
                        TargetRole: targetRole
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    const errorMsg = errorData.title || errorData.Message || JSON.stringify(errorData);
                    log(`❌ 发送失败 (HTTP ${response.status}): ${errorMsg}`, 'error');
                    console.error('详细错误:', errorData);
                    return;
                }

                const result = await response.json();
                if (result.Success) {
                    log(`✅ 向科室 ${wardCode} 发送成功 (医生:${result.DoctorCount}, 护士:${result.NurseCount})`, 'success');
                } else {
                    log(`❌ 发送失败: ${result.Message}`, 'error');
                }
            } catch (error) {
                log(`❌ 发送失败: ${error.message}`, 'error');
                console.error('详细错误:', error);
            }
        }

        // 广播
        async function broadcast() {
            const message = document.getElementById('broadcastMessage').value.trim();

            if (!message) {
                alert('请输入广播内容');
                return;
            }

            try {
                log(`🔄 正在广播消息...`, 'info');

                const response = await fetch(`${API_BASE}/message/test/broadcast`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ Message: message })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    const errorMsg = errorData.title || errorData.Message || JSON.stringify(errorData);
                    log(`❌ 广播失败 (HTTP ${response.status}): ${errorMsg}`, 'error');
                    console.error('详细错误:', errorData);
                    return;
                }

                const result = await response.json();
                if (result.Success) {
                    log(`✅ 广播成功，在线用户数: ${result.OnlineUserCount}`, 'success');
                } else {
                    log(`❌ 广播失败: ${result.Message}`, 'error');
                }
            } catch (error) {
                log(`❌ 广播失败: ${error.message}`, 'error');
                console.error('详细错误:', error);
            }
        }

        // 刷新在线用户
        async function refreshOnlineUsers() {
            try {
                log(`🔄 正在刷新在线用户列表...`, 'info');

                const response = await fetch(`${API_BASE}/message/test/online-users`);

                if (!response.ok) {
                    const errorData = await response.json();
                    const errorMsg = errorData.title || errorData.Message || JSON.stringify(errorData);
                    log(`❌ 刷新失败 (HTTP ${response.status}): ${errorMsg}`, 'error');
                    console.error('详细错误:', errorData);
                    return;
                }

                const result = await response.json();

                if (result.Success) {
                    const userList = document.getElementById('userList');
                    userList.innerHTML = '';

                    if (result.Users.length === 0) {
                        userList.innerHTML = '<p style="text-align: center; color: #999; padding: 20px;">暂无在线用户</p>';
                    } else {
                        result.Users.forEach(user => {
                            const div = document.createElement('div');
                            div.className = 'user-item';
                            div.innerHTML = `
                                <strong>${user.UserId}</strong> 
                                <span style="color: #666;">| ${user.Role === 'doctor' ? '医生' : '护士'}</span>
                                <span style="color: #999;">| 科室: ${user.Ward || '未指定'}</span>
                            `;
                            userList.appendChild(div);
                        });
                    }

                    log(`✅ 刷新在线用户成功，共 ${result.Count} 人`, 'success');
                    getOnlineStats();
                }
            } catch (error) {
                log(`❌ 刷新在线用户失败: ${error.message}`, 'error');
                console.error('详细错误:', error);
            }
        }

        // 获取统计数据
        async function getOnlineStats() {
            try {
                const response = await fetch(`${API_BASE}/message/online-stats`);

                if (!response.ok) {
                    console.error('获取统计数据失败:', response.status);
                    return;
                }

                const result = await response.json();

                if (result.Success) {
                    document.getElementById('totalOnline').textContent = result.Total;
                    document.getElementById('doctorOnline').textContent = result.Doctors;
                    document.getElementById('nurseOnline').textContent = result.Nurses;
                    log(`📊 统计数据更新: 总计${result.Total}人，医生${result.Doctors}人，护士${result.Nurses}人`, 'info');
                }
            } catch (error) {
                log(`❌ 获取统计数据失败: ${error.message}`, 'error');
                console.error('获取统计数据失败:', error);
            }
        }

        // 检查用户在线
        async function checkUserOnline() {
            const userId = document.getElementById('checkUserId').value.trim();
            if (!userId) {
                alert('请输入用户ID');
                return;
            }

            try {
                log(`🔄 正在检查用户 ${userId} 在线状态...`, 'info');

                const response = await fetch(`${API_BASE}/message/is-online/${userId}`);

                if (!response.ok) {
                    const errorData = await response.json();
                    const errorMsg = errorData.title || errorData.Message || JSON.stringify(errorData);
                    log(`❌ 检查失败 (HTTP ${response.status}): ${errorMsg}`, 'error');
                    console.error('详细错误:', errorData);
                    return;
                }

                const result = await response.json();

                if (result.Success) {
                    const status = result.IsOnline ? '在线' : '离线';
                    log(`👤 用户 ${userId}: ${status}, 角色: ${result.Role}, 科室: ${result.Ward || '未指定'}`, 'info');
                }
            } catch (error) {
                log(`❌ 检查失败: ${error.message}`, 'error');
                console.error('详细错误:', error);
            }
        }

        // 请求通知权限
        if (Notification.permission !== "granted") {
            Notification.requestPermission();
        }

        // 页面加载时获取统计数据
        window.onload = function () {
            getOnlineStats();
            log('[系统] 测试工具初始化完成', 'success');
        };

        // 页面关闭时断开连接
        window.onbeforeunload = function () {
            if (ws) ws.close();
        };
    </script>
</body>
