<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消息中心 WebSocket 测试</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }

        .section {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
            border-bottom: 3px solid #1e9fff;
            padding-bottom: 10px;
        }

        h2 {
            color: #666;
            margin-top: 0;
        }

        .test-btn {
            background: #1e9fff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
            font-size: 14px;
        }

        .test-btn:hover {
            background: #0c7cd5;
        }

        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
        }

        input,
        select {
            width: 100%;
            padding: 8px;
            margin: 5px 0 15px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        label {
            font-weight: bold;
            color: #555;
        }

        .log {
            background: #1e1e1e;
            color: #00ff00;
            padding: 10px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 10px;
        }

        .log-entry {
            margin-bottom: 5px;
        }
    </style>
</head>

<body>
    <h1>📱 消息中心 WebSocket 功能测试</h1>

    <div class="section">
        <h2>1️⃣ 设置用户信息（模拟登录）</h2>
        <div id="setupStatus" class="status info">请先设置用户信息，然后打开消息中心页面</div>

        <label>用户ID:</label>
        <input type="text" id="userId" value="DOC001" placeholder="例如: DOC001">

        <label>用户角色:</label>
        <select id="userRole">
            <option value="doctor">医生 (doctor)</option>
            <option value="nurse">护士 (nurse)</option>
        </select>

        <label>科室编号:</label>
        <input type="text" id="wardCode" value="NK001" placeholder="例如: NK001">

        <button class="test-btn" onclick="saveUserInfo()">💾 保存用户信息到 localStorage</button>
        <button class="test-btn" onclick="viewUserInfo()">👁️ 查看当前用户信息</button>
        <button class="test-btn" onclick="clearUserInfo()">🗑️ 清除用户信息</button>
    </div>

    <div class="section">
        <h2>2️⃣ 打开消息中心</h2>
        <div id="openStatus" class="status info">保存用户信息后，点击按钮打开消息中心</div>
        <button class="test-btn" onclick="openMessageCenter()">📬 在新窗口打开消息中心</button>
        <button class="test-btn" onclick="openMessageCenterIframe()">📱 在当前页面打开（iframe）</button>
    </div>

    <div class="section">
        <h2>3️⃣ 发送测试消息</h2>
        <div id="sendStatus" class="status info">发送测试消息到消息中心</div>

        <label>患者信息:</label>
        <input type="text" id="patientInfo" value="张三，男，45岁" placeholder="患者信息">

        <label>危急值内容:</label>
        <input type="text" id="crisisString" value="白细胞计数 25.6×10^9/L（参考范围：4-10）" placeholder="危急值内容">

        <button class="test-btn" onclick="sendTestMessage()">📤 发送测试消息</button>
    </div>

    <div class="section">
        <h2>4️⃣ 操作日志</h2>
        <button class="test-btn" onclick="clearLog()">🧹 清空日志</button>
        <div class="log" id="logArea">
            <div class="log-entry">[系统] 测试工具已加载</div>
        </div>
    </div>

    <div id="iframeContainer" style="margin-top: 20px;"></div>

    <script>
        const API_BASE = 'http://localhost:5251/api';

        function log(message, type = 'info') {
            const logArea = document.getElementById('logArea');
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.textContent = `[${time}] ${message}`;
            logArea.appendChild(entry);
            logArea.scrollTop = logArea.scrollHeight;
        }

        function clearLog() {
            document.getElementById('logArea').innerHTML = '<div class="log-entry">[系统] 日志已清空</div>';
        }

        function showStatus(elementId, message, type) {
            const element = document.getElementById(elementId);
            element.className = `status ${type}`;
            element.textContent = message;
        }

        function saveUserInfo() {
            const userId = document.getElementById('userId').value.trim();
            const userRole = document.getElementById('userRole').value;
            const wardCode = document.getElementById('wardCode').value.trim();

            if (!userId || !wardCode) {
                showStatus('setupStatus', '❌ 请填写完整的用户信息', 'error');
                log('保存失败：信息不完整', 'error');
                return;
            }

            localStorage.setItem('userId', userId);
            localStorage.setItem('userRole', userRole);
            localStorage.setItem('wardCode', wardCode);

            showStatus('setupStatus', `✅ 用户信息已保存：${userId} (${userRole === 'doctor' ? '医生' : '护士'}) - ${wardCode}`, 'success');
            log(`用户信息已保存：userId=${userId}, userRole=${userRole}, wardCode=${wardCode}`, 'success');
        }

        function viewUserInfo() {
            const userId = localStorage.getItem('userId');
            const userRole = localStorage.getItem('userRole');
            const wardCode = localStorage.getItem('wardCode');

            if (!userId) {
                showStatus('setupStatus', '⚠️ 未找到用户信息，请先保存', 'error');
                log('未找到用户信息', 'error');
                return;
            }

            showStatus('setupStatus', `当前用户：${userId} (${userRole === 'doctor' ? '医生' : '护士'}) - 科室：${wardCode}`, 'info');
            log(`当前用户信息：userId=${userId}, userRole=${userRole}, wardCode=${wardCode}`, 'info');
        }

        function clearUserInfo() {
            localStorage.removeItem('userId');
            localStorage.removeItem('userRole');
            localStorage.removeItem('wardCode');
            showStatus('setupStatus', '✅ 用户信息已清除', 'success');
            log('用户信息已清除', 'success');
        }

        function openMessageCenter() {
            const userId = localStorage.getItem('userId');
            if (!userId) {
                showStatus('openStatus', '❌ 请先保存用户信息', 'error');
                log('打开消息中心失败：未设置用户信息', 'error');
                return;
            }

            window.open('/navpage/message.html', '_blank');
            showStatus('openStatus', '✅ 消息中心已在新窗口打开', 'success');
            log('消息中心已在新窗口打开', 'success');
        }

        function openMessageCenterIframe() {
            const userId = localStorage.getItem('userId');
            if (!userId) {
                showStatus('openStatus', '❌ 请先保存用户信息', 'error');
                log('打开消息中心失败：未设置用户信息', 'error');
                return;
            }

            const container = document.getElementById('iframeContainer');
            container.innerHTML = `
                <div style="background: white; padding: 10px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                        <h3 style="margin: 0;">消息中心预览</h3>
                        <button class="test-btn" onclick="document.getElementById('iframeContainer').innerHTML=''">❌ 关闭</button>
                    </div>
                    <iframe src="/navpage/message.html" style="width: 100%; height: 600px; border: 1px solid #ddd; border-radius: 4px;"></iframe>
                </div>
            `;
            showStatus('openStatus', '✅ 消息中心已在当前页面打开', 'success');
            log('消息中心已在当前页面打开（iframe）', 'success');
        }

        async function sendTestMessage() {
            const userId = localStorage.getItem('userId');
            if (!userId) {
                showStatus('sendStatus', '❌ 请先保存用户信息', 'error');
                log('发送失败：未设置用户信息', 'error');
                return;
            }

            const patientInfo = document.getElementById('patientInfo').value.trim();
            const crisisString = document.getElementById('crisisString').value.trim();

            if (!patientInfo || !crisisString) {
                showStatus('sendStatus', '❌ 请填写完整的消息内容', 'error');
                log('发送失败：消息内容不完整', 'error');
                return;
            }

            try {
                showStatus('sendStatus', '⏳ 正在发送测试消息...', 'info');
                log(`正在向用户 ${userId} 发送测试消息...`, 'info');

                const response = await fetch(`${API_BASE}/message/test/send-to-user`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        UserId: userId,
                        PatientInfo: patientInfo,
                        CrisisString: crisisString
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    const errorMsg = errorData.title || errorData.Message || JSON.stringify(errorData);
                    showStatus('sendStatus', `❌ 发送失败: ${errorMsg}`, 'error');
                    log(`发送失败 (HTTP ${response.status}): ${errorMsg}`, 'error');
                    return;
                }

                const result = await response.json();
                if (result.Success) {
                    showStatus('sendStatus', `✅ 测试消息发送成功！请查看消息中心`, 'success');
                    log(`测试消息发送成功：${patientInfo} - ${crisisString}`, 'success');
                } else {
                    showStatus('sendStatus', `❌ 发送失败: ${result.Message}`, 'error');
                    log(`发送失败: ${result.Message}`, 'error');
                }
            } catch (error) {
                showStatus('sendStatus', `❌ 发送失败: ${error.message}`, 'error');
                log(`发送失败: ${error.message}`, 'error');
                console.error('详细错误:', error);
            }
        }

        // 页面加载时检查用户信息
        window.onload = function () {
            viewUserInfo();
            log('测试工具初始化完成', 'success');
        };
    </script>
</body>

</html>
