<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>应用更新包列表</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB',
                'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin-bottom: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            color: #333;
            font-size: 28px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #666;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .info-box {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .info-item {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .info-label {
            font-size: 12px;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 24px;
            font-weight: 600;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .error {
            background: #fff2f0;
            border: 1px solid #ffccc7;
            color: #ff4d4f;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f8f9ff;
        }

        th {
            text-align: left;
            padding: 15px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
            border-bottom: 2px solid #667eea;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
        }

        tr:hover {
            background: #f8f9ff;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge-latest {
            background: linear-gradient(135deg, #52c41a 0%, #73d13d 100%);
            color: white;
        }

        .badge-version {
            background: #f0f0f0;
            color: #666;
        }

        .badge-wgt {
            background: #e6f7ff;
            color: #1890ff;
            border: 1px solid #91d5ff;
        }

        .badge-apk {
            background: #f0f9ff;
            color: #0958d9;
            border: 1px solid #91caff;
        }

        .version-cell {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .download-link {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .download-link:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .icon {
            width: 20px;
            height: 20px;
        }

        .icon-sm {
            width: 16px;
            height: 16px;
        }

        .copy-btn {
            background: transparent;
            border: 1px solid #d9d9d9;
            color: #666;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .copy-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .card {
                padding: 20px;
            }

            h1 {
                font-size: 24px;
            }

            .info-box {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            table {
                font-size: 12px;
            }

            th,
            td {
                padding: 10px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    应用更新包列表
                </h1>
                <div class="header-actions">
                    <button class="btn btn-secondary" onclick="loadManifest()">
                        <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="23 4 23 10 17 10"></polyline>
                            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                        </svg>
                        刷新
                    </button>
                    <a href="/app-update-upload.html" class="btn btn-primary">
                        <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        上传新版本
                    </a>
                </div>
            </div>

            <div class="info-box" id="infoBox" style="display: none;">
                <div class="info-item">
                    <div class="info-label">最新版本</div>
                    <div class="info-value" id="latestVersion">-</div>
                </div>
                <div class="info-item">
                    <div class="info-label">版本代码</div>
                    <div class="info-value" id="latestVersionCode">-</div>
                </div>
                <div class="info-item">
                    <div class="info-label">更新类型</div>
                    <div class="info-value" id="latestType">-</div>
                </div>
                <div class="info-item">
                    <div class="info-label">版本总数</div>
                    <div class="info-value" id="totalVersions">-</div>
                </div>
            </div>

            <div id="errorContainer"></div>
            <div id="loadingContainer" class="loading">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="2" x2="12" y2="6"></line>
                    <line x1="12" y1="18" x2="12" y2="22"></line>
                    <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line>
                    <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line>
                    <line x1="2" y1="12" x2="6" y2="12"></line>
                    <line x1="18" y1="12" x2="22" y2="12"></line>
                    <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line>
                    <line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line>
                </svg>
                <p style="margin-top: 15px;">加载中...</p>
            </div>

            <div class="table-container" id="tableContainer" style="display: none;">
                <table>
                    <thead>
                        <tr>
                            <th>版本</th>
                            <th>类型</th>
                            <th>版本代码</th>
                            <th>文件名</th>
                            <th>大小</th>
                            <th>发布日期</th>
                            <th>描述</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                    </tbody>
                </table>
            </div>

            <div id="emptyState" style="display: none;" class="empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
                    <polyline points="13 2 13 9 20 9"></polyline>
                </svg>
                <p style="font-size: 16px; margin-bottom: 10px;">暂无更新包</p>
                <p style="font-size: 14px;">点击上方"上传新版本"按钮开始上传</p>
            </div>
        </div>
    </div>

    <script>
        const api = localStorage.getItem("api_url")

        window.addEventListener('load', () => {
            loadManifest();
        });

        async function loadManifest() {
            const loadingContainer = document.getElementById('loadingContainer');
            const errorContainer = document.getElementById('errorContainer');
            const tableContainer = document.getElementById('tableContainer');
            const emptyState = document.getElementById('emptyState');
            const infoBox = document.getElementById('infoBox');

            loadingContainer.style.display = 'block';
            errorContainer.innerHTML = '';
            tableContainer.style.display = 'none';
            emptyState.style.display = 'none';
            infoBox.style.display = 'none';
            console.log("使用的 API 地址:", api);
            try {
                const response = await fetch(api + '/wgt/update-manifest.json');

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();

                loadingContainer.style.display = 'none';

                document.getElementById('latestVersion').textContent = data.latest || '-';
                document.getElementById('latestVersionCode').textContent = data.latestVersionCode || '-';
                document.getElementById('latestType').textContent = (data.latestType || 'wgt').toUpperCase();
                document.getElementById('totalVersions').textContent = data.files ? data.files.length : 0;
                infoBox.style.display = 'grid';

                if (data.files && data.files.length > 0) {
                    renderTable(data.files, data.latest, data.latestType);
                    tableContainer.style.display = 'block';
                } else {
                    emptyState.style.display = 'block';
                }

            } catch (error) {
                loadingContainer.style.display = 'none';
                errorContainer.innerHTML = `
                    <div class="error">
                        <strong>加载失败：</strong>${error.message}
                    </div>
                `;
            }
        }

        function renderTable(files, latestVersion, latestType) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            files.forEach((file, index) => {
                const row = document.createElement('tr');

                const isLatest = file.version === latestVersion && (file.type || 'wgt') === (latestType || 'wgt');
                const fileType = (file.type || 'wgt').toLowerCase();

                row.innerHTML = `
                    <td>
                        <div class="version-cell">
                            <span style="font-weight: 600;">${file.version || '-'}</span>
                            ${isLatest ? '<span class="badge badge-latest">最新</span>' : ''}
                        </div>
                    </td>
                    <td>
                        <span class="badge badge-${fileType}">${fileType.toUpperCase()}</span>
                    </td>
                    <td>
                        ${file.versionCode ?
                        `<span class="badge badge-version">${file.versionCode}</span>` :
                        '<span style="color: #999;">-</span>'}
                    </td>
                    <td>${file.fileName || '-'}</td>
                    <td>${formatFileSize(file.size)}</td>
                    <td>${formatDate(file.publishedAt)}</td>
                    <td style="max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" 
                        title="${file.description || ''}">
                        ${file.description || '-'}
                    </td>
                    <td>
                        <a href="${file.url}" class="download-link" download>
                            <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="7 10 12 15 17 10"></polyline>
                                <line x1="12" y1="15" x2="12" y2="3"></line>
                            </svg>
                            下载
                        </a>
                        <button class="copy-btn" onclick="copyUrl('${file.url}')" title="复制下载链接">
                            <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                        </button>
                    </td>
                `;

                tbody.appendChild(row);
            });
        }

        function copyUrl(url) {
            const fullUrl = window.location.origin + url;

            if (navigator.clipboard) {
                navigator.clipboard.writeText(fullUrl).then(() => {
                    alert('✓ 下载链接已复制到剪贴板\n' + fullUrl);
                }).catch(() => {
                    fallbackCopy(fullUrl);
                });
            } else {
                fallbackCopy(fullUrl);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();

            try {
                document.execCommand('copy');
                alert('✓ 下载链接已复制到剪贴板\n' + text);
            } catch (err) {
                alert('复制失败，请手动复制：\n' + text);
            }

            document.body.removeChild(textarea);
        }

        function formatFileSize(bytes) {
            if (!bytes || bytes === 0) return '-';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';

            if (/^\d{8}$/.test(dateStr)) {
                const year = dateStr.substring(0, 4);
                const month = dateStr.substring(4, 6);
                const day = dateStr.substring(6, 8);
                return `${year}-${month}-${day}`;
            }

            return dateStr;
        }
    </script>
</body>

</html>
