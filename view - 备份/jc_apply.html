    <style>
      /* 确保固定列与其他列高度一致 */
      .layui-table-fixed-r .layui-table-body tr {
        height: auto !important;
      }

      .layui-table-fixed-r .layui-table-cell {
        font-size: 14px !important;
        line-height: 1.4 !important;
        height: auto !important;
        padding: 12px 8px !important;
        white-space: normal !important;
      }

      /* 确保固定列头部单元格与普通列保持一致 */
      .layui-table-fixed-r .layui-table-header .layui-table-cell {
        font-size: 14px !important;
        font-weight: bold !important;
        background-color: #f8f9fa !important;
        /* padding: 12px 8px !important; */
      }

      /* 操作按钮样式优化 */
      .layui-table .layui-btn-xs {
        font-size: 12px !important;
        line-height: 24px !important;
        height: 24px !important;
        margin: 2px !important;
        padding: 0 8px !important;
      }

      /* 确保固定列不会产生滚动条 */
      .layui-table-fixed-r {
        box-shadow: -1px 0 8px rgba(0, 0, 0, 0.08);
      }

      /* 修正固定列的行高与主表格保持一致 */
      .layui-table-fixed-r tbody tr {
        height: auto !important;
      }

      /* 确保固定列的内容垂直居中 */
      .layui-table-fixed-r .layui-table-cell {
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
      }

      /* 添加表格缩放的平滑过渡效果 */
      .layui-table-box {
        transition: transform 0.2s ease, width 0.2s ease;
      }

      /* 确保表格内部元素在缩放时能够正常调整 */
      .layui-table-header table,
      .layui-table-body table {
        transition: width 0.2s ease;
      }

      /* 套餐选择样式 */
      .package-form {
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      .package-content {
        overflow: hidden;
        flex: 1;
      }

      .package-selector {
        display: flex;
        flex-direction: column;
        height: 100%;
        gap: 15px;
      }

      .package-select-area {
        flex: 0 0 auto;
        padding: 15px;
        border-bottom: 1px solid #e6e6e6;
        background: #f8f9fa;
      }

      .package-select-label {
        font-size: 14px;
        font-weight: bold;
        display: block;
        margin-bottom: 8px;
        color: #333;
      }

      .package-select {
        position: relative;
        width: 100%;
        height: 36px;
        cursor: pointer;
        border: 1px solid #ddd;
        border-radius: 4px;
        background: white;
      }

      .package-select-display {
        font-size: 13px;
        line-height: 36px;
        width: 100%;
        height: 100%;
        padding: 0 30px 0 10px;
        cursor: pointer;
        user-select: none;
        color: #333;
        border: none;
        outline: none;
        background: transparent;
      }

      .package-select-display.placeholder {
        color: #999;
      }

      .package-select-arrow {
        font-size: 12px;
        position: absolute;
        top: 50%;
        right: 10px;
        transition: transform 0.2s ease;
        transform: translateY(-50%);
        pointer-events: none;
        color: #666;
      }

      .package-select.open .package-select-arrow {
        transform: translateY(-50%) rotate(180deg);
      }

      .package-select:focus {
        border-color: #1e9fff;
        box-shadow: 0 0 3px rgba(30, 159, 255, 0.3);
      }

      .package-dropdown {
        position: absolute;
        z-index: 1000;
        top: 100%;
        right: 0;
        left: 0;
        display: none;
        overflow-y: auto;
        max-height: 200px;
        border: 1px solid #ddd;
        border-top: none;
        border-radius: 0 0 4px 4px;
        background: white;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .package-dropdown.show {
        display: block;
      }

      .package-option {
        font-size: 13px;
        padding: 8px 10px;
        cursor: pointer;
        transition: background-color 0.2s ease;
        color: #333;
        border-bottom: 1px solid #f5f5f5;
      }

      .package-option:hover {
        background: #f5f5f5;
      }

      .package-option:last-child {
        border-bottom: none;
      }

      .package-option.selected {
        color: white;
        background: #1e9fff;
      }

      .package-items-area {
        display: flex;
        flex: 1;
        flex-direction: column;
        min-height: 0;
      }

      .items-container {
        overflow-y: auto;
        flex: 1;
        max-height: 280px;
      }

      .items-header {
        font-size: 13px;
        font-weight: bold;
        padding: 8px;
        text-align: center;
        color: #fff;
        background: #1e9fff;
      }

      .items-list {
        padding: 10px;
      }

      .item-checkbox {
        display: block;
        padding: 8px 0;
        cursor: pointer;
        border-bottom: 1px solid #f0f0f0;
      }

      .item-checkbox:hover {
        background: #f5f5f5;
      }

      .item-name {
        font-size: 13px;
        margin-left: 8px;
      }

      .no-package-selected {
        font-size: 13px;
        padding: 50px 20px;
        text-align: center;
        color: #999;
      }

      .dialog-buttons {
        flex-shrink: 0;
        padding: 15px;
        text-align: right;
        border-top: 1px solid #e6e6e6;
      }

      .dialog-buttons .layui-btn {
        margin-left: 10px;
      }

      /* 窄屏响应式布局 */
      @media (max-width: 768px) {
        .package-content {
          padding: 0;
        }

        .package-select-area {
          padding: 10px;
        }

        .package-select-label {
          font-size: 13px;
        }

        .package-select {
          height: 32px;
        }

        .package-select-display {
          font-size: 12px;
          line-height: 32px;
        }

        .package-dropdown {
          max-height: 150px;
        }

        .package-option {
          font-size: 12px;
          padding: 6px 8px;
        }

        .items-container {
          max-height: 200px;
        }

        .items-header {
          font-size: 12px;
        }

        .item-name {
          font-size: 12px;
        }
      }
      /* .layui-table-box {
        height: 100%;
      } */
      /* 更窄屏幕优化 */
      @media (max-width: 480px) {
        .items-container {
          max-height: 150px;
        }

        .dialog-buttons {
          padding: 10px;
        }

        .dialog-buttons .layui-btn {
          font-size: 12px;
          line-height: 32px;
          height: 32px;
          padding: 0 12px;
        }
      }
    </style>
  </head>

    <script>
      // HBuilder App环境下打开URL的通用工具函数
      function openUrlInBrowser(url, options) {
        options = options || {};
        var title = options.title || "打开链接";
        var confirmMessage =
          options.confirmMessage || "即将使用系统浏览器打开链接，确定继续吗？";
        var showConfirm = options.showConfirm !== false; // 默认显示确认框

        function doOpen() {
          if (window.plus) {
            // HBuilder App环境：使用系统浏览器打开
            try {
              plus.runtime.openURL(url, function (error) {
                layer.msg("无法打开链接：" + error.message, { icon: 5 });
              });
            } catch (e) {
              layer.msg("打开链接失败：" + e.message, { icon: 5 });
            }
          } else if (window.cordova && window.cordova.InAppBrowser) {
            // Cordova环境：使用InAppBrowser插件
            cordova.InAppBrowser.open(url, "_system");
          } else {
            // 普通浏览器环境：新标签页打开
            window.open(url, "_blank", "noopener,noreferrer");
          }
        }

        if (showConfirm && window.plus) {
          layer.confirm(
            confirmMessage,
            { icon: 3, title: title },
            function (index) {
              layer.close(index);
              doOpen();
            }
          );
        } else {
          doOpen();
        }
      }

      // 防抖函数
      function debounce(func, wait) {
        let timeout;
        return function executedFunction(...args) {
          const later = () => {
            clearTimeout(timeout);
            func(...args);
          };
          clearTimeout(timeout);
          timeout = setTimeout(later, wait);
        };
      }

      function scaleTableForMobile() {
        const layuiTableBox = document.querySelector(".layui-table-box");
        const layuiTableTool = document.querySelector(".layui-table-tool");
        const targetWidth = layuiTableTool.offsetWidth;
        const tableHeader = layuiTableBox.querySelector(".layui-table-header");
        const tableRealWidth = tableHeader.scrollWidth;
        console.log(
          "targetWidth:",
          targetWidth,
          "tableRealWidth:",
          tableRealWidth
        );

        if (
          tableRealWidth !== targetWidth &&
          tableRealWidth > 0 &&
          targetWidth > 0
        ) {
          const scale = targetWidth / tableRealWidth;
          layuiTableBox.style.transform = `scale(${scale})`;
          layuiTableBox.style.transformOrigin = "top left";
          layuiTableBox.style.width = `${100 / scale}%`;
          // layuiTableBox.style.height = `${100 / scale}%`;
          console.log("高度", layuiTableBox.style.height);
          // 重要：确保内部表格元素不被固定宽度限制
          const headerTable = layuiTableBox.querySelector(
            ".layui-table-header table"
          );
          const bodyTable = layuiTableBox.querySelector(
            ".layui-table-body table"
          );
          if (headerTable) {
            headerTable.style.width = "100%";
            headerTable.style.minWidth = "unset";
          }
          if (bodyTable) {
            bodyTable.style.width = "100%";
            bodyTable.style.minWidth = "unset";
          }
        } else {
          // 重置缩放
          layuiTableBox.style.transform = `scale(1)`;
          layuiTableBox.style.transformOrigin = "top left";
          layuiTableBox.style.width = `100%`;

          // 重置内部表格元素的样式
          const headerTable = layuiTableBox.querySelector(
            ".layui-table-header table"
          );
          const bodyTable = layuiTableBox.querySelector(
            ".layui-table-body table"
          );
          if (headerTable) {
            headerTable.style.width = "";
            headerTable.style.minWidth = "";
          }
          if (bodyTable) {
            bodyTable.style.width = "";
            bodyTable.style.minWidth = "";
          }
        }
      }

      // 使用防抖处理 resize 事件
      const debouncedScale = debounce(scaleTableForMobile, 150);
      window.addEventListener("resize", debouncedScale);
      layui.use(["table", "appconfig", "layer", "form"], function () {
        var table = layui.table;
        var $ = layui.jquery;
        var appconfig = layui.appconfig;
        var layer = layui.layer;
        var form = layui.form;

        // 获取URL参数
        function getUrlParam(name) {
          var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)");
          var r = window.location.search.substr(1).match(reg);
          if (r != null) return unescape(r[2]);
          return null;
        }

        var patient_id = getUrlParam("patient_id");
        var admiss_times = getUrlParam("admiss_times");
        // 获取患者信息 (已在顶部显示，此处不再重复)

        // 套餐数据变量
        var examPackages = [];
        var allExamItems = []; // 所有检查项目数据

        // 获取检查项目数据
        function loadExamItems(callback) {
          var wardData = localStorage.getItem("wardData");

          if (wardData === null) {
            layer.msg("请先选择病区！");
            location.href = "view/wardlist.html";
            return;
          }
          var jsonData = JSON.parse(wardData);
          localStorage.ward_sn = jsonData.ward_sn;

          $.ajax({
            url:
              appconfig.api +
              "/api/JcJy/GetJianChaList?hospital_dept=" +
              (localStorage.ward_sn || ""),
            type: "GET",
            dataType: "json",
            success: function (res) {
              if (res.Status === 1 && res.Data) {
                allExamItems = res.Data;
                callback(true);
              } else {
                layer.msg("获取检查项目数据失败: " + (res.msg || "未知错误"), {
                  icon: 5,
                });
                callback(false);
              }
            },
            error: function () {
              layer.msg("网络错误，无法获取检查项目数据", { icon: 5 });
              callback(false);
            },
          });
        }

        // 获取套餐数据
        function loadPackages(callback) {
          var loginUser = localStorage.getItem("loginUser");

          if (loginUser === null) {
            location.href = "index.html";
            return;
          }
          var loginUserData = JSON.parse(loginUser);
          $.ajax({
            url:
              "http://10.102.41.142:5105" +
              "/api/jcjy/GetCustomerTemplates?type=jiancha&opera=" +
              loginUserData.user_mi,
            type: "GET",
            dataType: "json",
            success: function (res) {
              if (res.status === 1 && res.data) {
                examPackages = res.data;
                callback(true);
              } else {
                layer.msg("获取套餐数据失败: " + (res.msg || "未知错误"), {
                  icon: 5,
                });
                callback(false);
              }
            },
            error: function () {
              layer.msg("网络错误，无法获取套餐数据", { icon: 5 });
              callback(false);
            },
          });
        }

        // 获取申请单编号
        function getApplySn(callback) {
          $.ajax({
            url: appconfig.api + "/api/JcJy/GetApplySn",
            type: "GET",
            dataType: "json",
            success: function (res) {
              if (res.Status === 1 && res.Data) {
                callback(true, res.Data);
              } else {
                layer.msg("获取申请单编号失败: " + (res.msg || "未知错误"), {
                  icon: 5,
                });
                callback(false, null);
              }
            },
            error: function () {
              layer.msg("网络错误，无法获取申请单编号", { icon: 5 });
              callback(false, null);
            },
          });
        }

        // 提交检查申请
        function submitExamApply(selectedItems, callback) {
          console.log("提交检查申请 - selectedItems:", selectedItems);
          console.log("提交检查申请 - allExamItems长度:", allExamItems.length);

          var loginUser = localStorage.getItem("loginUser");
          var patientData = JSON.parse(
            localStorage.getItem("patientData") || "{}"
          );

          if (!loginUser) {
            layer.msg("登录信息已过期，请重新登录", { icon: 5 });
            callback(false);
            return;
          }

          var loginUserData = JSON.parse(loginUser);
          var todoList = [];
          var completedCount = 0;
          var totalCount = selectedItems.length;

          console.log("开始处理 selectedItems，总数:", totalCount);

          // 为每个选中的项目创建申请记录
          selectedItems.forEach(function (selectedItem) {
            console.log("处理 selectedItem:", selectedItem);

            // 从allExamItems中找到完整的项目信息
            var fullItem = allExamItems.find(function (item) {
              return (
                item.id == selectedItem.id ||
                item.code == selectedItem.id ||
                item.sub_code == selectedItem.id ||
                item.item_id == selectedItem.id
              );
            });

            console.log("找到的 fullItem:", fullItem);

            if (!fullItem) {
              console.log(
                "未找到对应的 fullItem，selectedItem.id:",
                selectedItem.id
              );
              console.log("allExamItems 样例数据:", allExamItems.slice(0, 3));
              completedCount++;
              if (completedCount === totalCount) {
                submitAllApplies();
              }
              return;
            }

            // 获取申请单编号
            getApplySn(function (success, applyData) {
              console.log(
                "getApplySn 结果 - success:",
                success,
                "applyData:",
                applyData
              );

              if (success && applyData) {
                var wardData = JSON.parse(
                  localStorage.getItem("wardData") || "{}"
                );

                // 获取当前本地时间
                var now = new Date();
                var localDateTime =
                  now.getFullYear() +
                  "-" +
                  (now.getMonth() + 1).toString().padStart(2, "0") +
                  "-" +
                  now.getDate().toString().padStart(2, "0") +
                  " " +
                  now.getHours().toString().padStart(2, "0") +
                  ":" +
                  now.getMinutes().toString().padStart(2, "0") +
                  ":" +
                  now.getSeconds().toString().padStart(2, "0");

                var applyModel = {
                  // 申请单编号相关
                  exam_serial:
                    applyData.apply_date +
                    applyData.apply_sn.toString().padStart(5, "0"),
                  apply_date: localDateTime,

                  // 检查项目信息
                  exam_type: fullItem.type_code || fullItem.exam_type || "",
                  exam_type_name:
                    fullItem.type_code_name || fullItem.exam_type_name || "",
                  exam_sub_type: fullItem.sub_code || fullItem.code || "",
                  exam_sub_type_name:
                    fullItem.sub_code_name ||
                    fullItem.name ||
                    fullItem.item_name ||
                    "",
                  exec_unit: fullItem.exec_unit || "",
                  exec_unit_name: fullItem.exec_unit_name || "",

                  // 基础字段
                  exam_no:
                    applyData.apply_date +
                    applyData.apply_sn.toString().padStart(5, "0"),
                  patient_id: patient_id,
                  admiss_times: admiss_times,
                  apply_doctor: loginUserData.user_mi,
                  scheduled_date: localDateTime,
                  inpatient_no: patientData.inpatient_no || "",
                  apply_unit: wardData.ward_sn || localStorage.ward_sn || "",
                  erem_flag: "0", // 默认非急诊
                  exam_status: "0",
                  add_new: true,
                  charge_amount: 1,
                  zy_mz_flag: "1",
                  // 第三方申请信息
                  third_apply_type: fullItem.third_apply_type || "",
                  third_apply_class: fullItem.third_apply_class || "",

                  // 检查附加信息
                  exam_add_info: " ",
                  exam_add_info2: patientData.admiss_diag_name || " ",
                  exam_add_info3: " ",
                  exam_add_info4: " ",
                };

                console.log("创建的 applyModel:", applyModel);
                todoList.push(applyModel);
                console.log("添加到 todoList 后，长度:", todoList.length);
              } else {
                console.log("获取申请单编号失败");
              }

              completedCount++;
              if (completedCount === totalCount) {
                submitAllApplies();
              }
            });
          });

          // 提交所有申请
          function submitAllApplies() {
            console.log("submitAllApplies - todoList长度:", todoList.length);
            console.log("submitAllApplies - todoList内容:", todoList);

            if (todoList.length === 0) {
              layer.msg("没有有效的申请数据", { icon: 5 });
              callback(false);
              return;
            }

            $.ajax({
              url: appconfig.api + "/api/JcJy/JianchaSubmit",
              type: "POST",
              contentType: "application/json",
              data: JSON.stringify(todoList),
              dataType: "json",
              success: function (res) {
                if (res.Status === 1) {
                  callback(true);
                } else {
                  layer.msg("提交申请失败: " + (res.Msg || "未知错误"), {
                    icon: 5,
                  });
                  callback(false);
                }
              },
              error: function () {
                layer.msg("网络错误，申请提交失败", { icon: 5 });
                callback(false);
              },
            });
          }
        }
        var loginUserData = JSON.parse(localStorage.getItem("loginUser"));
        // 渲染表格
        table.render({
          elem: "#jiancha-table",
          url:
            appconfig.api +
            "/api/JcJy/GetJianChaApplys_JZZXYY?patient_id=" +
            patient_id +
            "&admiss_times=" +
            admiss_times +
            "&subsys_id=" +
            (loginUserData.subsys_id || ""),
          toolbar: "#toolbarDemo",
          defaultToolbar: [],
          cellMinWidth: 50,
          cols: [
            [
              // { type: "checkbox", width: 40 },
              { field: "exam_serial", title: "申请单号", width: 110 },
              {
                field: "exam_status",
                title: "状态",
                width: 40,
                templet: "#statusTpl",
              },
              { field: "exam_type_name", title: "检查类型", minWidth: 100 },
              { field: "exam_sub_type_name", title: "检查项目", minWidth: 100 },
              { field: "charge_amount", title: "数量", width: 60 },
              {
                field: "apply_date",
                title: "申请日期",
                width: 80,
                sort: true,
                templet: "#dateTpl",
              },
              // { field: "exam_flag_str", title: "增强或重建", width: 90 },
              // { field: "parent_serial", title: "父申请号", width: 100 },
              {
                // fixed: "right",
                title: "操作",
                width: 100,
                align: "center",
                toolbar: "#rowBar",
              },
            ],
          ],
          height: "100%",
          text: {
            none: '<div style="text-align: center; padding: 20px; color: #999; font-size: 13px;"><i class="layui-icon layui-icon-file" style="font-size: 36px; display: block; margin-bottom: 8px;"></i>暂无检查申请数据</div>',
          },
          parseData: function (res) {
            console.log("表格接口返回数据:", res);
            return {
              code: res.Status === 1 ? 0 : res.Status,
              msg: res.msg || "",
              count: res.Data ? res.Data.length : 0,
              data: res.Data || [],
            };
          },
          done: function (res, curr, count) {
            // 表格渲染完成后调用缩放函数
            setTimeout(function () {
              scaleTableForMobile();
            }, 100);
          },
        });

        // 头工具栏事件
        table.on("toolbar(jiancha-table)", function (obj) {
          switch (obj.event) {
            case "newApply":
              // 显示加载提示
              var loadingIndex = layer.msg("正在加载数据...", {
                icon: 16,
                shade: 0.3,
                time: 0,
              });

              // 先加载检查项目数据，再加载套餐数据
              loadExamItems(function (itemsSuccess) {
                if (!itemsSuccess) {
                  layer.close(loadingIndex);
                  return;
                }

                // 加载套餐数据
                loadPackages(function (packagesSuccess) {
                  layer.close(loadingIndex);

                  if (!packagesSuccess) {
                    return;
                  }

                  // 生成套餐选择下拉选项
                  var packageOptionsHtml = "";
                  examPackages.forEach(function (pkg) {
                    packageOptionsHtml +=
                      '<div class="package-option" data-id="' +
                      pkg.id +
                      '" data-value="' +
                      (pkg.value || "") +
                      '">' +
                      (pkg.name || "未命名套餐") +
                      "</div>";
                  });

                  layer.open({
                    type: 1,
                    title:
                      '<i class="layui-icon layui-icon-add-1"></i> 选择检查项目',
                    area: ["90%", "90%"],
                    offset: window.innerWidth < 768 ? "10px" : "auto", // 移动端靠近顶部，桌面端居中
                    maxmin: true,
                    resize: false,
                    content:
                      '<div class="package-form">' +
                      '<div class="package-content">' +
                      '<div class="package-selector">' +
                      '<div class="package-select-area">' +
                      '<label class="package-select-label">选择检查套餐：</label>' +
                      '<div class="package-select" id="package-select" tabindex="0">' +
                      '<div class="package-select-display placeholder">请选择检查套餐</div>' +
                      '<i class="layui-icon layui-icon-down package-select-arrow"></i>' +
                      '<div class="package-dropdown">' +
                      packageOptionsHtml +
                      "</div>" +
                      "</div>" +
                      "</div>" +
                      '<div class="package-items-area">' +
                      '<div class="items-container">' +
                      '<div class="no-package-selected">' +
                      '<i class="layui-icon layui-icon-file" style="font-size: 36px; display: block; margin-bottom: 8px;"></i>' +
                      "请先选择检查套餐" +
                      "</div>" +
                      "</div>" +
                      "</div>" +
                      "</div>" +
                      "</div>" +
                      '<div class="dialog-buttons">' +
                      '<button class="layui-btn layui-btn-normal" id="confirm-items">' +
                      '<i class="layui-icon layui-icon-ok"></i> 确认申请' +
                      "</button>" +
                      '<button class="layui-btn layui-btn-primary" id="cancel-items">' +
                      '<i class="layui-icon layui-icon-close"></i> 取消' +
                      "</button>" +
                      "</div>" +
                      "</div>",
                    success: function (layero, index) {
                      var selectedPackage = null;
                      var selectedItems = [];

                      // 显示项目列表
                      function showItems(pkg) {
                        var pkgTitle = pkg.title || pkg.name || "未命名套餐";
                        var itemsHtml =
                          '<div class="items-header">' +
                          pkgTitle +
                          " - 检查项目</div>" +
                          '<div class="items-list">';

                        // 根据套餐的value值过滤项目
                        var packageItems = [];
                        if (pkg.value && allExamItems.length > 0) {
                          var valueIds = pkg.value.split(",");
                          valueIds.forEach(function (id) {
                            var trimmedId = id.trim();
                            var item = allExamItems.find(function (examItem) {
                              return (
                                examItem.id == trimmedId ||
                                examItem.code == trimmedId
                              );
                            });
                            if (item) {
                              packageItems.push(item);
                            }
                          });
                        }
                        console.log("过滤后的项目数据:", packageItems);
                        if (packageItems.length > 0) {
                          packageItems.forEach(function (item) {
                            console.log("生成checkbox的item数据:", item);

                            // 尝试多个可能的id字段名
                            var itemId =
                              item.id ||
                              item.code ||
                              item.sub_code ||
                              item.item_id ||
                              "";
                            console.log("使用的itemId:", itemId);

                            itemsHtml +=
                              '<label class="item-checkbox">' +
                              '<input type="checkbox" value="' +
                              itemId +
                              '" data-name="' +
                              (item.name ||
                                item.item_name ||
                                item.sub_code_name) +
                              '" data-price="' +
                              (item.price || item.charge_amount || "0.00") +
                              '">' +
                              '<span class="item-name">' +
                              (item.name ||
                                item.item_name ||
                                item.sub_code_name) +
                              "</span>" +
                              "</label>";
                          });
                        } else {
                          itemsHtml +=
                            '<div style="text-align: center; padding: 50px; color: #999;">该套餐暂无项目数据</div>';
                        }

                        itemsHtml += "</div>";

                        $(layero).find(".items-container").html(itemsHtml);

                        // 监听项目选择
                        $(layero)
                          .find(".item-checkbox input")
                          .change(function () {
                            updateSelectedItems();
                          });
                      }

                      // 更新选中项目列表
                      function updateSelectedItems() {
                        selectedItems = [];
                        $(layero)
                          .find(".item-checkbox input:checked")
                          .each(function () {
                            selectedItems.push({
                              id: $(this).val(),
                              name: $(this).data("name"),
                              price: $(this).data("price"),
                            });
                          });
                      }

                      // 套餐选择事件
                      var $packageSelect = $(layero).find("#package-select");
                      var $packageDisplay = $packageSelect.find(
                        ".package-select-display"
                      );
                      var $packageDropdown =
                        $packageSelect.find(".package-dropdown");

                      // 点击显示/隐藏下拉框
                      $packageSelect.on("click", function (e) {
                        e.stopPropagation();
                        if ($packageDropdown.hasClass("show")) {
                          $packageDropdown.removeClass("show");
                          $packageSelect.removeClass("open");
                        } else {
                          $packageDropdown.addClass("show");
                          $packageSelect.addClass("open");
                        }
                      });

                      // 选择选项
                      $packageDropdown.on(
                        "click",
                        ".package-option",
                        function (e) {
                          e.stopPropagation();
                          var packageId = $(this).data("id");
                          var packageName = $(this).text();

                          // 更新显示
                          $packageDisplay
                            .text(packageName)
                            .removeClass("placeholder");
                          $packageDropdown
                            .find(".package-option")
                            .removeClass("selected");
                          $(this).addClass("selected");

                          // 隐藏下拉框
                          $packageDropdown.removeClass("show");
                          $packageSelect.removeClass("open");

                          // 处理选择逻辑
                          if (packageId) {
                            selectedPackage = examPackages.find(
                              (pkg) => pkg.id == packageId
                            );
                            selectedItems = []; // 切换套餐时清空已选项目
                            showItems(selectedPackage);
                          }
                        }
                      );

                      // 点击其他地方关闭下拉框
                      $(document).on("click", function () {
                        $packageDropdown.removeClass("show");
                        $packageSelect.removeClass("open");
                      });

                      // 键盘支持
                      $packageSelect.on("keydown", function (e) {
                        if (e.keyCode === 13 || e.keyCode === 32) {
                          // Enter或Space
                          e.preventDefault();
                          $(this).click();
                        }
                      });

                      // 确认申请
                      $(layero)
                        .find("#confirm-items")
                        .click(function () {
                          if (!selectedPackage) {
                            layer.msg("请先选择一个检查套餐", { icon: 5 });
                            return;
                          }

                          if (selectedItems.length === 0) {
                            layer.msg("请至少选择一个检查项目", { icon: 5 });
                            return;
                          }

                          // 显示提交进度
                          var submitIndex = layer.msg("正在提交申请...", {
                            icon: 16,
                            shade: 0.3,
                            time: 0,
                          });

                          // 提交申请
                          submitExamApply(selectedItems, function (success) {
                            layer.close(submitIndex);
                            if (success) {
                              layer.msg("检查项目申请成功！", {
                                icon: 1,
                                time: 2000,
                                end: function () {
                                  layer.close(index);
                                  table.reload("jiancha-table");
                                  setTimeout(scaleTableForMobile, 100);
                                },
                              });
                            }
                          });
                        });

                      // 取消申请
                      $(layero)
                        .find("#cancel-items")
                        .click(function () {
                          layer.close(index);
                        });
                    },
                  });
                });
              });
              break;
          }
        });

        // 操作列模板
        table.on("tool(jiancha-table)", function (obj) {
          var data = obj.data;
          var layEvent = obj.event;
          var loginUser = localStorage.getItem("loginUser");
          var patientData = JSON.parse(
            localStorage.getItem("patientData") || "{}"
          );

          if (!loginUser) {
            layer.msg("登录信息已过期，请重新登录", { icon: 5 });
            return;
          }

          var loginUserData = JSON.parse(loginUser);
          if (layEvent === "detail") {
            // 详情弹窗：请求接口获取报告URL并用设备浏览器打开
            var url = "http://10.101.199.142:5130/api/Third/GetTag20012";

            // 显示加载提示
            var loadingIndex = layer.msg("正在获取报告...", {
              icon: 16,
              shade: 0.3,
              time: 0,
            });

            // 使用原生XMLHttpRequest避免Layui jQuery的responseText问题
            var xhr = new XMLHttpRequest();
            xhr.open(
              "GET",
              appconfig.api +
                "/api/JcJy/GetJCPdfStreamFile?patientId=001015074100&examNo=2025072115484&examType=01",
              true
            );
            xhr.responseType = "blob";
            xhr.timeout = 15000;

            xhr.onload = function () {
              layer.close(loadingIndex);

              if (xhr.status === 200) {
                // 检查响应类型
                var contentType = xhr.getResponseHeader("Content-Type");
                console.log("Content-Type:", contentType);

                if (contentType && contentType.includes("application/pdf")) {
                  // ✅ 使用PDF.js渲染PDF
                  var pdfBlob = xhr.response;
                  var pdfUrl = URL.createObjectURL(pdfBlob);

                  // 根据环境选择打开方式
                  if (window.plus) {
                    console.log("HBuilder App环境，使用系统浏览器打开PDF");
                    // HBuilder App环境：保存并打开
                    layer.confirm(
                      "是否用系统浏览器打开PDF报告？",
                      {
                        icon: 3,
                        title: "打开报告",
                      },
                      function (index) {
                        layer.close(index);
                        plus.runtime.openURL(pdfUrl);
                      }
                    );
                  } else {
                    console.log("使用PDF.js渲染PDF");
                    // 普通浏览器环境：使用PDF.js渲染
                    if (window.innerWidth < 768) {
                      // 移动端：使用PDF.js的viewer页面
                      var pdfViewerUrl =
                        "/lib/pdfjs/web/viewer.html?file=" +
                        encodeURIComponent(pdfUrl);
                      window.open(pdfViewerUrl, "_blank");
                    } else {
                      // 桌面端：弹窗中使用PDF.js viewer
                      var pdfViewerUrl =
                        "/lib/pdfjs/web/viewer.html?file=" +
                        encodeURIComponent(pdfUrl);
                      layer.open({
                        type: 1,
                        title: "检查报告预览",
                        area: ["95%", "95%"],
                        content:
                          '<iframe src="' +
                          pdfViewerUrl +
                          '" style="width:100%;height:100%;border:none;"></iframe>',
                        end: function () {
                          URL.revokeObjectURL(pdfUrl); // 清理内存
                        },
                      });
                    }
                  }
                } else {
                  // 可能是重定向或错误响应
                  var reader = new FileReader();
                  reader.onload = function () {
                    try {
                      var jsonResponse = JSON.parse(reader.result);
                      if (jsonResponse.data) {
                        var reportUrl = jsonResponse.data;
                        if (reportUrl.indexOf("?") > -1) {
                          reportUrl += "&view=inline&display=web";
                        } else {
                          reportUrl += "?view=inline&display=web";
                        }
                        window.open(reportUrl, "_blank");
                      } else {
                        layer.alert("响应格式异常", { icon: 5 });
                      }
                    } catch (e) {
                      layer.alert("无法解析响应", { icon: 5 });
                    }
                  };
                  reader.readAsText(xhr.response);
                }
              } else if (xhr.status === 302 || xhr.status === 301) {
                // 处理重定向
                var location = xhr.getResponseHeader("Location");
                if (location) {
                  window.open(location, "_blank");
                }
              } else if (xhr.status === 400) {
                // 处理400错误（业务逻辑错误）
                var reader = new FileReader();
                reader.onload = function () {
                  layer.alert("获取报告失败: " + reader.result, { icon: 5 });
                };
                reader.readAsText(xhr.response);
              } else {
                layer.alert("获取报告失败: HTTP " + xhr.status, { icon: 5 });
              }
            };

            xhr.onerror = function () {
              layer.close(loadingIndex);
              layer.alert("网络错误，无法获取报告", { icon: 5 });
            };

            xhr.ontimeout = function () {
              layer.close(loadingIndex);
              layer.alert("请求超时，请重试", { icon: 5 });
            };

            xhr.send();
          } else if (layEvent === "delRow") {
            // 删除前先检查状态
            if (data.exam_status == 0) {
              layer.confirm(
                "确定删除该申请吗？",
                { icon: 3, title: "提示" },
                function (index) {
                  // 执行删除操作的代码
                  $.ajax({
                    url: appconfig.api + "/api/JcJy/DelJianCha",
                    type: "GET",
                    contentType: "application/json",
                    data: {
                      patient_id: data.patient_id,
                      admiss_times: data.admiss_times,
                      exam_no: data.exam_no,
                      sybsys_id: loginUserData.subsys_id,
                      opera: loginUserData.user_mi,
                    },
                    dataType: "json",
                    success: function (res) {
                      if (res.Status === 1) {
                        layer.msg("删除成功", { icon: 1 });
                        table.reload("jiancha-table");
                        setTimeout(scaleTableForMobile, 100);
                      } else {
                        layer.msg("删除失败: " + (res.msg || "未知错误"), {
                          icon: 5,
                        });
                      }
                    },
                    error: function () {
                      layer.msg("网络错误，删除失败", { icon: 5 });
                    },
                  });
                  layer.close(index);
                }
              );
            } else {
              layer.msg("该申请状态不可删除！", { icon: 5 });
            }
          }
        });
        // 批量删除按钮事件
        $(document).on("click", "#batch-delete-btn", function () {
          var checkStatus = table.checkStatus("jiancha-table");
          var selected = checkStatus.data;
          if (!selected || selected.length === 0) {
            layer.msg("请先勾选要删除的记录", { icon: 5 });
            return;
          }
          layer.confirm(
            "确定批量删除选中的申请吗？",
            { icon: 3, title: "提示" },
            function (index) {
              // 这里只做前端演示，实际应循环调用删除接口或提供批量接口
              var successCount = 0;
              var failCount = 0;
              var total = selected.length;
              var finished = 0;
              selected.forEach(function (row) {
                $.ajax({
                  url: appconfig.api + "/api/JcJy/DelJianCha",
                  type: "GET",
                  contentType: "application/json",
                  data: {
                    patient_id: row.patient_id,
                    admiss_times: row.admiss_times,
                    exam_no: row.exam_no,
                    sybsys_id: localStorage.loginUser
                      ? JSON.parse(localStorage.loginUser).subsys_id
                      : "",
                    opera: localStorage.loginUser
                      ? JSON.parse(localStorage.loginUser).user_mi
                      : "",
                  },
                  dataType: "json",
                  success: function (res) {
                    if (res.status === 1) {
                      successCount++;
                    } else {
                      failCount++;
                    }
                    finished++;
                    if (finished === total) {
                      layer.msg(
                        "批量删除完成，成功：" +
                          successCount +
                          "，失败：" +
                          failCount,
                        { icon: 1 }
                      );
                      table.reload("jiancha-table");
                      setTimeout(scaleTableForMobile, 100);
                    }
                  },
                  error: function () {
                    failCount++;
                    finished++;
                    if (finished === total) {
                      layer.msg(
                        "批量删除完成，成功：" +
                          successCount +
                          "，失败：" +
                          failCount,
                        { icon: 1 }
                      );
                      table.reload("jiancha-table");
                      setTimeout(scaleTableForMobile, 100);
                    }
                  },
                });
              });
              layer.close(index);
            }
          );
        });
      });
    </script>
  </body>
</html>
