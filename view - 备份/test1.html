<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <!-- <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
    /> -->
    <title>Document</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      .main {
        height: 100%;
      }
      .container {
        display: flex;
        overflow-x: hidden;
        flex-direction: row;
        width: 500%;
        height: 100%;
        /* height: 100vh; */
      }
      .page {
        flex: 1 0 auto;
        /* width: 100vw; */
        height: 100%;
      }
      #page1 {
        background-color: lightblue;
      }
      #page2 {
        background-color: lightgreen;
      }
      #page3 {
        background-color: lightgray;
      }
      #page4 {
        background-color: lightpink;
      }
      #page5 {
        background-color: lightcoral;
      }
    </style>
  </head>
  <body>
    <div class="main">
      <div class="container">
        <div class="page" id="page1"><h1>页面1</h1></div>
        <div class="page" id="page2"><h1>页面2</h1></div>
        <div class="page" id="page3"><h1>页面3</h1></div>
        <div class="page" id="page4"><h1>页面4</h1></div>
        <div class="page" id="page5"><h1>页面5</h1></div>
      </div>
    </div>
    <script>
      let index = 0;
      const container = document.querySelector(".container");
      const main = document.querySelector(".main");
      let startX = 0;
      let currentX = 0;
      let endX = 0;
      let width = window.innerWidth;
      function goToIndex(index) {
        console.log("goToIndex", index);
        container.style.transform = `translateX(${-index * width}px)`;
      }
      main.addEventListener("touchstart", function (e) {
        startX = e.touches[0].clientX;
        console.log(startX);
        container.style.transition = "transform 0.3s ease"; // disable transition during drag
      });
      main.addEventListener("touchmove", function (e) {
        currentX = e.touches[0].clientX;
        const deltaX = currentX - startX;
        container.style.transform = `translateX(${
          -(index * width) + deltaX
        }px)`;
      });
      main.addEventListener("touchend", function (e) {
        const deltaX = currentX - startX;
        if (deltaX < -(width / 2)) {
          goToIndex(index + 1);
          index++;
        } else if (deltaX > width / 2) {
          goToIndex(index - 1);
          index--;
        } else {
          goToIndex(index);
        }
        console.log(index);
      });
    </script>
  </body>
</html>
